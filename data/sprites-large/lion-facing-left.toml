# lion-facing-left — the same maned lion as lion-with-emotion.toml, turned
# to a left profile. The mane stays a full radial sunburst around the head
# since a mane reads fine from any angle, but it thins out on the side
# facing the viewer so the snout stays open; a small jaw bump breaks the
# head's leading edge there as the profile's own suggestion of a snout. One
# ear reads bigger and forward, the other smaller and tucked behind, and
# the tail tuft moves to the body's trailing edge. A near eye is drawn
# directly on the head; the shared face fragment lands on top of it once a
# mood is taught, and drops out cleanly if it isn't.
classes = ["lion"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="lion-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="14.5" cy="15.8" rx="6.4" ry="4.4" fill="url(#lion-facing-left-fill)"/>
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <line x1="10.1" y1="19.2" x2="10.1" y2="22"/>
    <line x1="12.9" y1="19.8" x2="12.9" y2="22"/>
    <line x1="16.1" y1="19.8" x2="16.1" y2="22"/>
    <line x1="18.9" y1="19.2" x2="18.9" y2="22"/>
  </g>
  <g fill="color-mix(in srgb, currentColor 55%, black)">
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(40 7.2 8.4)"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(80 7.2 8.4)"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(120 7.2 8.4)"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(160 7.2 8.4)"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(200 7.2 8.4)"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(320 7.2 8.4)"/>
  </g>
  <circle cx="7.2" cy="8.4" r="3.86" fill="url(#lion-facing-left-fill)"/>
  <path d="M4.4 6.2 L3.6 3.6 L6.2 5.4 Z" fill="url(#lion-facing-left-fill)"/>
  <path d="M9.8 5.6 L10.2 4.2 L8.8 5.2 Z" fill="url(#lion-facing-left-fill)"/>
  <path d="M4.4 9.6 C3.4 10 2.8 10.8 3 11.6 C3.8 11.2 4.4 10.5 4.8 9.7 Z" fill="url(#lion-facing-left-fill)"/>
  <path d="M20.5 13.6 C23.5 13 24.5 15.8 22.1 17 C21.1 16.4 20.3 15.2 20.1 13.9 Z" fill="url(#lion-facing-left-fill)"/>
  <ellipse cx="5.1" cy="7.9" rx="0.55" ry="0.68" fill="#1c1c1c"/>
  <ellipse cx="11.1" cy="12.8" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="5.6" cy="6.8" rx="1.1" ry="0.8" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Head radius 3.86 is 0.92 of lion-with-emotion.toml's own r=4.2. The near
# eye this file draws sits at (5.1, 7.9); scale is 0.65 of the head radius,
# and cx/cy place the shared face fragment's own forward eye exactly on
# top of it.
[face]
cx = 6.1
cy = 8.28
scale = 2.5

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
