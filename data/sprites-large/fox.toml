# fox — drawn sitting and facing the viewer, the one predator in this pack:
# a broad triangular face over an upright chest, with the brush tail curled
# forward across the feet. Three markings name the animal on their own —
# black-backed ears, a pale cheek ruff running down into the muzzle and
# throat, and the white tail tip — and the slit amber eye is what makes it
# read as a hunter rather than another burrower. All four are fixed colours,
# following badger.toml: they are the fox's pattern, not its coat, so a
# theme repaints the fur around them and leaves them alone.
classes = ["fox"]
