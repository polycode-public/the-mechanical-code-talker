# sugar — three overlapping pale lobes read as a heaped, granular mound
# where the pack's first draft (one plain dome) read as a hill; a small
# cube keeps a dimpled grid line rather than a diagonal ribbon stripe, so
# it reads as a sugar cube rather than a wrapped gift.
classes = ["sugar"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="sugar-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 40%, white)"/>
      <stop offset="55%" stop-color="color-mix(in srgb, currentColor 75%, white)"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 85%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#sugar-fill)">
    <circle cx="7.4" cy="17.6" r="3.2"/>
    <circle cx="11.4" cy="16" r="3.8"/>
    <circle cx="15.2" cy="17.8" r="3"/>
  </g>
  <rect x="13.6" y="6.8" width="5.2" height="5.2" rx="0.4" fill="url(#sugar-fill)" transform="rotate(-10 16.2 9.4)"/>
  <path d="M13.9 7.6 L18.9 7" stroke="#ffffff" stroke-width="0.4" opacity="0.5" transform="rotate(-10 16.2 9.4)"/>
  <path d="M13.6 9.4 H18.8 M16.2 6.8 V12" stroke="#000000" stroke-width="0.25" opacity="0.22" transform="rotate(-10 16.2 9.4)"/>
  <g fill="#ffffff" opacity="0.85">
    <circle cx="8.2" cy="15.4" r="0.55"/>
    <circle cx="11.8" cy="13.6" r="0.55"/>
    <circle cx="14.4" cy="15.8" r="0.5"/>
    <circle cx="6" cy="18.2" r="0.4"/>
  </g>
  <ellipse cx="9.4" cy="15.2" rx="2.2" ry="1.2" fill="#ffffff" opacity="0.32"/>
</svg>
"""
