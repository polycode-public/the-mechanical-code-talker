# sugar — a tied sack rather than salt.toml's rigid shaker, so the two
# white-powder classes read apart at icon size: a gathered neck with a
# tie line instead of a perforated cap, and scattered granule flecks
# across the body instead of shaker holes. A small cube beside the sack
# keeps its own dimpled grid line rather than a diagonal ribbon stripe,
# so it reads as a sugar cube rather than a wrapped gift.
classes = ["sugar"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="sugar-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 40%, white)"/>
      <stop offset="55%" stop-color="color-mix(in srgb, currentColor 75%, white)"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 85%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="11" cy="21" rx="6.6" ry="1.2" fill="#000000" opacity="0.16"/>
  <path d="M4.6 12.4 C4 17 5.6 20.4 11 20.4 C16.4 20.4 18 17 17.4 12.4 C17 9.2 14.6 7.2 11 7.2 C7.4 7.2 5 9.2 4.6 12.4 Z" fill="url(#sugar-fill)"/>
  <path d="M8 7.6 C7.6 6 8.4 4.6 11 4.4 C13.6 4.6 14.4 6 14 7.6 C12.8 7 9.2 7 8 7.6 Z" fill="url(#sugar-fill)"/>
  <path d="M8.4 4.8 L13.6 4.8" stroke="#7a6a4a" stroke-width="1" stroke-linecap="round" opacity="0.55"/>
  <g fill="#ffffff" opacity="0.85">
    <circle cx="8" cy="14.4" r="0.4"/>
    <circle cx="10.4" cy="12.8" r="0.4"/>
    <circle cx="13" cy="14.8" r="0.4"/>
    <circle cx="11.4" cy="16.6" r="0.4"/>
    <circle cx="14.4" cy="12.4" r="0.35"/>
    <circle cx="7" cy="17" r="0.35"/>
  </g>
  <ellipse cx="8.2" cy="12.4" rx="2" ry="1.4" fill="#ffffff" opacity="0.3" transform="rotate(-18 8.2 12.4)"/>
  <rect x="15.8" y="15.6" width="4.2" height="4.2" rx="0.35" fill="url(#sugar-fill)" transform="rotate(-8 17.9 17.7)"/>
  <path d="M16 16.2 L19.9 15.7" stroke="#ffffff" stroke-width="0.35" opacity="0.5" transform="rotate(-8 17.9 17.7)"/>
  <path d="M15.8 17.7 H20 M17.9 15.6 V19.8" stroke="#000000" stroke-width="0.22" opacity="0.22" transform="rotate(-8 17.9 17.7)"/>
</svg>
