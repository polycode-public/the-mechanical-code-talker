# lion — a sunburst of triangular mane tufts fixed to a shade darker than
# the coat (a lion's mane reads dimmer than its body regardless of the
# individual's own coat tone, from pale straw to near-black), the dog/
# animal body shape underneath it, four legs and a tail tuft.
