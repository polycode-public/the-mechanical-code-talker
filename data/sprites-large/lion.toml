  <defs>
    <linearGradient id="lion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13.4" cy="15.6" rx="6.4" ry="4.4" fill="url(#lion-fill)"/>
  <g fill="url(#lion-fill)" opacity="0.9">
    <path d="M6.8 4.2 L7.6 0.6 L8.4 4.2 Z"/>
    <path d="M6.8 4.2 L7.6 0.6 L8.4 4.2 Z" transform="rotate(40 7.6 8)"/>
