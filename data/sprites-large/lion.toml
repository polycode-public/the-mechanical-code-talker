# lion — the menagerie's own big cat at the sprite tier: the dog/
# animal body shape with a radiating spike mane rather than rounded
# curls (a curl cluster reads as a poodle's own coat at this scale, a
# sunburst of triangular tufts reads as a mane), the tier's usual
# gradient/highlight, no material.
classes = ["lion"]
