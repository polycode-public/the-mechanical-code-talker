# tiger-facing-half-left — tiger turned three-quarters, halfway between
# tiger-facing-left.toml's full profile and tiger-with-emotion.toml's front
# view. The head-and-ears block sits at the midpoint position, the nose
# wedge projects only half as far, and a small far eye appears near the
# head's right edge so both eyes read. Body, legs, stripes, tail and
# highlights keep tiger-with-emotion's own exact coordinates, the same as
# the full profile.
classes = ["tiger"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="tiger-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15" rx="6.6" ry="4.4" fill="url(#tiger-facing-half-left-fill)"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="8" y1="18.4" x2="7.8" y2="21.6"/>
    <line x1="11" y1="19.2" x2="11" y2="22"/>
    <line x1="15" y1="19.2" x2="15.2" y2="22"/>
    <line x1="18" y1="18.2" x2="18.4" y2="21.4"/>
  </g>
  <g fill="url(#tiger-facing-half-left-fill)">
    <ellipse cx="7.8" cy="21.9" rx="0.9" ry="0.55"/>
    <ellipse cx="11" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="15.2" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="18.4" cy="21.7" rx="0.9" ry="0.55"/>
  </g>
  <circle cx="6.65" cy="9" r="3.8" fill="url(#tiger-facing-half-left-fill)"/>
  <path d="M3.85 6.4 L2.85 3 L6.05 5 Z" fill="url(#tiger-facing-half-left-fill)"/>
  <path d="M9.05 6 L9.65 2.6 L12.05 5.2 Z" fill="url(#tiger-facing-half-left-fill)"/>
  <ellipse cx="5.25" cy="10.6" rx="1" ry="0.8" fill="#f4ede0"/>
  <ellipse cx="7.95" cy="10.6" rx="1" ry="0.8" fill="#f4ede0"/>
  <path d="M3.4 8.65 Q3.0 9.15 3.4 9.65 Z" fill="url(#tiger-facing-half-left-fill)"/>
  <ellipse cx="4.7" cy="8.65" rx="0.32" ry="0.38" fill="#1c1c1c"/>
  <ellipse cx="8.0" cy="8.55" rx="0.2" ry="0.24" fill="#1c1c1c"/>
  <g stroke="#000000" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M8.6 12 L12 10.6"/>
    <path d="M9 14.8 L13 14"/>
    <path d="M9.4 17.6 L13 17.4"/>
    <path d="M15.2 11.6 L18.2 11"/>
    <path d="M15.8 14.8 L19 15"/>
    <path d="M15.6 17.8 L18.6 18.2"/>
  </g>
  <path d="M19 13 C22 12.4 22.4 15.2 20 16 Z" fill="url(#tiger-facing-half-left-fill)"/>
  <ellipse cx="9.6" cy="12.2" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="6.65" cy="9" rx="3.3" ry="2.9" fill="#ffffff" opacity="0.22"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# The head-and-ears block sits at cx=6.65 (half the full profile's -0.69
# shift), so scale is 0.82 * 3.8 = 3.1. The near eye this file draws sits at
# (4.7, 8.65). cx = 4.7 + 0.4*3.1 = 5.94, cy = 8.65 + 0.15*3.1 = 9.12.
[face]
cx = 5.94
cy = 9.12
scale = 3.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
