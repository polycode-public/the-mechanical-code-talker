# root — a length of woody root crossing the frame, with two stubby side
# roots, bark grain along the run and one pale cut end. A vertical taproot
# was the first draft and it kept reading as a stripped carrot or, with its
# rootlets on, a stick figure; a horizontal woody run has neither problem
# and matches what a dig actually turns up. The tan is fixed rather than
# shaded from currentColor, which on a dark-inked page rendered the whole
# thing near-black.
classes = ["root"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="root-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#d6bd92"/>
      <stop offset="55%" stop-color="#9c7d4f"/>
      <stop offset="100%" stop-color="#63492a"/>
    </linearGradient>
  </defs>
  <path d="M9.8 15.2 C9.4 13 8.4 11.4 6.8 10.2 C8.8 10.4 10.4 12 11 14.4 Z" fill="url(#root-fill)"/>
  <path d="M13.6 13.8 C14.2 15.8 14.6 17.6 15.9 19.4 C14.1 19.2 12.7 17.4 12.3 15 Z" fill="url(#root-fill)"/>
  <path d="M3.4 18.4 C4.6 16 7.4 15 9.8 14.2 C12.4 13.3 14.6 12 16.4 9.6 C17.6 8 19 6.4 20.7 5.8 C21.3 6.7 21 7.9 20 8.9 C18.6 10.3 17.6 11.5 16.6 12.9 C14.8 15.5 12 16.9 9.2 17.8 C7 18.5 5.4 19.3 4.4 20.5 C3.5 20.3 3.1 19.4 3.4 18.4 Z" fill="url(#root-fill)"/>
  <g stroke="#4e3a20" stroke-width="0.45" opacity="0.3" stroke-linecap="round" fill="none">
    <path d="M5.2 18.8 C7.4 17.2 10.6 16 13.2 14.2"/>
    <path d="M14.6 13.4 C16.2 11.8 17.6 10 19.4 8.4"/>
    <path d="M6.4 20 C8.4 18.6 10.8 17.6 13.2 16.4"/>
  </g>
  <ellipse cx="4.1" cy="19.5" rx="1.05" ry="1.5" fill="#e6d3ac" transform="rotate(38 4.1 19.5)"/>
  <ellipse cx="4.1" cy="19.5" rx="0.5" ry="0.75" fill="none" stroke="#a58a5c" stroke-width="0.3" transform="rotate(38 4.1 19.5)"/>
  <path d="M4.6 17.6 C6.6 16 9.4 15 11.8 14" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.3" stroke-linecap="round"/>
