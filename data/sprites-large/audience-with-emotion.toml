# audience-with-emotion — same three-bust composite as audience.toml, plus
# a required [face] anchor and a {{FACE}} placeholder that resolves to
# whichever of the 6 curated mgx:feels words the instance's own fact names.
# No mgx:feels fact falls through to the plain audience.toml sprite.
#
# Judgment call: audience.toml draws three busts, the two flanking ones
# faded (opacity 0.6) and set back, the center one (cx=12 cy=9.4 r=2.6) at
# full opacity and drawn last (on top) — the same depth cue the file's own
# header comment describes. The face anchors on that center, frontmost bust
# only, not all three.
classes = ["audience"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="audience-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g opacity="0.6">
    <circle cx="5" cy="12" r="2.3" fill="url(#audience-with-emotion-fill)"/>
    <path d="M1.6 21 C1.6 17.6 3 16.1 5 16.1 C7 16.1 8.4 17.6 8.4 21 Z" fill="url(#audience-with-emotion-fill)"/>
    <path d="M3.9 16.2 L5 17.1 L6.1 16.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  </g>
  <g opacity="0.6">
    <circle cx="19" cy="12" r="2.3" fill="url(#audience-with-emotion-fill)"/>
    <path d="M15.6 21 C15.6 17.6 17 16.1 19 16.1 C21 16.1 22.4 17.6 22.4 21 Z" fill="url(#audience-with-emotion-fill)"/>
    <path d="M20.1 16.2 L19 17.1 L17.9 16.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  </g>
  <circle cx="12" cy="9.4" r="2.6" fill="url(#audience-with-emotion-fill)"/>
  <path d="M8.2 21 C8.2 17 9.8 15.2 12 15.2 C14.2 15.2 15.8 17 15.8 21 Z" fill="url(#audience-with-emotion-fill)"/>
  <path d="M1.6 21 L22.4 21" stroke="currentColor" stroke-width="0.7" opacity="0.3" stroke-linecap="round"/>
  {{FACE}}
</svg>
"""

# The center bust's own cx/cy/r — the frontmost figure in the composite.
[face]
cx = 12
cy = 9.4
scale = 2.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
