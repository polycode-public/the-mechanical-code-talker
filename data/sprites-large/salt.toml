# salt — a shaker, not a mound: a perforated cap over a rounded jar, the
# holes the one cue that separates it from sugar.toml's tied sack at
# icon size where both classes would otherwise be the same pale
# gradient. Gradient/highlight only: salt's own whiteness is close
# enough to neutral that a taught colour still reads plausibly through
# it.
classes = ["salt"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="salt-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 45%, white)"/>
      <stop offset="55%" stop-color="color-mix(in srgb, currentColor 78%, white)"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 88%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="21" rx="6.2" ry="1.2" fill="#000000" opacity="0.16"/>
  <path d="M6.4 10.4 C6.4 8.6 8.8 7.4 12 7.4 C15.2 7.4 17.6 8.6 17.6 10.4 L18.4 19 C18.5 20.2 17 21 12 21 C7 21 5.5 20.2 5.6 19 Z" fill="url(#salt-fill)"/>
  <path d="M8.4 7.8 C8.4 5.6 9.8 4.2 12 4.2 C14.2 4.2 15.6 5.6 15.6 7.8 L15.6 9 C15.6 9.6 14 10 12 10 C10 10 8.4 9.6 8.4 9 Z" fill="url(#salt-fill)"/>
  <g fill="#4a4a46" opacity="0.75">
    <circle cx="10.2" cy="6.4" r="0.42"/>
    <circle cx="12" cy="5.8" r="0.42"/>
    <circle cx="13.8" cy="6.4" r="0.42"/>
    <circle cx="10.9" cy="7.4" r="0.42"/>
    <circle cx="13.1" cy="7.4" r="0.42"/>
  </g>
  <path d="M7.4 12 L16.8 12" stroke="#ffffff" stroke-width="0.4" opacity="0.35"/>
  <ellipse cx="9.2" cy="14.4" rx="1.6" ry="3.2" fill="#ffffff" opacity="0.28" transform="rotate(6 9.2 14.4)"/>
</svg>
"""
