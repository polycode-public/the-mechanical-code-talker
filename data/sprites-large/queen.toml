# queen — a narrower crown than king.toml's, a central jewel spike over a
# thinner band, so the two royal figures read as distinct shapes rather
# than one crown recoloured.
classes = ["queen"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="queen-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M8 6.2 C8 6.2 8.3 3 8.9 2.6 C9.6 2.2 10.2 3.6 10.6 4.8 C10.9 3.6 11.4 2 12 2 C12.6 2 13.1 3.6 13.4 4.8 C13.8 3.6 14.4 2.2 15.1 2.6 C15.7 3 16 6.2 16 6.2 Z" fill="url(#queen-fill)"/>
  <circle cx="12" cy="3.3" r="0.6" fill="currentColor" opacity="0.9"/>
  <rect x="8" y="5.9" width="8" height="1.3" rx="0.4" fill="url(#queen-fill)"/>
  <circle cx="12" cy="9.4" r="3.1" fill="url(#queen-fill)"/>
  <path d="M6 21 C6 15.6 8.7 13.2 12 13.2 C15.3 13.2 18 15.6 18 21 Z" fill="url(#queen-fill)"/>
  <ellipse cx="8.8" cy="6.6" rx="1.5" ry="0.4" fill="#ffffff" opacity="0.3"/>
</svg>
"""
