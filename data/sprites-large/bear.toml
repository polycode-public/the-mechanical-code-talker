# bear — a round head over a broad body, four stubby paws breaking the
# body's silhouette and a fixed tan muzzle patch with a dark nose (a
# muzzle paler than the coat is a bear identity feature that holds even
# on black bears, so it stays fixed rather than following the theme).
classes = ["bear"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bear-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="15.4" rx="7.2" ry="5.6" fill="url(#bear-fill)"/>
  <g fill="url(#bear-fill)">
    <ellipse cx="5.8" cy="19.8" rx="1.2" ry="1.4"/>
    <ellipse cx="9.4" cy="20.4" rx="1.2" ry="1.4"/>
    <ellipse cx="14.6" cy="20.4" rx="1.2" ry="1.4"/>
    <ellipse cx="18.2" cy="19.8" rx="1.2" ry="1.4"/>
  </g>
  <circle cx="12" cy="9" r="5" fill="url(#bear-fill)"/>
  <circle cx="7" cy="5.4" r="2.1" fill="url(#bear-fill)"/>
  <circle cx="17" cy="5.4" r="2.1" fill="url(#bear-fill)"/>
  <ellipse cx="12" cy="11.4" rx="2.4" ry="1.9" fill="#c9a273"/>
  <ellipse cx="12" cy="10.5" rx="0.9" ry="0.65" fill="#1c1c1c"/>
  <ellipse cx="8.6" cy="11" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="7.6" cy="4.8" rx="0.8" ry="0.6" fill="#ffffff" opacity="0.3"/>
</svg>
"""
