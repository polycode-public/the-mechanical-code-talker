# driver — the pack's shared adult body under a fixed slate-blue flat
# cap (the classic driving-cap wool colour, fixed the way badger's
# stripes are) holding a steering wheel in front at waist height, the
# single cue for someone at the controls of a vehicle rather than on
# foot.
