# bridge — an arch and deck at the sprite tier, both sharing one taught
# mgx:madeOf gradient (a plank-and-rope bridge reads wood, a girder
# bridge reads metal — the same two-treatment spread cabinet/desk/bed
# already cover). The railing posts stay dark-tone overlays rather than a
# third colour, the same convention cabinet/desk use for their own knobs.
classes = ["bridge"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bridge-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="{{FILL_LIGHT}}"/>
      <stop offset="55%" stop-color="{{FILL}}"/>
      <stop offset="100%" stop-color="{{FILL_DARK}}"/>
    </linearGradient>
  </defs>
  <path d="M2.5 18 C2.5 10.4 8 6.4 12 6.4 C16 6.4 21.5 10.4 21.5 18 L18 18 C18 12.4 15 9.6 12 9.6 C9 9.6 6 12.4 6 18 Z" fill="url(#bridge-fill)"/>
  <rect x="2.5" y="18" width="19" height="2.2" rx="0.6" fill="url(#bridge-fill)"/>
  <g stroke="{{FILL_DARK}}" stroke-width="0.9" opacity="0.7">
    <line x1="7" y1="18" x2="7" y2="20.2"/>
    <line x1="10.4" y1="18" x2="10.4" y2="20.2"/>
    <line x1="13.6" y1="18" x2="13.6" y2="20.2"/>
    <line x1="17" y1="18" x2="17" y2="20.2"/>
  </g>
  <path d="M4 14 C5.4 10.6 8.4 8 12 8" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.4"/>
</svg>
"""

[parameters.material]
property = "mgx:madeOf"
placeholders = { light = "{{FILL_LIGHT}}", base = "{{FILL}}", dark = "{{FILL_DARK}}" }

[parameters.material.values]
wood = "wood"
metal = "metal"
