# rabbit-facing-half-right — rabbit-facing-half-left.toml's three-quarter
# turn mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins. The mirror flips the lit corner of the shared gradient
# along with the pose, which reads as the same rabbit turned around under
# the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["rabbit"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="rabbit-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="15.4" cy="16.2" rx="5.8" ry="5.2" fill="url(#rabbit-facing-half-right-fill)"/>
    <circle cx="22.4" cy="17.7" r="1.8" fill="url(#rabbit-facing-half-right-fill)"/>
    <ellipse cx="15" cy="20.5" rx="1.3" ry="1.6" fill="url(#rabbit-facing-half-right-fill)"/>
    <ellipse cx="11.4" cy="19.7" rx="1.5" ry="1.8" fill="url(#rabbit-facing-half-right-fill)"/>
    <ellipse cx="9.2" cy="4.2" rx="1.1" ry="3" fill="url(#rabbit-facing-half-right-fill)" opacity="0.88" transform="rotate(16 9.2 4.2)"/>
    <ellipse cx="7" cy="3.9" rx="1.4" ry="4.6" fill="url(#rabbit-facing-half-right-fill)" transform="rotate(7 7 3.9)"/>
    <ellipse cx="7" cy="4.3" rx="0.6" ry="3" fill="#e3aca6" opacity="0.7" transform="rotate(7 7 4.3)"/>
    <circle cx="8.4" cy="9.5" r="3.9" fill="url(#rabbit-facing-half-right-fill)"/>
    <ellipse cx="5" cy="10.7" rx="1.5" ry="1.2" fill="#e3aca6" opacity="0.55"/>
    <circle cx="3.7" cy="10.4" r="0.42" fill="#1c1c1c"/>
    <ellipse cx="8" cy="8.9" rx="0.28" ry="0.34" fill="#1c1c1c"/>
    <ellipse cx="6.6" cy="8.5" rx="0.55" ry="0.68" fill="#1c1c1c"/>
    <ellipse cx="9.3" cy="7.2" rx="1.2" ry="0.9" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="12.8" cy="13.6" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# rabbit-facing-half-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 7.89); cy and scale are the mirror's own invariants. Because the
# fragment sits outside the flip group, these are plain unflipped canvas
# coordinates.
[face]
cx = 16.11
cy = 8.98
scale = 3.22

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
