# lawyer-facing-half-left-moving — lawyer-facing-half-left.toml's
# three-quarter turn caught mid-stride. The head, nose wedge, both eyes and
# hair highlight hold their half-left shape and position exactly. What
# moved is the two side-cape arms and the torso, the same stride the full
# profile uses. The briefcase, its strap and the two collar tabs stay
# fixed.
classes = ["lawyer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="lawyer-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="lawyer-facing-half-left-moving-briefcase" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#a9713f"/>
      <stop offset="100%" stop-color="#6b4423"/>
    </linearGradient>
  </defs>
  <g fill="url(#lawyer-facing-half-left-moving-fill)">
    <path d="M9.4 13.1 C7.8 12.5 6.3 13.5 5.8 16.1 C5.6 17.5 6.2 18.5 7.3 18.2 C7.4 16.2 7.9 14.5 9.6 13.6 Z"/>
    <path d="M14.6 13.1 C16.7 13.5 18.7 15.3 19 18.2 C19.1 19.5 18.3 20.3 17.2 19.7 C17 17.4 16.3 15.1 14.3 14.2 Z"/>
    <path d="M6.3 21 C6.1 15.5 8.7 12.9 11.7 12.9 C15.1 12.9 17.6 14.8 17.1 19.6 C16.9 20.7 15.9 20.7 15.1 20.1 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <path d="M17.4 15.4 C17.4 14.4 18 13.8 18.8 13.8 C19.6 13.8 20.2 14.4 20.2 15.4" fill="none" stroke="#6b4423" stroke-width="0.8" opacity="0.8" stroke-linecap="round"/>
  <rect x="16.4" y="15.4" width="4.8" height="4.4" rx="0.5" fill="url(#lawyer-facing-half-left-moving-briefcase)"/>
  <rect x="18.2" y="16.8" width="1.2" height="0.9" rx="0.2" fill="#d9a635"/>
  <rect x="10.6" y="13" width="0.9" height="1.5" rx="0.12" fill="#f4f1ea"/>
  <rect x="12.5" y="13" width="0.9" height="1.5" rx="0.12" fill="#f4f1ea"/>
  <circle cx="11.7" cy="6.6" r="3.3" fill="url(#lawyer-facing-half-left-moving-fill)"/>
  <path d="M8.6 6.1 Q7.9 7.4 8.6 8.1 Z" fill="url(#lawyer-facing-half-left-moving-fill)"/>
  <ellipse cx="10" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <ellipse cx="14" cy="6.05" rx="0.18" ry="0.22" fill="#1c1c1c"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 13.9 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.3 4.2 C10.0 3.6 10.8 3.4 11.7 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 11.08
cy = 6.51
scale = 2.7

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
