  <path d="M8.4 2.6 H15.2 V12.4 C15.2 13.6 15.8 14.4 16.8 15 L20.6 17.2 C21.6 17.8 21.6 19.2 20.6 19.8 C18.6 21 16 21.4 13.4 20.6 C10.4 19.6 8.4 17 8.4 13.8 Z" fill="url(#sock-fill)"/>
