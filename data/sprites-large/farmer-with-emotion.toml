# farmer-with-emotion — same straw-hat silhouette as farmer.toml, plus a
# required [face] anchor and a {{FACE}} placeholder that resolves to
# whichever of the 6 curated mgx:feels words the instance's own fact names.
# No mgx:feels fact falls through to the plain farmer.toml sprite.
classes = ["farmer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="farmer-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="5.4" rx="7" ry="1.7" fill="url(#farmer-with-emotion-fill)"/>
  <path d="M9.1 5.1 C9.1 3.1 10.4 1.7 12 1.7 C13.6 1.7 14.9 3.1 14.9 5.1 C14.9 5.5 14.8 5.8 14.7 6.1 L9.3 6.1 C9.2 5.8 9.1 5.5 9.1 5.1 Z" fill="url(#farmer-with-emotion-fill)" opacity="0.92"/>
  <path d="M9.3 5.6 L14.7 5.6" stroke="currentColor" stroke-width="0.6" opacity="0.35"/>
  <circle cx="12" cy="8.4" r="3.1" fill="url(#farmer-with-emotion-fill)"/>
  <path d="M6 21 C6 15.5 8.7 13.1 12 13.1 C15.3 13.1 18 15.5 18 21 Z" fill="url(#farmer-with-emotion-fill)"/>
  <ellipse cx="8.8" cy="4.7" rx="2.2" ry="0.6" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r farmer.toml's own head circle declares.
[face]
cx = 12
cy = 8.4
scale = 3.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
