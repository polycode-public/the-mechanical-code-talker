# family-facing-left — family-with-emotion.toml's three-figure composite
# turned so the frontmost, face-bearing child turns to a left profile: a nose
# wedge breaks the child head's left silhouette and a single forward eye
# replaces the front-facing pair, using the same anchor arithmetic
# king-facing-left.toml's own profile turn uses, scaled down to the child's
# own smaller head (r=2.3 against king's 3.3). The two flanking parent
# figures keep family-with-emotion.toml's own front-view geometry unchanged —
# they carry no face mechanism today, so only the one figure the resolver
# ever paints a face onto needs to visibly turn.
classes = ["family"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="family-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M8.5 7.4 C9.7 8.7 9.9 10.9 8.9 13.3" fill="none" stroke="url(#family-facing-left-fill)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M2.7 7.4 C1.5 8.7 1.4 10.9 2.3 13.3" fill="none" stroke="url(#family-facing-left-fill)" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="5.6" cy="8.4" r="2.7" fill="url(#family-facing-left-fill)"/>
  <path d="M2 22 C2 17.3 3.6 15.1 5.6 15.1 C7.6 15.1 9.2 17.3 9.2 22 Z" fill="url(#family-facing-left-fill)"/>
  <path d="M4.3 14.9 L5.6 16 L6.9 14.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18.4" cy="8.4" r="2.7" fill="url(#family-facing-left-fill)"/>
  <path d="M14.8 22 C14.8 17.3 16.4 15.1 18.4 15.1 C20.4 15.1 22 17.3 22 22 Z" fill="url(#family-facing-left-fill)"/>
  <path d="M17.1 14.9 L18.4 16 L19.7 14.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8.4 22 C8.4 18.4 9.8 16.6 12 16.6 C14.2 16.6 15.6 18.4 15.6 22 Z" fill="url(#family-facing-left-fill)"/>
  <path d="M11.1 16.4 L12 17.1 L12.9 16.4" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="11.58" cy="11.4" r="2.3" fill="url(#family-facing-left-fill)"/>
  <path d="M9.42 10.98 Q8.55 11.68 9.42 12.41 Z" fill="url(#family-facing-left-fill)"/>
  <ellipse cx="10.4" cy="11.05" rx="0.2" ry="0.24" fill="#1c1c1c"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# The child's own head circle (cx=12 cy=11.4 r=2.3 in family-with-emotion.toml)
# shifted left by 0.42 — 0.18 * r, the same ratio king-facing-left.toml's own
# 0.6-against-r=3.3 shift uses. scale is 0.636 * 2.3 = 1.46, and cx/cy place
# the shared face fragment's own forward eye on top of the one drawn above at
# (10.4, 11.05).
[face]
cx = 10.98
cy = 11.27
scale = 1.46

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
