# airport — a schematic in room.toml's own family: the same soft ambient
# wash and bordered frame, its interior line art swapped for a paper-plane
# glyph crossing a dashed runway rather than a doorway, since an airport
# reads as "a place planes move through" far more than as a room to stand
# in.
classes = ["airport"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="airport-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#airport-fill)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M5.5 16.5 H18.5" stroke="currentColor" stroke-width="1" stroke-dasharray="2.2 1.8" opacity="0.55"/>
  <path d="M6 10.5 L18.5 6 L12.5 17.5 L10.6 12 L6 10.5 Z" fill="currentColor" opacity="0.85"/>
  <path d="M10.6 12 L18.5 6" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>
  <path d="M4 4 L11 4" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
</svg>
"""
