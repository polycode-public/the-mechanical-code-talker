# airport — a control tower with a warning beacon and a banking aircraft
# tail fin over a dashed runway, so it reads as "planes move through here"
# rather than the generic bordered-room card the pack's other place
# sprites share. The tower body stays a fixed light concrete grey and the
# beacon a fixed aviation red, since both are real-world constants; the
# card itself keeps the currentColor gradient every place sprite owns.
classes = ["airport"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="airport-fill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 42%, white)"/>
      <stop offset="60%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 70%, black)"/>
    </linearGradient>
    <linearGradient id="airport-tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e5df"/>
      <stop offset="100%" stop-color="#a9a89f"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#airport-fill)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M5.5 16.5 H18.5" stroke="currentColor" stroke-width="1" stroke-dasharray="2.2 1.8" opacity="0.55"/>
  <rect x="8.2" y="10.2" width="1.6" height="9.2" fill="url(#airport-tower)"/>
  <path d="M7.4 8.2 H10.6 V10.2 H7.4 Z" fill="url(#airport-tower)"/>
  <circle cx="9" cy="7.4" r="0.65" fill="#d1453b"/>
  <path d="M12 15.4 L18.6 10.2 C19.6 9.4 20.8 10.6 20 11.6 L15 17 Z" fill="#f2f0ec"/>
  <path d="M12 15.4 L15 17 L13.4 18.6 Z" fill="#2f6fa8"/>
  <path d="M14 13.8 L18.6 10.2" stroke="#2f6fa8" stroke-width="0.6" opacity="0.7"/>
  <path d="M4 4 L11 4" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
"""
