      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12.4" cy="16.4" rx="6" ry="4.2" fill="url(#cat-fill)"/>
  <circle cx="9" cy="9.4" r="4.4" fill="url(#cat-fill)"/>
  <path d="M5.6 6.4 L4.8 2.4 L8 5.2 Z" fill="url(#cat-fill)"/>
  <path d="M12.4 6.4 L13.2 2.4 L10 5.2 Z" fill="url(#cat-fill)"/>
  <path d="M18.6 15 C21.6 13.4 22.4 16.6 20 18.2 C18.4 19.2 17 17.4 18.6 15 Z" fill="url(#cat-fill)"/>
