# cat — gradient-shaded like dog/poodle, no material table: pointed ears,
# whiskers, a nose triangle and a curled tail distinguish it from the
# dog/poodle pair sharing this tier's own body-plus-round-head layout.
classes = ["cat"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="cat-fill" x1="0" y1="0" x2="0.4" y2="1">
