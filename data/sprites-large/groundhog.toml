# groundhog — the one creature in this pack drawn sitting up on its
# haunches rather than as a quadruped: a very plump upright body, two
# rounded forepaws held at the chest, and a small unmarked head, so the
# silhouette itself (posture and bulk) carries the identity rather than
# a face pattern — the tier's usual gradient/highlight, no material.
classes = ["groundhog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="groundhog-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="21.6" rx="5.6" ry="1.8" fill="url(#groundhog-fill)"/>
  <ellipse cx="12" cy="15.6" rx="6.6" ry="7.4" fill="url(#groundhog-fill)"/>
  <circle cx="12" cy="7.4" r="4.4" fill="url(#groundhog-fill)"/>
  <circle cx="8.2" cy="4.4" r="1.3" fill="url(#groundhog-fill)"/>
  <circle cx="15.8" cy="4.4" r="1.3" fill="url(#groundhog-fill)"/>
