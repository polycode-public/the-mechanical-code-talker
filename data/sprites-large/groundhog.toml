  </defs>
  <path d="M17 17.6 C20.4 17.8 22.4 19.8 22 21.4 C21.7 22.6 20.3 22.8 19.9 21.8 C20.6 20.4 19.4 19 17 18.8 Z" fill="url(#groundhog-fill)"/>
