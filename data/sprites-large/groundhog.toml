# groundhog — the one creature in this pack drawn sitting up on its
# haunches rather than as a quadruped: a very plump upright body, two
# clawed forepaws held at the chest, flat hind feet planted either side,
# small round ears set low and wide, and the pair of chisel incisors every
# marmot shows under a blunt dark nose. The teeth and the nose are fixed
# colours because they are the reading the silhouette alone can't give
# (upright and plump also describes a bear cub); the coat, the paler chest
# and the sheen all stay anchored to currentColor.
classes = ["groundhog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="groundhog-fill" x1="0" y1="0" x2="0.4" y2="1">
