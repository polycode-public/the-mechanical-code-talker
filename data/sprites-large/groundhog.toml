      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <radialGradient id="groundhog-underside" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 38%, #f6efe2)" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 38%, #f6efe2)" stop-opacity="0"/>
