# shoe — a sneaker profile with a fixed dark sole, gradient/highlight
# treatment on the upper only; a sole reads dark regardless of the shoe's
# own colour, the same fixed-accent reasoning as tiger.toml's stripes.
classes = ["shoe"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="shoe-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M3 18.4 C3 15.6 4.4 14.6 6.6 14.4 L10 11 C10.6 10.4 11.4 10.2 12.2 10.6 L15.6 12.2 C17 12.8 18.4 13.6 19.6 14.8 L21.4 16.6 C22 17.2 21.8 18.4 20.8 18.4 Z" fill="url(#shoe-fill)"/>
  <path d="M3 18.4 H21 V20 C21 20.6 20.6 21 20 21 H4 C3.4 21 3 20.6 3 20 Z" fill="#221f1c" opacity="0.85"/>
  <path d="M10.4 12 L14.6 13.6" stroke="#000000" stroke-width="0.4" opacity="0.3"/>
  <path d="M6.8 14.6 L6.4 18" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
</svg>
"""
