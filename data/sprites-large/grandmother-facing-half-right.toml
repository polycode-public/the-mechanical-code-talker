# grandmother-facing-half-right — grandmother-facing-half-left.toml's three-quarter turn
# mirrored across the canvas midline, so the two directions stay
# geometrically identical twins. {{FACE}} sits outside the flip group, the
# same rule the full profile pair uses.

classes = ["grandmother"]

svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="grandmother-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
  <path d="M15.3 5.4 C16.7 7 16.9 9.6 15.7 12.6" fill="none" stroke="color-mix(in srgb, currentColor 20%, white)" stroke-width="1.6" stroke-linecap="round" opacity="0.92"/>
  <path d="M8.1 5.4 C6.7 7 6.5 9.6 7.7 12.6" fill="none" stroke="color-mix(in srgb, currentColor 20%, white)" stroke-width="1.6" stroke-linecap="round" opacity="0.92"/>
  <g fill="url(#grandmother-facing-half-right-fill)">
    <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
    <path d="M14.6 13.1 C16.4 13.2 18.1 14.7 18.4 17.4 C18.5 18.8 17.8 19.7 16.8 19.2 C16.7 17.1 16.1 15.1 14.3 14.2 Z"/>
    <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <circle cx="11.7" cy="6.6" r="3.3" fill="url(#grandmother-facing-half-right-fill)"/>
  <path d="M8.6 6.1 Q7.9 7.4 8.6 8.1 Z" fill="url(#grandmother-facing-half-right-fill)"/>
  <ellipse cx="10" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <ellipse cx="14" cy="6.05" rx="0.18" ry="0.22" fill="#1c1c1c"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 13.9 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.3 4.2 C10 3.6 10.8 3.4 11.7 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <path d="M6.4 13.6 C5.8 16.3 6.1 19 7.6 21.2 C8.3 20.9 9 20.5 9.5 20 C8.3 18.1 8 15.9 8.5 13.9 C7.8 13.7 7.1 13.6 6.4 13.6 Z" fill="url(#grandmother-facing-half-right-fill)" opacity="0.88"/>
  <path d="M17.6 13.6 C18.2 16.3 17.9 19 16.4 21.2 C15.7 20.9 15 20.5 14.5 20 C15.7 18.1 16 15.9 15.5 13.9 C16.2 13.7 16.9 13.6 17.6 13.6 Z" fill="url(#grandmother-facing-half-right-fill)" opacity="0.88"/>
  <path d="M8.5 13.9 C9.8 13 10.9 12.6 12 12.6 C13.1 12.6 14.2 13 15.5 13.9" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.5"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

[face]
cx = 12.92
cy = 6.51
scale = 2.7

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
