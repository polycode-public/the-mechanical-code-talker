# king — a wide trefoil crown (three arched points, a jewel at the centre
# peak) on a band, the single royal cue. queen.toml carries a narrower
# crown of its own so the two read as distinct royal figures, not the
# same shape recoloured.
classes = ["king"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="king-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M7 6.6 L8 3 L10.2 5.2 L12 2.4 L13.8 5.2 L16 3 L17 6.6 Z" fill="url(#king-fill)"/>
  <circle cx="12" cy="4.1" r="0.7" fill="currentColor" opacity="0.9"/>
  <rect x="7" y="6.2" width="10" height="1.6" rx="0.4" fill="url(#king-fill)"/>
  <circle cx="12" cy="9.6" r="3.1" fill="url(#king-fill)"/>
  <path d="M6 21 C6 15.7 8.7 13.4 12 13.4 C15.3 13.4 18 15.7 18 21 Z" fill="url(#king-fill)"/>
  <ellipse cx="8.8" cy="6.9" rx="1.6" ry="0.4" fill="#ffffff" opacity="0.3"/>
</svg>
"""
