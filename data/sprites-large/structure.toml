# structure — the sprite tier's generic engineered framework: an A-frame
# lattice tower of legs, rungs and zigzag braces rather than any solid
# walled block, so it reads as "built framework" apart from building.toml's
# own elevation. The steel keeps the tier's currentColor gradient the way
# every other theme-owned surface does; the hazard band near the apex is
# fixed safety-amber because that banding is the one near-universal marker
# painted on real towers, cranes and rigs regardless of theme.
classes = ["structure"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="structure-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 55%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#structure-fill)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 L4 21"/>
    <path d="M12 3 L20 21"/>
  </g>
  <g stroke="url(#structure-fill)" stroke-width="1" stroke-linecap="round">
    <line x1="9.78" y1="8" x2="14.22" y2="8"/>
    <line x1="7.56" y1="13" x2="16.44" y2="13"/>
    <line x1="5.33" y1="18" x2="18.67" y2="18"/>
  </g>
  <g stroke="url(#structure-fill)" stroke-width="0.8" stroke-linecap="round">
    <line x1="9.78" y1="8" x2="16.44" y2="13"/>
    <line x1="16.44" y1="13" x2="5.33" y2="18"/>
    <line x1="5.33" y1="18" x2="20" y2="21"/>
  </g>
  <rect x="2.6" y="20.6" width="3" height="1.4" fill="color-mix(in srgb, currentColor 70%, black)"/>
  <rect x="18.4" y="20.6" width="3" height="1.4" fill="color-mix(in srgb, currentColor 70%, black)"/>
  <rect x="10.4" y="6" width="3.2" height="1" fill="#e0a838" opacity="0.85"/>
  <circle cx="12" cy="3" r="0.5" fill="#1c1c1c" opacity="0.5"/>
</svg>
"""
