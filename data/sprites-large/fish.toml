# fish — the pack's own aquarium/river creature at the sprite tier: a
# gradient body (a fish's own colour is whatever the renderer's currentColor
# sets, not a taught fact) with a full fin set — tail, dorsal, pectoral and
# a ventral fin — carrying ray lines, and a proper white-ringed eye, since
# fin structure and a visible eye are what a fish silhouette is otherwise
# missing entirely.
classes = ["fish"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="fish-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M4 12.4 C6 8.8 10.4 6.8 15 8 C18.6 9 20.6 10.8 21.4 12.4 C20.6 14 18.6 15.8 15 16.8 C10.4 18 6 16 4 12.4 Z" fill="url(#fish-fill)"/>
  <path d="M4 12.4 L1 9.4 L2.2 12.4 L1 15.4 Z" fill="color-mix(in srgb, currentColor 78%, black)"/>
  <path d="M13.6 7.6 L16.6 3.8 L15.4 8.2 Z" fill="color-mix(in srgb, currentColor 70%, black)"/>
  <path d="M13.2 17 L15.6 20.6 L13.8 16.6 Z" fill="color-mix(in srgb, currentColor 70%, black)"/>
  <g stroke="color-mix(in srgb, currentColor 60%, black)" stroke-width="0.35" opacity="0.55" stroke-linecap="round">
    <path d="M2 10.4 L4.4 11.6"/><path d="M2 14.4 L4.4 13.2"/>
    <path d="M14.4 5.4 L15 8"/><path d="M14.4 18.6 L14.8 16.2"/>
  </g>
  <circle cx="17.6" cy="11.6" r="1.5" fill="#f4ecd8"/>
  <circle cx="17.8" cy="11.6" r="0.85" fill="#0d1a12"/>
  <circle cx="17.5" cy="11.3" r="0.22" fill="#ffffff" opacity="0.85"/>
  <path d="M11 9.4 C11.8 9 12.8 9 13.6 9.4" stroke="currentColor" stroke-width="0.7" opacity="0.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="9.4" cy="10.4" rx="2.6" ry="1.3" fill="#ffffff" opacity="0.32"/>
</svg>
"""
