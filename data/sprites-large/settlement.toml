# settlement — the parent behind village.toml's own pair of cottages: three
# small roofs at uneven heights with plain door slits, no tree and no
# tower, visibly humbler than both village.toml and municipality.toml.
# Same white/black wash over currentColor that village.toml and town.toml
# use for their roofs; the door slits stay a fixed dark opening the way
# every roofed sprite in this pack marks its own entrance.
classes = ["settlement"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="settlement-wash" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <path d="M1.6 16.8 L4.4 13.2 L7.2 16.8 V21.4 H1.6 Z" fill="url(#settlement-wash)" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
  <rect x="3.4" y="18.6" width="1.4" height="2.8" fill="currentColor" opacity="0.4"/>
  <path d="M7.6 15 L11.6 10.4 L15.6 15 V21.6 H7.6 Z" fill="url(#settlement-wash)" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
  <rect x="10.6" y="17.6" width="2" height="4" fill="currentColor" opacity="0.4"/>
  <path d="M16 17.4 L18.6 14.2 L21.2 17.4 V21.2 H16 Z" fill="url(#settlement-wash)" stroke="currentColor" stroke-width="0.9" stroke-linejoin="round"/>
  <rect x="17.6" y="19" width="1.6" height="2.2" fill="currentColor" opacity="0.4"/>
</svg>
