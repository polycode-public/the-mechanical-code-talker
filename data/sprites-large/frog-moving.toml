# frog-moving — frog-with-emotion.toml's own front view caught mid hop,
# used whenever mgx:pose = moving is taught with no facing fact alongside
# it. The two eye bulges, belly patch and face anchor keep their front-on
# position; the resting back-leg lobes stretch into a pair of kicked-out
# legs, staggered symmetrically to each side, and the body lifts slightly
# into the jump.
classes = ["frog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="frog-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#a8d068"/>
      <stop offset="55%" stop-color="#5a9040"/>
      <stop offset="100%" stop-color="#2f5322"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="14.6" rx="7.4" ry="5.4" fill="url(#frog-moving-fill)"/>
  <ellipse cx="4" cy="19.8" rx="3.4" ry="1.5" fill="url(#frog-moving-fill)" transform="rotate(25 4 19.8)"/>
  <ellipse cx="20" cy="19.8" rx="3.4" ry="1.5" fill="url(#frog-moving-fill)" transform="rotate(-25 20 19.8)"/>
  <g stroke="#2f5322" stroke-width="0.9" stroke-linecap="round">
    <path d="M1.3 18.6 L0.4 19.4"/><path d="M1.7 20.4 L1 21.4"/>
    <path d="M22.7 18.6 L23.6 19.4"/><path d="M22.3 20.4 L23 21.4"/>
  </g>
  <ellipse cx="9.2" cy="16" rx="2.6" ry="1.7" fill="#dcead0" opacity="0.55"/>
  <ellipse cx="8.4" cy="12.6" rx="1.5" ry="1" fill="#2f5322" opacity="0.4"/>
  <ellipse cx="15.6" cy="12.6" rx="1.5" ry="1" fill="#2f5322" opacity="0.4"/>
  <circle cx="8" cy="8" r="2.6" fill="url(#frog-moving-fill)"/>
  <circle cx="16" cy="8" r="2.6" fill="url(#frog-moving-fill)"/>
  <circle cx="8" cy="7.8" r="1.9" fill="#f4ecd8"/>
  <circle cx="16" cy="7.8" r="1.9" fill="#f4ecd8"/>
  <ellipse cx="9.4" cy="13.2" rx="2.4" ry="1.3" fill="#ffffff" opacity="0.22"/>
  <ellipse cx="7.2" cy="7" rx="0.7" ry="0.5" fill="#ffffff" opacity="0.6"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:pose"
value = "moving"

# Reuses frog-with-emotion.toml's own front-facing anchor unchanged — this
# is still the centre view, so the face fragment stays exactly where it
# already sits between the two eye bulges.
[face]
cx = 12
cy = 12
scale = 5.5

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
