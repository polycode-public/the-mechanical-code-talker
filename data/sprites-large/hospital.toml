# hospital — a building marked by a fixed medical cross at the sprite
# tier: the cross reads red regardless of theme, the way the letter's
# own wax seal stays fixed — its colour comes from what it signifies,
# not from the wall behind it.
classes = ["hospital"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="hospital-wash" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect x="4" y="6.4" width="16" height="14.6" rx="0.6" fill="url(#hospital-wash)" stroke="currentColor" stroke-width="1.3"/>
  <g fill="#b23a2e">
    <rect x="10.6" y="9" width="2.8" height="8.2" rx="0.4"/>
    <rect x="7.9" y="11.7" width="8.2" height="2.8" rx="0.4"/>
  </g>
  <rect x="9.8" y="17.6" width="4.4" height="3.4" fill="#000000" opacity="0.22"/>
  <path d="M5.6 7.8 L5.6 19.4" stroke="#ffffff" stroke-width="0.6" opacity="0.3"/>
</svg>
"""
