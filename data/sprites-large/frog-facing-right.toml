# frog-facing-right — frog-facing-left.toml's profile mirrored across the
# canvas midline (every shape wrapped in one translate-then-flip group), so
# the two directions stay geometrically identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is
# never mirrored.
classes = ["frog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="frog-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#a8d068"/>
      <stop offset="55%" stop-color="#5a9040"/>
      <stop offset="100%" stop-color="#2f5322"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="14.5" cy="15.2" rx="7.4" ry="5.2" fill="url(#frog-facing-right-fill)"/>
    <ellipse cx="10" cy="17.8" rx="3" ry="2" fill="url(#frog-facing-right-fill)"/>
    <ellipse cx="20.5" cy="17.4" rx="2.2" ry="1.6" fill="url(#frog-facing-right-fill)"/>
    <g stroke="#2f5322" stroke-width="0.9" stroke-linecap="round">
      <path d="M7.6 18.6 L6.6 20"/><path d="M9.4 19.6 L9.2 21"/><path d="M11.6 19.4 L12 20.8"/>
    </g>
    <ellipse cx="11.8" cy="17" rx="2.6" ry="1.7" fill="#dcead0" opacity="0.55"/>
    <ellipse cx="8.6" cy="13.4" rx="1.3" ry="0.9" fill="#2f5322" opacity="0.4"/>
    <circle cx="9.8" cy="9.6" r="1.1" fill="url(#frog-facing-right-fill)"/>
    <circle cx="9.8" cy="9.5" r="0.75" fill="#f4ecd8"/>
    <circle cx="6" cy="9" r="2.8" fill="url(#frog-facing-right-fill)"/>
    <circle cx="6" cy="8.8" r="2" fill="#f4ecd8"/>
    <path d="M3.4 9.6 C1.8 9.8 1.4 10.8 2.4 11.6 C3.4 12 4.4 10.8 3.4 9.6 Z" fill="#5a9040"/>
    <ellipse cx="12" cy="13.8" rx="2.4" ry="1.3" fill="#ffffff" opacity="0.22"/>
    <ellipse cx="4.8" cy="7.8" rx="0.6" ry="0.45" fill="#ffffff" opacity="0.6"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# frog-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 6.62); cy and scale are the mirror's own invariants.
[face]
cx = 17.38
cy = 9.03
scale = 1.55

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
