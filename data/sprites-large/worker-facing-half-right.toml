# worker-facing-half-right — worker-facing-half-left.toml's three-quarter
# turn mirrored across the canvas midline. {{FACE}} sits outside the flip
# group so a resolved expression never reads back-to-front.
classes = ["worker"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="worker-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M7.5 3.6 C7.5 1.8 9.3 0.3 11.7 0.3 C14.1 0.3 15.9 1.8 15.9 3.6 L15.9 3.9 L7.5 3.9 Z" fill="url(#worker-facing-half-right-fill)"/>
    <ellipse cx="11.7" cy="3.9" rx="5" ry="0.7" fill="url(#worker-facing-half-right-fill)"/>
    <g fill="url(#worker-facing-half-right-fill)">
      <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
      <path d="M14.6 13.1 C16.4 13.2 18.1 14.7 18.4 17.4 C18.5 18.8 17.8 19.7 16.8 19.2 C16.7 17.1 16.1 15.1 14.3 14.2 Z"/>
      <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
      <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
    </g>
    <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
    <rect x="7.2" y="15.6" width="9.6" height="1.3" rx="0.2" fill="#e8a325"/>
    <rect x="7.2" y="16.45" width="9.6" height="0.35" fill="#f4f1ea" opacity="0.85"/>
    <ellipse cx="6.7" cy="17.5" rx="1" ry="0.6" fill="color-mix(in srgb, currentColor 40%, white)" transform="rotate(-25 6.7 17.5)"/>
    <ellipse cx="17.3" cy="17.5" rx="1" ry="0.6" fill="color-mix(in srgb, currentColor 40%, white)" transform="rotate(25 17.3 17.5)"/>
    <path d="M16.4 17.6 C16.7 17.2 17.3 17.2 17.6 17.6 C17.8 17.9 17.8 18.2 17.6 18.5 L19.4 20.3 L18.9 20.8 L17.1 19 C16.8 19.2 16.5 19.2 16.2 19 C15.8 18.7 15.8 18.1 16.4 17.6 Z" fill="#8a8f99"/>
    <circle cx="11.7" cy="6.6" r="3.3" fill="url(#worker-facing-half-right-fill)"/>
    <path d="M8.6 6.1 Q7.9 7.4 8.6 8.1 Z" fill="url(#worker-facing-half-right-fill)"/>
    <ellipse cx="10" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
    <ellipse cx="14" cy="6.05" rx="0.18" ry="0.22" fill="#1c1c1c"/>
    <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <ellipse cx="8.7" cy="3.4" rx="1.6" ry="0.5" fill="#ffffff" opacity="0.32"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# worker-facing-half-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 11.08); cy and scale are the mirror's own invariants.
[face]
cx = 12.92
cy = 6.51
scale = 2.7

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
