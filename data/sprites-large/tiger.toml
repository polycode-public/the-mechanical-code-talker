# tiger — the dog.toml silhouette with pointed ears and a set of fixed dark
# stripe strokes overlaid on the gradient coat, since stripes read as a
# marking on top of the coat's own colour, not a second material.
classes = ["tiger"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="tiger-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15" rx="6.6" ry="4.4" fill="url(#tiger-fill)"/>
  <circle cx="7" cy="9" r="3.8" fill="url(#tiger-fill)"/>
  <path d="M4.2 6.4 L3.2 3 L6.4 5 Z" fill="url(#tiger-fill)"/>
  <path d="M9.4 6 L10 2.6 L12.4 5.2 Z" fill="url(#tiger-fill)"/>
  <g stroke="#241f19" stroke-width="0.9" stroke-linecap="round" opacity="0.55">
    <path d="M9 12.4 L11.6 11.4"/>
    <path d="M9.4 15 L12.4 14.4"/>
    <path d="M9.8 17.4 L12.6 17.2"/>
    <path d="M15.6 12 L18 11.6"/>
    <path d="M16.2 15.2 L18.8 15.4"/>
    <path d="M5.4 8.4 L6.6 7.6"/>
  </g>
  <ellipse cx="6.1" cy="8" rx="1" ry="1.3" fill="#000000" opacity="0.22"/>
  <path d="M19 13 C22 12.4 22.4 15.2 20 16 Z" fill="url(#tiger-fill)"/>
  <ellipse cx="9.6" cy="12.2" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
</svg>
"""
