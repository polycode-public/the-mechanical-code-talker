# tiger — the dog.toml silhouette with pointed ears, fixed dark stripe
# strokes and fixed cream cheek patches overlaid on the gradient coat
# (stripes and cheek fur read as markings on top of the coat's own colour,
# not a second material), plus four legs with paws.
classes = ["tiger"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="tiger-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15" rx="6.6" ry="4.4" fill="url(#tiger-fill)"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="8" y1="18.4" x2="7.8" y2="21.6"/>
    <line x1="11" y1="19.2" x2="11" y2="22"/>
    <line x1="15" y1="19.2" x2="15.2" y2="22"/>
    <line x1="18" y1="18.2" x2="18.4" y2="21.4"/>
  </g>
  <g fill="url(#tiger-fill)">
    <ellipse cx="7.8" cy="21.9" rx="0.9" ry="0.55"/>
    <ellipse cx="11" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="15.2" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="18.4" cy="21.7" rx="0.9" ry="0.55"/>
  </g>
  <circle cx="7" cy="9" r="3.8" fill="url(#tiger-fill)"/>
  <path d="M4.2 6.4 L3.2 3 L6.4 5 Z" fill="url(#tiger-fill)"/>
