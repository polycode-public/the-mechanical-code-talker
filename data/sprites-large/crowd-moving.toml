# crowd-moving — crowd-with-emotion.toml's frontmost figure caught
# mid-stride, with no facing angle recorded (mgx:pose = "moving" alone,
# centre view). Its head stays crowd-with-emotion.toml's own front anchor
# exactly; its two arms swing oppositely (one raised and pulled in, the
# other extended down and back) and its torso leans slightly off its
# resting silhouette — the same kind of small, readable coordinate shift
# king-facing-left-moving.toml uses for its own profile stride, applied
# here to a front view instead of a profile. The two flanking figures stay
# exactly as crowd.toml draws them.
classes = ["crowd"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="crowd-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g opacity="0.6">
    <path d="M3.2 14.5 C1.9 14.6 0.6 15.7 0.4 17.8 C0.3 18.8 0.8 19.5 1.6 19.1 C1.6 17.6 2.1 16.0 3.5 15.4 Z" fill="url(#crowd-moving-fill)"/>
    <path d="M7.2 14.5 C8.5 14.6 9.8 15.7 10.0 17.8 C10.1 18.8 9.6 19.5 8.8 19.1 C8.8 17.6 8.3 16.0 6.9 15.4 Z" fill="url(#crowd-moving-fill)"/>
    <path d="M1.4 22 C1.4 17.8 3 15.9 5.2 15.9 C7.4 15.9 9 17.8 9 22 Z" fill="url(#crowd-moving-fill)"/>
    <circle cx="5.2" cy="9.6" r="2.5" fill="url(#crowd-moving-fill)"/>
  </g>
  <g opacity="0.6">
    <path d="M16.8 14.5 C15.5 14.6 14.2 15.7 14.0 17.8 C13.9 18.8 14.4 19.5 15.2 19.1 C15.2 17.6 15.7 16.0 17.1 15.4 Z" fill="url(#crowd-moving-fill)"/>
    <path d="M20.8 14.5 C22.1 14.6 23.4 15.7 23.6 17.8 C23.7 18.8 23.2 19.5 22.4 19.1 C22.4 17.6 21.9 16.0 20.5 15.4 Z" fill="url(#crowd-moving-fill)"/>
    <path d="M15 22 C15 17.8 16.6 15.9 18.8 15.9 C21 15.9 22.6 17.8 22.6 22 Z" fill="url(#crowd-moving-fill)"/>
    <circle cx="18.8" cy="9.6" r="2.5" fill="url(#crowd-moving-fill)"/>
  </g>
  <path d="M9.6 13.5 C8.3 13.0 7.1 13.8 6.8 15.9 C6.7 17.1 7.2 17.8 8.0 17.5 C8.1 16.0 8.5 14.7 9.8 14.0 Z" fill="url(#crowd-moving-fill)"/>
  <path d="M14.4 13.5 C16.2 13.8 17.8 15.4 18.1 17.9 C18.2 19.1 17.5 19.9 16.5 19.4 C16.3 17.5 15.7 15.7 14.1 14.5 Z" fill="url(#crowd-moving-fill)"/>
  <path d="M7.0 22 C6.9 17.2 9.0 14.8 12 14.9 C15.0 15.0 17.1 17.2 16.9 21.8 C14.9 21.4 9.1 21.4 7.0 22 Z" fill="url(#crowd-moving-fill)"/>
  <ellipse cx="10.5" cy="17.1" rx="1.3" ry="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="12" cy="7.6" r="3" fill="url(#crowd-moving-fill)"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:pose"
value = "moving"

# The center figure's own cx/cy/r crowd-with-emotion.toml's own front-facing
# anchor declares — the walk cycle changes the body, never the head anchor.
[face]
cx = 12
cy = 7.6
scale = 3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
