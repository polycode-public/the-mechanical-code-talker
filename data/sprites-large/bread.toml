# bread — a food item at the sprite tier: a fixed warm crust gradient
# (bread's own colour is what makes it read as bread, the same reason the
# lamp's flame stays fixed regardless of theme) rather than a taught
# mgx:madeOf material. Three deep score slashes show pale crumb through
# the crust, the crust-versus-crumb contrast a plain gradient loaf can't
# carry on its own, plus a base shadow and one crust highlight.
classes = ["bread"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bread-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f0c987"/>
      <stop offset="55%" stop-color="#d19a4c"/>
      <stop offset="100%" stop-color="#9c6a26"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="19.6" rx="8.8" ry="1.4" fill="#5c3a14" opacity="0.28"/>
  <path d="M3.4 15.8 C2.8 10.2 6.8 5 12 5 C17.2 5 21.2 10.2 20.6 15.8 C20.3 18.8 16.7 20.2 12 20.2 C7.3 20.2 3.7 18.8 3.4 15.8 Z" fill="url(#bread-fill)"/>
  <g stroke="#fbe8c0" stroke-width="1.15" stroke-linecap="round" opacity="0.85">
    <path d="M8 8.6 C8.7 11.4 8.7 15.6 7.7 18.4" fill="none"/>
    <path d="M12 7.8 C12.7 10.8 12.7 16 11.9 19" fill="none"/>
    <path d="M16 8.6 C16.7 11.4 16.7 15.6 15.7 18.4" fill="none"/>
  </g>
  <g stroke="#8a5a24" stroke-width="0.4" opacity="0.4" stroke-linecap="round">
    <path d="M8.5 8.8 C9.2 11.5 9.2 15.6 8.2 18.3" fill="none"/>
    <path d="M12.5 8 C13.2 10.9 13.2 16 12.4 19" fill="none"/>
    <path d="M16.5 8.8 C17.2 11.5 17.2 15.6 16.2 18.3" fill="none"/>
  </g>
  <path d="M6.2 8.4 C7.6 6.2 9.8 5.2 12 5.2" fill="none" stroke="#fbe4b8" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
</svg>
"""
