# kitchen — the family's shared room vignette turned toward cooking: a
# fixed cast-iron stove with two lit burners, a copper pan hung from a
# wall peg, and a curl of steam standing in for the room's usual window
# light. The stove-iron and pan-copper are fixed because they are the
# fixture's own real-world colours, not a theme's to shade.
