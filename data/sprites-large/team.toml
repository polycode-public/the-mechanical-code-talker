      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="5" cy="9" r="2.6" fill="url(#team-fill)"/>
  <path d="M1.6 22 C1.6 17.7 3 15.6 5 15.6 C7 15.6 8.4 17.7 8.4 22 Z" fill="url(#team-fill)"/>
