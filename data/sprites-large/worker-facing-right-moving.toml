# worker-facing-right-moving — worker-facing-left-moving.toml's mid-stride
# profile mirrored across the canvas midline. {{FACE}} sits outside the flip
# group.
classes = ["worker"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="worker-facing-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M7.2 3.6 C7.2 1.8 9.0 0.3 11.4 0.3 C13.8 0.3 15.6 1.8 15.6 3.6 L15.6 3.9 L7.2 3.9 Z" fill="url(#worker-facing-right-moving-fill)"/>
    <ellipse cx="11.4" cy="3.9" rx="5" ry="0.7" fill="url(#worker-facing-right-moving-fill)"/>
    <g fill="url(#worker-facing-right-moving-fill)">
      <path d="M9.4 13.1 C7.8 12.5 6.3 13.5 5.8 16.1 C5.6 17.5 6.2 18.5 7.3 18.2 C7.4 16.2 7.9 14.5 9.6 13.6 Z"/>
      <path d="M14.6 13.1 C16.7 13.5 18.7 15.3 19 18.2 C19.1 19.5 18.3 20.3 17.2 19.7 C17 17.4 16.3 15.1 14.3 14.2 Z"/>
      <path d="M6.3 21 C6.1 15.5 8.7 12.9 11.7 12.9 C15.1 12.9 17.6 14.8 17.1 19.6 C16.9 20.7 15.9 20.7 15.1 20.1 Z"/>
      <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
    </g>
    <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
    <rect x="7.2" y="15.6" width="9.6" height="1.3" rx="0.2" fill="#e8a325"/>
    <rect x="7.2" y="16.45" width="9.6" height="0.35" fill="#f4f1ea" opacity="0.85"/>
    <ellipse cx="6.7" cy="17.5" rx="1" ry="0.6" fill="color-mix(in srgb, currentColor 40%, white)" transform="rotate(-25 6.7 17.5)"/>
    <ellipse cx="17.3" cy="17.5" rx="1" ry="0.6" fill="color-mix(in srgb, currentColor 40%, white)" transform="rotate(25 17.3 17.5)"/>
    <path d="M16.4 17.6 C16.7 17.2 17.3 17.2 17.6 17.6 C17.8 17.9 17.8 18.2 17.6 18.5 L19.4 20.3 L18.9 20.8 L17.1 19 C16.8 19.2 16.5 19.2 16.2 19 C15.8 18.7 15.8 18.1 16.4 17.6 Z" fill="#8a8f99"/>
    <circle cx="11.4" cy="6.6" r="3.3" fill="url(#worker-facing-right-moving-fill)"/>
    <path d="M8.3 6 Q7.05 7 8.3 8.05 Z" fill="url(#worker-facing-right-moving-fill)"/>
    <ellipse cx="9.7" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
    <ellipse cx="8.4" cy="3.4" rx="1.6" ry="0.5" fill="#ffffff" opacity="0.32"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 13.5
cy = 6.4
scale = 2.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
