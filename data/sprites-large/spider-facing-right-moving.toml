# spider-facing-right-moving — spider-facing-left-moving.toml's mid-scuttle
# full profile mirrored across the canvas midline (every shape wrapped in
# one translate-then-flip group), so the two directions stay geometrically
# identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["spider"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="spider-facing-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g stroke="currentColor" stroke-width="0.9" fill="none" stroke-linecap="round">
      <path d="M8.64 10.36 L7.2 7"/>
      <path d="M10.36 11.96 L9.2 10"/>
      <path d="M12.09 13.56 L10.2 10.5"/>
      <path d="M13.81 15.16 L13.5 12.5"/>
    </g>
    <ellipse cx="14.5" cy="15.8" rx="5" ry="4.6" fill="url(#spider-facing-right-moving-fill)"/>
    <ellipse cx="12.8" cy="14.1" rx="1.7" ry="1.3" fill="#000000" opacity="0.2"/>
    <path d="M14.5 12.6 L16.7 15.4 L14.5 15.8 L12.3 15.4 Z" fill="color-mix(in srgb, currentColor 80%, black)" opacity="0.55"/>
    <ellipse cx="19.3" cy="16.6" rx="0.85" ry="0.65" fill="#1c1c1c"/>
    <circle cx="7.6" cy="9.4" r="2.9" fill="url(#spider-facing-right-moving-fill)"/>
    <ellipse cx="6.7" cy="8.5" rx="1.05" ry="0.8" fill="#ffffff" opacity="0.32"/>
    <g stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round">
      <path d="M8.64 10.36 L2.5 13"/>
      <path d="M10.36 11.96 L7.5 20.5"/>
      <path d="M12.09 13.56 L7 20"/>
      <path d="M13.81 15.16 L16.5 23"/>
    </g>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "right"

[[match]]
property = "mgx:pose"
value = "moving"

# spider-facing-left-moving.toml's anchor reflected across the canvas
# midline (cx = 24 - 7.6); cy and scale are the mirror's own invariants.
[face]
cx = 16.4
cy = 9.4
scale = 1.9

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
