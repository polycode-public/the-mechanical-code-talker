# gathering — a loose huddle of four, more generic than crowd.toml's
# mirrored front-and-flanks trio or audience.toml's seated row: no
# baseline, no symmetry, just bodies bunched close at uneven sizes and
# heights the way any unplanned group of people actually stands. A pale
# hairline stroke on each head is the only thing separating one figure's
# silhouette from its neighbour's, the same reason a coin stack needs a
# rim between each coin.
classes = ["gathering"]
