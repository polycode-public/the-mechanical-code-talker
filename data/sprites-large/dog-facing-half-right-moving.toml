# dog-facing-half-right-moving — dog-facing-half-left-moving.toml's stride
# mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins. {{FACE}} sits outside the flip group, the same rule the
# full profile pair uses, so a resolved expression never reads
# back-to-front.
classes = ["dog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="dog-facing-half-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="13.8" cy="15.4" rx="6.2" ry="4.2" fill="url(#dog-facing-half-right-moving-fill)"/>
    <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="8.8" y1="18.1" x2="7" y2="20.6"/>
      <line x1="11.2" y1="19.3" x2="12.8" y2="22"/>
      <line x1="15.2" y1="19.4" x2="17" y2="22.1"/>
      <line x1="18.6" y1="17.9" x2="17.1" y2="20.3"/>
    </g>
    <g fill="url(#dog-facing-half-right-moving-fill)">
      <ellipse cx="7" cy="20.7" rx="0.8" ry="0.5"/>
      <ellipse cx="12.8" cy="22.2" rx="0.9" ry="0.55"/>
      <ellipse cx="17" cy="22.3" rx="0.9" ry="0.55"/>
      <ellipse cx="17.1" cy="20.4" rx="0.8" ry="0.5"/>
    </g>
    <path d="M19.6 12.5 C22.8 10.3 23.4 13.1 20.4 14.5 Z" fill="url(#dog-facing-half-right-moving-fill)"/>
    <path d="M9.2 6.7 L10 4.5 L7.8 5.3 Z" fill="url(#dog-facing-half-right-moving-fill)"/>
    <circle cx="6.8" cy="9" r="3.6" fill="url(#dog-facing-half-right-moving-fill)"/>
    <path d="M4.4 6.6 L2 2.9 L6.2 5 Z" fill="url(#dog-facing-half-right-moving-fill)"/>
    <path d="M6.4 8 L3 9.4 L6.4 10.6 Z" fill="url(#dog-facing-half-right-moving-fill)"/>
    <ellipse cx="8.3" cy="8.8" rx="0.9" ry="1.1" fill="#000000" opacity="0.22"/>
    <ellipse cx="5.4" cy="7.9" rx="0.55" ry="0.6" fill="#1c1c1c"/>
    <ellipse cx="9.5" cy="7.9" rx="0.35" ry="0.4" fill="#1c1c1c"/>
    <ellipse cx="3" cy="9.4" rx="0.5" ry="0.4" fill="#1c1c1c"/>
    <ellipse cx="10.6" cy="13" rx="2.4" ry="1.4" fill="#ffffff" opacity="0.28"/>
    <ellipse cx="5.8" cy="6.9" rx="1.1" ry="0.8" fill="#ffffff" opacity="0.32"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

# dog-facing-half-left-moving.toml's anchor reflected across the canvas
# midline (cx = 24 - 6.6); cy and scale are the mirror's own invariants,
# since the fragment sits outside the flip group and never itself gets
# flipped.
[face]
cx = 17.4
cy = 8.35
scale = 3.0

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
