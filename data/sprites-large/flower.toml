# flower — the garden's own bloom at the sprite tier: a corolla of
# petals around a bright centre, no material (a petal's own colour is
# whatever currentColor sets, matching the tier's other plant/creature
# treatments). The petal gradient is radial rather than linear, so it
# rotates with each petal and shades base-to-tip instead of cutting a
# single diagonal across the whole bloom; thin veins between petals
# give the ring separation at 40px.
classes = ["flower"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <radialGradient id="flower-fill" cx="50%" cy="85%" r="85%">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 55%, white)"/>
      <stop offset="60%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 75%, black)"/>
    </radialGradient>
  </defs>
  <path d="M12 21 L12 13.6" stroke="#3c7a3c" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M12 17.4 C10.2 17.6 8.6 18.6 8 20" fill="none" stroke="#3c7a3c" stroke-width="1" stroke-linecap="round"/>
  <g fill="url(#flower-fill)">
    <ellipse cx="12" cy="6.2" rx="2.6" ry="3.4"/>
    <ellipse cx="12" cy="6.2" rx="2.6" ry="3.4" transform="rotate(72 12 10)"/>
    <ellipse cx="12" cy="6.2" rx="2.6" ry="3.4" transform="rotate(144 12 10)"/>
    <ellipse cx="12" cy="6.2" rx="2.6" ry="3.4" transform="rotate(216 12 10)"/>
    <ellipse cx="12" cy="6.2" rx="2.6" ry="3.4" transform="rotate(288 12 10)"/>
  </g>
  <g stroke="color-mix(in srgb, currentColor 70%, black)" stroke-width="0.3" opacity="0.35" stroke-linecap="round">
    <path d="M12 10 L12 3.2"/>
    <path d="M12 10 L12 3.2" transform="rotate(72 12 10)"/>
    <path d="M12 10 L12 3.2" transform="rotate(144 12 10)"/>
    <path d="M12 10 L12 3.2" transform="rotate(216 12 10)"/>
    <path d="M12 10 L12 3.2" transform="rotate(288 12 10)"/>
  </g>
  <circle cx="12" cy="10" r="2.4" fill="#f4c542"/>
  <ellipse cx="11.2" cy="9.2" rx="0.8" ry="0.6" fill="#ffffff" opacity="0.5"/>
</svg>
"""
