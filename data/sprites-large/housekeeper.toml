# housekeeper — Ashcombe Hall's own housekeeper at the sprite tier:
# mob-cap, head and body share one gradient, apron-tie kept as a flat
# stroke accent, with a highlight along the cap brim.
classes = ["housekeeper"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="housekeeper-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="4.6" rx="5.6" ry="2.1" fill="url(#housekeeper-fill)"/>
  <path d="M8.6 5 C8.6 3 10 1.7 12 1.7 C14 1.7 15.4 3 15.4 5 L15.4 5.6 L8.6 5.6 Z" fill="url(#housekeeper-fill)" opacity="0.92"/>
  <circle cx="12" cy="7.6" r="3.1" fill="url(#housekeeper-fill)"/>
  <path d="M6 21 C6 15.5 8.7 13.1 12 13.1 C15.3 13.1 18 15.5 18 21 Z" fill="url(#housekeeper-fill)"/>
  <path d="M9 16 C10 15.4 14 15.4 15 16" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45" stroke-linecap="round"/>
  <ellipse cx="9.2" cy="3.9" rx="2" ry="0.6" fill="#ffffff" opacity="0.32"/>
</svg>
"""
