# housekeeper — Ashcombe Hall's own housekeeper. A long skirt gives her a
# silhouette the hall's other staff don't share; the class colour stays on
# the dress and the linen mob cap, pinafore and cuffs stay fixed cream, the
# same split badger.toml makes between its stripes and its coat. The brass
# chatelaine on her hip is the mark that names her, and it is the world's own
# fact drawn: this is the one person in the hall who knows where the key is.
