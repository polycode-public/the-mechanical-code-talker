# grandmother-with-emotion — the same body plus shawl as grandmother.toml
# (a shawl draped over both shoulders down past the hip, the single age
# cue), plus the shared face-fragment mechanism (sprite-expressions.mjs):
# a required [face] anchor and a {{FACE}} placeholder that resolves to
# whichever of the 6 curated mgx:feels words
# (happy/sad/angry/scared/surprised/calm) the instance's own fact names. No
# mgx:feels fact falls through to the plain grandmother.toml sprite, the
# same dog/dog-with-colour precedent. {{FACE}} sits as the last child
# before </svg>, painting over the body beneath it.
classes = ["grandmother"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="grandmother-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#grandmother-with-emotion-fill)"/>
  <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z" fill="url(#grandmother-with-emotion-fill)"/>
  <path d="M6.4 13.6 C5.8 16.3 6.1 19 7.6 21.2 C8.3 20.9 9 20.5 9.5 20 C8.3 18.1 8 15.9 8.5 13.9 C7.8 13.7 7.1 13.6 6.4 13.6 Z" fill="url(#grandmother-with-emotion-fill)" opacity="0.88"/>
  <path d="M17.6 13.6 C18.2 16.3 17.9 19 16.4 21.2 C15.7 20.9 15 20.5 14.5 20 C15.7 18.1 16 15.9 15.5 13.9 C16.2 13.7 16.9 13.6 17.6 13.6 Z" fill="url(#grandmother-with-emotion-fill)" opacity="0.88"/>
  <path d="M8.5 13.9 C9.8 13 10.9 12.6 12 12.6 C13.1 12.6 14.2 13 15.5 13.9" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.5"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r grandmother.toml's own head circle declares.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
