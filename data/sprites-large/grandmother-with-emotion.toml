# grandmother-with-emotion — the same body, pale grey hair and shawl as
# grandmother.toml, plus the shared face-fragment mechanism
# (sprite-expressions.mjs): a required [face] anchor and a {{FACE}}
# placeholder that resolves to whichever of the 6 curated mgx:feels words
# (happy/sad/angry/scared/surprised/calm) the instance's own fact names. No
# mgx:feels fact falls through to the plain grandmother.toml sprite, the
# same dog/dog-with-colour precedent. {{FACE}} sits as the last child
# before </svg>, painting over the body beneath it.
classes = ["grandmother"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="grandmother-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M15.6 5.4 C17 7 17.2 9.6 16 12.6" fill="none" stroke="color-mix(in srgb, currentColor 20%, white)" stroke-width="1.6" stroke-linecap="round" opacity="0.92"/>
  <path d="M8.4 5.4 C7 7 6.8 9.6 8 12.6" fill="none" stroke="color-mix(in srgb, currentColor 20%, white)" stroke-width="1.6" stroke-linecap="round" opacity="0.92"/>
  <g fill="url(#grandmother-with-emotion-fill)">
    <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
    <path d="M14.6 13.1 C16.4 13.2 18.1 14.7 18.4 17.4 C18.5 18.8 17.8 19.7 16.8 19.2 C16.7 17.1 16.1 15.1 14.3 14.2 Z"/>
    <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#grandmother-with-emotion-fill)"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 13.9 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <path d="M6.4 13.6 C5.8 16.3 6.1 19 7.6 21.2 C8.3 20.9 9 20.5 9.5 20 C8.3 18.1 8 15.9 8.5 13.9 C7.8 13.7 7.1 13.6 6.4 13.6 Z" fill="url(#grandmother-with-emotion-fill)" opacity="0.88"/>
  <path d="M17.6 13.6 C18.2 16.3 17.9 19 16.4 21.2 C15.7 20.9 15 20.5 14.5 20 C15.7 18.1 16 15.9 15.5 13.9 C16.2 13.7 16.9 13.6 17.6 13.6 Z" fill="url(#grandmother-with-emotion-fill)" opacity="0.88"/>
  <path d="M8.5 13.9 C9.8 13 10.9 12.6 12 12.6 C13.1 12.6 14.2 13 15.5 13.9" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.5"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r grandmother.toml's own head circle declares.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
