# vole — chubbier and shorter-tailed than mouse.toml: small round ears
# (radius roughly half of mouse's), a blunt round head instead of a
# pointed one, and a short thick tail held close to the body instead of
# mouse's long thin curve — the tier's usual gradient/highlight, no
# material.
classes = ["vole"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="vole-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="11.4" cy="15.6" rx="6.8" ry="5.4" fill="url(#vole-fill)"/>
  <circle cx="8.6" cy="9.6" r="4.6" fill="url(#vole-fill)"/>
  <circle cx="5.6" cy="6.4" r="1.4" fill="url(#vole-fill)"/>
  <circle cx="9.4" cy="5.2" r="1.5" fill="url(#vole-fill)"/>
  <circle cx="7.6" cy="10.2" r="0.8" fill="#000000" opacity="0.55"/>
  <ellipse cx="4.8" cy="10.6" rx="1" ry="0.8" fill="#c98c8c" opacity="0.7"/>
  <ellipse cx="18.6" cy="17.2" rx="2.4" ry="1.8" fill="url(#vole-fill)"/>
  <ellipse cx="9" cy="17" rx="3.2" ry="1.7" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="6" cy="5.6" rx="0.7" ry="0.5" fill="#ffffff" opacity="0.32"/>
</svg>
"""
