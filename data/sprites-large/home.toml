# home — the shelter glyph, warmed: a fixed golden window glow and a
# curl of chimney smoke turn the same pitched-roof-over-doorstep shape
# house.toml carries literally into a lived-in one, so home reads warmer
# than house rather than sharing its box. The glow and smoke are fixed
# because they are what "occupied and lit" means regardless of theme.
classes = ["home"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="home-wash" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 45%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 72%, black)"/>
    </linearGradient>
    <radialGradient id="home-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M3.4 13.4 L12 4 L20.6 13.4 Z" fill="url(#home-wash)"/>
  <path d="M3.4 13.4 L12 4 L20.6 13.4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
  <rect x="8.4" y="13.4" width="7.2" height="7.6" rx="0.6" fill="url(#home-wash)" stroke="currentColor" stroke-width="1"/>
  <rect x="10.6" y="16.4" width="2.8" height="4.6" fill="color-mix(in srgb, currentColor 80%, black)"/>
  <circle cx="12" cy="18.7" r="0.3" fill="#c9a227"/>
  <circle cx="16.8" cy="14.6" r="1.5" fill="url(#home-glow)"/>
  <rect x="16" y="13.8" width="1.6" height="1.6" fill="none" stroke="currentColor" stroke-width="0.5"/>
  <rect x="15.4" y="6" width="1.3" height="2.6" fill="color-mix(in srgb, currentColor 60%, black)"/>
  <path d="M16 5.6 C14.8 4.6 17 3.8 15.8 2.8" fill="none" stroke="#c9c6bd" stroke-width="0.7" opacity="0.7" stroke-linecap="round"/>
  <line x1="2.6" y1="21" x2="21.4" y2="21" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
</svg>
"""
