# home — a shelter glyph at the sprite tier: a roof pitched over a low
# doorstep, symbolic rather than a full elevation (house.toml carries
# the literal building), the same fixed white-to-black wash room.toml
# uses rather than a currentColor mix (a background tint's own
# light/dark direction would otherwise flip between themes).
classes = ["home"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="home-wash" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <path d="M3.4 13.4 L12 4 L20.6 13.4 Z" fill="url(#home-wash)" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="8.4" y="13.4" width="7.2" height="7.6" rx="0.6" fill="url(#home-wash)" stroke="currentColor" stroke-width="1.2"/>
  <rect x="10.6" y="16.4" width="2.8" height="4.6" fill="#000000" opacity="0.24"/>
  <path d="M5.4 12.4 L12 6.2" stroke="#ffffff" stroke-width="0.8" opacity="0.4" stroke-linecap="round" fill="none"/>
  <line x1="2.6" y1="21" x2="21.4" y2="21" stroke="currentColor" stroke-width="1" opacity="0.4"/>
</svg>
"""
