# room — the family's shared room vignette kept at its plainest: a floor
# line and one window of daylight, with no furniture forcing a specific
# identity, so this can stand in for any interior none of the other
# sprites in this pack name.
classes = ["room"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="room-wash" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 38%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 65%, black)"/>
    </linearGradient>
    <radialGradient id="room-light" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fff6da" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fff6da" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#room-wash)"/>
  <rect x="3" y="15.6" width="18" height="5.4" fill="color-mix(in srgb, currentColor 55%, black)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <circle cx="15.4" cy="9.4" r="4.4" fill="url(#room-light)"/>
  <rect x="12.6" y="6.6" width="5.6" height="5.6" fill="#cfe0e6" stroke="#454b52" stroke-width="0.5"/>
  <path d="M15.4 6.6 V12.2 M12.6 9.4 H18.2" stroke="#454b52" stroke-width="0.4"/>
</svg>
"""
