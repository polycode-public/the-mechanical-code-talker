# horse-facing-half-left — the horse turned three-quarters, a shallower
# lean than horse-facing-left.toml's full profile: the neck sweeps up and
# only partway toward the left edge, the head tip lands nearer the
# canvas's centre, and a faint far-cheek line shows alongside the near eye
# — the cue that reads as a turned head rather than a flat profile. The
# body and legs keep the profile file's own general layout, shifted to sit
# under this shallower neck.
classes = ["horse"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="horse-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13.8" cy="14.7" rx="7" ry="4.1" fill="url(#horse-facing-half-left-fill)"/>
  <path d="M12.8 12.5 C12.4 8.7 11.2 5.7 9.5 4.6 C10.3 6.7 10.5 8.9 10.1 11 C9.4 12 9.4 13.5 10.5 14.3 C11.8 13.4 12.5 13 12.8 12.5 Z" fill="url(#horse-facing-half-left-fill)"/>
  <path d="M8 6 C8.8 6.5 9.4 7.4 9.6 8.5" fill="none" stroke="#000000" stroke-width="0.7" opacity="0.3" stroke-linecap="round"/>
  <path d="M11 9 C10.8 10.2 10.9 11.4 11.2 12.3" fill="none" stroke="color-mix(in srgb, currentColor 35%, black)" stroke-width="0.5" opacity="0.45" stroke-linecap="round"/>
  <path d="M11 7.4 C11.6 8.4 11.7 9.6 11.3 10.6" fill="none" stroke="color-mix(in srgb, currentColor 35%, black)" stroke-width="0.4" opacity="0.4" stroke-linecap="round"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="9.2" y1="18" x2="8.8" y2="22"/>
    <line x1="12.8" y1="18.6" x2="12.6" y2="22"/>
    <line x1="16.4" y1="18" x2="16.8" y2="22"/>
    <line x1="19.4" y1="17.2" x2="20.2" y2="21.6"/>
  </g>
  <g fill="#2b2118">
    <ellipse cx="8.8" cy="22" rx="0.7" ry="0.4"/>
    <ellipse cx="12.6" cy="22" rx="0.7" ry="0.4"/>
    <ellipse cx="16.8" cy="22" rx="0.7" ry="0.4"/>
    <ellipse cx="20.2" cy="21.6" rx="0.7" ry="0.4"/>
  </g>
  <path d="M16.4 17 C18.8 17.6 19.4 16 18 15.2 Z" fill="url(#horse-facing-half-left-fill)"/>
  <circle cx="9" cy="6.2" r="0.38" fill="#1c1c1c"/>
  <ellipse cx="11.4" cy="12.5" rx="2.8" ry="1.5" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="9.6" cy="6.5" rx="2.2" ry="2" fill="#ffffff" opacity="0.22"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# Half scale is 0.825 * profile radius 3.31 = 2.73 (rounded to 2.72, the
# table's own halfway point between the front view's 1.0*r and the
# profile's 0.65*r). The near eye drawn above sits at (9, 6.2), so
# cx = 9 + 0.4*2.72 = 10.09 and cy = 6.2 + 0.15*2.72 = 6.61.
[face]
cx = 10.09
cy = 6.61
scale = 2.72

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
