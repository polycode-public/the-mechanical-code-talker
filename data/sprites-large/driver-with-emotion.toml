# driver-with-emotion — the same flat-cap-and-wheel body as driver.toml,
# plus the shared face-fragment mechanism (sprite-expressions.mjs): a
# required [face] anchor and a {{FACE}} placeholder that resolves to
# whichever of the 6 curated mgx:feels words the instance's own fact
# names. No mgx:feels fact falls through to the plain driver.toml
# sprite. {{FACE}} sits as the last child before </svg>, painting over
# the body beneath it.
#
# The cap sits ABOVE the head as its own separate geometry (crown peaking
# near y=1.4, brim to one side near y=5) — not the face anchor. [face]
# below is anchored on the SAME head circle driver.toml's own <circle>
# declares (cx=12 cy=6.6 r=3.3), so the resolved face paints onto the
# head itself, clear of the cap.
classes = ["driver"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="driver-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="driver-with-emotion-cap" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5c6b7a"/>
      <stop offset="100%" stop-color="#3c4653"/>
    </linearGradient>
  </defs>
  <g fill="url(#driver-with-emotion-fill)">
    <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
    <path d="M14.6 13.1 C16.4 13.2 18.1 14.7 18.4 17.4 C18.5 18.8 17.8 19.7 16.8 19.2 C16.7 17.1 16.1 15.1 14.3 14.2 Z"/>
    <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#driver-with-emotion-fill)"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <circle cx="12" cy="17.6" r="3" fill="none" stroke="url(#driver-with-emotion-fill)" stroke-width="1.3"/>
  <line x1="12" y1="14.6" x2="12" y2="17.6" stroke="url(#driver-with-emotion-fill)" stroke-width="1.1"/>
  <line x1="9.4" y1="19.1" x2="12" y2="17.6" stroke="url(#driver-with-emotion-fill)" stroke-width="1.1"/>
  <line x1="14.6" y1="19.1" x2="12" y2="17.6" stroke="url(#driver-with-emotion-fill)" stroke-width="1.1"/>
  <circle cx="12" cy="17.6" r="0.7" fill="url(#driver-with-emotion-fill)"/>
  <path d="M8.9 4.5 C8.7 2.7 10 1.4 12 1.4 C14 1.4 15.3 2.7 15.1 4.5 C15.06 4.7 14.9 4.8 14.7 4.8 L9.3 4.8 C9.1 4.8 8.94 4.7 8.9 4.5 Z" fill="url(#driver-with-emotion-cap)"/>
  <path d="M8.9 4.5 C8.3 4.5 7.7 4.7 7.3 4.9 C7.1 5 7.1 5.3 7.4 5.35 L9.3 5.2 L9.3 4.5 Z" fill="url(#driver-with-emotion-cap)"/>
  <circle cx="12" cy="1.7" r="0.35" fill="#2b323b"/>
  <ellipse cx="10.1" cy="2.6" rx="1.2" ry="0.4" fill="#ffffff" opacity="0.25"/>
  {{FACE}}
</svg>
"""

# The head circle driver.toml itself declares (cx=12 cy=6.6 r=3.3) — the
# cap geometry above it is a separate prop, not the face anchor; anchoring
# here keeps the face on the head, clear of the cap.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
