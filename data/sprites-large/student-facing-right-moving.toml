# student-facing-right-moving — student-facing-left-moving.toml's stride
# mirrored across the canvas midline, the same mirror-not-redraw rule
# every right-facing file in this pack follows.
classes = ["student"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="student-facing-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#student-facing-right-moving-fill)">
      <path d="M9.4 13.4 C7.8 12.8 6.3 13.8 5.8 16.4 C5.6 17.8 6.2 18.8 7.3 18.5 C7.4 16.5 7.9 14.8 9.6 13.9 Z"/>
      <path d="M14.6 13.4 C16.7 13.8 18.7 15.6 19 18.5 C19.1 19.8 18.3 20.6 17.2 20 C17 17.7 16.3 15.4 14.3 14.5 Z"/>
      <path d="M6.3 21 C6.1 15.7 8.7 13.2 11.7 13.2 C15.1 13.2 17.6 15 17.1 19.6 C16.9 20.7 15.9 20.7 15.1 20.1 Z"/>
      <path d="M10.75 11.3 L13.25 11.3 L13.05 13.3 L10.95 13.3 Z"/>
    </g>
    <g transform="rotate(-14 11.44 5.3)">
      <path d="M8.64 4.9 C8.64 3.2 9.84 2 11.44 2 C13.04 2 14.24 3.2 14.24 4.9 L14.24 5.4 L8.64 5.4 Z" fill="url(#student-facing-right-moving-fill)" opacity="0.92"/>
      <rect x="6.04" y="4.6" width="10.8" height="1.4" rx="0.2" fill="url(#student-facing-right-moving-fill)"/>
    </g>
    <path d="M16.44 5.4 L17.04 8.6" stroke="currentColor" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
    <circle cx="17.04" cy="8.8" r="0.6" fill="#d4a72c"/>
    <circle cx="11.44" cy="8.6" r="3.1" fill="url(#student-facing-right-moving-fill)"/>
    <path d="M8.53 8.04 Q7.35 8.97 8.53 9.96 Z" fill="url(#student-facing-right-moving-fill)"/>
    <ellipse cx="9.84" cy="8.13" rx="0.26" ry="0.31" fill="#1c1c1c"/>
    <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 13.35
cy = 8.43
scale = 2.02

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
