# mouse-facing-half-right-moving — mouse-facing-half-left-moving.toml's
# mid-scurry three-quarter turn mirrored across the canvas midline (every
# shape wrapped in one translate-then-flip group), so the two directions
# stay geometrically identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["mouse"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="mouse-facing-half-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M4.4 15 C4 12 5.8 9.6 9.2 9.4 C14 8.6 18.4 9 20.8 11.8 C22.8 14.2 22.2 18.6 19 20.6 C15.8 22.4 10 22 7 20.2 C4.8 18.8 4.6 17 4.4 15 Z" fill="url(#mouse-facing-half-right-moving-fill)"/>
    <circle cx="12.4" cy="5.2" r="1.3" fill="url(#mouse-facing-half-right-moving-fill)"/>
    <circle cx="7.6" cy="5.8" r="3" fill="url(#mouse-facing-half-right-moving-fill)"/>
    <path d="M19 19.6 C23 20.8 23.9 16.4 21.4 14 C22.6 16.8 21 18.8 19 19.6 Z" fill="url(#mouse-facing-half-right-moving-fill)"/>
    <ellipse cx="4.8" cy="14.6" rx="0.8" ry="0.6" fill="#c98c8c" opacity="0.7"/>
    <g stroke="#000000" stroke-width="0.35" opacity="0.4">
      <path d="M4.8 14.2 L2.6 13.6"/>
      <path d="M4.8 15 L2.6 15.6"/>
    </g>
    <ellipse cx="6.6" cy="12.6" rx="0.55" ry="0.65" fill="#000000" opacity="0.6"/>
    <ellipse cx="9.8" cy="11" rx="0.25" ry="0.3" fill="#000000" opacity="0.6"/>
    <ellipse cx="16.8" cy="17.4" rx="3" ry="1.6" fill="#ffffff" opacity="0.28"/>
    <ellipse cx="6.6" cy="4.8" rx="0.9" ry="0.7" fill="#ffffff" opacity="0.35"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

# mouse-facing-half-left-moving.toml's anchor reflected across the canvas
# midline (cx = 24 - 7.6); cy and scale are the mirror's own invariants.
[face]
cx = 16.4
cy = 12.975
scale = 2.5

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
