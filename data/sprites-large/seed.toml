# seed — a warm brown husk with a pale hilum stripe and a two-leaf sprout
# breaking out of the tip. The sprout is what makes it a seed rather than a
# bean or a small stone at the size the mud room view draws it. Both husk
# and sprout are fixed colours: shaded from currentColor the husk came out
# near-black on this page and read as a stone, the exact confusion the
# sprout is there to prevent.
