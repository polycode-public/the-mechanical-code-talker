# student-with-emotion — the same mortarboard-and-tassel body as
# student.toml, plus the shared face-fragment mechanism
# (sprite-expressions.mjs): a required [face] anchor and a {{FACE}}
# placeholder that resolves to whichever of the 6 curated mgx:feels words
# the instance's own fact names. No mgx:feels fact falls through to the
# plain student.toml sprite. {{FACE}} sits as the last child before
# </svg>, painting over the body beneath it, below the mortarboard and
# tassel.
classes = ["student"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="student-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#student-with-emotion-fill)">
    <path d="M9.4 13.4 C7.6 13.5 5.9 15 5.6 17.7 C5.5 19.1 6.2 20 7.2 19.5 C7.3 17.4 7.9 15.4 9.7 14.5 Z"/>
    <path d="M14.6 13.4 C16.4 13.5 18.1 15 18.4 17.7 C18.5 19.1 17.8 20 16.8 19.5 C16.7 17.4 16.1 15.4 14.3 14.5 Z"/>
    <path d="M6 21 C6 15.5 8.7 13.1 12 13.1 C15.3 13.1 18 15.5 18 21 Z"/>
    <path d="M10.75 11.3 L13.25 11.3 L13.05 13.3 L10.95 13.3 Z"/>
  </g>
  <g transform="rotate(-6 12 5.3)">
    <path d="M9.2 4.9 C9.2 3.2 10.4 2 12 2 C13.6 2 14.8 3.2 14.8 4.9 L14.8 5.4 L9.2 5.4 Z" fill="url(#student-with-emotion-fill)" opacity="0.92"/>
    <rect x="6.6" y="4.6" width="10.8" height="1.4" rx="0.2" fill="url(#student-with-emotion-fill)"/>
  </g>
  <path d="M17 5.4 L17.6 8.6" stroke="currentColor" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
  <circle cx="17.6" cy="8.8" r="0.6" fill="#d4a72c"/>
  <circle cx="12" cy="8.6" r="3.1" fill="url(#student-with-emotion-fill)"/>
  <path d="M10.4 12.9 L12 14.2 L13.6 12.9" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 14.2 L12 20.5" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r student.toml's own head circle declares.
[face]
cx = 12
cy = 8.6
scale = 3.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
