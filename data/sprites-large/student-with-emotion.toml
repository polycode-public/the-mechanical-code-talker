# student-with-emotion — same face-fragment mechanism as
# person-with-emotion.toml (sprite-expressions.mjs); [face] anchored on
# student.toml's own head circle, below the mortarboard and tassel.
classes = ["student"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="student-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-6 12 5.3)">
    <path d="M9.2 4.9 C9.2 3.2 10.4 2 12 2 C13.6 2 14.8 3.2 14.8 4.9 L14.8 5.4 L9.2 5.4 Z" fill="url(#student-with-emotion-fill)" opacity="0.92"/>
    <rect x="6.6" y="4.6" width="10.8" height="1.4" rx="0.2" fill="url(#student-with-emotion-fill)"/>
  </g>
  <path d="M17 5.4 L17.6 8.6" stroke="currentColor" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
  <circle cx="17.6" cy="8.8" r="0.6" fill="currentColor" opacity="0.75"/>
  <circle cx="12" cy="8.6" r="3.1" fill="url(#student-with-emotion-fill)"/>
  <path d="M6 21 C6 15.5 8.7 13.1 12 13.1 C15.3 13.1 18 15.5 18 21 Z" fill="url(#student-with-emotion-fill)"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r student.toml's own head circle declares.
[face]
cx = 12
cy = 8.6
scale = 3.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
