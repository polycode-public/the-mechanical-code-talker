# elephant — the ear sits behind everything at reduced opacity so it reads
# as "further back" rather than fusing into the head, the head overlaps the
# body at the neck, and the trunk is its own path curling down in FRONT of
# the face. A fixed ivory tusk and four thick pillar legs carry the rest of
# the identity — the tusk is fixed because ivory holds its colour
# regardless of coat, the same reason vole.toml fixes its whiskers.
classes = ["elephant"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="elephant-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="6.2" cy="7.4" rx="3.8" ry="4.4" fill="url(#elephant-fill)" opacity="0.55"/>
  <ellipse cx="14.5" cy="15" rx="7.2" ry="5.4" fill="url(#elephant-fill)"/>
  <g fill="url(#elephant-fill)">
    <rect x="8.6" y="18.8" width="2" height="3.2" rx="1"/>
    <rect x="12.4" y="19.2" width="2" height="3" rx="1"/>
    <rect x="16.4" y="19.2" width="2" height="3" rx="1"/>
    <rect x="19.6" y="18.8" width="2" height="3.2" rx="1"/>
  </g>
  <circle cx="8.8" cy="10.2" r="4.4" fill="url(#elephant-fill)"/>
  <path d="M6.4 13 C5.2 13.6 4.6 15 5 16.4 C5.7 15.6 6.3 14.5 6.7 13.1 Z" fill="#f4ecd8"/>
  <path d="M6.6 13.4 C4.2 14 3 17 3.8 19.6 C4.2 21 5.6 21.2 5.8 19.8 C5 18.4 4.6 16.2 5.4 14.2 C5.7 13.8 6.2 13.6 6.6 13.4 Z" fill="url(#elephant-fill)"/>
  <circle cx="7" cy="9" r="0.6" fill="#000000" opacity="0.5"/>
  <ellipse cx="11.4" cy="12.6" rx="2.8" ry="1.7" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="7.4" cy="8.2" rx="1.3" ry="1" fill="#ffffff" opacity="0.3"/>
</svg>
"""
