# meerkat — the pack's other upright creature, but slender where
# groundhog.toml is plump: a tall sentry stance, small arms held at the
# chest, dark eye-mask patches, and a long tail trailing down to prop
# the stance up, its tip a fixed dark accent (the same technique owl.toml
# uses for its eyes) rather than a currentColor coat — the tier's usual
# gradient/highlight otherwise, no material.
classes = ["meerkat"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="meerkat-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M15.6 13.4 C19.6 14.6 20.8 19 18.6 22.4 C18.2 20 17.6 17.8 16.2 16 C15.6 15.2 15.2 14.2 15.6 13.4 Z" fill="url(#meerkat-fill)"/>
  <ellipse cx="19" cy="21.4" rx="1.5" ry="1.7" fill="#2b1e14"/>
  <ellipse cx="12" cy="22.4" rx="3.6" ry="1.4" fill="url(#meerkat-fill)"/>
  <ellipse cx="11.6" cy="15" rx="4.4" ry="7.2" fill="url(#meerkat-fill)"/>
