# rabbit-facing-left — rabbit-with-emotion.toml's long-eared rabbit turned to
# a left profile: the head moves to the canvas's left edge, a soft pink
# muzzle patch and dark nose break its leading edge, both ears sweep back
# over the turn (the near ear taller and fully opaque, the far ear behind it
# shorter and drawn at reduced opacity so it reads as further away), the
# whiskers fan left off the muzzle, and the cottontail breaks the trailing
# (right) edge. A hand-authored [match] variant (the bear-facing-left.toml
# precedent), selected only when the instance's own mgx:faces fact says
# "left". It also carries the shared face-fragment mechanism, so a rabbit
# taught BOTH mgx:faces = left and one of the 6 mgx:feels words renders this
# profile wearing that mood; taught only the facing, {{FACE}} resolves to
# nothing and the profile keeps the single forward eye it draws itself.
classes = ["rabbit"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="rabbit-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13.4" cy="16.2" rx="5.8" ry="5.2" fill="url(#rabbit-facing-left-fill)"/>
  <circle cx="20.4" cy="17.7" r="1.8" fill="url(#rabbit-facing-left-fill)"/>
  <ellipse cx="13" cy="20.5" rx="1.3" ry="1.6" fill="url(#rabbit-facing-left-fill)"/>
  <ellipse cx="9.4" cy="19.7" rx="1.5" ry="1.8" fill="url(#rabbit-facing-left-fill)"/>
  <ellipse cx="7.6" cy="4.4" rx="1.3" ry="4" fill="url(#rabbit-facing-left-fill)" opacity="0.88" transform="rotate(22 7.6 4.4)"/>
  <ellipse cx="5" cy="3.9" rx="1.4" ry="4.6" fill="url(#rabbit-facing-left-fill)" transform="rotate(14 5 3.9)"/>
  <ellipse cx="5" cy="4.3" rx="0.6" ry="3" fill="#e3aca6" opacity="0.7" transform="rotate(14 5 4.3)"/>
  <circle cx="6.4" cy="9.4" r="3.9" fill="url(#rabbit-facing-left-fill)"/>
  <ellipse cx="3" cy="10.7" rx="1.7" ry="1.3" fill="#e3aca6" opacity="0.55"/>
  <circle cx="1.7" cy="10.4" r="0.45" fill="#1c1c1c"/>
  <ellipse cx="4.6" cy="8.5" rx="0.55" ry="0.68" fill="#1c1c1c"/>
  <g stroke="#1c1c1c" stroke-width="0.2" opacity="0.4" stroke-linecap="round">
    <path d="M3.4 10.2 L0.3 9.4"/>
    <path d="M3.4 10.7 L0.1 10.7"/>
    <path d="M3.6 11.2 L0.5 12"/>
  </g>
  <ellipse cx="7.3" cy="7.2" rx="1.3" ry="0.95" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="10.8" cy="13.6" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from THIS file's own profile geometry, not copied from
# rabbit-with-emotion.toml's front-facing anchor (cx=10.4 cy=9.6 scale=4.2):
# the profile head circle is cx=6.4 cy=9.4 r=3.9, smaller than the front
# head's r=4.2 the same way bear's profile head shrank a little from its own
# front head. scale = 0.65 * 3.9 = 2.535, rounded to 2.54, the same
# profile-scale ratio bear-facing-left.toml used for its own head radius.
# The profile's own default eye already drawn above sits at (4.6, 8.5), so
# cx = 4.6 + 0.4*2.54 = 5.62 and cy = 8.5 + 0.15*2.54 = 8.88, landing the
# shared face fragment's own forward eye exactly on top of it.
[face]
cx = 5.62
cy = 8.88
scale = 2.54

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
