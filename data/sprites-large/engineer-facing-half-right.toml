# engineer-facing-half-right — engineer-facing-half-left.toml's three-quarter
# turn mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins. {{FACE}} sits outside the flip group, the same rule the
# full profile pair uses, so a resolved expression never reads back-to-front.
classes = ["engineer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="engineer-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="engineer-facing-half-right-hat" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f7c65a"/>
      <stop offset="100%" stop-color="#d99a1f"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#engineer-facing-half-right-fill)">
      <path d="M9.4 13.4 C7.6 13.5 5.9 15 5.6 17.7 C5.5 19.1 6.2 20 7.2 19.5 C7.3 17.4 7.9 15.4 9.7 14.5 Z"/>
      <path d="M14.6 13.4 C16.4 13.5 18.1 15 18.4 17.7 C18.5 19.1 17.8 20 16.8 19.5 C16.7 17.4 16.1 15.4 14.3 14.5 Z"/>
      <path d="M6 21 C6 15.5 8.7 13.1 12 13.1 C15.3 13.1 18 15.5 18 21 Z"/>
      <path d="M10.75 11.3 L13.25 11.3 L13.05 13.3 L10.95 13.3 Z"/>
    </g>
    <circle cx="11.72" cy="8.6" r="3.1" fill="url(#engineer-facing-half-right-fill)"/>
    <path d="M8.81 8.13 Q8.15 9.35 8.81 10.01 Z" fill="url(#engineer-facing-half-right-fill)"/>
    <ellipse cx="10.12" cy="8.13" rx="0.26" ry="0.32" fill="#1c1c1c"/>
    <ellipse cx="13.88" cy="8.08" rx="0.17" ry="0.21" fill="#1c1c1c"/>
    <path d="M10.4 12.9 L12 14.2 L13.6 12.9" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M8.42 5.4 C8.42 3.2 9.92 1.7 11.72 1.7 C13.52 1.7 15.02 3.2 15.02 5.4 L15.02 5.9 L8.42 5.9 Z" fill="url(#engineer-facing-half-right-hat)"/>
    <ellipse cx="11.72" cy="6.1" rx="5" ry="0.85" fill="url(#engineer-facing-half-right-hat)"/>
    <path d="M11.72 1.9 L11.72 5.9" stroke="#b9800f" stroke-width="0.3" opacity="0.45"/>
    <ellipse cx="9.42" cy="3.4" rx="1.3" ry="0.45" fill="#ffffff" opacity="0.35"/>
    <g transform="rotate(25 16.4 16.8)">
      <rect x="15.6" y="15.6" width="1.6" height="5.4" rx="0.5" fill="#7d8894"/>
      <path d="M15.1 14.6 C15.1 13.6 15.7 13 16.4 13 C17.1 13 17.7 13.6 17.7 14.6 C17.7 15.3 17.3 15.8 16.7 15.9 L16.1 15.9 C15.5 15.8 15.1 15.3 15.1 14.6 Z" fill="none" stroke="#7d8894" stroke-width="0.7"/>
    </g>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# engineer-facing-half-left.toml's anchor reflected across the canvas
# midline (cx = 24 - 11.14); cy and scale are the mirror's own invariants,
# since the fragment sits outside the flip group and never itself gets
# flipped.
[face]
cx = 12.86
cy = 8.51
scale = 2.54

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
