# cellar — Ashcombe Hall's underground room, the family's shared room
# vignette turned below-grade: a fixed cool-stone stair descends under a
# stone arch, lit by a fixed lantern glow rather than the family's usual
# daylight window, since a cellar has no window to light it. The stone is
# fixed rather than a currentColor mix because a color-mixed stair reads
# as a near-black smear against the room's own dark ink themes; a stone
# grey holds its contrast on every backdrop.
classes = ["cellar"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="cellar-wash" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 34%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 55%, black)"/>
    </linearGradient>
    <linearGradient id="cellar-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa1a8"/>
      <stop offset="100%" stop-color="#666e77"/>
    </linearGradient>
    <radialGradient id="cellar-lantern" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#cellar-wash)"/>
  <rect x="3" y="15.6" width="18" height="5.4" fill="color-mix(in srgb, currentColor 60%, black)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M15.5 12.4 A3.5 3.5 0 0 0 8.5 12.4 V19.6 H15.5 Z" fill="none" stroke="url(#cellar-stone)" stroke-width="1.3"/>
  <path d="M6 19.4 H9.4 V17 H12 V14.6 H15 V12.2 H18 V19.4 Z" fill="url(#cellar-stone)"/>
  <path d="M6 19.4 H9.4 M9.4 17 H12 M12 14.6 H15 M15 12.2 H18" stroke="#454c53" stroke-width="0.4" opacity="0.7"/>
  <circle cx="7.4" cy="17.6" r="2.4" fill="url(#cellar-lantern)"/>
  <rect x="6.95" y="16.95" width="0.9" height="1.3" rx="0.2" fill="#3a2c1c"/>
  <path d="M7.4 16.95 V16.1" stroke="#8a6a3c" stroke-width="0.35"/>
</svg>
"""
