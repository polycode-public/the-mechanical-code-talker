# owl-facing-right-moving — owl-facing-left-moving.toml's mid-flap profile
# mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored.
classes = ["owl"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="owl-facing-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M6.4 4.6 C5.6 3 5.8 1.4 7 0.8 C7.5 2.4 7.7 3.8 7.6 5.1 Z" fill="color-mix(in srgb, currentColor 78%, black)"/>
    <path d="M14.6 5.6 C15.1 4.4 15 3.4 14.3 2.9 C13.9 3.9 13.7 4.8 13.8 5.8 Z" fill="color-mix(in srgb, currentColor 78%, black)"/>
    <path d="M4.4 7.6 C4.4 4.2 7.2 3.4 12.4 3.4 C16.6 3.4 16.8 5.6 16.8 8.6 C16.8 10.6 16.2 11.8 15.6 12.4 C18 13.6 19.4 16.4 19.4 18.8 C19.4 21.2 16.4 22.8 12.6 22.8 C9 22.8 4.6 21.8 4.6 19.8 C4.6 17.2 6 14.8 8.2 13.4 C6 12.2 4.4 10.4 4.4 7.6 Z" fill="url(#owl-facing-right-moving-fill)"/>
    <path d="M17.5 10.5 C19.8 9 22.4 8.4 23.6 6.4 C22.6 9.2 21.4 11.6 18.6 13.2 C18 12.2 17.6 11.3 17.5 10.5 Z" fill="url(#owl-facing-right-moving-fill)"/>
    <path d="M6 17 C3.4 18 1 19.6 1.2 22.2 C3 20.4 5.2 19.2 7.6 18.6 C7.2 18 6.6 17.4 6 17 Z" fill="url(#owl-facing-right-moving-fill)"/>
    <circle cx="6.2" cy="8" r="2.6" fill="#f4ecd8"/>
    <circle cx="6.2" cy="8" r="1.3" fill="#0d1a12"/>
    <circle cx="14.4" cy="8.6" r="1.6" fill="#f4ecd8" opacity="0.55"/>
    <circle cx="14.4" cy="8.6" r="0.8" fill="#0d1a12" opacity="0.55"/>
    <path d="M4.4 9.6 L2.4 10.6 L4.4 11.8 Z" fill="#e8a23a"/>
    <g stroke="#e8a23a" stroke-width="1.1" stroke-linecap="round">
      <path d="M10.2 22.2 L10 23.4"/>
      <path d="M15 22.4 L15.2 23.6"/>
    </g>
    <ellipse cx="11.5" cy="17.4" rx="3.4" ry="2" fill="#ffffff" opacity="0.22"/>
    <circle cx="5.5" cy="7.2" r="0.55" fill="#ffffff" opacity="0.7"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 16.56
cy = 8.47
scale = 3.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
