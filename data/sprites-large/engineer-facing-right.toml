# engineer-facing-right — engineer-facing-left.toml's profile mirrored across
# the canvas midline (every shape wrapped in one translate-then-flip group),
# so the two directions stay geometrically identical twins. The mirror flips
# the lit corner of the shared gradients along with the pose, which reads as
# the same figure turned around under the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the head turned around.
classes = ["engineer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="engineer-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="engineer-facing-right-hat" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f7c65a"/>
      <stop offset="100%" stop-color="#d99a1f"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#engineer-facing-right-fill)">
      <path d="M9.4 13.4 C7.6 13.5 5.9 15 5.6 17.7 C5.5 19.1 6.2 20 7.2 19.5 C7.3 17.4 7.9 15.4 9.7 14.5 Z"/>
      <path d="M14.6 13.4 C16.4 13.5 18.1 15 18.4 17.7 C18.5 19.1 17.8 20 16.8 19.5 C16.7 17.4 16.1 15.4 14.3 14.5 Z"/>
      <path d="M6 21 C6 15.5 8.7 13.1 12 13.1 C15.3 13.1 18 15.5 18 21 Z"/>
      <path d="M10.75 11.3 L13.25 11.3 L13.05 13.3 L10.95 13.3 Z"/>
    </g>
    <circle cx="11.44" cy="8.6" r="3.1" fill="url(#engineer-facing-right-fill)"/>
    <path d="M8.53 8.04 Q7.35 8.98 8.53 9.96 Z" fill="url(#engineer-facing-right-fill)"/>
    <ellipse cx="9.84" cy="8.13" rx="0.26" ry="0.32" fill="#1c1c1c"/>
    <path d="M10.4 12.9 L12 14.2 L13.6 12.9" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M8.14 5.4 C8.14 3.2 9.64 1.7 11.44 1.7 C13.24 1.7 14.74 3.2 14.74 5.4 L14.74 5.9 L8.14 5.9 Z" fill="url(#engineer-facing-right-hat)"/>
    <ellipse cx="11.44" cy="6.1" rx="5" ry="0.85" fill="url(#engineer-facing-right-hat)"/>
    <path d="M11.44 1.9 L11.44 5.9" stroke="#b9800f" stroke-width="0.3" opacity="0.45"/>
    <ellipse cx="9.14" cy="3.4" rx="1.3" ry="0.45" fill="#ffffff" opacity="0.35"/>
    <g transform="rotate(25 16.4 16.8)">
      <rect x="15.6" y="15.6" width="1.6" height="5.4" rx="0.5" fill="#7d8894"/>
      <path d="M15.1 14.6 C15.1 13.6 15.7 13 16.4 13 C17.1 13 17.7 13.6 17.7 14.6 C17.7 15.3 17.3 15.8 16.7 15.9 L16.1 15.9 C15.5 15.8 15.1 15.3 15.1 14.6 Z" fill="none" stroke="#7d8894" stroke-width="0.7"/>
    </g>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# engineer-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 10.63); cy and scale are the mirror's own invariants. Because the
# fragment sits outside the flip group, these are plain unflipped canvas
# coordinates.
[face]
cx = 13.37
cy = 8.43
scale = 1.97

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
