# town — a cluster of pitched-roof buildings whose walls a theme owns,
# rising to one taller landmark tower with a fixed copper-green spire
# that marks it apart from the cluster around it. The roofs and spire
# are fixed the way house.toml's own slate is: a roof's material is its
# own colour, not the wall's to shade.
classes = ["town"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="town-wash" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 36%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 65%, black)"/>
    </linearGradient>
  </defs>
  <rect x="10.4" y="4.6" width="3.2" height="16.8" fill="url(#town-wash)" stroke="currentColor" stroke-width="1.1"/>
  <path d="M10 4.6 L12 1.6 L14 4.6 Z" fill="#4a7a6a"/>
  <line x1="12" y1="1.6" x2="12" y2="0.2" stroke="#4a7a6a" stroke-width="0.6"/>
  <rect x="11.2" y="6.6" width="1.6" height="1.6" fill="#000000" opacity="0.2"/>
  <rect x="11.2" y="10.6" width="1.6" height="1.6" fill="#000000" opacity="0.2"/>
  <rect x="2.4" y="14.4" width="5.4" height="7" fill="url(#town-wash)" stroke="currentColor" stroke-width="1"/>
  <path d="M2 14.4 L5.1 11.6 L8.2 14.4 Z" fill="#7a3420"/>
  <rect x="3.2" y="16" width="1.2" height="1.2" fill="#000000" opacity="0.2"/>
  <rect x="15.2" y="13.4" width="5.6" height="8" fill="url(#town-wash)" stroke="currentColor" stroke-width="1"/>
  <path d="M14.8 13.4 L18 10.4 L21.2 13.4 Z" fill="#454b52"/>
  <rect x="16.2" y="15" width="1.2" height="1.2" fill="#000000" opacity="0.2"/>
  <path d="M10.8 4.8 L10.8 20.6" stroke="#ffffff" stroke-width="0.4" opacity="0.3"/>
</svg>
"""
