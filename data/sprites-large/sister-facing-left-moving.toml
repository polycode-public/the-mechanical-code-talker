# sister-facing-left-moving — sister-facing-left.toml's profile caught
# mid-stride. The head, nose wedge, eye and hair strands hold their profile
# shape and position exactly, since a head does not change shape
# mid-stride. What moved is the near arm (swung forward and raised), the
# far arm (trailing back, extended), and the robe hem (swept back, one
# side lifted clear of the ground) — the same stride transform
# king-facing-left-moving.toml applies to king's own arms and robe, carried
# over to sister's own child-scale body.
classes = ["sister"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="sister-facing-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M15.55 6.8 C16.95 8.6 16.95 11.2 15.55 13.8" fill="none" stroke="url(#sister-facing-left-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M7.15 6.8 C5.75 8.6 5.75 11.2 7.15 13.8" fill="none" stroke="url(#sister-facing-left-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="url(#sister-facing-left-moving-fill)">
    <path d="M9.4 14.9 C8.1 14.3 6.9 15 6.5 17 C6.35 18.1 6.9 18.9 7.8 18.7 C7.9 17.1 8.3 15.9 9.6 15.2 Z"/>
    <path d="M14.6 14.9 C16.4 15.3 18.1 16.8 18.3 19.1 C18.35 20.1 17.6 20.7 16.7 20.2 C16.5 18.3 15.9 16.5 14.3 15.8 Z"/>
    <path d="M7.7 21 C7.5 16.8 9.4 14.7 11.7 14.7 C14.4 14.7 16.2 16.1 15.7 19.6 C15.5 20.7 14.5 20.7 13.7 20.1 Z"/>
    <path d="M10.8 11.4 L13.2 11.4 L13 14.6 L11 14.6 Z"/>
  </g>
  <ellipse cx="10.2" cy="18" rx="1.1" ry="1.6" fill="#ffffff" opacity="0.1"/>
  <circle cx="11.35" cy="8.2" r="3.6" fill="url(#sister-facing-left-moving-fill)"/>
  <path d="M7.97 7.55 Q6.6 8.63 7.97 9.78 Z" fill="url(#sister-facing-left-moving-fill)"/>
  <ellipse cx="9.5" cy="7.65" rx="0.31" ry="0.36" fill="#1c1c1c"/>
  <path d="M9.3 15.3 C8.3 16 7.6 17.2 7.4 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 15.3 C15.7 16 16.4 17.2 16.6 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.15 6.95 C9.75 6.45 10.45 6.25 11.35 6.35" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 10.44
cy = 8.0
scale = 2.34

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
