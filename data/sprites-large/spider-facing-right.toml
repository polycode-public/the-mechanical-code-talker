# spider-facing-right — spider-facing-left.toml's profile mirrored across
# the canvas midline (every shape wrapped in one translate-then-flip group),
# so the two directions stay geometrically identical twins. The mirror
# flips the lit corner of the shared gradient along with the pose, which
# reads as the same spider turned around under the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["spider"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="spider-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g stroke="currentColor" stroke-width="0.9" fill="none" stroke-linecap="round">
      <path d="M8.64 10.36 L6.8 7.6"/>
      <path d="M10.36 11.96 L8.8 9.2"/>
      <path d="M12.09 13.56 L10.8 11"/>
      <path d="M13.81 15.16 L12.8 13"/>
    </g>
    <ellipse cx="14.5" cy="15.8" rx="5" ry="4.6" fill="url(#spider-facing-right-fill)"/>
    <ellipse cx="12.8" cy="14.1" rx="1.7" ry="1.3" fill="#000000" opacity="0.2"/>
    <path d="M14.5 12.6 L16.7 15.4 L14.5 15.8 L12.3 15.4 Z" fill="color-mix(in srgb, currentColor 80%, black)" opacity="0.55"/>
    <ellipse cx="19.3" cy="16.6" rx="0.85" ry="0.65" fill="#1c1c1c"/>
    <circle cx="7.6" cy="9.4" r="2.9" fill="url(#spider-facing-right-fill)"/>
    <ellipse cx="6.7" cy="8.5" rx="1.05" ry="0.8" fill="#ffffff" opacity="0.32"/>
    <g stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round">
      <path d="M8.64 10.36 L3.5 15"/>
      <path d="M10.36 11.96 L5.5 19"/>
      <path d="M12.09 13.56 L9.5 21.5"/>
      <path d="M13.81 15.16 L14 22.5"/>
    </g>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# spider-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 7.6); cy and scale are the mirror's own invariants. Because the
# fragment sits outside the flip group, these are plain unflipped canvas
# coordinates.
[face]
cx = 16.4
cy = 9.4
scale = 1.9

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
