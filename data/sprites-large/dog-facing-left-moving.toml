# dog-facing-left-moving — dog-facing-left.toml's full left profile caught
# mid-stride. The head, snout, ears and eye hold their profile shape and
# position exactly, since a head does not change shape mid-stride. What
# moved: the front-near and back-far legs swing forward and lift clear of
# the ground, the front-far and back-near legs trail and stay planted, the
# body dips slightly, and the tail lifts higher than its resting curve.
classes = ["dog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="dog-facing-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13.6" cy="15.4" rx="6.2" ry="4.2" fill="url(#dog-facing-left-moving-fill)"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="8.6" y1="18.1" x2="6.8" y2="20.6"/>
    <line x1="11" y1="19.3" x2="12.6" y2="22"/>
    <line x1="15" y1="19.4" x2="16.8" y2="22.1"/>
    <line x1="18.4" y1="17.9" x2="16.9" y2="20.3"/>
  </g>
  <g fill="url(#dog-facing-left-moving-fill)">
    <ellipse cx="6.8" cy="20.7" rx="0.8" ry="0.5"/>
    <ellipse cx="12.6" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="16.8" cy="22.3" rx="0.9" ry="0.55"/>
    <ellipse cx="16.9" cy="20.4" rx="0.8" ry="0.5"/>
  </g>
  <path d="M19.4 12.5 C22.6 10.3 23.2 13.1 20.2 14.5 Z" fill="url(#dog-facing-left-moving-fill)"/>
  <circle cx="6.6" cy="9" r="3.6" fill="url(#dog-facing-left-moving-fill)"/>
  <path d="M6.2 7.9 L2.6 8.9 L6.2 10.5 Z" fill="url(#dog-facing-left-moving-fill)"/>
  <path d="M4.2 6.6 L2.2 3.2 L6 5 Z" fill="url(#dog-facing-left-moving-fill)"/>
  <path d="M9 6.4 L11 3.2 L7.4 4.9 Z" fill="url(#dog-facing-left-moving-fill)"/>
  <ellipse cx="7.8" cy="8.4" rx="1" ry="1.3" fill="#000000" opacity="0.22"/>
  <ellipse cx="2.9" cy="8.9" rx="0.62" ry="0.5" fill="#1c1c1c"/>
  <ellipse cx="5.2" cy="7.9" rx="0.55" ry="0.6" fill="#1c1c1c"/>
  <ellipse cx="10.4" cy="13" rx="2.4" ry="1.4" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="5.6" cy="6.9" rx="1.1" ry="0.8" fill="#ffffff" opacity="0.32"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 6.1
cy = 8.25
scale = 2.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
