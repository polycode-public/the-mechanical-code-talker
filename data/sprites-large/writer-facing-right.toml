# writer-facing-right — writer-facing-left.toml's profile mirrored across
# the canvas midline (every shape wrapped in one translate-then-flip group),
# the same king-facing-right.toml precedent. {{FACE}} sits OUTSIDE the flip
# group, so the resolved face fragment is never mirrored.
classes = ["writer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="writer-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="writer-facing-right-notebook" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#a9764f"/>
      <stop offset="100%" stop-color="#7d5738"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#writer-facing-right-fill)">
      <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
      <path d="M14.6 13.1 C16.4 13.2 18.1 14.7 18.4 17.4 C18.5 18.8 17.8 19.7 16.8 19.2 C16.7 17.1 16.1 15.1 14.3 14.2 Z"/>
      <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
      <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
    </g>
    <circle cx="11.4" cy="6.6" r="3.3" fill="url(#writer-facing-right-fill)"/>
    <path d="M8.3 6 Q7.05 7 8.3 8.05 Z" fill="url(#writer-facing-right-fill)"/>
    <ellipse cx="9.7" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
    <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M16.4 12.8 L19.6 16 L18.6 17 L15.4 13.8 Z" fill="url(#writer-facing-right-fill)" opacity="0.95"/>
    <path d="M18.6 17 L17.6 19.4 L16.6 18.4 Z" fill="currentColor" opacity="0.85"/>
    <path d="M16 13.2 L16.9 14.1" stroke="#ffffff" stroke-width="0.4" opacity="0.5"/>
    <g transform="rotate(-15 7.6 16)">
      <rect x="6.4" y="14" width="2.6" height="3.6" rx="0.3" fill="url(#writer-facing-right-notebook)"/>
      <rect x="6.7" y="14.3" width="0.5" height="3" fill="#f4f1ea" opacity="0.8"/>
    </g>
    <path d="M9.0 4.2 C9.7 3.6 10.5 3.4 11.4 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# writer-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 10.5); cy and scale are the mirror's own invariants.
[face]
cx = 13.5
cy = 6.4
scale = 2.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
