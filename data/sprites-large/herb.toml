# herb — the leafy sprig behind carrot.toml, lettuce.toml, tomato.toml and
# vegetable.toml in this pack's own taxonomy: three tied stems fanning out
# into leaflets, with no pot and no root the way plant.toml and
# vegetable.toml each show one. Every leaf and the tie both stay a fixed
# green/brown pair, the same fixed-identity reasoning carrot.toml's own top
# uses, because a cut herb's own colours don't vary with a taught instance.
