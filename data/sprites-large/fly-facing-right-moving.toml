# fly-facing-right-moving — fly-facing-left-moving.toml's flight pose
# mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is
# never mirrored.
classes = ["fly"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="fly-facing-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="currentColor">
      <path d="M9 10 C2 5 0.5 2.5 2 1 C5.5 1 9.5 5.5 11 10 Z" opacity="0.25"/>
      <path d="M9 10 C3 6 2 4 3 2 C6 2 9 6 10.5 10 Z" opacity="0.5"/>
      <path d="M10.5 10 C12 8 12.5 7 12 6 C11 6.5 10.3 8 10.5 10 Z" opacity="0.25"/>
    </g>
    <path d="M6 6.4 C5.4 5 5.6 3.6 6.4 3" stroke="#5a4636" stroke-width="0.3" opacity="0.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="9" cy="13.6" rx="3.4" ry="5.2" fill="url(#fly-facing-right-moving-fill)"/>
    <ellipse cx="8.1" cy="12" rx="1.1" ry="1.7" fill="#000000" opacity="0.22"/>
    <circle cx="9" cy="7" r="2.48" fill="url(#fly-facing-right-moving-fill)"/>
    <ellipse cx="7.7" cy="6.2" rx="0.4" ry="0.45" fill="#1c1c1c"/>
    <g stroke="currentColor" stroke-width="1" stroke-linecap="round">
      <path d="M6.6 17 L5.6 18"/>
      <path d="M11.4 17 L12.4 18"/>
    </g>
    <ellipse cx="7.8" cy="10.6" rx="1.6" ry="1" fill="#ffffff" opacity="0.3"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 15.66
cy = 6.44
scale = 1.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
