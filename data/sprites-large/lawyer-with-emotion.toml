# lawyer-with-emotion — the same body plus briefcase as lawyer.toml (a
# briefcase held at the side, a curved carry handle and a small clasp
# mark), plus the shared face-fragment mechanism (sprite-expressions.mjs):
# a required [face] anchor and a {{FACE}} placeholder that resolves to
# whichever of the 6 curated mgx:feels words
# (happy/sad/angry/scared/surprised/calm) the instance's own fact names. No
# mgx:feels fact falls through to the plain lawyer.toml sprite, the same
# dog/dog-with-colour precedent. {{FACE}} sits as the last child before
# </svg>, painting over the body beneath it.
classes = ["lawyer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="lawyer-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#lawyer-with-emotion-fill)"/>
  <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z" fill="url(#lawyer-with-emotion-fill)"/>
  <path d="M17.4 15.4 C17.4 14.4 18 13.8 18.8 13.8 C19.6 13.8 20.2 14.4 20.2 15.4" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.7" stroke-linecap="round"/>
  <rect x="16.4" y="15.4" width="4.8" height="4.4" rx="0.5" fill="url(#lawyer-with-emotion-fill)" opacity="0.95"/>
  <rect x="18.2" y="16.8" width="1.2" height="0.9" rx="0.2" fill="currentColor" opacity="0.6"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r lawyer.toml's own head circle declares.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
