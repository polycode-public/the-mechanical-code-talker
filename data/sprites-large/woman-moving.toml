# woman-moving — the front-facing figure mid-stride, selected on
# mgx:pose = moving alone (no facing fact at all). The head and hair
# strands keep woman-with-emotion.toml's own front geometry unchanged — a
# front view has no turned head to redraw. Only the arms change: the near
# (screen-left) arm swings forward and up, the far arm trails back, the
# same raised/trailing pair king-facing-left-moving.toml uses for its own
# stride, reused here without the profile's head turn since a walk's arm
# swing reads the same viewed from the front.
classes = ["woman"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="woman-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M15.6 5.4 C17 7 17.2 9.6 16 12.6" fill="none" stroke="url(#woman-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M8.4 5.4 C7 7 6.8 9.6 8 12.6" fill="none" stroke="url(#woman-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="url(#woman-moving-fill)">
    <path d="M9.4 13.1 C7.8 12.5 6.3 13.5 5.8 16.1 C5.6 17.5 6.2 18.5 7.3 18.2 C7.4 16.2 7.9 14.5 9.6 13.6 Z"/>
    <path d="M14.6 13.1 C16.7 13.5 18.7 15.3 19 18.2 C19.1 19.5 18.3 20.3 17.2 19.7 C17 17.4 16.3 15.1 14.3 14.2 Z"/>
    <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#woman-moving-fill)"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 13.9 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:pose"
value = "moving"

# The same cx/cy/r woman.toml's own head circle declares — a front view has
# no head turn to shift the anchor from.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
