# sister-moving — a centre-facing mid-stride pose: the same front-facing
# head and [face] anchor as sister-with-emotion.toml (no facing fact is
# needed, only mgx:pose = moving), with the arms and robe hem redrawn for a
# clear walking stride — one arm swung forward and up, the other trailing
# back, the hem swept and lifted on one side, the same body redraw
# sister-facing-left-moving.toml carries.
classes = ["sister"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="sister-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M16.2 6.8 C17.6 8.6 17.6 11.2 16.2 13.8" fill="none" stroke="url(#sister-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M7.8 6.8 C6.4 8.6 6.4 11.2 7.8 13.8" fill="none" stroke="url(#sister-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="url(#sister-moving-fill)">
    <path d="M9.4 14.9 C8.1 14.3 6.9 15 6.5 17 C6.35 18.1 6.9 18.9 7.8 18.7 C7.9 17.1 8.3 15.9 9.6 15.2 Z"/>
    <path d="M14.6 14.9 C16.4 15.3 18.1 16.8 18.3 19.1 C18.35 20.1 17.6 20.7 16.7 20.2 C16.5 18.3 15.9 16.5 14.3 15.8 Z"/>
    <path d="M7.7 21 C7.5 16.8 9.4 14.7 11.7 14.7 C14.4 14.7 16.2 16.1 15.7 19.6 C15.5 20.7 14.5 20.7 13.7 20.1 Z"/>
    <path d="M10.8 11.4 L13.2 11.4 L13 14.6 L11 14.6 Z"/>
  </g>
  <ellipse cx="10.2" cy="18" rx="1.1" ry="1.6" fill="#ffffff" opacity="0.1"/>
  <circle cx="12" cy="8.2" r="3.6" fill="url(#sister-moving-fill)"/>
  <path d="M9.3 15.3 C8.3 16 7.6 17.2 7.4 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 15.3 C15.7 16 16.4 17.2 16.6 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.8 5.6 C10.4 5.1 11.1 4.9 12 5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:pose"
value = "moving"

# The same cx/cy/r sister-with-emotion.toml's own [face] anchor declares —
# a centre-facing pose keeps the front head untouched, only the body moves.
[face]
cx = 12
cy = 8.2
scale = 3.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
