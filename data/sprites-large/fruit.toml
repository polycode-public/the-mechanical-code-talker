# fruit — an apple, the one fruit shape that reads at icon size without a
# label. Two lobes and a dimpled top keep it apart from tomato.toml's round
# globe, and the single leaf on a bare stem keeps it apart from that
# sprite's five-lobe calyx. The crimson runs cooler than the tomato's
# orange-red for the same reason. Fixed colours: a fruit's own colour is
# most of what identifies it, the same call bread.toml makes about its
# crust.
classes = ["fruit"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="fruit-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ef7b6a"/>
      <stop offset="55%" stop-color="#c62b3b"/>
      <stop offset="100%" stop-color="#7f1524"/>
    </linearGradient>
  </defs>
  <path d="M12 4.2 C12 5.8 12.4 7 13.4 8" fill="none" stroke="#6b4a24" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M12.6 5.4 C14.2 3.9 16.7 3.9 18 5 C16.7 6.9 14.2 7.1 12.7 6.2 Z" fill="#4a7a34"/>
  <path d="M12 8.4 C10.6 6.5 7.2 6.7 5.6 9.4 C4 12.1 4.8 16.5 7 19.3 C8.4 21.1 10.3 21.7 12 20.7 C13.7 21.7 15.6 21.1 17 19.3 C19.2 16.5 20 12.1 18.4 9.4 C16.8 6.7 13.4 6.5 12 8.4 Z" fill="url(#fruit-fill)"/>
  <path d="M12 8.6 C11.8 12 11.8 16.4 12 20.4" fill="none" stroke="#7f1524" stroke-width="0.55" opacity="0.22"/>
  <ellipse cx="8.6" cy="11.4" rx="1.7" ry="2.5" fill="#ffffff" opacity="0.32" transform="rotate(-22 8.6 11.4)"/>
</svg>
"""
