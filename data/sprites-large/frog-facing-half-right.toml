# frog-facing-half-right — frog-facing-half-left.toml's three-quarter turn
# mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is
# never mirrored.
classes = ["frog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="frog-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#a8d068"/>
      <stop offset="55%" stop-color="#5a9040"/>
      <stop offset="100%" stop-color="#2f5322"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="13.2" cy="15.1" rx="7.4" ry="5.3" fill="url(#frog-facing-half-right-fill)"/>
    <ellipse cx="8.6" cy="17.7" rx="3" ry="2" fill="url(#frog-facing-half-right-fill)"/>
    <ellipse cx="19" cy="17.5" rx="2.6" ry="1.8" fill="url(#frog-facing-half-right-fill)"/>
    <g stroke="#2f5322" stroke-width="0.9" stroke-linecap="round">
      <path d="M6.2 18.5 L5.2 19.9"/><path d="M8 19.5 L7.8 20.9"/><path d="M10.2 19.3 L10.6 20.7"/>
      <path d="M17.4 18.5 L18.2 19.7"/><path d="M19.4 19.3 L19.6 20.6"/>
    </g>
    <ellipse cx="10.4" cy="16.8" rx="2.6" ry="1.7" fill="#dcead0" opacity="0.55"/>
    <ellipse cx="9" cy="13.2" rx="1.4" ry="0.95" fill="#2f5322" opacity="0.4"/>
    <ellipse cx="15" cy="13.1" rx="1" ry="0.7" fill="#2f5322" opacity="0.3"/>
    <circle cx="11.8" cy="8.5" r="1.8" fill="url(#frog-facing-half-right-fill)"/>
    <circle cx="11.8" cy="8.3" r="1.3" fill="#f4ecd8"/>
    <circle cx="7.4" cy="8.7" r="2.6" fill="url(#frog-facing-half-right-fill)"/>
    <circle cx="7.4" cy="8.5" r="1.9" fill="#f4ecd8"/>
    <path d="M5.2 9.4 C4.2 9.6 4 10.2 4.6 10.7 C5.2 11 5.9 10.2 5.2 9.4 Z" fill="#5a9040"/>
    <ellipse cx="11" cy="13.6" rx="2.4" ry="1.3" fill="#ffffff" opacity="0.22"/>
    <ellipse cx="6.2" cy="7.6" rx="0.55" ry="0.42" fill="#ffffff" opacity="0.6"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# frog-facing-half-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 8.19); cy and scale are the mirror's own invariants.
[face]
cx = 15.81
cy = 8.80
scale = 1.97

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
