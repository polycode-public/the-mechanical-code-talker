# engineer-with-emotion — the same hard-hat-and-wrench body as
# engineer.toml, plus the shared face-fragment mechanism
# (sprite-expressions.mjs): a required [face] anchor and a {{FACE}}
# placeholder that resolves to whichever of the 6 curated mgx:feels words
# the instance's own fact names. No mgx:feels fact falls through to the
# plain engineer.toml sprite. {{FACE}} sits as the last child before
# </svg>, painting over the body beneath it.
#
# The hard hat sits ABOVE the head as its own separate geometry (dome
# peaking near y=1.7, brim at y=6.1) — not the face anchor. [face] below
# is anchored on the SAME head circle engineer.toml's own <circle>
# declares (cx=12 cy=8.6 r=3.1), so the resolved face paints onto the
# head itself, clear of the brim.
classes = ["engineer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="engineer-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="engineer-with-emotion-hat" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f7c65a"/>
      <stop offset="100%" stop-color="#d99a1f"/>
    </linearGradient>
  </defs>
  <g fill="url(#engineer-with-emotion-fill)">
    <path d="M9.4 13.4 C7.6 13.5 5.9 15 5.6 17.7 C5.5 19.1 6.2 20 7.2 19.5 C7.3 17.4 7.9 15.4 9.7 14.5 Z"/>
    <path d="M14.6 13.4 C16.4 13.5 18.1 15 18.4 17.7 C18.5 19.1 17.8 20 16.8 19.5 C16.7 17.4 16.1 15.4 14.3 14.5 Z"/>
    <path d="M6 21 C6 15.5 8.7 13.1 12 13.1 C15.3 13.1 18 15.5 18 21 Z"/>
    <path d="M10.75 11.3 L13.25 11.3 L13.05 13.3 L10.95 13.3 Z"/>
  </g>
  <circle cx="12" cy="8.6" r="3.1" fill="url(#engineer-with-emotion-fill)"/>
  <path d="M10.4 12.9 L12 14.2 L13.6 12.9" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M8.7 5.4 C8.7 3.2 10.2 1.7 12 1.7 C13.8 1.7 15.3 3.2 15.3 5.4 L15.3 5.9 L8.7 5.9 Z" fill="url(#engineer-with-emotion-hat)"/>
  <ellipse cx="12" cy="6.1" rx="5" ry="0.85" fill="url(#engineer-with-emotion-hat)"/>
  <path d="M12 1.9 L12 5.9" stroke="#b9800f" stroke-width="0.3" opacity="0.45"/>
  <ellipse cx="9.7" cy="3.4" rx="1.3" ry="0.45" fill="#ffffff" opacity="0.35"/>
  <g transform="rotate(25 16.4 16.8)">
    <rect x="15.6" y="15.6" width="1.6" height="5.4" rx="0.5" fill="#7d8894"/>
    <path d="M15.1 14.6 C15.1 13.6 15.7 13 16.4 13 C17.1 13 17.7 13.6 17.7 14.6 C17.7 15.3 17.3 15.8 16.7 15.9 L16.1 15.9 C15.5 15.8 15.1 15.3 15.1 14.6 Z" fill="none" stroke="#7d8894" stroke-width="0.7"/>
  </g>
  {{FACE}}
</svg>
"""

# The head circle engineer.toml itself declares (cx=12 cy=8.6 r=3.1) — the
# hard-hat geometry above it is a separate prop, not the face anchor;
# anchoring here keeps the face on the head, clear of the brim.
[face]
cx = 12
cy = 8.6
scale = 3.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
