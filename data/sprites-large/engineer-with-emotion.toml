# engineer-with-emotion — same rolled-blueprint silhouette as
# engineer.toml, plus a required [face] anchor and a {{FACE}} placeholder
# that resolves to whichever of the 6 curated mgx:feels words the
# instance's own fact names. No mgx:feels fact falls through to the plain
# engineer.toml sprite.
classes = ["engineer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="engineer-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#engineer-with-emotion-fill)"/>
  <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z" fill="url(#engineer-with-emotion-fill)"/>
  <g transform="rotate(8 16.6 16.7)">
    <rect x="15.4" y="13" width="2.4" height="7.4" rx="1.1" fill="url(#engineer-with-emotion-fill)" opacity="0.92"/>
    <path d="M15.6 13.4 L17.6 13.4" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
  </g>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r engineer.toml's own head circle declares.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
