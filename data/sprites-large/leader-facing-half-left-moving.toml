# leader-facing-half-left-moving — leader-facing-half-left.toml's
# three-quarter turn caught mid-stride, the same cape-arm/torso transform
# leader-facing-left-moving.toml applies, since the body figure underneath
# a facing variant does not itself depend on how far the head has turned.
classes = ["leader"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="leader-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#leader-facing-half-left-moving-fill)">
    <path d="M9.4 13.1 C7.8 12.5 6.3 13.5 5.8 16.1 C5.6 17.5 6.2 18.5 7.3 18.2 C7.4 16.2 7.9 14.5 9.6 13.6 Z"/>
    <path d="M6.3 21 C6.1 15.5 8.7 12.9 11.7 12.9 C13.3 12.9 14.7 13.6 15.7 14.9 L21 11.4 L21.8 12.7 L16.8 16.6 C17.4 17.9 17.8 19.4 17.3 20.4 C17.1 20.9 16.3 20.8 15.7 20.2 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <circle cx="9.4" cy="13.9" r="0.7" fill="#2a4d7a"/>
  <circle cx="9.4" cy="13.9" r="0.32" fill="#1c3355"/>
  <circle cx="11.7" cy="6.6" r="3.3" fill="url(#leader-facing-half-left-moving-fill)"/>
  <path d="M8.6 6.1 Q7.9 7.4 8.6 8.1 Z" fill="url(#leader-facing-half-left-moving-fill)"/>
  <ellipse cx="10" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <ellipse cx="14" cy="6.05" rx="0.18" ry="0.22" fill="#1c1c1c"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M16 14.8 L20.2 11.9" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.25" stroke-linecap="round"/>
  <path d="M9.3 4.2 C10.0 3.6 10.8 3.4 11.7 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 11.08
cy = 6.51
scale = 2.7

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
