# fly-facing-half-left-moving — fly-facing-half-left.toml's own
# three-quarter turn caught mid flight. The head, antenna, both eyes and
# face anchor stay exactly as that file draws them. What moves: a wider,
# more translucent wing layers over the near wing to read as motion blur,
# and the legs tuck up close to the abdomen instead of trailing down.
classes = ["fly"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="fly-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="currentColor">
    <path d="M10.3 10 C4 5.5 3 3.5 4 1.5 C7.5 1.5 10.5 5.5 12 10 Z" opacity="0.25"/>
    <path d="M10.3 10 C5 6.5 4 5 5 3 C7.5 3 10 6.5 11.3 10 Z" opacity="0.5"/>
    <path d="M11.3 10 C13.5 7.5 14 6 13 4.5 C11.5 5 10.8 7.5 11.3 10 Z" opacity="0.4"/>
  </g>
  <path d="M9 6.6 C8.6 5.6 8.8 4.6 9.4 4.2" stroke="#5a4636" stroke-width="0.3" opacity="0.6" fill="none" stroke-linecap="round"/>
  <ellipse cx="10.5" cy="13.6" rx="3.4" ry="5.2" fill="url(#fly-facing-half-left-moving-fill)"/>
  <ellipse cx="9.6" cy="12" rx="1.1" ry="1.7" fill="#000000" opacity="0.22"/>
  <circle cx="10.5" cy="7" r="2.48" fill="url(#fly-facing-half-left-moving-fill)"/>
  <ellipse cx="9.3" cy="6.3" rx="0.4" ry="0.45" fill="#1c1c1c"/>
  <ellipse cx="11.6" cy="6.6" rx="0.25" ry="0.3" fill="#1c1c1c"/>
  <g stroke="currentColor" stroke-width="1" stroke-linecap="round">
    <path d="M8.1 17 L7.1 18"/>
    <path d="M12.9 17 L13.9 18"/>
  </g>
  <ellipse cx="9.3" cy="10.6" rx="1.6" ry="1" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 10.12
cy = 6.61
scale = 2.05

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
