# container — the generic fallback for any container with no sprite of its
# own (cabinet/portrait are Ashcombe Hall's own named two): a chest
# silhouette gradient-shaded from its taught mgx:madeOf value, covering the
# widest plausible spread of the four non-food treatments a generic chest
# could be — wood, metal, plastic, or a woven basket — since a fallback
# has to read believably across whichever of those a taught instance turns
# out to be.
classes = ["container"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="container-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="{{FILL_LIGHT}}"/>
      <stop offset="55%" stop-color="{{FILL}}"/>
      <stop offset="100%" stop-color="{{FILL_DARK}}"/>
    </linearGradient>
  </defs>
  <path d="M3 10 L5 5 H19 L21 10 Z" fill="url(#container-fill)"/>
  <rect x="3" y="10" width="18" height="10" rx="1.2" fill="url(#container-fill)"/>
  <rect x="3" y="10" width="18" height="1.6" fill="#000000" opacity="0.2"/>
  <path d="M4.6 11 L4.6 19" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
  <rect x="10.6" y="9.2" width="2.8" height="2.6" rx="0.5" fill="#000000" opacity="0.3"/>
</svg>
"""

[parameters.material]
property = "mgx:madeOf"
placeholders = { light = "{{FILL_LIGHT}}", base = "{{FILL}}", dark = "{{FILL_DARK}}" }

[parameters.material.values]
wood = "wood"
metal = "metal"
plastic = "plastic"
"woven material" = "woven material"
