# precipitation — the parent behind rain.toml's streaks and snow.toml's
# flakes: the same cloud silhouette shedding both at once, so it reads as
# the general fall rather than either single kind. Fixed cool cloud tones
# for the same reason rain.toml and snow.toml stay fixed: a rain-cloud's
# own colour doesn't vary with a taught instance the way an object's
# material does.
classes = ["precipitation"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="precipitation-cloud" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#e8ecf0"/>
      <stop offset="60%" stop-color="#c0c9d2"/>
      <stop offset="100%" stop-color="#8f99a6"/>
    </linearGradient>
  </defs>
  <path d="M6.6 12.2 C4.2 12.2 3 10.2 4.2 8.2 C4.8 5.8 7.2 5.2 8.8 6.4 C9.8 4.2 13 3.8 14.6 6 C17.4 5.6 19.4 7.6 19 10 C20.6 10.4 21 12.4 19.4 13.4 C19 13.7 18.6 13.8 18 13.8 H7.4 C7.1 13.8 6.8 13.8 6.6 12.2 Z" fill="url(#precipitation-cloud)"/>
  <ellipse cx="9" cy="8" rx="2.2" ry="1.4" fill="#ffffff" opacity="0.4"/>
  <g stroke="#5c9bd6" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <line x1="7.4" y1="15.8" x2="6.2" y2="20.8"/>
    <line x1="15.6" y1="15.8" x2="14.4" y2="20.6"/>
  </g>
  <g fill="#eaf3fb" opacity="0.9">
    <circle cx="11" cy="18.2" r="1"/>
    <circle cx="18.6" cy="17.4" r="0.9"/>
    <circle cx="13" cy="21" r="0.7"/>
  </g>
</svg>
"""
