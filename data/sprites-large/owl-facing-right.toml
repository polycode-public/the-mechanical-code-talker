# owl-facing-right — owl-facing-left.toml's profile mirrored across the
# canvas midline (every shape wrapped in one translate-then-flip group), so
# the two directions stay geometrically identical twins. The mirror flips
# the lit corner of the shared gradient along with the pose, which reads as
# the same owl turned around under the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the head turned around.
classes = ["owl"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="owl-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M6.4 4.6 C5.6 3 5.8 1.4 7 0.8 C7.5 2.4 7.7 3.8 7.6 5.1 Z" fill="color-mix(in srgb, currentColor 78%, black)"/>
    <path d="M14.6 5.6 C15.1 4.4 15 3.4 14.3 2.9 C13.9 3.9 13.7 4.8 13.8 5.8 Z" fill="color-mix(in srgb, currentColor 78%, black)"/>
    <path d="M4.4 7.6 C4.4 4.2 7.2 3.4 12.4 3.4 C16.6 3.4 16.8 5.6 16.8 8.6 C16.8 10.6 16.2 11.8 15.6 12.4 C18 13.6 19.4 16.4 19.4 18.8 C19.4 21.2 16.4 22.8 12.6 22.8 C9 22.8 4.6 21.8 4.6 19.8 C4.6 17.2 6 14.8 8.2 13.4 C6 12.2 4.4 10.4 4.4 7.6 Z" fill="url(#owl-facing-right-fill)"/>
    <circle cx="6.2" cy="8" r="2.6" fill="#f4ecd8"/>
    <circle cx="6.2" cy="8" r="1.3" fill="#0d1a12"/>
    <circle cx="14.4" cy="8.6" r="1.6" fill="#f4ecd8" opacity="0.55"/>
    <circle cx="14.4" cy="8.6" r="0.8" fill="#0d1a12" opacity="0.55"/>
    <path d="M4.4 9.6 L2.4 10.6 L4.4 11.8 Z" fill="#e8a23a"/>
    <g stroke="#e8a23a" stroke-width="1.1" stroke-linecap="round">
      <path d="M10.2 22.2 L10 23.4"/>
      <path d="M15 22.4 L15.2 23.6"/>
    </g>
    <ellipse cx="11.5" cy="17.4" rx="3.4" ry="2" fill="#ffffff" opacity="0.22"/>
    <circle cx="5.5" cy="7.2" r="0.55" fill="#ffffff" opacity="0.7"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# owl-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 7.44); cy and scale are the mirror's own invariants. Because
# the fragment sits outside the flip group, these are plain unflipped
# canvas coordinates.
[face]
cx = 16.56
cy = 8.47
scale = 3.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
