# servant — the shared person body under a buttoned waistcoat and a
# folded cloth draped over one forearm, the generic domestic-work cues
# (Ashcombe Hall's own named staff — butler, cook, gardener, housekeeper —
# already carry their own more specific attributes; this covers everyone
# else in service). Both are fixed (dark waistcoat, cream cloth) rather
# than currentColor: a currentColor waistcoat reads fine on a light theme
# ink but disappears into the body on a black one, and it is the whole
# identity here.
classes = ["servant"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="servant-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#servant-fill)">
    <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
