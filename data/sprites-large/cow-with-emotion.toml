# cow-with-emotion — copies cow.toml's shape exactly. The muzzle patch and
# nostril dots sit below the new face's own eye/mouth band and read as a
# muzzle underneath it, so both stay; cow.toml has no separate eye markup
# to drop.
classes = ["cow"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="cow-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="14.6" rx="7" ry="4.8" fill="url(#cow-with-emotion-fill)"/>
  <circle cx="6.6" cy="9.6" r="4.4" fill="url(#cow-with-emotion-fill)"/>
  <ellipse cx="5.6" cy="11.6" rx="2.4" ry="1.8" fill="#e7c9c2"/>
  <circle cx="4.6" cy="11.2" r="0.45" fill="#1c1c1c"/>
  <circle cx="6.6" cy="11.6" r="0.45" fill="#1c1c1c"/>
  <path d="M4 6.6 L2.4 4.4 M9.2 6.6 L10.8 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M3.4 8.4 L1.4 7.6 M9.8 8.4 L11.8 7.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <g fill="#f4f1ea">
    <ellipse cx="15.6" cy="12" rx="2.4" ry="1.8"/>
    <ellipse cx="10.6" cy="16.4" rx="1.8" ry="1.4"/>
    <ellipse cx="18" cy="16" rx="1.6" ry="1.3"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="8" y1="18.6" x2="7.6" y2="21.6"/>
    <line x1="11.4" y1="19.2" x2="11.2" y2="22"/>
    <line x1="15.4" y1="19" x2="15.6" y2="22"/>
    <line x1="18.6" y1="18.4" x2="19.2" y2="21.4"/>
  </g>
  <g fill="#1c1c1c">
    <ellipse cx="7.5" cy="21.9" rx="0.8" ry="0.45"/>
    <ellipse cx="11.1" cy="22.2" rx="0.8" ry="0.45"/>
    <ellipse cx="15.7" cy="22.2" rx="0.8" ry="0.45"/>
    <ellipse cx="19.3" cy="21.7" rx="0.8" ry="0.45"/>
  </g>
  <ellipse cx="9.6" cy="12.6" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r cow.toml's own head circle declares.
[face]
cx = 6.6
cy = 9.6
scale = 4.4

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
