# chair — a back, seat and four legs at the sprite tier, all sharing one
# taught mgx:madeOf gradient across the three treatments furniture.toml
# already covers (wood, metal, plastic); the legs stay dark-tone overlays
# rather than a fourth colour.
classes = ["chair"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="chair-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="{{FILL_LIGHT}}"/>
      <stop offset="55%" stop-color="{{FILL}}"/>
      <stop offset="100%" stop-color="{{FILL_DARK}}"/>
    </linearGradient>
  </defs>
  <rect x="7" y="3" width="10" height="2.4" rx="0.6" fill="url(#chair-fill)"/>
  <rect x="7" y="5.4" width="2" height="7.4" fill="url(#chair-fill)"/>
  <rect x="7.4" y="11.6" width="9.2" height="2.4" rx="0.6" fill="url(#chair-fill)"/>
  <path d="M7.6 4 L15.6 4" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>
  <g stroke="{{FILL_DARK}}" stroke-width="1.5" stroke-linecap="round">
    <line x1="8.4" y1="14" x2="7.6" y2="21"/>
    <line x1="16" y1="14" x2="16.6" y2="21"/>
    <line x1="9.4" y1="14" x2="9.4" y2="18"/>
    <line x1="15" y1="14" x2="15" y2="18"/>
  </g>
</svg>
"""

[parameters.material]
property = "mgx:madeOf"
placeholders = { light = "{{FILL_LIGHT}}", base = "{{FILL}}", dark = "{{FILL_DARK}}" }

[parameters.material.values]
wood = "wood"
metal = "metal"
plastic = "plastic"
