# elephant-facing-left-moving — elephant-facing-left.toml's own profile
# caught mid-stride. The head, ear, trunk, eye and face anchor stay exactly
# as that file draws them, since a head does not change shape mid-stride.
# What moves: the four legs pair up into elephants' own slow, ambling
# gait — the near pair swings forward and lifts together, the far pair
# stays planted together — the body dips slightly under the stride, and
# the trunk swings forward for a touch of dynamism.
classes = ["elephant"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="elephant-facing-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="10.4" cy="6.6" rx="3.2" ry="3.8" fill="url(#elephant-facing-left-moving-fill)" opacity="0.55"/>
  <ellipse cx="14.6" cy="15.8" rx="7.2" ry="5.2" fill="url(#elephant-facing-left-moving-fill)"/>
  <g fill="url(#elephant-facing-left-moving-fill)">
    <rect x="8.4" y="17.6" width="2" height="2.8" rx="1"/>
    <rect x="12.2" y="17.8" width="2" height="2.8" rx="1"/>
    <rect x="17" y="19.6" width="2" height="3.2" rx="1"/>
    <rect x="20.2" y="19.4" width="2" height="3.2" rx="1"/>
  </g>
  <ellipse cx="22" cy="12.8" rx="1" ry="1.3" fill="url(#elephant-facing-left-moving-fill)"/>
  <circle cx="7.6" cy="8.6" r="4.05" fill="url(#elephant-facing-left-moving-fill)"/>
  <path d="M4.7 11.2 C3.5 11.8 2.9 13.2 3.3 14.6 C4 13.8 4.6 12.7 5 11.3 Z" fill="#f4ecd8"/>
  <path d="M4.9 11.6 C2.5 12.2 1.3 15.2 2.1 17.8 C2.5 19.2 3.9 19.4 4.1 18 C3.3 16.6 2.9 14.4 3.7 12.4 C4 12 4.5 11.8 4.9 11.6 Z" fill="url(#elephant-facing-left-moving-fill)"/>
  <ellipse cx="5.9" cy="7.4" rx="0.55" ry="0.65" fill="#1c1c1c"/>
  <ellipse cx="8.6" cy="6.2" rx="1.3" ry="1" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="11.6" cy="14" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 6.94
cy = 7.79
scale = 2.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
