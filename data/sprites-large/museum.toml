# museum — a classical facade whose whole identity is its own pale stone:
# a pediment over fluted columns and steps, with a fixed crimson banner
# hung between two of the columns. Stone and banner are fixed because a
# museum's own marble read and its hung exhibition banner are the two
# cues that separate it from library's book-spine identity, not a colour
# a theme should carry.
classes = ["museum"]
