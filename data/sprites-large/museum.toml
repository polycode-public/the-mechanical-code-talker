      <stop offset="100%" stop-color="#b7ab90"/>
    </linearGradient>
    <linearGradient id="museum-pediment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5eedd"/>
      <stop offset="100%" stop-color="#cbbf9f"/>
    </linearGradient>
  </defs>
  <path d="M3 8.6 L12 3.4 L21 8.6 Z" fill="url(#museum-pediment)" stroke="#8a7c5c" stroke-width="1"/>
