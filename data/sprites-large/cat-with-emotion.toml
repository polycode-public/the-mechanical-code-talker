# cat-with-emotion — the 19-expressive-faced-animal wave's own worked
# example for the shared face-fragment mechanism (sprite-expressions.mjs):
# the same silhouette as cat.toml, plus a required [face] anchor and a
# {{FACE}} placeholder that resolves to whichever of the 6 curated
# mgx:feels words (happy/sad/angry/scared/surprised/calm) the instance's
# own fact names. A cat with no mgx:feels fact at all falls through to the
# plain cat.toml sprite, the same dog/dog-with-colour precedent.
#
# {{FACE}} sits as the LAST child before </svg> (sprite-expressions.mjs's
# own convention) — copy this exact shape for the other 18 animal classes:
# same body as the plain template, [face] anchored on that same class's
# own head circle cx/cy/r, {{FACE}} appended last. cat.toml's own nose
# triangle is drawn BEFORE {{FACE}} on purpose — a nose sits below the
# face fragment's eye/mouth band and reads fine underneath it, unlike
# dog.toml's eye-shadow ellipse which would have overlapped the new eyes
# directly.
classes = ["cat"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="cat-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12.4" cy="16.4" rx="6" ry="4.2" fill="url(#cat-with-emotion-fill)"/>
  <g fill="url(#cat-with-emotion-fill)">
    <ellipse cx="8.2" cy="20" rx="1" ry="1.2"/>
    <ellipse cx="10.8" cy="20.4" rx="1" ry="1.2"/>
    <ellipse cx="14" cy="20.4" rx="1" ry="1.2"/>
    <ellipse cx="16.6" cy="20" rx="1" ry="1.2"/>
  </g>
  <circle cx="9" cy="9.4" r="4.4" fill="url(#cat-with-emotion-fill)"/>
  <path d="M5.6 6.4 L4.8 2.4 L8 5.2 Z" fill="url(#cat-with-emotion-fill)"/>
  <path d="M12.4 6.4 L13.2 2.4 L10 5.2 Z" fill="url(#cat-with-emotion-fill)"/>
  <path d="M5.8 5.6 L5.3 3.4 L7.2 5 Z" fill="#e3a8a0"/>
  <path d="M12.2 5.6 L12.7 3.4 L10.8 5 Z" fill="#e3a8a0"/>
  <path d="M18.6 15 C21.6 13.4 22.4 16.6 20 18.2 C18.4 19.2 17 17.4 18.6 15 Z" fill="url(#cat-with-emotion-fill)"/>
  <path d="M6.4 9.4 L4 9 M6.6 10.4 L4.2 10.8 M11.6 9.4 L14 9 M11.4 10.4 L13.8 10.8" stroke="currentColor" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
  <path d="M8.2 10.6 L9.8 10.6 L9 11.4 Z" fill="#d98a86"/>
  <ellipse cx="7" cy="7.6" rx="1.5" ry="1.1" fill="#ffffff" opacity="0.32"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r cat.toml's own head circle declares.
[face]
cx = 9
cy = 9.4
scale = 4.4

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
