# glove — Ashcombe Hall's own pair of gloves at the sprite tier: four
# separate fingers and a thumb, each its own rounded shape rather than a
# mitten blob with painted-on seam lines, over a wide cuff band. A
# currentColor gradient rather than a taught mgx:madeOf one, since this
# pack's material system only has a safe no-fact fallback for a class
# the legacy flat sprite registry already carries (see sprite-map.mjs's
# own SPRITE_REGISTRY) — an UNtaught glove would otherwise resolve with
# no match at its own term and fall through to the generic animal
# sprite, so a currentColor gradient (the same treatment plain
# creatures and plants use) is the one that always renders correctly,
# taught or not.
classes = ["glove"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="glove-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M6.4 13 C4.6 12.6 3.3 14 3.6 15.8 C3.8 17.3 5.1 18.1 6.4 17.5 Z" fill="url(#glove-fill)"/>
  <rect x="7.4" y="13.4" width="7.6" height="6.4" rx="2.2" fill="url(#glove-fill)"/>
  <g fill="url(#glove-fill)">
    <rect x="7.6" y="7.6" width="1.7" height="6.6" rx="0.85"/>
    <rect x="9.7" y="6.4" width="1.7" height="7.8" rx="0.85"/>
    <rect x="11.8" y="6.4" width="1.7" height="7.8" rx="0.85"/>
    <rect x="13.9" y="7.6" width="1.7" height="6.6" rx="0.85"/>
  </g>
  <rect x="6.8" y="18.8" width="9.2" height="3.2" rx="1.2" fill="url(#glove-fill)"/>
  <g stroke="#000000" stroke-width="0.3" opacity="0.22">
    <line x1="9.4" y1="7.8" x2="9.4" y2="13.6"/>
    <line x1="11.5" y1="6.6" x2="11.5" y2="13.6"/>
    <line x1="13.6" y1="7.8" x2="13.6" y2="13.6"/>
  </g>
  <path d="M8.2 8.2 C7.9 11.4 8 15 8.6 18.8" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.35" stroke-linecap="round"/>
  <path d="M8.2 19.6 L14.8 19.6" stroke="#000000" stroke-width="0.3" opacity="0.2"/>
</svg>
"""
