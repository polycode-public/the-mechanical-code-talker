# bear-facing-left-moving — bear-facing-left.toml's own profile caught
# mid-stride. The head, ears, muzzle, nose and eye stay exactly as that
# file draws them, since a head does not change shape mid-stride. What
# moves: the four paws spread from their standing row into a diagonal
# gait, the near pair swung forward and lifted, the far pair trailing
# low and back; the body dips down slightly under the stride; and the
# tail nub lifts and swings up and back.
classes = ["bear"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bear-facing-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13.2" cy="16" rx="7" ry="5.4" fill="url(#bear-facing-left-moving-fill)"/>
  <g fill="url(#bear-facing-left-moving-fill)">
    <ellipse cx="8.8" cy="19" rx="1.2" ry="1.3"/>
    <ellipse cx="10.3" cy="21" rx="1.2" ry="1.4"/>
    <ellipse cx="16.9" cy="19.6" rx="1.2" ry="1.3"/>
    <ellipse cx="18.2" cy="20.6" rx="1.2" ry="1.4"/>
  </g>
  <circle cx="21.3" cy="12.6" r="1.2" fill="url(#bear-facing-left-moving-fill)"/>
  <circle cx="5.8" cy="5.2" r="1.6" fill="url(#bear-facing-left-moving-fill)"/>
  <circle cx="7.4" cy="8.8" r="4.6" fill="url(#bear-facing-left-moving-fill)"/>
  <circle cx="9.6" cy="4.8" r="2" fill="url(#bear-facing-left-moving-fill)"/>
  <ellipse cx="3.9" cy="10.2" rx="2.4" ry="1.8" fill="#c9a273"/>
  <ellipse cx="2.5" cy="9.6" rx="0.85" ry="0.65" fill="#1c1c1c"/>
  <ellipse cx="6" cy="7.8" rx="0.5" ry="0.62" fill="#1c1c1c"/>
  <ellipse cx="8.4" cy="6.4" rx="1.4" ry="1" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="10.6" cy="14" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 7.2
cy = 8.25
scale = 3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
