# girl-facing-half-right-moving — girl-facing-half-left-moving.toml's stride
# mirrored across the canvas midline, the same translate-then-flip technique
# the standing pairs use. {{FACE}} sits outside the flip group.

classes = ["girl"]

svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="girl-facing-half-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
  <path d="M15.87 6.8 C17.27 8.6 17.27 11.2 15.87 13.8" fill="none" stroke="url(#girl-facing-half-right-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M7.47 6.8 C6.07 8.6 6.07 11.2 7.47 13.8" fill="none" stroke="url(#girl-facing-half-right-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="url(#girl-facing-half-right-moving-fill)">
    <path d="M9.4 14.9 C7.95 14.6 6.7 15.7 6.4 17.95 C6.3 19.1 6.9 19.85 7.75 19.5 C7.85 17.85 8.3 16.35 9.65 15.65 Z"/>
    <path d="M14.6 14.9 C16.3 15.1 17.9 16.5 18.1 18.8 C18.2 19.7 17.5 20.5 16.6 20.0 C16.45 18.0 15.95 16.3 14.3 15.5 Z"/>
    <path d="M7.55 21 C7.45 16.65 9.4 14.65 11.85 14.65 C14.65 14.65 16.75 16.5 16.55 20.3 C16.45 21.2 15.7 21.2 14.95 20.65 Z"/>
    <path d="M10.8 11.4 L13.2 11.4 L13 14.6 L11 14.6 Z"/>
  </g>
  <ellipse cx="10.2" cy="18" rx="1.1" ry="1.6" fill="#ffffff" opacity="0.1"/>
  <circle cx="11.67" cy="8.2" r="3.6" fill="url(#girl-facing-half-right-moving-fill)"/>
  <path d="M8.29 7.65 Q7.52 9.07 8.29 9.84 Z" fill="url(#girl-facing-half-right-moving-fill)"/>
  <ellipse cx="9.82" cy="7.65" rx="0.31" ry="0.37" fill="#1c1c1c"/>
  <ellipse cx="14.18" cy="7.6" rx="0.2" ry="0.24" fill="#1c1c1c"/>
  <path d="M10.6 14.3 L12 15.4 L13.4 14.3" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 15.4 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.35" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 15.3 C8.3 16 7.6 17.2 7.4 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 15.3 C15.7 16 16.4 17.2 16.6 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.47 5.6 C10.07 5.1 10.77 4.9 11.67 5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 13
cy = 8.09
scale = 2.95

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
