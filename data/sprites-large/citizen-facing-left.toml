# citizen-facing-left — citizen.toml's plain silhouette turned to a left
# profile: the head shifts toward the left shoulder, a nose wedge breaks the
# head's left silhouette, a single forward eye replaces the front-facing
# pair, and the brow-highlight arc follows the head. The torso, arms, neck
# notch and shading strokes keep citizen.toml's own geometry — no chest
# decoration to hold in place, unlike champion.toml's ribbon/medal/laurel.
# Selected only when the instance's own mgx:faces fact says "left". It also
# carries the shared face-fragment mechanism, so a citizen taught BOTH
# mgx:faces = left and one of the 6 mgx:feels words renders this profile
# wearing that mood.
#
# citizen.toml's own head circle (cx=12 cy=6.6 r=3.3) is IDENTICAL to
# king.toml's/champion.toml's, so the anchor arithmetic below lands on the
# same numbers those files' own headers derive — independently re-derived
# here from citizen's own geometry, not copied, and simply equal by
# construction.
classes = ["citizen"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="citizen-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#citizen-facing-left-fill)">
    <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
    <path d="M14.6 13.1 C16.4 13.2 18.1 14.7 18.4 17.4 C18.5 18.8 17.8 19.7 16.8 19.2 C16.7 17.1 16.1 15.1 14.3 14.2 Z"/>
    <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <circle cx="11.4" cy="6.6" r="3.3" fill="url(#citizen-facing-left-fill)"/>
  <path d="M8.3 6 Q7.05 7 8.3 8.05 Z" fill="url(#citizen-facing-left-fill)"/>
  <ellipse cx="9.7" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.0 4.2 C9.7 3.6 10.5 3.4 11.4 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from THIS file's own profile geometry: the head shifts left to
# cx=11.4 (0.1818 * 3.3, citizen's own head radius), the forward eye this
# file draws sits at (9.7, 6.1), scale is 0.6364 * 3.3 = 2.1, and cx/cy place
# the fragment so its own forward eye lands on the drawn one:
# cx = 9.7 + 0.4*2.1 = 10.5, cy = 6.1 + 0.15*2.1 = 6.4.
[face]
cx = 10.5
cy = 6.4
scale = 2.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
