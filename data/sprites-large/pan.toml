# pan — the kitchen's default portable at the sprite tier: a frying pan seen
# from above with a long handle and a soft gradient, so a taken pan reads as
# its own object rather than the generic portable. A rolled rim ring and a
# rivet where the handle meets the body are dark/light overlays on the same
# currentColor body, not a second colour — a cast rim and a forged rivet
# read as the same metal as the pan, just caught by the light differently.
classes = ["pan"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <radialGradient id="pan-wash" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
  </defs>
  <circle cx="10" cy="14" r="6" fill="currentColor"/>
  <circle cx="10" cy="14" r="6" fill="url(#pan-wash)"/>
  <circle cx="10" cy="14" r="5.86" fill="none" stroke="#000000" stroke-width="0.55" opacity="0.28"/>
  <circle cx="10" cy="14" r="5.3" fill="none" stroke="#ffffff" stroke-width="0.45" opacity="0.32"/>
  <circle cx="10" cy="14" r="3.6" fill="#000000" opacity="0.28"/>
  <rect x="15" y="12.9" width="7.2" height="2.2" rx="1.1" fill="currentColor"/>
  <rect x="16" y="13.15" width="5.6" height="0.4" rx="0.2" fill="#ffffff" opacity="0.22"/>
  <circle cx="15.6" cy="14" r="0.62" fill="#000000" opacity="0.35"/>
  <circle cx="15.44" cy="13.84" r="0.22" fill="#ffffff" opacity="0.5"/>
</svg>
"""
