# horse-facing-left — horse.toml's neck-and-head path re-swept so the head
# tip breaks the canvas's LEFT edge instead of the right: horse.toml's own
# front pose already draws its neck leaning right, so a left profile
# mirrors that same curve's shape across the canvas rather than shifting a
# head circle the way bear.toml's rounder classes do. The nostril curve
# and mane strand travel with the head; the tail tuft moves to the body's
# trailing right side; the four legs redistribute beneath the body. A
# hand-authored [match] variant, selected only when the instance's own
# mgx:faces fact says "left"; taught only the facing, {{FACE}} resolves to
# nothing and the profile keeps the single forward eye it draws itself.
classes = ["horse"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="horse-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12.6" cy="14.7" rx="7" ry="4.1" fill="url(#horse-facing-left-fill)"/>
  <path d="M7.2 12.4 C6.6 8.6 4.6 5.6 2 4.4 C3 6.6 3.2 8.8 2.6 11 C1.8 12 1.8 13.6 3 14.4 C4.6 13.2 6.2 13 7.2 12.4 Z" fill="url(#horse-facing-left-fill)"/>
  <path d="M5.6 6 C4.6 6.6 3.8 7.6 3.4 8.8" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
  <path d="M6.2 9 C5.9 10.2 6 11.4 6.4 12.4" fill="none" stroke="color-mix(in srgb, currentColor 35%, black)" stroke-width="0.5" opacity="0.45" stroke-linecap="round"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="8.4" y1="18" x2="8" y2="22"/>
    <line x1="12" y1="18.6" x2="11.8" y2="22"/>
    <line x1="15.6" y1="18" x2="16" y2="22"/>
    <line x1="18.6" y1="17.2" x2="19.4" y2="21.6"/>
  </g>
  <g fill="#2b2118">
    <ellipse cx="8" cy="22" rx="0.7" ry="0.4"/>
    <ellipse cx="11.8" cy="22" rx="0.7" ry="0.4"/>
    <ellipse cx="16" cy="22" rx="0.7" ry="0.4"/>
    <ellipse cx="19.4" cy="21.6" rx="0.7" ry="0.4"/>
  </g>
  <path d="M17.6 17 C20 17.6 20.6 16 19.2 15.2 Z" fill="url(#horse-facing-left-fill)"/>
  <circle cx="3.4" cy="6.6" r="0.4" fill="#1c1c1c"/>
  <ellipse cx="10.6" cy="12.5" rx="2.8" ry="1.5" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="3.6" cy="7" rx="2.6" ry="2.3" fill="#ffffff" opacity="0.22"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# horse has no head circle, so R_front is taken from horse-with-emotion's
# own face.scale (3.6). Profile radius 0.92*3.6=3.31; scale is 0.65 of
# that (2.15, rounded to 2.1). The forward eye drawn above sits at
# (3.4, 6.6), so cx = 3.4 + 0.4*2.1 = 4.24 and cy = 6.6 + 0.15*2.1 = 6.92.
[face]
cx = 4.24
cy = 6.92
scale = 2.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
