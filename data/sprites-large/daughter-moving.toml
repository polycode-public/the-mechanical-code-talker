# daughter-moving — the centre-facing walking pose: daughter.toml's own
# front-facing head, unshifted, both hair strands at their plain front
# positions, and the arms/legs redrawn to the same walking stride the
# facing-and-moving variants use. Selected on mgx:pose = "moving" alone,
# with no facing fact required — the frame an instance gets when it is
# taught it is moving but not which way it faces.
classes = ["daughter"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="daughter-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M16.2 6.8 C17.6 8.6 17.6 11.2 16.2 13.8" fill="none" stroke="url(#daughter-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M7.8 6.8 C6.4 8.6 6.4 11.2 7.8 13.8" fill="none" stroke="url(#daughter-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="url(#daughter-moving-fill)">
    <path d="M9.4 14.9 C8.06 14.44 6.82 15.24 6.46 17.26 C6.33 18.36 6.9 19.14 7.78 18.98 C7.88 17.28 8.3 16.02 9.62 15.32 Z"/>
    <path d="M14.6 14.9 C16.34 15.24 17.98 16.68 18.18 18.94 C18.23 19.96 17.5 20.58 16.62 20.1 C16.44 18.24 15.86 16.5 14.3 15.8 Z"/>
    <path d="M7.6 21 C7.5 17 9.3 14.7 12 14.7 C14.6 14.7 16.4 16.4 16 19.9 C15.8 20.7 15 20.7 14.4 20.2 Z"/>
    <path d="M10.8 11.4 L13.2 11.4 L13 14.6 L11 14.6 Z"/>
  </g>
  <ellipse cx="10.2" cy="18" rx="1.1" ry="1.6" fill="#ffffff" opacity="0.1"/>
  <circle cx="12" cy="8.2" r="3.6" fill="url(#daughter-moving-fill)"/>
  <path d="M10.6 14.3 L12 15.4 L13.4 14.3" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 15.4 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.35" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 15.3 C8.3 16 7.6 17.2 7.4 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 15.3 C15.7 16 16.4 17.2 16.6 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.8 5.6 C10.4 5.1 11.1 4.9 12 5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:pose"
value = "moving"

# daughter-with-emotion.toml's own front-facing anchor, reused verbatim:
# the head does not move in this frame, only the limbs do.
[face]
cx = 12
cy = 8.2
scale = 3.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
