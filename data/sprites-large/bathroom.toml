# bathroom — room.toml's own frame and wash, its interior swapped for a
# tub outline, a tap and a round mirror so it reads as its own room rather
# than a duplicate of bedroom's.
classes = ["bathroom"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bathroom-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#bathroom-fill)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <rect x="5.5" y="14.5" width="13" height="4.6" rx="2.3" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <path d="M8 14.5 V12.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="15.6" cy="7.6" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <path d="M14.4 7 L16.8 8.2" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>
  <path d="M4 4 L11 4" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
</svg>
"""
