# bathroom — the family's shared room vignette (wall gradient, a floor
# plane, one light glint, one or two furniture masses): a clawfoot tub in
# fixed porcelain and a brass-framed mirror whose glass sheen stands in
# for the room's own light source. Porcelain and brass are fixed because
# a bathtub is never "theme-coloured" in the way a wall is.
classes = ["bathroom"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bathroom-fill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 42%, white)"/>
      <stop offset="60%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 70%, black)"/>
    </linearGradient>
    <linearGradient id="bathroom-tub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f2ea"/>
      <stop offset="100%" stop-color="#c7cdd1"/>
    </linearGradient>
    <radialGradient id="bathroom-sheen" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#bathroom-fill)"/>
  <rect x="3" y="15.6" width="18" height="5.4" fill="color-mix(in srgb, currentColor 55%, black)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M5.4 15.4 C5.4 14 6.6 13.4 8 13.4 L15 13.4 C16.6 13.4 17.8 14.2 17.8 15.6 C17.8 17.6 16.4 18.6 14.4 18.6 L8 18.6 C6.2 18.6 5.4 17.2 5.4 15.4 Z" fill="url(#bathroom-tub)"/>
  <g fill="#9aa3a8">
    <ellipse cx="6.2" cy="19.2" rx="0.6" ry="0.9"/>
    <ellipse cx="17" cy="19.2" rx="0.6" ry="0.9"/>
  </g>
  <path d="M7.8 13.4 V11.6" stroke="#c9a227" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="7.8" cy="11.2" r="0.55" fill="#c9a227"/>
  <ellipse cx="10.6" cy="15.6" rx="4" ry="1.2" fill="url(#bathroom-sheen)"/>
  <circle cx="16" cy="7.4" r="2.6" fill="none" stroke="#c9a227" stroke-width="1.1"/>
  <circle cx="16" cy="7.4" r="1.9" fill="#cfe0e6"/>
  <path d="M14.8 6.4 L17.2 8.4" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
  <path d="M4 4 L11 4" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
"""
