# baby-facing-half-right — baby-facing-half-left.toml's three-quarter turn
# mirrored across the canvas midline. {{FACE}} sits outside the flip group.
classes = ["baby"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="baby-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="9.8" cy="21.5" rx="1.3" ry="1" fill="url(#baby-facing-half-right-fill)"/>
    <ellipse cx="14.2" cy="21.5" rx="1.3" ry="1" fill="url(#baby-facing-half-right-fill)"/>
    <path d="M7.2 21 C6.6 15.6 8 12.4 12 12.4 C16 12.4 17.4 15.6 16.8 21 C16.8 21 14.6 22 12 22 C9.4 22 7.2 21 7.2 21 Z" fill="url(#baby-facing-half-right-fill)"/>
    <ellipse cx="9.8" cy="17.2" rx="1.6" ry="2.4" fill="#ffffff" opacity="0.1"/>
    <circle cx="11.65" cy="7.4" r="3.8" fill="url(#baby-facing-half-right-fill)"/>
    <path d="M8.8 7.0 Q8.4 7.4 8.8 7.8 Z" fill="url(#baby-facing-half-right-fill)"/>
    <ellipse cx="10.2" cy="7.02" rx="0.3" ry="0.36" fill="#1c1c1c"/>
    <ellipse cx="13.6" cy="6.95" rx="0.2" ry="0.24" fill="#1c1c1c"/>
    <path d="M9 12.9 L12 15.4 L15 12.9" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8.4 16.6 C9.6 17.4 14.4 17.4 15.6 16.6" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3" stroke-linecap="round"/>
    <circle cx="12" cy="17" r="0.55" fill="currentColor" opacity="0.25"/>
    <path d="M9.25 4.8 C9.95 4.2 10.75 4 11.65 4.1" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# baby-facing-half-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 11.44); cy and scale are the mirror's own invariants.
[face]
cx = 12.56
cy = 7.49
scale = 3.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
