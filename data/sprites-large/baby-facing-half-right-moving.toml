# baby-facing-half-right-moving — baby-facing-half-left-moving.toml's
# wiggling three-quarter turn mirrored across the canvas midline. {{FACE}}
# sits outside the flip group.
classes = ["baby"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="baby-facing-half-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="8.3" cy="20.3" rx="1.3" ry="1" fill="url(#baby-facing-half-right-moving-fill)"/>
    <ellipse cx="15.8" cy="21.8" rx="1.3" ry="1" fill="url(#baby-facing-half-right-moving-fill)"/>
    <path d="M6.8 21.2 C6.2 15.6 8 12.4 12 12.4 C16 12.4 17.6 15.6 17.0 20.8 C17.0 20.8 14.6 22.2 12.1 21.7 C9.4 21.2 7.2 21.5 6.8 21.2 Z" fill="url(#baby-facing-half-right-moving-fill)"/>
    <ellipse cx="9.8" cy="17.2" rx="1.6" ry="2.4" fill="#ffffff" opacity="0.1"/>
    <circle cx="11.65" cy="7.4" r="3.8" fill="url(#baby-facing-half-right-moving-fill)"/>
    <path d="M8.8 7.0 Q8.4 7.4 8.8 7.8 Z" fill="url(#baby-facing-half-right-moving-fill)"/>
    <ellipse cx="10.2" cy="7.02" rx="0.3" ry="0.36" fill="#1c1c1c"/>
    <ellipse cx="13.6" cy="6.95" rx="0.2" ry="0.24" fill="#1c1c1c"/>
    <path d="M9 12.9 L12 15.4 L15 12.9" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8.4 16.6 C9.6 17.4 14.4 17.4 15.6 16.6" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3" stroke-linecap="round"/>
    <circle cx="12" cy="17" r="0.55" fill="currentColor" opacity="0.25"/>
    <path d="M9.25 4.8 C9.95 4.2 10.75 4 11.65 4.1" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 12.56
cy = 7.49
scale = 3.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
