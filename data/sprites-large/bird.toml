# bird — gradient-shaded like dog/animal, no material table: a perched
# silhouette (round body, round head, a wing fold, a beak and two feet)
# rather than a bird in flight, so it stays legible at a glance.
classes = ["bird"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bird-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="11.4" cy="13.4" rx="6.4" ry="5" fill="url(#bird-fill)"/>
  <circle cx="16.4" cy="8.4" r="3.4" fill="url(#bird-fill)"/>
  <path d="M19.4 8.2 L22.4 7.4 L19.8 9.6 Z" fill="currentColor" opacity="0.8"/>
  <path d="M6.4 12.4 C3 11.6 2.4 14.6 5.6 15.6 C7.4 16.2 8.4 14.4 6.4 12.4 Z" fill="url(#bird-fill)"/>
  <circle cx="17.6" cy="7.4" r="0.6" fill="#000000" opacity="0.5"/>
  <ellipse cx="9.4" cy="11.4" rx="2.6" ry="1.6" fill="#ffffff" opacity="0.3"/>
  <g stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <line x1="9.4" y1="18" x2="8.4" y2="21"/>
    <line x1="12.4" y1="18.2" x2="13" y2="21"/>
  </g>
</svg>
"""
