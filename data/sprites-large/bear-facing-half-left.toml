# bear-facing-half-left — the bear turned three-quarters, halfway between
# bear-facing-left.toml's full profile and bear-with-emotion.toml's front
# view. The head sits at the midpoint position, the muzzle projects only
# half as far past the head's left edge and dips forward, and a small far
# eye now shows past the muzzle line alongside the near eye — the cue that
# reads as a turned head rather than a flat profile. The body, paws and
# tail nub keep the profile file's own geometry, shifted right by the same
# amount the head moved.
classes = ["bear"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bear-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="15.5" cy="15.6" rx="7" ry="5.4" fill="url(#bear-facing-half-left-fill)"/>
  <g fill="url(#bear-facing-half-left-fill)">
    <ellipse cx="9.9" cy="20" rx="1.2" ry="1.4"/>
    <ellipse cx="13.3" cy="20.5" rx="1.2" ry="1.4"/>
    <ellipse cx="17.9" cy="20.5" rx="1.2" ry="1.4"/>
    <ellipse cx="21.3" cy="19.9" rx="1.2" ry="1.4"/>
  </g>
  <circle cx="23.2" cy="13.4" r="1.2" fill="url(#bear-facing-half-left-fill)"/>
  <circle cx="8.6" cy="4.7" r="1.3" fill="url(#bear-facing-half-left-fill)"/>
  <circle cx="9.7" cy="8.9" r="4.6" fill="url(#bear-facing-half-left-fill)"/>
  <circle cx="11.9" cy="5" r="2" fill="url(#bear-facing-half-left-fill)"/>
  <ellipse cx="6.5" cy="10.7" rx="2" ry="1.5" fill="#c9a273"/>
  <ellipse cx="5.3" cy="10.2" rx="0.7" ry="0.55" fill="#1c1c1c"/>
  <ellipse cx="11.6" cy="8.3" rx="0.3" ry="0.38" fill="#1c1c1c"/>
  <ellipse cx="8.9" cy="8" rx="0.5" ry="0.62" fill="#1c1c1c"/>
  <ellipse cx="10.7" cy="6.6" rx="1.2" ry="0.9" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="12.9" cy="13.6" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# Half scale is 0.825 * head radius 4.6 = 3.79, rounded to 3.8 (the table's
# own halfway point between the front view's 1.0*r and the profile's
# 0.65*r). The near eye drawn above sits at (8.9, 8), so cx = 8.9 +
# 0.4*3.8 = 10.42 and cy = 8 + 0.15*3.8 = 8.57, landing the shared face
# fragment's own near eye on top of it.
[face]
cx = 10.42
cy = 8.57
scale = 3.8

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
