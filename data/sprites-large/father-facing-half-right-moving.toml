# father-facing-half-right-moving — father-facing-half-left-moving.toml's
# stride mirrored across the canvas midline, the same translate-then-flip
# technique the standing pairs use. {{FACE}} sits outside the flip group.

classes = ["father"]

svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="father-facing-half-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
  <g fill="url(#father-facing-half-right-moving-fill)">
    <path d="M9.4 13.1 C7.7 12.8 6.1 14 5.7 16.7 C5.55 18.1 6.2 19.1 7.25 18.7 C7.35 16.7 7.9 14.8 9.65 13.9 Z"/>
    <path d="M14.6 13.1 C16.5 13.3 18.4 15 18.7 17.8 C18.8 19 18.1 19.9 17 19.3 C16.85 17.2 16.2 15.1 14.3 14.2 Z"/>
    <path d="M6.15 21 C6 15.4 8.7 12.85 11.85 12.85 C15.2 12.85 17.8 15.05 17.35 19.8 C17.15 20.85 15.9 20.85 15.1 20.25 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <circle cx="11.7" cy="6.6" r="3.3" fill="url(#father-facing-half-right-moving-fill)"/>
  <path d="M8.6 6.1 Q7.9 7.4 8.6 8.1 Z" fill="url(#father-facing-half-right-moving-fill)"/>
  <ellipse cx="10" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <ellipse cx="14" cy="6.05" rx="0.18" ry="0.22" fill="#1c1c1c"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 13.9 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.3 4.2 C10 3.6 10.8 3.4 11.7 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <path d="M18.6 15.3 C19.7 15.5 20.3 16.3 20.1 17.4 C20 18.3 19.2 18.9 18.2 18.7 C17.3 18.5 16.9 17.6 17.1 16.7 C17.3 15.8 17.9 15.2 18.6 15.3 Z" fill="#e4cfa0"/>
  <path d="M17.6 16.4 C18.3 16.7 19 16.7 19.6 16.3" fill="none" stroke="#b89860" stroke-width="0.25" stroke-linecap="round" opacity="0.7"/>
  <circle cx="18.7" cy="15.9" r="0.22" fill="#8a6a3a"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 12.92
cy = 6.51
scale = 2.7

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
