# factory — room.toml's own card, its interior swapped for a fixed-brick
# sawtooth-roofed shed, a smoking chimney and a row of fixed warm-lit
# windows. Brick is fixed because it is the one material a factory shed
# reads as almost everywhere it appears.
classes = ["factory"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="factory-fill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 42%, white)"/>
      <stop offset="60%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 70%, black)"/>
    </linearGradient>
    <linearGradient id="factory-brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b5563d"/>
      <stop offset="100%" stop-color="#7a341f"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#factory-fill)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <rect x="5.5" y="11.4" width="13" height="8.1" fill="url(#factory-brick)"/>
  <path d="M5.5 11.4 L9.5 8.4 L9.5 11.4 L13.3 8.4 L13.3 11.4 L18.5 11.4" fill="url(#factory-brick)"/>
  <rect x="15.2" y="6" width="2.2" height="5.4" fill="url(#factory-brick)"/>
