    <rect x="7" y="14" width="1" height="1"/>
    <rect x="10" y="14" width="1" height="1"/>
    <rect x="13" y="14" width="1" height="1"/>
  </g>
  <path d="M4 4 L11 4" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
"""
