# leader-facing-half-left — the leader turned three-quarters from the full
# left profile toward the front. The head and hair highlight sit at the
# half-left position between the two views, the nose wedge projects only
# half as far past the head's edge and dips down instead of pointing
# straight out, and a second, smaller far eye appears near the head's
# right edge so both eyes read. The cape-arm, the combined torso+pointing-
# arm shape, the rosette and the pointing-arm shadow stroke keep
# leader-with-emotion.toml's own geometry, the same as the full profile.
classes = ["leader"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="leader-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#leader-facing-half-left-fill)">
    <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
    <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C13.6 12.8 15 13.5 16 14.8 L21 11.4 L21.8 12.7 L16.8 16.6 C17.5 18 18 19.6 18 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <circle cx="9.4" cy="13.9" r="0.7" fill="#2a4d7a"/>
  <circle cx="9.4" cy="13.9" r="0.32" fill="#1c3355"/>
  <circle cx="11.7" cy="6.6" r="3.3" fill="url(#leader-facing-half-left-fill)"/>
  <path d="M8.6 6.1 Q7.9 7.4 8.6 8.1 Z" fill="url(#leader-facing-half-left-fill)"/>
  <ellipse cx="10" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <ellipse cx="14" cy="6.05" rx="0.18" ry="0.22" fill="#1c1c1c"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 13.9 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M16 14.8 L20.2 11.9" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.25" stroke-linecap="round"/>
  <path d="M9.3 4.2 C10.0 3.6 10.8 3.4 11.7 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# The head sits at cx=11.7 cy=6.6 r=3.3 (0.3 short of the full left profile's
# shift), so scale is 0.825 * 3.3 = 2.7. The near eye this file draws sits at
# (10, 6.1), the profile's own forward eye shifted right by the head's own
# 0.3-unit move. cx = 10 + 0.4*2.7 = 11.08 and cy = 6.1 + 0.15*2.7 = 6.51.
[face]
cx = 11.08
cy = 6.51
scale = 2.7

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
