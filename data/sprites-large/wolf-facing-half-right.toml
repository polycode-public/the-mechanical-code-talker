# wolf-facing-half-right — wolf-facing-half-left.toml's three-quarter turn
# mirrored across the canvas midline. {{FACE}} sits outside the flip group.
classes = ["wolf"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="wolf-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="12.6" cy="15.4" rx="6.6" ry="4.2" fill="url(#wolf-facing-half-right-fill)"/>
    <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <line x1="8" y1="17.6" x2="7.8" y2="22.2"/>
      <line x1="10.8" y1="18.6" x2="10.8" y2="22.4"/>
      <line x1="14.4" y1="18.6" x2="14.4" y2="22.4"/>
      <line x1="17.4" y1="17.6" x2="17.6" y2="22.2"/>
    </g>
    <path d="M4.22 10.2 C4.22 7 6.42 5.2 9.22 5.2 C12.02 5.2 13.62 7.4 13.42 10.2 C13.22 12.4 11.82 13.4 9.02 13.4 C6.42 13.4 4.22 12.4 4.22 10.2 Z" fill="url(#wolf-facing-half-right-fill)"/>
    <path d="M4.62 6.6 L3.02 2.6 L6.62 4.8 Z" fill="url(#wolf-facing-half-right-fill)"/>
    <path d="M11.02 5.4 L11.42 1.6 L14.22 4.6 Z" fill="url(#wolf-facing-half-right-fill)"/>
    <ellipse cx="7.22" cy="12.4" rx="2.2" ry="1.6" fill="color-mix(in srgb, currentColor 45%, white)"/>
    <path d="M5.22 10.4 C5.62 12.2 7.42 13 9.02 13 C7.42 12.2 6.22 11.2 6.02 9.4 Z" fill="#000000" opacity="0.18"/>
    <ellipse cx="5.22" cy="11.2" rx="0.55" ry="0.45" fill="#1c1c1c"/>
    <path d="M4.38 9.0 Q3.58 9.5 4.38 10.0 Z" fill="url(#wolf-facing-half-right-fill)"/>
    <ellipse cx="5.68" cy="8.3" rx="0.3" ry="0.36" fill="#1c1c1c"/>
    <ellipse cx="8.5" cy="8.2" rx="0.2" ry="0.24" fill="#1c1c1c"/>
    <path d="M17.4 13.2 C21 10.6 23.6 13 22 16.6 C21 18.2 19.6 18.4 18.8 17 C20.2 16.4 20.8 15.1 20.2 13.8 C19.2 13 18.3 12.9 17.4 13.2 Z" fill="url(#wolf-facing-half-right-fill)"/>
    <ellipse cx="10.2" cy="12.2" rx="2.4" ry="1.4" fill="#ffffff" opacity="0.26"/>
    <ellipse cx="8.92" cy="9.2" rx="3.6" ry="3.1" fill="#ffffff" opacity="0.22"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# wolf-facing-half-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 7.04); cy and scale are the mirror's own invariants.
[face]
cx = 16.96
cy = 8.81
scale = 3.4

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
