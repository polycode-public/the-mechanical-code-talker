# wolf-facing-half-left-moving — wolf-facing-half-left.toml's three-quarter
# head caught over the same prowling body wolf-facing-left-moving.toml
# draws: the prowl is judged to read the same regardless of how far the
# head has turned, so it is shared verbatim between the full and half
# profile's moving frames — only the head, ears, throat shadow, shadow
# patch, nose dot, nose wedge and near/far eyes differ, carried over
# unchanged from wolf-facing-half-left.toml.
classes = ["wolf"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="wolf-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12.6" cy="15.7" rx="6.6" ry="4.2" fill="url(#wolf-facing-half-left-moving-fill)"/>
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <line x1="7.2" y1="17.0" x2="6.6" y2="20.6"/>
    <line x1="10.6" y1="18.2" x2="10.2" y2="22.6"/>
    <line x1="14.8" y1="17.0" x2="15.6" y2="20.4"/>
    <line x1="17.6" y1="18.2" x2="18.4" y2="22.4"/>
  </g>
  <path d="M4.22 10.2 C4.22 7 6.42 5.2 9.22 5.2 C12.02 5.2 13.62 7.4 13.42 10.2 C13.22 12.4 11.82 13.4 9.02 13.4 C6.42 13.4 4.22 12.4 4.22 10.2 Z" fill="url(#wolf-facing-half-left-moving-fill)"/>
  <path d="M4.62 6.6 L3.02 2.6 L6.62 4.8 Z" fill="url(#wolf-facing-half-left-moving-fill)"/>
  <path d="M11.02 5.4 L11.42 1.6 L14.22 4.6 Z" fill="url(#wolf-facing-half-left-moving-fill)"/>
  <ellipse cx="7.22" cy="12.4" rx="2.2" ry="1.6" fill="color-mix(in srgb, currentColor 45%, white)"/>
  <path d="M5.22 10.4 C5.62 12.2 7.42 13 9.02 13 C7.42 12.2 6.22 11.2 6.02 9.4 Z" fill="#000000" opacity="0.18"/>
  <ellipse cx="5.22" cy="11.2" rx="0.55" ry="0.45" fill="#1c1c1c"/>
  <path d="M4.38 9.0 Q3.58 9.5 4.38 10.0 Z" fill="url(#wolf-facing-half-left-moving-fill)"/>
  <ellipse cx="5.68" cy="8.3" rx="0.3" ry="0.36" fill="#1c1c1c"/>
  <ellipse cx="8.5" cy="8.2" rx="0.2" ry="0.24" fill="#1c1c1c"/>
  <path d="M17.4 12.8 C21 10.2 23.6 12.6 22 16.2 C21 17.8 19.6 18.0 18.8 16.6 C20.2 16.0 20.8 14.7 20.2 13.4 C19.2 12.6 18.3 12.5 17.4 12.8 Z" fill="url(#wolf-facing-half-left-moving-fill)"/>
  <ellipse cx="10.2" cy="12.2" rx="2.4" ry="1.4" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="8.92" cy="9.2" rx="3.6" ry="3.1" fill="#ffffff" opacity="0.22"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 7.04
cy = 8.81
scale = 3.4

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
