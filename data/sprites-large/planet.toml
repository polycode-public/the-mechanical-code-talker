# planet — a ringed sphere at the sprite tier. A ring is Saturn's own
# feature, and Saturn's own colour is a pale sandy gold, so this sprite
# fixes that palette rather than taking the tier's currentColor gradient
# — the same reason earth.toml fixes blue-green rather than letting a
# theme repaint a specific, real body. Fixing the hue also keeps it
# unmistakably distinct from earth's own blue globe. The ring sits
# behind the sphere and simply shows past its edges, rather than a
# hand-clipped front arc.
classes = ["planet"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <radialGradient id="planet-fill" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f6dfa8"/>
      <stop offset="60%" stop-color="#d9a95a"/>
      <stop offset="100%" stop-color="#a2712f"/>
    </radialGradient>
  </defs>
  <ellipse cx="12" cy="13.4" rx="10.4" ry="3" fill="none" stroke="#c9a15a" stroke-width="1.1" opacity="0.7"/>
  <circle cx="12" cy="12" r="6.6" fill="url(#planet-fill)"/>
  <path d="M6.2 13.2 C8.6 14.2 15.4 14.2 17.8 13.2" stroke="#7a5322" stroke-width="0.5" opacity="0.3" fill="none"/>
  <ellipse cx="9.4" cy="9" rx="2.6" ry="1.6" fill="#ffffff" opacity="0.32"/>
</svg>
"""
