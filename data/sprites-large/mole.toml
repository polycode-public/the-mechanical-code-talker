# mole — the tunnel's own creature at the sprite tier: no visible ears
# (a mole's ear is a hidden fold, not a flap, so this is the one animal
# in the pack that draws none), a blunt merged snout with a pink tip,
# tiny near-blind eyes, and two oversized spade-shaped front paws for
# digging — the tier's usual gradient/highlight, no material.
