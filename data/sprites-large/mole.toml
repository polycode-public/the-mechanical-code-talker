# mole — the tunnel's own creature at the sprite tier: no visible ears (a
# mole's ear is a hidden fold, not a flap, so this is the one animal in the
# pack that draws none), a narrow pink cone snout carried straight off a
# neckless head, a near-blind pinprick eye, and two outward-turned spade
# hands whose pale claws are the reason the animal is shaped the way it is.
# The snout, hands and claws are fixed colours because they are bare skin
# and horn, not coat, and a theme that repaints the fur should leave them
# alone — the same split badger.toml makes between its stripes and its body.
classes = ["mole"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="mole-fill" x1="0" y1="0" x2="0.4" y2="1">
