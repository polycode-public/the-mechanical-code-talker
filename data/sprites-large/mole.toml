  <path d="M20.6 13.2 C22.4 12.2 23.8 13.2 23.5 14.7 C23.3 15.7 22.3 16 21.9 15.2 C22.4 14.6 22.2 13.9 21.5 13.7 Z" fill="url(#mole-fill)"/>
