# village — a couple of humble cottages under fixed thatch roofs, fewer
# and lower than town's cluster, each doorway lit and one shade tree
# filling the green between them. Thatch and the tree's own foliage
# colour are fixed since both are real materials the roof and hedge
# always carry.
