# poodle — the sprite tier's own version of the seed taxonomy's worked
# example (poodle IsA dog): three clipped pompom circles on the head, a
# pompom tail, and matching pompom cuffs at each ankle keep this fully
# distinct from the plain dog sprite it would otherwise fall back to, with
# a fixed dark nose at the snout tip.
classes = ["poodle"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="poodle-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15" rx="6.4" ry="4.6" fill="url(#poodle-fill)"/>
  <ellipse cx="10.8" cy="13.2" rx="1.8" ry="1.3" fill="#000000" opacity="0.18"/>
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <line x1="8.4" y1="18.8" x2="8.2" y2="21.6"/>
    <line x1="11" y1="19.4" x2="11" y2="22"/>
    <line x1="15" y1="19.4" x2="15" y2="22"/>
    <line x1="17.6" y1="18.8" x2="17.8" y2="21.6"/>
  </g>
  <g fill="url(#poodle-fill)">
    <circle cx="8.2" cy="20.6" r="1"/>
    <circle cx="11" cy="21.2" r="1"/>
    <circle cx="15" cy="21.2" r="1"/>
    <circle cx="17.8" cy="20.6" r="1"/>
  </g>
  <circle cx="7" cy="8.5" r="4" fill="url(#poodle-fill)"/>
  <g fill="url(#poodle-fill)">
    <circle cx="4" cy="6" r="1.6"/>
    <circle cx="7" cy="4.2" r="1.7"/>
    <circle cx="10" cy="6" r="1.6"/>
  </g>
  <ellipse cx="3.2" cy="8.8" rx="0.55" ry="0.45" fill="#1c1c1c"/>
  <rect x="18.5" y="14" width="2.2" height="6" rx="1.1" fill="url(#poodle-fill)"/>
  <circle cx="19.6" cy="13" r="1.5" fill="url(#poodle-fill)"/>
  <ellipse cx="9.6" cy="12.2" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="5.6" cy="7" rx="1.3" ry="1" fill="#ffffff" opacity="0.32"/>
</svg>
"""
