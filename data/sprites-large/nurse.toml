  <path d="M8.2 4.4 C8.2 2.4 9.9 0.8 12 0.8 C14.1 0.8 15.8 2.4 15.8 4.4 L15.8 5.5 C15.8 5.9 15.4 6.2 15 6.2 L9 6.2 C8.6 6.2 8.2 5.9 8.2 5.5 Z" fill="url(#nurse-fill)"/>
