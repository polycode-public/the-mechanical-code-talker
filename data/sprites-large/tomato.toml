# tomato — a squat red globe under a five-lobe green calyx and a short
# stem. Red and green are fixed, not currentColor-shaded: the colour pair is
# what separates a tomato from every other round fruit at the size the mud
# room view draws it. One crease down the left shoulder keeps it from
# reading as a flat ball.
classes = ["tomato"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="tomato-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f6836a"/>
      <stop offset="55%" stop-color="#d43a26"/>
      <stop offset="100%" stop-color="#8f1f10"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="14.4" rx="7.4" ry="6.6" fill="url(#tomato-fill)"/>
  <path d="M8.6 9.6 C9.7 12.4 9.6 16.4 8.4 18.9" fill="none" stroke="#8f1f10" stroke-width="0.7" opacity="0.28" stroke-linecap="round"/>
  <path d="M15.4 9.8 C14.5 12.5 14.6 16.3 15.6 18.7" fill="none" stroke="#8f1f10" stroke-width="0.6" opacity="0.2" stroke-linecap="round"/>
  <rect x="11.4" y="3.6" width="1.3" height="4.2" rx="0.65" fill="#4a7a34"/>
  <g fill="#3f7a2f">
    <ellipse cx="12" cy="8.4" rx="2.9" ry="1.15"/>
    <ellipse cx="12" cy="8.4" rx="2.9" ry="1.15" transform="rotate(72 12 8.4)"/>
    <ellipse cx="12" cy="8.4" rx="2.9" ry="1.15" transform="rotate(144 12 8.4)"/>
  </g>
  <circle cx="12" cy="8.4" r="1.15" fill="#5a9040"/>
  <ellipse cx="9.3" cy="11.6" rx="2.1" ry="1.5" fill="#ffffff" opacity="0.33" transform="rotate(-28 9.3 11.6)"/>
</svg>
"""
