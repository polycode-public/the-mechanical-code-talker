# champion-with-emotion — same medal-and-ribbon silhouette as
# champion.toml, plus a required [face] anchor and a {{FACE}} placeholder
# that resolves to whichever of the 6 curated mgx:feels words the
# instance's own fact names. No mgx:feels fact falls through to the plain
# champion.toml sprite.
classes = ["champion"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="champion-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#champion-with-emotion-fill)"/>
  <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z" fill="url(#champion-with-emotion-fill)"/>
  <path d="M10.4 13.6 L12 16.8 L13.6 13.6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.7" stroke-linecap="round"/>
  <circle cx="12" cy="18.2" r="2" fill="currentColor" opacity="0.92"/>
  <circle cx="12" cy="18.2" r="1.1" fill="url(#champion-with-emotion-fill)"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r champion.toml's own head circle declares.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
