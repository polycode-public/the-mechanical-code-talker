# cook — Ashcombe Hall's own cook at the sprite tier: the toque, head and
# body all share the one gradient (a chef's whites read as one tonal
# family), with a highlight on the toque itself since that's the tallest,
# most light-catching part of the silhouette.
classes = ["cook"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="cook-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="3.4" rx="5.4" ry="3" fill="url(#cook-fill)"/>
  <rect x="8.6" y="5.6" width="6.8" height="2.2" rx="0.6" fill="url(#cook-fill)"/>
  <circle cx="12" cy="10" r="3.1" fill="url(#cook-fill)"/>
  <path d="M6 21 C6 15.6 8.7 13.2 12 13.2 C15.3 13.2 18 15.6 18 21 Z" fill="url(#cook-fill)"/>
  <ellipse cx="9.6" cy="2.2" rx="1.8" ry="1" fill="#ffffff" opacity="0.35"/>
</svg>
"""
