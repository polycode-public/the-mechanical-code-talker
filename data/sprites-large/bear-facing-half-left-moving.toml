# bear-facing-half-left-moving — bear-facing-half-left.toml's three-quarter
# turn caught mid-stride. The head, ears, muzzle, nose and eyes stay exactly
# as that file draws them, since a head does not change shape mid-stride.
# What moves: the four paws spread from their standing row into the same
# diagonal gait bear-facing-left-moving.toml draws (the near pair swung
# forward and lifted, the far pair trailing low and back); the body dips
# down slightly under the stride; and the tail nub lifts and swings up and
# back. Every paw/tail/body delta is the exact same offset
# bear-facing-left-moving.toml applies to bear-facing-left.toml's own
# geometry — the half-left body is already that profile's own shapes shifted
# right by a constant amount, so the same stride articulation lands correctly
# on top of it.
classes = ["bear"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bear-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="15.5" cy="16" rx="7" ry="5.4" fill="url(#bear-facing-half-left-moving-fill)"/>
  <g fill="url(#bear-facing-half-left-moving-fill)">
    <ellipse cx="11.1" cy="19" rx="1.2" ry="1.3"/>
    <ellipse cx="12.6" cy="21" rx="1.2" ry="1.4"/>
    <ellipse cx="19.2" cy="19.6" rx="1.2" ry="1.3"/>
    <ellipse cx="20.5" cy="20.6" rx="1.2" ry="1.4"/>
  </g>
  <circle cx="23.6" cy="12.6" r="1.2" fill="url(#bear-facing-half-left-moving-fill)"/>
  <circle cx="8.6" cy="4.7" r="1.3" fill="url(#bear-facing-half-left-moving-fill)"/>
  <circle cx="9.7" cy="8.9" r="4.6" fill="url(#bear-facing-half-left-moving-fill)"/>
  <circle cx="11.9" cy="5" r="2" fill="url(#bear-facing-half-left-moving-fill)"/>
  <ellipse cx="6.5" cy="10.7" rx="2" ry="1.5" fill="#c9a273"/>
  <ellipse cx="5.3" cy="10.2" rx="0.7" ry="0.55" fill="#1c1c1c"/>
  <ellipse cx="11.6" cy="8.3" rx="0.3" ry="0.38" fill="#1c1c1c"/>
  <ellipse cx="8.9" cy="8" rx="0.5" ry="0.62" fill="#1c1c1c"/>
  <ellipse cx="10.7" cy="6.6" rx="1.2" ry="0.9" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="12.9" cy="14" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

# The head doesn't move mid-stride, so this is bear-facing-half-left.toml's
# own anchor unchanged.
[face]
cx = 10.42
cy = 8.57
scale = 3.8

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
