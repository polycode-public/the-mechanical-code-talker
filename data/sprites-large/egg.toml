# egg — the spider-and-fly board's laid egg at the sprite tier, coloured
# entirely through currentColor there (the board sets a fixed muted grey),
# so the shell stays the dominant surface — a scatter of fixed brown-tan
# speckles is the only fixed accent, the small realistic detail that
# separates a speckled egg from a plain painted ellipse, kept small enough
# to survive the board's ~41px render. One broad soft highlight stands in
# for the icon tier's flat carved-highlight ellipse.
classes = ["egg"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="egg-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 55%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M12 2 C7 2 4 10 4 15.5 C4 20 7.6 22 12 22 C16.4 22 20 20 20 15.5 C20 10 17 2 12 2 Z" fill="url(#egg-fill)"/>
  <g fill="#8a6a4a" opacity="0.55">
    <ellipse cx="14.6" cy="7.8" rx="0.75" ry="0.55" transform="rotate(20 14.6 7.8)"/>
    <ellipse cx="9.4" cy="13.4" rx="0.6" ry="0.45" transform="rotate(-10 9.4 13.4)"/>
    <ellipse cx="15.4" cy="14.8" rx="0.7" ry="0.5" transform="rotate(35 15.4 14.8)"/>
    <ellipse cx="11.6" cy="18.4" rx="0.55" ry="0.4" transform="rotate(-15 11.6 18.4)"/>
    <ellipse cx="16" cy="11" rx="0.5" ry="0.38" transform="rotate(5 16 11)"/>
  </g>
  <ellipse cx="9.4" cy="9" rx="1.9" ry="2.8" fill="#ffffff" opacity="0.4"/>
</svg>
"""
