# sheep-facing-half-left-moving — sheep-facing-half-left.toml's own
# three-quarter turn caught mid-stride. The face and ears stay exactly as
# that file draws them; the four legs spread into the same diagonal gait
# sheep-facing-left-moving.toml uses (near pair forward and lifted, far
# pair trailing low), shifted the same 2.2 units the plain half-left turn
# shifts its whole composition, and the wool mass dips by 0.4 under the
# stride.
classes = ["sheep"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="sheep-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g stroke="#3a352f" stroke-width="1.5" stroke-linecap="round">
    <line x1="11.2" y1="17" x2="12.6" y2="19.4"/>
    <line x1="13.6" y1="17.6" x2="15" y2="20"/>
    <line x1="18.6" y1="18.8" x2="17.4" y2="22.2"/>
    <line x1="21" y1="18.2" x2="19.8" y2="21.6"/>
  </g>
  <g fill="url(#sheep-facing-half-left-moving-fill)">
    <circle cx="13.4" cy="13" r="3.4"/>
    <circle cx="17.2" cy="11.4" r="3.8"/>
    <circle cx="20.7" cy="12.8" r="3"/>
    <circle cx="15" cy="15.8" r="3.6"/>
    <circle cx="19.2" cy="15.8" r="3.2"/>
    <circle cx="22.8" cy="14" r="1"/>
  </g>
  <g stroke="color-mix(in srgb, currentColor 40%, black)" stroke-width="0.4" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M14.2 10.8 C14.8 10.2 15.6 10.2 16.2 10.6"/>
    <path d="M18.2 9.4 C18.8 9 19.6 9.1 20.1 9.6"/>
    <path d="M20.8 11.4 C21.3 11 22 11.1 22.4 11.6"/>
  </g>
  <ellipse cx="7.8" cy="9.5" rx="0.95" ry="1.3" fill="#3a352f" transform="rotate(20 7.8 9.5)"/>
  <ellipse cx="4.4" cy="9.8" rx="1.1" ry="1.5" fill="#3a352f" transform="rotate(-15 4.4 9.8)"/>
  <ellipse cx="6.2" cy="13" rx="2.6" ry="2.2" fill="#3a352f"/>
  <ellipse cx="17.2" cy="9.6" rx="2.3" ry="1.4" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 6.2
cy = 13
scale = 1.98

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
