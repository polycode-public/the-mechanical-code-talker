# girl-moving — girl-with-emotion.toml's front figure caught mid-stride,
# selected on mgx:pose = "moving" alone (no facing fact on record, so the
# centre view is what a moving-but-unturned instance gets — the same
# absent-fact convention the turntable itself uses for the front view). The
# head and tails stay at girl-with-emotion.toml's own front anchor; what
# moved is the arms (one forward, one back) and the dress hem, asymmetric
# the same way the profile strides are.

classes = ["girl"]

svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="girl-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M16.2 6.8 C17.6 8.6 17.6 11.2 16.2 13.8" fill="none" stroke="url(#girl-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M7.8 6.8 C6.4 8.6 6.4 11.2 7.8 13.8" fill="none" stroke="url(#girl-moving-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="url(#girl-moving-fill)">
    <path d="M9.4 14.9 C7.5 15.1 6.2 16.5 6.05 18.9 C6 20 6.6 20.7 7.5 20.4 C7.65 18.7 8 17 9.6 15.9 Z"/>
    <path d="M14.6 14.9 C16.6 14.8 18.1 15.9 18.3 18.2 C18.4 19.4 17.7 20.2 16.7 19.7 C16.45 18 15.9 16.4 14.3 15.6 Z"/>
    <path d="M7.6 21 C7.4 16.7 9.4 14.6 12 14.6 C14.8 14.6 17 16.9 16.7 20.6 C16.55 21.2 15.6 21 15 20.6 C15.25 18.6 14.85 16.8 13.5 15.7 C12.7 16 11.3 16 10.5 15.7 C9.2 16.8 8.8 18.6 9 20.6 C8.4 21 7.75 21.2 7.6 21 Z"/>
    <path d="M10.8 11.4 L13.2 11.4 L13 14.6 L11 14.6 Z"/>
  </g>
  <ellipse cx="10.2" cy="18" rx="1.1" ry="1.6" fill="#ffffff" opacity="0.1"/>
  <circle cx="12" cy="8.2" r="3.6" fill="url(#girl-moving-fill)"/>
  <path d="M10.6 14.3 L12 15.4 L13.4 14.3" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 15.4 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.35" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 15.3 C8.3 16 7.6 17.2 7.4 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 15.3 C15.7 16 16.4 17.2 16.6 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.8 5.6 C10.4 5.1 11.1 4.9 12 5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:pose"
value = "moving"

[face]
cx = 12
cy = 8.2
scale = 3.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
