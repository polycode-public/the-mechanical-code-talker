classes = ["queen"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="queen-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="queen-moving-crown-gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f6d675"/>
      <stop offset="55%" stop-color="#d9a635"/>
      <stop offset="100%" stop-color="#9c6b12"/>
    </linearGradient>
  </defs>
  <path d="M8.6 2.8 C8.7 1.8 9.2 1.2 9.7 1.5 C10.1 1.7 10.3 2.2 10.4 2.7 C10.7 1.6 11.2 0.5 12 0.5 C12.8 0.5 13.3 1.6 13.6 2.7 C13.7 2.2 13.9 1.7 14.3 1.5 C14.8 1.2 15.3 1.8 15.4 2.8 Z" fill="url(#queen-moving-crown-gold)"/>
  <circle cx="12" cy="1" r="0.5" fill="#6a3b8a"/>
  <rect x="8.6" y="2.6" width="6.8" height="1.1" rx="0.35" fill="url(#queen-moving-crown-gold)"/>
  <g fill="url(#queen-moving-fill)">
    <path d="M9.4 13.1 C7.8 12.5 6.3 13.5 5.8 16.1 C5.6 17.5 6.2 18.5 7.3 18.2 C7.4 16.2 7.9 14.5 9.6 13.6 Z"/>
    <path d="M14.6 13.1 C16.7 13.5 18.7 15.3 19 18.2 C19.1 19.5 18.3 20.3 17.2 19.7 C17 17.4 16.3 15.1 14.3 14.2 Z"/>
    <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <path d="M10 12.6 C10.6 13.4 11.3 13.7 12 13.7 C12.7 13.7 13.4 13.4 14 12.6" fill="none" stroke="url(#queen-moving-crown-gold)" stroke-width="0.4" opacity="0.85"/>
  <circle cx="12" cy="13.7" r="0.4" fill="#6a3b8a"/>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#queen-moving-fill)"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:pose"
value = "moving"

[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
