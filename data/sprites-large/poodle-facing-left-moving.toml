# poodle-facing-left-moving — poodle-facing-left.toml's own profile caught
# mid-stride. The head, curls, nose and eye stay exactly as that file draws
# them, since a head does not change shape mid-stride. What moves: the four
# legs spread from their standing row into a diagonal trot, the near pair
# swung forward and lifted, the far pair trailing low and back; the body
# dips down slightly under the stride; and the pompom tail lifts and swings
# up and back.
classes = ["poodle"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="poodle-facing-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="14.4" cy="15.6" rx="6.2" ry="4.6" fill="url(#poodle-facing-left-moving-fill)"/>
  <ellipse cx="12.2" cy="13.8" rx="1.8" ry="1.3" fill="#000000" opacity="0.18"/>
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <line x1="11.4" y1="18.8" x2="11.2" y2="19.8"/>
    <line x1="11.9" y1="20.1" x2="11.9" y2="21.9"/>
    <line x1="18.1" y1="18.6" x2="17.9" y2="20.4"/>
    <line x1="18.2" y1="19.7" x2="18.4" y2="21.5"/>
  </g>
  <g fill="url(#poodle-facing-left-moving-fill)">
    <circle cx="11.2" cy="19.8" r="1"/>
    <circle cx="11.9" cy="21.9" r="1"/>
    <circle cx="17.9" cy="20.4" r="1"/>
    <circle cx="18.4" cy="21.5" r="1"/>
  </g>
  <rect x="20.1" y="13.4" width="2.2" height="6" rx="1.1" fill="url(#poodle-facing-left-moving-fill)"/>
  <circle cx="21.2" cy="12.4" r="1.5" fill="url(#poodle-facing-left-moving-fill)"/>
  <circle cx="6.2" cy="8.7" r="4" fill="url(#poodle-facing-left-moving-fill)"/>
  <g fill="url(#poodle-facing-left-moving-fill)">
    <circle cx="3" cy="5.6" r="1.6"/>
    <circle cx="6" cy="3.9" r="1.7"/>
    <circle cx="8.6" cy="5.7" r="1.4"/>
  </g>
  <ellipse cx="1.9" cy="8.9" rx="0.6" ry="0.5" fill="#1c1c1c"/>
  <ellipse cx="4.8" cy="7.7" rx="0.5" ry="0.6" fill="#1c1c1c"/>
  <ellipse cx="7.2" cy="6.3" rx="1.2" ry="0.9" fill="#ffffff" opacity="0.32"/>
  <ellipse cx="10.8" cy="12.8" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 5.8
cy = 8.1
scale = 2.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
