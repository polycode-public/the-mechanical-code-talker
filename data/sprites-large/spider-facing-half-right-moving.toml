# spider-facing-half-right-moving —
# spider-facing-half-left-moving.toml's mid-scuttle three-quarter turn
# mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["spider"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="spider-facing-half-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round">
      <path d="M10.7 10.46 L8.5 6.5"/>
      <path d="M12.2 12.06 L9.8 8.5"/>
      <path d="M13.7 13.66 L14 10"/>
      <path d="M15.2 15.26 L16.5 13"/>
    </g>
    <ellipse cx="15.8" cy="15.9" rx="5" ry="4.6" fill="url(#spider-facing-half-right-moving-fill)"/>
    <ellipse cx="14.1" cy="14.2" rx="1.7" ry="1.3" fill="#000000" opacity="0.2"/>
    <path d="M15.8 12.7 L18 15.5 L15.8 15.9 L13.6 15.5 Z" fill="color-mix(in srgb, currentColor 80%, black)" opacity="0.55"/>
    <ellipse cx="20.6" cy="16.7" rx="0.85" ry="0.65" fill="#1c1c1c"/>
    <circle cx="9.8" cy="9.5" r="2.9" fill="url(#spider-facing-half-right-moving-fill)"/>
    <ellipse cx="8.9" cy="8.6" rx="1.05" ry="0.8" fill="#ffffff" opacity="0.32"/>
    <g stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round">
      <path d="M10.7 10.46 L5 13"/>
      <path d="M12.2 12.06 L9.5 19"/>
      <path d="M13.7 13.66 L9 20"/>
      <path d="M15.2 15.26 L17.5 21.5"/>
    </g>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

# spider-facing-half-left-moving.toml's anchor reflected across the canvas
# midline (cx = 24 - 9.8); cy and scale are the mirror's own invariants.
[face]
cx = 14.2
cy = 9.5
scale = 2.4

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
