# rabbit — the sprite tier's own long-eared creature: two long, narrow,
# outward-splayed ears carry the silhouette's whole identity. The pale pink
# inner ear, nose and eye are fixed the way vole.toml fixes its own eye bead
# and ear lining — small accents, not the coat, which stays currentColor.
# Whiskers and two forepaws break the round-blob outline the old version
# had no limbs to interrupt.
classes = ["rabbit"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="rabbit-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="9" cy="5.4" rx="1.5" ry="4.8" fill="url(#rabbit-fill)" transform="rotate(-14 9 5.4)"/>
  <ellipse cx="13.4" cy="5.4" rx="1.5" ry="4.8" fill="url(#rabbit-fill)" transform="rotate(14 13.4 5.4)"/>
  <ellipse cx="9" cy="5.8" rx="0.65" ry="3.2" fill="#e3aca6" opacity="0.7" transform="rotate(-14 9 5.8)"/>
  <ellipse cx="13.4" cy="5.8" rx="0.65" ry="3.2" fill="#e3aca6" opacity="0.7" transform="rotate(14 13.4 5.8)"/>
  <ellipse cx="12" cy="16" rx="6" ry="5.4" fill="url(#rabbit-fill)"/>
  <circle cx="10.4" cy="9.6" r="4.2" fill="url(#rabbit-fill)"/>
  <circle cx="18" cy="17.6" r="1.8" fill="url(#rabbit-fill)"/>
  <g fill="url(#rabbit-fill)">
    <ellipse cx="7.2" cy="18.4" rx="1.4" ry="1.7"/>
    <ellipse cx="15.6" cy="20.2" rx="1.4" ry="1.7"/>
  </g>
  <circle cx="9" cy="9" r="0.7" fill="#1c1c1c"/>
  <circle cx="8.8" cy="8.76" r="0.24" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="10.4" cy="11" rx="0.6" ry="0.4" fill="#e3aca6"/>
  <g stroke="#1c1c1c" stroke-width="0.2" opacity="0.4" stroke-linecap="round">
    <path d="M9.8 11.2 L6.6 10.6"/>
    <path d="M9.8 11.6 L6.6 12"/>
    <path d="M11 11.6 L13.6 12.6"/>
  </g>
  <ellipse cx="8.6" cy="12.6" rx="2.4" ry="1.4" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="9.4" cy="8.6" rx="1.1" ry="0.8" fill="#ffffff" opacity="0.3"/>
</svg>
"""
