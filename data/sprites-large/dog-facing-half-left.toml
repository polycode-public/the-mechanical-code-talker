# dog-facing-half-left — the floppy-eared dog turned three-quarters from
# the full left profile toward the front. The head sits at the midpoint
# between the two views, the snout projects only half as far past the
# head's edge and dips down instead of pointing straight out, and a
# second, smaller far eye appears near the head's right edge so both eyes
# read at once. The body, legs and tail keep the profile's own shapes,
# shifted right by the same 0.2 units the head moved.
classes = ["dog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="dog-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13.8" cy="15" rx="6.2" ry="4.2" fill="url(#dog-facing-half-left-fill)"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="8.6" y1="18.4" x2="8.4" y2="21.6"/>
    <line x1="11.4" y1="19.2" x2="11.4" y2="22"/>
    <line x1="15.6" y1="19.2" x2="15.8" y2="22"/>
    <line x1="18.4" y1="18.2" x2="18.8" y2="21.4"/>
  </g>
  <g fill="url(#dog-facing-half-left-fill)">
    <ellipse cx="8.4" cy="21.9" rx="0.9" ry="0.55"/>
    <ellipse cx="11.4" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="15.8" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="18.8" cy="21.7" rx="0.9" ry="0.55"/>
  </g>
  <path d="M19.6 12.8 C22.4 11.4 23 14.4 20.6 15.4 Z" fill="url(#dog-facing-half-left-fill)"/>
  <path d="M9.2 6.7 L10 4.5 L7.8 5.3 Z" fill="url(#dog-facing-half-left-fill)"/>
  <circle cx="6.8" cy="9" r="3.6" fill="url(#dog-facing-half-left-fill)"/>
  <path d="M4.4 6.6 L2 2.9 L6.2 5 Z" fill="url(#dog-facing-half-left-fill)"/>
  <path d="M6.4 8 L3 9.4 L6.4 10.6 Z" fill="url(#dog-facing-half-left-fill)"/>
  <ellipse cx="8.3" cy="8.8" rx="0.9" ry="1.1" fill="#000000" opacity="0.22"/>
  <ellipse cx="5.4" cy="7.9" rx="0.55" ry="0.6" fill="#1c1c1c"/>
  <ellipse cx="9.5" cy="7.9" rx="0.35" ry="0.4" fill="#1c1c1c"/>
  <ellipse cx="3" cy="9.4" rx="0.5" ry="0.4" fill="#1c1c1c"/>
  <ellipse cx="10.6" cy="12.6" rx="2.4" ry="1.4" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="5.8" cy="6.9" rx="1.1" ry="0.8" fill="#ffffff" opacity="0.32"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# The head sits at cx=6.8 cy=9 r=3.6 (the geometry table's half-left row),
# so scale is 0.825 * 3.6 = 3.0. The near eye this file draws sits at
# (5.4, 7.9), the profile's own forward eye shifted right by the head's own
# 0.2-unit move. cx = 5.4 + 0.4*3.0 = 6.6 and cy = 7.9 + 0.15*3.0 = 8.35.
[face]
cx = 6.6
cy = 8.35
scale = 3.0

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
