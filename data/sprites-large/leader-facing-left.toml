# leader-facing-left — leader-with-emotion.toml's figure turned to a left
# profile: the head shifts toward the left shoulder, a nose wedge breaks
# the head's left silhouette, and a single forward eye replaces the
# front-facing pair. Unlike the other person-role classes, leader has no
# separate right-arm cape — its torso and raised pointing arm are one
# combined path, kept exactly as leader-with-emotion.toml draws it across
# every profile, the same way king kept its crown and ermine collar
# unchanged in shape: the rosette and the pointing-arm's own shadow stroke
# are shoulder/arm props, not head props, so a head turn does not move
# them. Selected only when the instance's own mgx:faces fact says "left".
classes = ["leader"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="leader-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#leader-facing-left-fill)">
    <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
    <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C13.6 12.8 15 13.5 16 14.8 L21 11.4 L21.8 12.7 L16.8 16.6 C17.5 18 18 19.6 18 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <circle cx="9.4" cy="13.9" r="0.7" fill="#2a4d7a"/>
  <circle cx="9.4" cy="13.9" r="0.32" fill="#1c3355"/>
  <circle cx="11.4" cy="6.6" r="3.3" fill="url(#leader-facing-left-fill)"/>
  <path d="M8.3 6 Q7.05 7 8.3 8.05 Z" fill="url(#leader-facing-left-fill)"/>
  <ellipse cx="9.7" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 13.9 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M16 14.8 L20.2 11.9" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.25" stroke-linecap="round"/>
  <path d="M9.0 4.2 C9.7 3.6 10.5 3.4 11.4 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from leader's own front head circle (cx=12 cy=6.6 r=3.3, same as
# king's): the head shifts left to cx=11.4, and the forward eye this file
# draws sits at (9.7, 6.1). scale is ~0.65 of the head radius, and cx/cy
# place the fragment so its own forward eye lands on the drawn one.
[face]
cx = 10.5
cy = 6.4
scale = 2.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
