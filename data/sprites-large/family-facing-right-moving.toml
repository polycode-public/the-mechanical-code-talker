# family-facing-right-moving — family-facing-left-moving.toml mirrored
# across the canvas midline, the same flip-group pattern the standing pair
# uses.
classes = ["family"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="family-facing-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M8.5 7.4 C9.7 8.7 9.9 10.9 8.9 13.3" fill="none" stroke="url(#family-facing-right-moving-fill)" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M2.7 7.4 C1.5 8.7 1.4 10.9 2.3 13.3" fill="none" stroke="url(#family-facing-right-moving-fill)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="5.6" cy="8.4" r="2.7" fill="url(#family-facing-right-moving-fill)"/>
    <path d="M2 22 C2 17.3 3.6 15.1 5.6 15.1 C7.6 15.1 9.2 17.3 9.2 22 Z" fill="url(#family-facing-right-moving-fill)"/>
    <path d="M4.3 14.9 L5.6 16 L6.9 14.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18.4" cy="8.4" r="2.7" fill="url(#family-facing-right-moving-fill)"/>
    <path d="M14.8 22 C14.8 17.3 16.4 15.1 18.4 15.1 C20.4 15.1 22 17.3 22 22 Z" fill="url(#family-facing-right-moving-fill)"/>
    <path d="M17.1 14.9 L18.4 16 L19.7 14.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8.58 22 C8.46 18.52 9.8 16.66 11.82 16.66 C14.08 16.66 15.36 18.1 15.06 21.16 Z" fill="url(#family-facing-right-moving-fill)"/>
    <path d="M11.1 16.4 L12 17.1 L12.9 16.4" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="11.58" cy="11.4" r="2.3" fill="url(#family-facing-right-moving-fill)"/>
    <path d="M9.42 10.98 Q8.55 11.68 9.42 12.41 Z" fill="url(#family-facing-right-moving-fill)"/>
    <ellipse cx="10.4" cy="11.05" rx="0.2" ry="0.24" fill="#1c1c1c"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 13.02
cy = 11.27
scale = 1.46

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
