# elephant-facing-half-left-moving — elephant-facing-half-left.toml's own
# three-quarter turn caught mid-stride. The head, ear, trunk, eyes and face
# anchor stay exactly as that file draws them. What moves: the four legs
# pair up into the same ambling gait as the full profile's moving file, the
# body dips slightly, and the trunk swings forward.
classes = ["elephant"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="elephant-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="11.4" cy="7" rx="3.2" ry="3.7" fill="url(#elephant-facing-half-left-moving-fill)" opacity="0.55"/>
  <ellipse cx="16.6" cy="15.8" rx="7.2" ry="5.2" fill="url(#elephant-facing-half-left-moving-fill)"/>
  <g fill="url(#elephant-facing-half-left-moving-fill)">
    <rect x="10.2" y="17.6" width="2" height="2.8" rx="1"/>
    <rect x="14" y="17.8" width="2" height="2.8" rx="1"/>
    <rect x="18.8" y="19.6" width="2" height="3.2" rx="1"/>
    <rect x="22" y="19.4" width="2" height="3.2" rx="1"/>
  </g>
  <ellipse cx="23.8" cy="12.8" rx="1" ry="1.3" fill="url(#elephant-facing-half-left-moving-fill)"/>
  <circle cx="8.6" cy="9.2" r="4.05" fill="url(#elephant-facing-half-left-moving-fill)"/>
  <path d="M6.3 12.4 C5.5 12.8 5.1 13.6 5.3 14.4 C5.8 13.9 6.2 13.2 6.5 12.5 Z" fill="#f4ecd8"/>
  <path d="M6.5 12.6 C4.9 13 4.1 14.8 4.6 16.4 C4.9 17.2 5.8 17.3 5.9 16.5 C5.4 15.6 5.2 14.4 5.7 13.2 C5.9 13 6.2 12.8 6.5 12.6 Z" fill="url(#elephant-facing-half-left-moving-fill)"/>
  <ellipse cx="10.5" cy="8.9" rx="0.3" ry="0.38" fill="#1c1c1c"/>
  <ellipse cx="6.7" cy="8.4" rx="0.55" ry="0.65" fill="#1c1c1c"/>
  <ellipse cx="9.6" cy="6.8" rx="1.3" ry="1" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="13.6" cy="14" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 8.04
cy = 8.90
scale = 3.34

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
