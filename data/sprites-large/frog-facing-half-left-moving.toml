# frog-facing-half-left-moving — frog-facing-half-left.toml's own
# three-quarter turn caught mid hop. The eyes, snout and face anchor stay
# exactly as that file draws them. What moves: the two resting leg lobes
# stretch into kicked-out, extended legs trailing behind and below, and
# the body dips slightly into the launch.
classes = ["frog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="frog-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#a8d068"/>
      <stop offset="55%" stop-color="#5a9040"/>
      <stop offset="100%" stop-color="#2f5322"/>
    </linearGradient>
  </defs>
  <ellipse cx="13.2" cy="15.4" rx="7.4" ry="5.3" fill="url(#frog-facing-half-left-moving-fill)"/>
  <ellipse cx="17.6" cy="19.6" rx="4" ry="1.7" fill="url(#frog-facing-half-left-moving-fill)" transform="rotate(-16 17.6 19.6)"/>
  <ellipse cx="20.8" cy="17" rx="2.9" ry="1.3" fill="url(#frog-facing-half-left-moving-fill)" transform="rotate(-22 20.8 17)"/>
  <g stroke="#2f5322" stroke-width="0.9" stroke-linecap="round">
    <path d="M21.2 19 L22.1 19.8"/><path d="M20.9 20.5 L21.6 21.5"/>
  </g>
  <ellipse cx="10.4" cy="17.1" rx="2.6" ry="1.7" fill="#dcead0" opacity="0.55"/>
  <ellipse cx="9" cy="13.5" rx="1.4" ry="0.95" fill="#2f5322" opacity="0.4"/>
  <ellipse cx="15" cy="13.4" rx="1" ry="0.7" fill="#2f5322" opacity="0.3"/>
  <circle cx="11.8" cy="8.5" r="1.8" fill="url(#frog-facing-half-left-moving-fill)"/>
  <circle cx="11.8" cy="8.3" r="1.3" fill="#f4ecd8"/>
  <circle cx="7.4" cy="8.7" r="2.6" fill="url(#frog-facing-half-left-moving-fill)"/>
  <circle cx="7.4" cy="8.5" r="1.9" fill="#f4ecd8"/>
  <path d="M5.2 9.4 C4.2 9.6 4 10.2 4.6 10.7 C5.2 11 5.9 10.2 5.2 9.4 Z" fill="#5a9040"/>
  <ellipse cx="11" cy="13.9" rx="2.4" ry="1.3" fill="#ffffff" opacity="0.22"/>
  <ellipse cx="6.2" cy="7.6" rx="0.55" ry="0.42" fill="#ffffff" opacity="0.6"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 8.19
cy = 8.80
scale = 1.97

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
