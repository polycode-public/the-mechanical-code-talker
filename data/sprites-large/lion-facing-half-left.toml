# lion-facing-half-left — the lion turned three-quarters, halfway between
# lion-facing-left.toml's full profile and lion-with-emotion.toml's front
# view. The head keeps the profile file's own head radius, only its
# position shifts toward centre; the mane thins only slightly on the near
# side, since a shallower turn still shows most of the sunburst; the jaw
# bump projects only about half as far past the head's edge as the full
# profile's does; and a small far eye now shows alongside the near eye —
# the cue that reads as a turned head rather than a flat profile. The body,
# legs and tail keep the profile file's own shapes, shifted right by the
# same amount the head moved.
classes = ["lion"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="lion-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="14" cy="15.7" rx="6.4" ry="4.4" fill="url(#lion-facing-half-left-fill)"/>
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <line x1="9.55" y1="19.2" x2="9.55" y2="22"/>
    <line x1="12.35" y1="19.8" x2="12.35" y2="22"/>
    <line x1="15.55" y1="19.8" x2="15.55" y2="22"/>
    <line x1="18.35" y1="19.2" x2="18.35" y2="22"/>
  </g>
  <g fill="color-mix(in srgb, currentColor 55%, black)">
    <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z"/>
    <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(40 7.5 8.2)"/>
    <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(80 7.5 8.2)"/>
    <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(120 7.5 8.2)"/>
    <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(160 7.5 8.2)"/>
    <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(200 7.5 8.2)"/>
    <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(240 7.5 8.2)"/>
    <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(320 7.5 8.2)"/>
  </g>
  <circle cx="7.5" cy="8.2" r="3.86" fill="url(#lion-facing-half-left-fill)"/>
  <path d="M4.9 5.8 L4.1 3.4 L6.7 5.2 Z" fill="url(#lion-facing-half-left-fill)"/>
  <path d="M9.7 5.5 L10.1 4.4 L9 5.1 Z" fill="url(#lion-facing-half-left-fill)"/>
  <path d="M5.4 9.4 C4.8 9.6 4.5 10 4.6 10.4 C5 10.2 5.3 9.8 5.5 9.4 Z" fill="url(#lion-facing-half-left-fill)"/>
  <path d="M20 13.6 C23 13 24 15.8 21.6 17 C20.6 16.4 19.8 15.2 19.6 13.9 Z" fill="url(#lion-facing-half-left-fill)"/>
  <ellipse cx="9" cy="8.3" rx="0.3" ry="0.38" fill="#1c1c1c"/>
  <ellipse cx="6" cy="7.9" rx="0.55" ry="0.65" fill="#1c1c1c"/>
  <ellipse cx="10.55" cy="12.8" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="5.9" cy="6.6" rx="1.1" ry="0.8" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# Half scale is 0.825 * head radius 3.86 = 3.18, the table's own halfway
# point between the front view's 1.0*r and the profile's 0.65*r. The near
# eye drawn above sits at (6, 7.9), so cx = 6 + 0.4*3.18 = 7.27 and
# cy = 7.9 + 0.15*3.18 = 8.38, landing the shared face fragment's own near
# eye on top of it.
[face]
cx = 7.27
cy = 8.38
scale = 3.18

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
