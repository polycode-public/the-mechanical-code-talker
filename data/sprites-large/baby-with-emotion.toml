# baby-with-emotion — same swaddled-bundle silhouette as baby.toml, plus a
# required [face] anchor and a {{FACE}} placeholder that resolves to
# whichever of the 6 curated mgx:feels words the instance's own fact names.
# No mgx:feels fact falls through to the plain baby.toml sprite.
classes = ["baby"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="baby-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M7.2 21 C6.6 15.6 8 12.4 12 12.4 C16 12.4 17.4 15.6 16.8 21 C16.8 21 14.6 22 12 22 C9.4 22 7.2 21 7.2 21 Z" fill="url(#baby-with-emotion-fill)"/>
  <circle cx="12" cy="7.4" r="3.8" fill="url(#baby-with-emotion-fill)"/>
  <path d="M9 12.9 L12 15.4 L15 12.9" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9.6 4.8 C10.3 4.2 11.1 4 12 4.1" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r baby.toml's own head circle declares.
[face]
cx = 12
cy = 7.4
scale = 3.8

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
