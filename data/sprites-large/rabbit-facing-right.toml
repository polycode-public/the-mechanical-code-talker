# rabbit-facing-right — rabbit-facing-left.toml's profile mirrored across
# the canvas midline (every shape wrapped in one translate-then-flip group),
# so the two directions stay geometrically identical twins. The mirror flips
# the lit corner of the shared gradient along with the pose, which reads as
# the same rabbit turned around under the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["rabbit"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="rabbit-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="13.4" cy="16.2" rx="5.8" ry="5.2" fill="url(#rabbit-facing-right-fill)"/>
    <circle cx="20.4" cy="17.7" r="1.8" fill="url(#rabbit-facing-right-fill)"/>
    <ellipse cx="13" cy="20.5" rx="1.3" ry="1.6" fill="url(#rabbit-facing-right-fill)"/>
    <ellipse cx="9.4" cy="19.7" rx="1.5" ry="1.8" fill="url(#rabbit-facing-right-fill)"/>
    <ellipse cx="7.6" cy="4.4" rx="1.3" ry="4" fill="url(#rabbit-facing-right-fill)" opacity="0.88" transform="rotate(22 7.6 4.4)"/>
    <ellipse cx="5" cy="3.9" rx="1.4" ry="4.6" fill="url(#rabbit-facing-right-fill)" transform="rotate(14 5 3.9)"/>
    <ellipse cx="5" cy="4.3" rx="0.6" ry="3" fill="#e3aca6" opacity="0.7" transform="rotate(14 5 4.3)"/>
    <circle cx="6.4" cy="9.4" r="3.9" fill="url(#rabbit-facing-right-fill)"/>
    <ellipse cx="3" cy="10.7" rx="1.7" ry="1.3" fill="#e3aca6" opacity="0.55"/>
    <circle cx="1.7" cy="10.4" r="0.45" fill="#1c1c1c"/>
    <ellipse cx="4.6" cy="8.5" rx="0.55" ry="0.68" fill="#1c1c1c"/>
    <g stroke="#1c1c1c" stroke-width="0.2" opacity="0.4" stroke-linecap="round">
      <path d="M3.4 10.2 L0.3 9.4"/>
      <path d="M3.4 10.7 L0.1 10.7"/>
      <path d="M3.6 11.2 L0.5 12"/>
    </g>
    <ellipse cx="7.3" cy="7.2" rx="1.3" ry="0.95" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="10.8" cy="13.6" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# rabbit-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 5.62); cy and scale are the mirror's own invariants. Because the
# fragment sits outside the flip group, these are plain unflipped canvas
# coordinates.
[face]
cx = 18.38
cy = 8.88
scale = 2.54

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
