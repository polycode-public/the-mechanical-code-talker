# family — three figures rather than one: two adult-scale silhouettes
# flanking a shorter, child-scale one between them, all fully opaque
# (distinct individuals, not a background). The height difference alone
# is the differentiator — crowd.toml's own figures are the same height
# but faded, since a crowd is anonymous and a family is not.
classes = ["family"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="family-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="5.6" cy="8.4" r="2.7" fill="url(#family-fill)"/>
  <path d="M2 22 C2 17.3 3.6 15.1 5.6 15.1 C7.6 15.1 9.2 17.3 9.2 22 Z" fill="url(#family-fill)"/>
  <circle cx="18.4" cy="8.4" r="2.7" fill="url(#family-fill)"/>
  <path d="M14.8 22 C14.8 17.3 16.4 15.1 18.4 15.1 C20.4 15.1 22 17.3 22 22 Z" fill="url(#family-fill)"/>
  <circle cx="12" cy="11.4" r="2.3" fill="url(#family-fill)"/>
  <path d="M8.4 22 C8.4 18.4 9.8 16.6 12 16.6 C14.2 16.6 15.6 18.4 15.6 22 Z" fill="url(#family-fill)"/>
</svg>
"""
