# family — three figures rather than one: two adult-scale silhouettes
# flanking a shorter, child-scale one between them, all fully opaque
# (distinct individuals, not a background). Each figure now carries a
# small neck-and-collar notch matching the pack's own adult/child body
# language, and the left adult carries a hair silhouette so the group
# reads as parent-parent-child rather than three anonymous clones. The
# height difference alone was already the differentiator against
# crowd.toml's own same-height, faded figures — a crowd is anonymous and a
# family is not.
classes = ["family"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="family-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M8.5 7.4 C9.7 8.7 9.9 10.9 8.9 13.3" fill="none" stroke="url(#family-fill)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M2.7 7.4 C1.5 8.7 1.4 10.9 2.3 13.3" fill="none" stroke="url(#family-fill)" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="5.6" cy="8.4" r="2.7" fill="url(#family-fill)"/>
  <path d="M2 22 C2 17.3 3.6 15.1 5.6 15.1 C7.6 15.1 9.2 17.3 9.2 22 Z" fill="url(#family-fill)"/>
  <path d="M4.3 14.9 L5.6 16 L6.9 14.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18.4" cy="8.4" r="2.7" fill="url(#family-fill)"/>
  <path d="M14.8 22 C14.8 17.3 16.4 15.1 18.4 15.1 C20.4 15.1 22 17.3 22 22 Z" fill="url(#family-fill)"/>
  <path d="M17.1 14.9 L18.4 16 L19.7 14.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="11.4" r="2.3" fill="url(#family-fill)"/>
  <path d="M8.4 22 C8.4 18.4 9.8 16.6 12 16.6 C14.2 16.6 15.6 18.4 15.6 22 Z" fill="url(#family-fill)"/>
  <path d="M11.1 16.4 L12 17.1 L12.9 16.4" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
