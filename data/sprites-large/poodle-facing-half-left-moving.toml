# poodle-facing-half-left-moving — poodle-facing-half-left.toml's own
# three-quarter turn caught mid-stride. The head, curls, nose and both eyes
# stay exactly as that file draws them, since a head does not change shape
# mid-stride. What moves: the four legs spread into a diagonal trot, the
# near pair swung forward and lifted, the far pair trailing low and back;
# the body dips down slightly under the stride; and the pompom tail lifts
# and swings up and back.
classes = ["poodle"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="poodle-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="16.7" cy="15.6" rx="6.2" ry="4.6" fill="url(#poodle-facing-half-left-moving-fill)"/>
  <ellipse cx="14.5" cy="13.8" rx="1.8" ry="1.3" fill="#000000" opacity="0.18"/>
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <line x1="13.7" y1="18.8" x2="13.5" y2="19.8"/>
    <line x1="14.2" y1="20.1" x2="14.2" y2="21.9"/>
    <line x1="20.4" y1="18.6" x2="20.2" y2="20.4"/>
    <line x1="20.5" y1="19.7" x2="20.7" y2="21.5"/>
  </g>
  <g fill="url(#poodle-facing-half-left-moving-fill)">
    <circle cx="13.5" cy="19.8" r="1"/>
    <circle cx="14.2" cy="21.9" r="1"/>
    <circle cx="20.2" cy="20.4" r="1"/>
    <circle cx="20.7" cy="21.5" r="1"/>
  </g>
  <rect x="22.4" y="13.4" width="2.2" height="6" rx="1.1" fill="url(#poodle-facing-half-left-moving-fill)"/>
  <circle cx="23.5" cy="12.4" r="1.5" fill="url(#poodle-facing-half-left-moving-fill)"/>
  <circle cx="8.5" cy="8.8" r="4" fill="url(#poodle-facing-half-left-moving-fill)"/>
  <g fill="url(#poodle-facing-half-left-moving-fill)">
    <circle cx="5.3" cy="5.8" r="1.6"/>
    <circle cx="8.3" cy="4.1" r="1.7"/>
    <circle cx="10.9" cy="5.2" r="1.1"/>
  </g>
  <ellipse cx="4.7" cy="9.5" rx="0.5" ry="0.42" fill="#1c1c1c"/>
  <ellipse cx="7.7" cy="7.9" rx="0.5" ry="0.6" fill="#1c1c1c"/>
  <ellipse cx="10.4" cy="8.2" rx="0.3" ry="0.37" fill="#1c1c1c"/>
  <ellipse cx="9.5" cy="6.5" rx="1" ry="0.8" fill="#ffffff" opacity="0.32"/>
  <ellipse cx="13.1" cy="12.8" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 9.0
cy = 8.4
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
