# crowd-with-emotion — same three-figure composite as crowd.toml, plus a
# required [face] anchor and a {{FACE}} placeholder that resolves to
# whichever of the 6 curated mgx:feels words the instance's own fact names.
# No mgx:feels fact falls through to the plain crowd.toml sprite.
#
# Judgment call: crowd.toml fades the two flanking figures (opacity 0.6)
# and draws the center figure (cx=12 cy=7.6 r=3) at full opacity, last (on
# top) — the file's own header comment reads this as the anonymous-many
# framing. The face anchors on that center, frontmost figure only.
classes = ["crowd"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="crowd-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g opacity="0.6">
    <circle cx="5.2" cy="9.6" r="2.5" fill="url(#crowd-with-emotion-fill)"/>
    <path d="M1.4 22 C1.4 17.8 3 15.9 5.2 15.9 C7.4 15.9 9 17.8 9 22 Z" fill="url(#crowd-with-emotion-fill)"/>
  </g>
  <g opacity="0.6">
    <circle cx="18.8" cy="9.6" r="2.5" fill="url(#crowd-with-emotion-fill)"/>
    <path d="M15 22 C15 17.8 16.6 15.9 18.8 15.9 C21 15.9 22.6 17.8 22.6 22 Z" fill="url(#crowd-with-emotion-fill)"/>
  </g>
  <circle cx="12" cy="7.6" r="3" fill="url(#crowd-with-emotion-fill)"/>
  <path d="M6.8 22 C6.8 17.1 9 14.9 12 14.9 C15 14.9 17.2 17.1 17.2 22 Z" fill="url(#crowd-with-emotion-fill)"/>
  {{FACE}}
</svg>
"""

# The center figure's own cx/cy/r — the frontmost figure in the composite.
[face]
cx = 12
cy = 7.6
scale = 3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
