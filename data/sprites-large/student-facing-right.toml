# student-facing-right — student-facing-left.toml's profile mirrored
# across the canvas midline (every shape wrapped in one translate-then-flip
# group), so the two directions stay geometrically identical twins.
# {{FACE}} sits outside the flip group, so the resolved face fragment is
# never mirrored.
classes = ["student"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="student-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#student-facing-right-fill)">
      <path d="M9.4 13.4 C7.6 13.5 5.9 15 5.6 17.7 C5.5 19.1 6.2 20 7.2 19.5 C7.3 17.4 7.9 15.4 9.7 14.5 Z"/>
      <path d="M14.6 13.4 C16.4 13.5 18.1 15 18.4 17.7 C18.5 19.1 17.8 20 16.8 19.5 C16.7 17.4 16.1 15.4 14.3 14.5 Z"/>
      <path d="M6 21 C6 15.5 8.7 13.1 12 13.1 C15.3 13.1 18 15.5 18 21 Z"/>
      <path d="M10.75 11.3 L13.25 11.3 L13.05 13.3 L10.95 13.3 Z"/>
    </g>
    <g transform="rotate(-14 11.44 5.3)">
      <path d="M8.64 4.9 C8.64 3.2 9.84 2 11.44 2 C13.04 2 14.24 3.2 14.24 4.9 L14.24 5.4 L8.64 5.4 Z" fill="url(#student-facing-right-fill)" opacity="0.92"/>
      <rect x="6.04" y="4.6" width="10.8" height="1.4" rx="0.2" fill="url(#student-facing-right-fill)"/>
    </g>
    <path d="M16.44 5.4 L17.04 8.6" stroke="currentColor" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
    <circle cx="17.04" cy="8.8" r="0.6" fill="#d4a72c"/>
    <circle cx="11.44" cy="8.6" r="3.1" fill="url(#student-facing-right-fill)"/>
    <path d="M8.53 8.04 Q7.35 8.97 8.53 9.96 Z" fill="url(#student-facing-right-fill)"/>
    <ellipse cx="9.84" cy="8.13" rx="0.26" ry="0.31" fill="#1c1c1c"/>
    <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# student-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 10.65); cy and scale are the mirror's own invariants.
[face]
cx = 13.35
cy = 8.43
scale = 2.02

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
