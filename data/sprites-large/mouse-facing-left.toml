# mouse-facing-left — the same round-bodied, big-eared mouse as mouse.toml
# turned to a left profile: the body blob's nose tip and whiskers break the
# silhouette's left edge, the near ear reads larger and forward while the
# far ear peeks out behind it, and the curled tail closes the right side.
# Selected only when the instance's own mgx:faces fact says "left". It also
# carries the shared face-fragment mechanism, so a mouse taught BOTH
# mgx:faces = left and one of the 6 mgx:feels words renders this profile
# wearing that mood; taught only the facing, {{FACE}} resolves to nothing
# and the profile keeps the single forward eye it draws itself.
classes = ["mouse"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="mouse-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M2.4 15 C2 12 3.8 9.6 7.2 9.4 C11.4 9.1 15.6 9.6 18 12.2 C20.4 14.6 20.2 18.4 17.4 20.4 C14.6 22.2 9 22.4 5.6 21 C2.8 19.8 2.8 17.4 2.4 15 Z" fill="url(#mouse-facing-left-fill)"/>
  <circle cx="10.4" cy="5.2" r="1.3" fill="url(#mouse-facing-left-fill)"/>
  <circle cx="5.6" cy="5.8" r="3" fill="url(#mouse-facing-left-fill)"/>
  <path d="M17.8 19 C21.6 19.8 22.2 15.8 20 14 C20.8 16.6 19.4 18.4 17.8 19 Z" fill="url(#mouse-facing-left-fill)"/>
  <ellipse cx="2.8" cy="14.6" rx="0.8" ry="0.6" fill="#c98c8c" opacity="0.7"/>
  <g stroke="#000000" stroke-width="0.35" opacity="0.4">
    <path d="M2.6 14.2 L0.2 13.2"/>
    <path d="M2.6 15 L0.2 16"/>
  </g>
  <ellipse cx="4.6" cy="12.6" rx="0.55" ry="0.65" fill="#000000" opacity="0.6"/>
  <ellipse cx="14.8" cy="17.4" rx="3" ry="1.6" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="4.6" cy="4.8" rx="0.9" ry="0.7" fill="#ffffff" opacity="0.35"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from THIS file's own profile geometry, not copied from
# mouse-with-emotion.toml's front-facing anchor (cx=12.3 cy=11.3 scale=3):
# mouse has no head circle (both mouse.toml circles are ears, the same
# reason mouse-with-emotion.toml anchors on the body blob's own bulge), so
# the profile's near ear stands in for the "head radius" bear/cat/dog use —
# it is the biggest circle near the face, cx=5.6 cy=5.8 r=3. scale is 0.65
# of that radius (0.65 * 3 = 1.95), the same ratio the reference classes use
# to pull the fragment's two eyes closer together than a front view. cx/cy
# then add a small forward-and-down offset to the drawn eye at (4.6, 12.6)
# so the fragment's own forward eye lands on top of it.
[face]
cx = 5.5
cy = 12.95
scale = 1.95

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
