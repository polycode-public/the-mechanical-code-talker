# sheep-facing-half-left — the sheep turned three-quarters, halfway between
# sheep-facing-left.toml's full profile and sheep-with-emotion.toml's front
# view. The whole composition (face, ears, wool, legs, tail nub) is
# sheep-facing-left.toml's own profile shifted right by the same 2.2 units,
# so the head reads at the midpoint position exactly the way
# bear-facing-half-left.toml shifts its own profile body rightward. The far
# ear, nearly hidden in the full profile, is enlarged here so it reads past
# the near ear's edge — the cue that this is a turned head rather than a
# flat profile.
classes = ["sheep"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="sheep-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g stroke="#3a352f" stroke-width="1.5" stroke-linecap="round">
    <line x1="11.6" y1="18.2" x2="11.6" y2="21.4"/>
    <line x1="13.8" y1="18.8" x2="13.8" y2="22"/>
    <line x1="18.2" y1="18.4" x2="18.2" y2="21.6"/>
    <line x1="20.4" y1="17.8" x2="20.4" y2="21"/>
  </g>
  <g fill="url(#sheep-facing-half-left-fill)">
    <circle cx="13.4" cy="12.6" r="3.4"/>
    <circle cx="17.2" cy="11" r="3.8"/>
    <circle cx="20.7" cy="12.4" r="3"/>
    <circle cx="15" cy="15.4" r="3.6"/>
    <circle cx="19.2" cy="15.4" r="3.2"/>
    <circle cx="22.8" cy="13.6" r="1"/>
  </g>
  <g stroke="color-mix(in srgb, currentColor 40%, black)" stroke-width="0.4" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M14.2 10.4 C14.8 9.8 15.6 9.8 16.2 10.2"/>
    <path d="M18.2 9 C18.8 8.6 19.6 8.7 20.1 9.2"/>
    <path d="M20.8 11 C21.3 10.6 22 10.7 22.4 11.2"/>
  </g>
  <ellipse cx="7.8" cy="9.5" rx="0.95" ry="1.3" fill="#3a352f" transform="rotate(20 7.8 9.5)"/>
  <ellipse cx="4.4" cy="9.8" rx="1.1" ry="1.5" fill="#3a352f" transform="rotate(-15 4.4 9.8)"/>
  <ellipse cx="6.2" cy="13" rx="2.6" ry="2.2" fill="#3a352f"/>
  <ellipse cx="17.2" cy="9.2" rx="2.3" ry="1.4" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# Half scale is 0.825 * the profile face-ellipse's own average radius
# (2.4) = 1.98 — the table's own halfway point between the front view's
# 1.0*avg-radius (sheep-with-emotion.toml's scale=2.4) and the profile's
# 0.65*avg-radius (sheep-facing-left.toml's scale=1.56). The face ellipse
# keeps the same rx=2.6/ry=2.2 size the profile draws (the ellipse's own
# size stays constant across the turn, only its position and the ear
# proportions change), shifted to cx=6.2 cy=13 — the profile's cx=4 cy=13
# moved right by the same 2.2 units the whole composition shifted.
[face]
cx = 6.2
cy = 13
scale = 1.98

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
