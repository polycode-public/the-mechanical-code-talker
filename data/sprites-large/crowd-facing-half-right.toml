# crowd-facing-half-right — crowd-facing-half-left.toml's centre-figure
# three-quarter turn mirrored across the canvas midline (the centre figure's
# own shapes wrapped in one translate-then-flip group; the two faded
# flanking figures keep their own front-facing geometry, outside the flip
# group, exactly as crowd-facing-right.toml leaves them). {{FACE}} sits
# outside the flip group too, so the resolved face fragment is never
# mirrored.
classes = ["crowd"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="crowd-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g opacity="0.6">
    <path d="M3.2 14.5 C1.9 14.6 0.6 15.7 0.4 17.8 C0.3 18.8 0.8 19.5 1.6 19.1 C1.6 17.6 2.1 16.0 3.5 15.4 Z" fill="url(#crowd-facing-half-right-fill)"/>
    <path d="M7.2 14.5 C8.5 14.6 9.8 15.7 10.0 17.8 C10.1 18.8 9.6 19.5 8.8 19.1 C8.8 17.6 8.3 16.0 6.9 15.4 Z" fill="url(#crowd-facing-half-right-fill)"/>
    <path d="M1.4 22 C1.4 17.8 3 15.9 5.2 15.9 C7.4 15.9 9 17.8 9 22 Z" fill="url(#crowd-facing-half-right-fill)"/>
    <circle cx="5.2" cy="9.6" r="2.5" fill="url(#crowd-facing-half-right-fill)"/>
  </g>
  <g opacity="0.6">
    <path d="M16.8 14.5 C15.5 14.6 14.2 15.7 14.0 17.8 C13.9 18.8 14.4 19.5 15.2 19.1 C15.2 17.6 15.7 16.0 17.1 15.4 Z" fill="url(#crowd-facing-half-right-fill)"/>
    <path d="M20.8 14.5 C22.1 14.6 23.4 15.7 23.6 17.8 C23.7 18.8 23.2 19.5 22.4 19.1 C22.4 17.6 21.9 16.0 20.5 15.4 Z" fill="url(#crowd-facing-half-right-fill)"/>
    <path d="M15 22 C15 17.8 16.6 15.9 18.8 15.9 C21 15.9 22.6 17.8 22.6 22 Z" fill="url(#crowd-facing-half-right-fill)"/>
    <circle cx="18.8" cy="9.6" r="2.5" fill="url(#crowd-facing-half-right-fill)"/>
  </g>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M9.6 13.5 C8.0 13.6 6.5 15.0 6.2 17.4 C6.1 18.7 6.7 19.5 7.6 19.1 C7.7 17.1 8.3 15.3 9.9 14.5 Z" fill="url(#crowd-facing-half-right-fill)"/>
    <path d="M14.4 13.5 C16.0 13.6 17.5 15.0 17.8 17.4 C17.9 18.7 17.3 19.5 16.4 19.1 C16.3 17.1 15.7 15.3 14.1 14.5 Z" fill="url(#crowd-facing-half-right-fill)"/>
    <path d="M6.8 22 C6.8 17.1 9 14.9 12 14.9 C15 14.9 17.2 17.1 17.2 22 Z" fill="url(#crowd-facing-half-right-fill)"/>
    <ellipse cx="10.5" cy="17.1" rx="1.3" ry="2" fill="#ffffff" opacity="0.1"/>
    <circle cx="11.73" cy="7.6" r="3" fill="url(#crowd-facing-half-right-fill)"/>
    <path d="M8.9 7.15 Q8.3 8.33 8.9 8.96 Z" fill="url(#crowd-facing-half-right-fill)"/>
    <ellipse cx="10.18" cy="7.14" rx="0.25" ry="0.31" fill="#1c1c1c"/>
    <ellipse cx="13.8" cy="7.1" rx="0.16" ry="0.2" fill="#1c1c1c"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# crowd-facing-half-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 11.16); cy and scale are the mirror's own invariants, since the
# fragment sits outside the flip group and never itself gets flipped.
[face]
cx = 12.84
cy = 7.51
scale = 2.45

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
