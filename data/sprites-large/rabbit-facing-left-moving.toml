# rabbit-facing-left-moving — rabbit-facing-left.toml's own profile caught
# mid-leap. The head, ears' inner shading, muzzle, nose and eye stay exactly
# as that file draws them, since a head does not change shape mid-hop. What
# moves: the body stretches and lifts as it leaves the ground, the leading
# paw reaches forward, the trailing paw drops low and back into the push-off
# position, both ears sweep back further with the motion, and the cottontail
# lifts.
classes = ["rabbit"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="rabbit-facing-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13.6" cy="15.4" rx="6.2" ry="4.9" fill="url(#rabbit-facing-left-moving-fill)"/>
  <circle cx="20.8" cy="16.4" r="1.9" fill="url(#rabbit-facing-left-moving-fill)"/>
  <ellipse cx="17.5" cy="20.8" rx="1.5" ry="1.7" fill="url(#rabbit-facing-left-moving-fill)"/>
  <ellipse cx="7" cy="17" rx="1.6" ry="1.3" fill="url(#rabbit-facing-left-moving-fill)"/>
  <ellipse cx="8.4" cy="4.6" rx="1.2" ry="3.7" fill="url(#rabbit-facing-left-moving-fill)" opacity="0.88" transform="rotate(30 8.4 4.6)"/>
  <ellipse cx="5.8" cy="4.1" rx="1.3" ry="4.3" fill="url(#rabbit-facing-left-moving-fill)" transform="rotate(22 5.8 4.1)"/>
  <ellipse cx="5.8" cy="4.4" rx="0.55" ry="2.8" fill="#e3aca6" opacity="0.7" transform="rotate(22 5.8 4.4)"/>
  <circle cx="6.4" cy="9.4" r="3.9" fill="url(#rabbit-facing-left-moving-fill)"/>
  <ellipse cx="3" cy="10.7" rx="1.7" ry="1.3" fill="#e3aca6" opacity="0.55"/>
  <circle cx="1.7" cy="10.4" r="0.45" fill="#1c1c1c"/>
  <ellipse cx="4.6" cy="8.5" rx="0.55" ry="0.68" fill="#1c1c1c"/>
  <g stroke="#1c1c1c" stroke-width="0.2" opacity="0.4" stroke-linecap="round">
    <path d="M3.4 10.2 L0.3 9.4"/>
    <path d="M3.4 10.7 L0.1 10.7"/>
    <path d="M3.6 11.2 L0.5 12"/>
  </g>
  <ellipse cx="7.3" cy="7.2" rx="1.3" ry="0.95" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="11" cy="12.8" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 5.62
cy = 8.88
scale = 2.54

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
