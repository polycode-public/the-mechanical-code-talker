# person-with-emotion — the 56-person-role wave's own worked example for
# the shared face-fragment mechanism (sprite-expressions.mjs): the same
# silhouette as person.toml, plus a required [face] anchor and a {{FACE}}
# placeholder that resolves to whichever of the 6 curated mgx:feels words
# (happy/sad/angry/scared/surprised/calm) the instance's own fact names. A
# person with no mgx:feels fact at all falls through to the plain
# person.toml sprite, the same dog/dog-with-colour precedent.
#
# {{FACE}} sits as the LAST child before </svg> (sprite-expressions.mjs's
# own convention) — copy this exact shape for the other 55 person-role
# classes: same body as the plain template, [face] anchored on that same
# class's own head circle cx/cy/r, {{FACE}} appended last.
classes = ["person"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="person-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#person-with-emotion-fill)"/>
  <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z" fill="url(#person-with-emotion-fill)"/>
  <path d="M12 12.8 C13.1 12.8 14.1 13 15 13.4" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.4" stroke-linecap="round"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r person.toml's own head circle declares.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
