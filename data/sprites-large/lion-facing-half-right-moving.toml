# lion-facing-half-right-moving — lion-facing-half-left-moving.toml's prowl
# mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored.
classes = ["lion"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="lion-facing-half-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="14" cy="16" rx="6.4" ry="4.4" fill="url(#lion-facing-half-right-moving-fill)"/>
    <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <line x1="9.95" y1="18.6" x2="9.15" y2="21.4"/>
      <line x1="12.95" y1="19.4" x2="13.95" y2="22"/>
      <line x1="17.15" y1="19" x2="16.35" y2="21.6"/>
      <line x1="20.15" y1="18.6" x2="20.95" y2="22"/>
    </g>
    <g fill="color-mix(in srgb, currentColor 55%, black)">
      <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z"/>
      <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(40 7.5 8.2)"/>
      <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(80 7.5 8.2)"/>
      <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(120 7.5 8.2)"/>
      <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(160 7.5 8.2)"/>
      <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(200 7.5 8.2)"/>
      <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(240 7.5 8.2)"/>
      <path d="M6.7 4.4 L7.5 0.8 L8.3 4.4 Z" transform="rotate(320 7.5 8.2)"/>
    </g>
    <circle cx="7.5" cy="8.2" r="3.86" fill="url(#lion-facing-half-right-moving-fill)"/>
    <path d="M4.9 5.8 L4.1 3.4 L6.7 5.2 Z" fill="url(#lion-facing-half-right-moving-fill)"/>
    <path d="M9.7 5.5 L10.1 4.4 L9 5.1 Z" fill="url(#lion-facing-half-right-moving-fill)"/>
    <path d="M5.4 9.4 C4.8 9.6 4.5 10 4.6 10.4 C5 10.2 5.3 9.8 5.5 9.4 Z" fill="url(#lion-facing-half-right-moving-fill)"/>
    <path d="M21 12.8 C24.5 11.5 25.5 15 22.5 17.4 C21.3 16.6 20.3 14.8 20.1 13 Z" fill="url(#lion-facing-half-right-moving-fill)"/>
    <ellipse cx="9" cy="8.3" rx="0.3" ry="0.38" fill="#1c1c1c"/>
    <ellipse cx="6" cy="7.9" rx="0.55" ry="0.65" fill="#1c1c1c"/>
    <ellipse cx="10.55" cy="13.1" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
    <ellipse cx="5.9" cy="6.6" rx="1.1" ry="0.8" fill="#ffffff" opacity="0.3"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 16.73
cy = 8.38
scale = 3.18

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
