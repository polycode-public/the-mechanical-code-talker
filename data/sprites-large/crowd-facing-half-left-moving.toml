# crowd-facing-half-left-moving — crowd-facing-half-left.toml's frontmost
# figure caught mid-stride. Its head, nose wedge, near/far eyes hold their
# half-turn shape and position exactly; the body redraw (near arm raised,
# far arm trailing, torso leaning with its hem lifted) is the SAME stride
# crowd-facing-left-moving.toml draws, since the walk cycle is a body pose
# independent of how far the head has turned. The two flanking figures stay
# exactly as crowd.toml draws them.
classes = ["crowd"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="crowd-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g opacity="0.6">
    <path d="M3.2 14.5 C1.9 14.6 0.6 15.7 0.4 17.8 C0.3 18.8 0.8 19.5 1.6 19.1 C1.6 17.6 2.1 16.0 3.5 15.4 Z" fill="url(#crowd-facing-half-left-moving-fill)"/>
    <path d="M7.2 14.5 C8.5 14.6 9.8 15.7 10.0 17.8 C10.1 18.8 9.6 19.5 8.8 19.1 C8.8 17.6 8.3 16.0 6.9 15.4 Z" fill="url(#crowd-facing-half-left-moving-fill)"/>
    <path d="M1.4 22 C1.4 17.8 3 15.9 5.2 15.9 C7.4 15.9 9 17.8 9 22 Z" fill="url(#crowd-facing-half-left-moving-fill)"/>
    <circle cx="5.2" cy="9.6" r="2.5" fill="url(#crowd-facing-half-left-moving-fill)"/>
  </g>
  <g opacity="0.6">
    <path d="M16.8 14.5 C15.5 14.6 14.2 15.7 14.0 17.8 C13.9 18.8 14.4 19.5 15.2 19.1 C15.2 17.6 15.7 16.0 17.1 15.4 Z" fill="url(#crowd-facing-half-left-moving-fill)"/>
    <path d="M20.8 14.5 C22.1 14.6 23.4 15.7 23.6 17.8 C23.7 18.8 23.2 19.5 22.4 19.1 C22.4 17.6 21.9 16.0 20.5 15.4 Z" fill="url(#crowd-facing-half-left-moving-fill)"/>
    <path d="M15 22 C15 17.8 16.6 15.9 18.8 15.9 C21 15.9 22.6 17.8 22.6 22 Z" fill="url(#crowd-facing-half-left-moving-fill)"/>
    <circle cx="18.8" cy="9.6" r="2.5" fill="url(#crowd-facing-half-left-moving-fill)"/>
  </g>
  <path d="M9.6 13.5 C8.2 12.9 6.9 13.8 6.4 16.1 C6.2 17.4 6.7 18.3 7.7 18.1 C7.8 16.2 8.3 14.7 9.8 13.9 Z" fill="url(#crowd-facing-half-left-moving-fill)"/>
  <path d="M14.4 13.5 C16.3 13.9 18.1 15.6 18.4 18.2 C18.5 19.4 17.8 20.1 16.8 19.6 C16.6 17.4 15.9 15.3 14.1 14.5 Z" fill="url(#crowd-facing-half-left-moving-fill)"/>
  <path d="M7.1 22 C6.9 17.3 9.0 15.0 11.7 15.0 C14.8 15.0 16.9 16.7 16.4 20.8 C16.3 21.7 15.4 21.7 14.7 21.2 Z" fill="url(#crowd-facing-half-left-moving-fill)"/>
  <ellipse cx="10.5" cy="17.1" rx="1.3" ry="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="11.73" cy="7.6" r="3" fill="url(#crowd-facing-half-left-moving-fill)"/>
  <path d="M8.9 7.15 Q8.3 8.33 8.9 8.96 Z" fill="url(#crowd-facing-half-left-moving-fill)"/>
  <ellipse cx="10.18" cy="7.14" rx="0.25" ry="0.31" fill="#1c1c1c"/>
  <ellipse cx="13.8" cy="7.1" rx="0.16" ry="0.2" fill="#1c1c1c"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 11.16
cy = 7.51
scale = 2.45

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
