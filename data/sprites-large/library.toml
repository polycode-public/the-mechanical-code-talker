# library — the family's shared room vignette turned toward reading:
# fixed-wood shelving lined with colour-varied spines and a ladder
# leaning against it for the top row. The spines carry a small fixed
# palette, not one flat currentColor block, because shelved books only
# read as books when their covers differ from one another.
classes = ["library"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="library-wash" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 38%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 65%, black)"/>
    </linearGradient>
    <linearGradient id="library-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f6a3f"/>
      <stop offset="100%" stop-color="#5c3f22"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#library-wash)"/>
  <rect x="3" y="15.6" width="18" height="5.4" fill="color-mix(in srgb, currentColor 55%, black)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <rect x="4.6" y="4.6" width="13" height="12.6" fill="url(#library-wood)" stroke="#3f2a15" stroke-width="0.3"/>
  <g stroke="#3f2a15" stroke-width="0.35">
    <line x1="4.6" y1="8.6" x2="17.6" y2="8.6"/>
    <line x1="4.6" y1="12.6" x2="17.6" y2="12.6"/>
  </g>
  <g stroke-width="1.5" stroke-linecap="butt">
    <line x1="5.4" y1="5" x2="5.4" y2="8.2" stroke="#b23a3a"/>
    <line x1="6.4" y1="5" x2="6.4" y2="8.2" stroke="#3a5f8a"/>
    <line x1="7.4" y1="5" x2="7.4" y2="8.2" stroke="#c9a227"/>
    <line x1="8.4" y1="5" x2="8.4" y2="8.2" stroke="#4a7a34"/>
    <line x1="9.4" y1="5" x2="9.4" y2="8.2" stroke="#7a4a94"/>
    <line x1="10.4" y1="5" x2="10.4" y2="8.2" stroke="#3a5f8a"/>
