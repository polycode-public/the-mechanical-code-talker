# library — a building marked by an open book at the sprite tier: an
# early draft used a row of upright spines, but at this scale even
# height matched a bar chart's own silhouette far more than a
# bookshelf's — an open book's two-page V shape has no such
# double-reading, and stays distinct from museum's own columned
# facade.
classes = ["library"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="library-wash" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect x="4" y="6.4" width="16" height="14.6" rx="0.6" fill="url(#library-wash)" stroke="currentColor" stroke-width="1.3"/>
  <path d="M12 9.6 C10.4 8.4 8 8 6.2 8.6 V15.8 C8 15.2 10.4 15.6 12 16.8 C13.6 15.6 16 15.2 17.8 15.8 V8.6 C16 8 13.6 8.4 12 9.6 Z" fill="currentColor" opacity="0.8"/>
  <path d="M12 9.6 V16.8" stroke="#000000" stroke-width="0.4" opacity="0.4"/>
  <path d="M7.2 9.8 L11 11 M7.2 11.6 L11 12.6 M7.2 13.4 L10.6 14.2" stroke="#000000" stroke-width="0.35" opacity="0.35" fill="none"/>
  <path d="M13 11 L16.8 9.8 M13 12.6 L16.8 11.6 M13.4 14.2 L16.8 13.4" stroke="#000000" stroke-width="0.35" opacity="0.35" fill="none"/>
  <rect x="9.8" y="17.6" width="4.4" height="3.4" fill="#000000" opacity="0.22"/>
</svg>
"""
