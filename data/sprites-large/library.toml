    <line x1="9.4" y1="9" x2="9.4" y2="12.2" stroke="#4a7a34"/>
    <line x1="10.4" y1="9" x2="10.4" y2="12.2" stroke="#7a4a94"/>
    <line x1="11.4" y1="9" x2="11.4" y2="12.2" stroke="#c9a227"/>
  </g>
  <path d="M18.4 19.2 L20.6 5.4" stroke="#8f6a3f" stroke-width="0.7"/>
