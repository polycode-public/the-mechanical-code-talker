# river — a winding band tinted pale blue rather than room.toml's own
# neutral wash: the tint stays a fixed stop-color with stop-opacity, the
# same mechanism room.toml explains, so the water reads blue on either
# theme without a currentColor mix flipping its own direction.
classes = ["river"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="river-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfe2e7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7fb6c1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <path d="M2 4 C6 6 4 10 8 12 C12 14 10 18 14 20 L22 20 C16 17 19 13 15 11 C11 9 13 5 9 3 Z" fill="url(#river-fill)"/>
  <path d="M2 4 C6 6 4 10 8 12 C12 14 10 18 14 20" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.7"/>
  <path d="M9 3 C13 5 11 9 15 11 C19 13 16 17 22 20" fill="none" stroke="currentColor" stroke-width="1.1" opacity="0.7"/>
  <path d="M4.6 6.4 C6.6 8 6 9.6 7.6 11" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
</svg>
"""
