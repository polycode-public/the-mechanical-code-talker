# iron — a raw ingot at the sprite tier: the shared palette carries no
# dedicated grey/steel treatment, so iron renders through the plastic
# treatment's own cool grey triple instead of the warm metal one gold
# and generic metal use — a cooler hue reads closer to real iron than a
# brass tone would, and the bar-shaped ingot keeps it from ever being
# mistaken for gold's own nugget.
classes = ["iron"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="iron-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f3f3f3"/>
      <stop offset="55%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </linearGradient>
  </defs>
  <path d="M4.4 15.2 L6.4 8.6 H17.6 L19.6 15.2 L17.6 18.6 H6.4 Z" fill="url(#iron-fill)"/>
  <path d="M6.4 8.6 L8 10.6 H16 L17.6 8.6" fill="none" stroke="#5c5c5c" stroke-width="0.5" opacity="0.4"/>
  <path d="M6.8 10.4 L5.2 15.2" stroke="#ffffff" stroke-width="0.7" opacity="0.4" stroke-linecap="round"/>
</svg>
"""
