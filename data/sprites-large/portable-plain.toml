# portable-plain — the last resort, for a carryable object whose whole class
# chain turned up no sprite AND which carries no taught mgx:madeOf value: a
# cloth bundle gathered and tied at the neck, shaded from currentColor.
# Without it such an object falls past its own parameterized template, past
# the flat legacy icon, and all the way to the generic animal root, which is
# a worse answer for a thing than a plain bundle is. Same shape
# ring-plain.toml/table-plain.toml take.
#
# The tie band and the cloth folds are drawn as an embossed pair (a white
# line above, a black one below) rather than a single tinted stroke: the
# body is a currentColor gradient, so a stroke mixed from currentColor
# disappears into it, and a plain round mass with a loop over the top reads
# as a weight on a handle instead of something you could carry.
classes = ["portable"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="portable-plain-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M9.6 8.6 C9.2 6.6 8.6 5 7.4 3.6 C9.4 4.2 10.8 5 11.6 6.2 C12.2 4.8 13.4 3.8 15.2 3.2 C14.2 4.8 13.6 6.6 13.4 8.6 Z" fill="url(#portable-plain-fill)"/>
  <path d="M6.6 15.2 C6.6 11 9 8.4 12 8.4 C15 8.4 17.4 11 17.4 15.2 C17.4 18.8 15 21 12 21 C9 21 6.6 18.8 6.6 15.2 Z" fill="url(#portable-plain-fill)"/>
  <path d="M9.2 8.9 C10 8.1 14 8.1 14.8 8.9" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
  <path d="M9.2 9.7 C10 8.9 14 8.9 14.8 9.7" fill="none" stroke="#000000" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <g fill="none" stroke-linecap="round">
    <path d="M10.2 11.4 C9.4 13.8 9.2 16.8 9.8 19.4" stroke="#000000" stroke-width="0.6" opacity="0.22"/>
    <path d="M13.8 11.4 C14.6 13.8 14.8 16.8 14.2 19.4" stroke="#000000" stroke-width="0.6" opacity="0.22"/>
  </g>
  <ellipse cx="9.8" cy="12.6" rx="1.7" ry="2.3" fill="#ffffff" opacity="0.26" transform="rotate(-16 9.8 12.6)"/>
</svg>
"""
