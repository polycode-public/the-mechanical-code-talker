# coffee — a drink at the sprite tier: a white cup on a saucer, tapered
# at the base rather than a flat-sided box, a fixed dark-roast gradient
# for the surface with a pale crema ring at the rim (no taught
# mgx:madeOf material — the cup's own ceramic doesn't need naming for a
# drink to read as coffee), and two steam curls in currentColor since
# steam has no colour of its own.
classes = ["coffee"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="coffee-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#a9754a"/>
      <stop offset="55%" stop-color="#6f4020"/>
      <stop offset="100%" stop-color="#432711"/>
    </linearGradient>
    <linearGradient id="coffee-cup" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fefefe"/>
      <stop offset="60%" stop-color="#eaf6f7"/>
      <stop offset="100%" stop-color="#c7d6d6"/>
    </linearGradient>
  </defs>
  <ellipse cx="10.4" cy="19.6" rx="8" ry="1.6" fill="#e8dcbf" opacity="0.7"/>
  <path d="M5.2 10.4 H14.4 V15.6 C14.4 18.2 12.5 19.4 9.8 19.4 C7.1 19.4 5.2 18.2 5.2 15.6 Z" fill="url(#coffee-cup)"/>
  <ellipse cx="9.8" cy="10.4" rx="4.6" ry="1.15" fill="#fefefe"/>
  <ellipse cx="9.8" cy="10.5" rx="4.4" ry="1.05" fill="url(#coffee-fill)"/>
  <ellipse cx="9.8" cy="10.05" rx="3.9" ry="0.7" fill="#e8c88a" opacity="0.55"/>
  <path d="M14.4 12 C17.4 11.6 17.8 15.6 14.8 15.8" fill="none" stroke="#eaf6f7" stroke-width="1.3"/>
  <path d="M8 9 C7.6 7.6 9 7.2 8.6 5.8 M11.4 9 C11 7.6 12.4 7.2 12 5.8" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.35" stroke-linecap="round"/>
</svg>
"""
