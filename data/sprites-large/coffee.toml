# coffee — a drink at the sprite tier: a white cup on a saucer, a fixed
# dark-roast gradient for the surface (no taught mgx:madeOf material — the
# cup's own ceramic doesn't need naming for a drink to read as coffee) and
# two steam curls in currentColor since steam has no colour of its own.
classes = ["coffee"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="coffee-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#a9754a"/>
      <stop offset="55%" stop-color="#6f4020"/>
      <stop offset="100%" stop-color="#432711"/>
    </linearGradient>
  </defs>
  <ellipse cx="10.4" cy="19.6" rx="8" ry="1.6" fill="#e8dcbf" opacity="0.7"/>
  <path d="M4.6 10.4 H15 V15.6 C15 18.2 12.9 19.4 9.8 19.4 C6.7 19.4 4.6 18.2 4.6 15.6 Z" fill="#eaf6f7"/>
  <ellipse cx="9.8" cy="10.6" rx="5.2" ry="1.4" fill="url(#coffee-fill)"/>
  <path d="M15 12 C18 11.6 18.4 15.6 15.4 15.8" fill="none" stroke="#eaf6f7" stroke-width="1.3"/>
  <path d="M8 9 C7.6 7.6 9 7.2 8.6 5.8 M11.4 9 C11 7.6 12.4 7.2 12 5.8" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.35" stroke-linecap="round"/>
</svg>
"""
