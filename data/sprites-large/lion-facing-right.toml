# lion-facing-right — lion-facing-left.toml's profile mirrored across the
# canvas midline (every shape wrapped in one translate-then-flip group), so
# the two directions stay geometrically identical twins. The mirror flips
# the lit corner of the shared gradient along with the pose, which reads as
# the same figure turned around under the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored.
classes = ["lion"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="lion-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="14.5" cy="15.8" rx="6.4" ry="4.4" fill="url(#lion-facing-right-fill)"/>
    <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <line x1="10.1" y1="19.2" x2="10.1" y2="22"/>
      <line x1="12.9" y1="19.8" x2="12.9" y2="22"/>
      <line x1="16.1" y1="19.8" x2="16.1" y2="22"/>
      <line x1="18.9" y1="19.2" x2="18.9" y2="22"/>
    </g>
    <g fill="color-mix(in srgb, currentColor 55%, black)">
      <path d="M6.4 4.6 L7.2 1 L8 4.6 Z"/>
      <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(40 7.2 8.4)"/>
      <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(80 7.2 8.4)"/>
      <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(120 7.2 8.4)"/>
      <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(160 7.2 8.4)"/>
      <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(200 7.2 8.4)"/>
      <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(320 7.2 8.4)"/>
    </g>
    <circle cx="7.2" cy="8.4" r="3.86" fill="url(#lion-facing-right-fill)"/>
    <path d="M4.4 6.2 L3.6 3.6 L6.2 5.4 Z" fill="url(#lion-facing-right-fill)"/>
    <path d="M9.8 5.6 L10.2 4.2 L8.8 5.2 Z" fill="url(#lion-facing-right-fill)"/>
    <path d="M4.4 9.6 C3.4 10 2.8 10.8 3 11.6 C3.8 11.2 4.4 10.5 4.8 9.7 Z" fill="url(#lion-facing-right-fill)"/>
    <path d="M20.5 13.6 C23.5 13 24.5 15.8 22.1 17 C21.1 16.4 20.3 15.2 20.1 13.9 Z" fill="url(#lion-facing-right-fill)"/>
    <ellipse cx="5.1" cy="7.9" rx="0.55" ry="0.68" fill="#1c1c1c"/>
    <ellipse cx="11.1" cy="12.8" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
    <ellipse cx="5.6" cy="6.8" rx="1.1" ry="0.8" fill="#ffffff" opacity="0.3"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# lion-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 6.1); cy and scale are the mirror's own invariants.
[face]
cx = 17.9
cy = 8.28
scale = 2.5

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
