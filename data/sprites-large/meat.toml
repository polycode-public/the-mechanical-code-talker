# meat — a roasted drumstick at the sprite tier: a fixed roast-brown
# gradient (roasted meat's own colour is what makes it read as cooked
# meat, the same call bread.toml makes about its crust) on a meaty bulb
# tapering to an exposed bone with a rounded knuckle cap, with roast
# marks following the bulb's own curve so the silhouette reads as a leg
# of meat rather than a loaf or a plated mound.
classes = ["meat"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="meat-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#e8a463"/>
      <stop offset="55%" stop-color="#b96a2e"/>
      <stop offset="100%" stop-color="#7a3f14"/>
    </linearGradient>
  </defs>
  <path d="M9 3.6 C13.6 2 18.4 4.8 19.2 9.6 C20 14.4 16.6 18.4 12 18.4 C8.4 18.4 6 15.6 6.4 12.2 C6.7 9.6 7.6 5.4 9 3.6 Z" fill="url(#meat-fill)"/>
  <path d="M7.6 16.8 L4 21" stroke="#f4ecd8" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="4" cy="21" r="1.6" fill="#f4ecd8"/>
  <g stroke="#7a3f14" stroke-width="0.5" opacity="0.4" stroke-linecap="round" fill="none">
    <path d="M9.4 6 C11.6 5 14.4 5.4 16.4 7.2"/>
    <path d="M8.4 9.4 C11.2 8.4 14.8 8.8 17.4 10.8"/>
    <path d="M8 13 C10.6 12.2 14 12.6 16.4 14.4"/>
  </g>
  <ellipse cx="10.4" cy="8.4" rx="2.8" ry="1.8" fill="#ffffff" opacity="0.3"/>
</svg>
"""
