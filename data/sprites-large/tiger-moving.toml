# tiger-moving — tiger-with-emotion.toml's figure caught mid-run while still
# facing front: selected by mgx:pose = "moving" ALONE, with no facing fact
# at all, so the head, ears and cheeks stay at tiger-with-emotion's own
# front anchor (cx=7 cy=9 scale=3.8), completely unshifted. The four
# front-facing legs stagger into an asymmetric running stance instead of the
# standing row, and the body dips slightly.
classes = ["tiger"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="tiger-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15.3" rx="6.6" ry="4.4" fill="url(#tiger-moving-fill)"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="7.4" y1="17.8" x2="6.8" y2="20.6"/>
    <line x1="10.6" y1="19.4" x2="10.2" y2="22.4"/>
    <line x1="15.4" y1="17.6" x2="16.2" y2="20.4"/>
    <line x1="18.4" y1="18.6" x2="19.2" y2="21.6"/>
  </g>
  <g fill="url(#tiger-moving-fill)">
    <ellipse cx="6.8" cy="20.9" rx="0.9" ry="0.55"/>
    <ellipse cx="10.2" cy="22.7" rx="0.9" ry="0.55"/>
    <ellipse cx="16.2" cy="20.7" rx="0.9" ry="0.55"/>
    <ellipse cx="19.2" cy="21.9" rx="0.9" ry="0.55"/>
  </g>
  <circle cx="7" cy="9" r="3.8" fill="url(#tiger-moving-fill)"/>
  <path d="M4.2 6.4 L3.2 3 L6.4 5 Z" fill="url(#tiger-moving-fill)"/>
  <path d="M9.4 6 L10 2.6 L12.4 5.2 Z" fill="url(#tiger-moving-fill)"/>
  <ellipse cx="5.6" cy="10.6" rx="1" ry="0.8" fill="#f4ede0"/>
  <ellipse cx="8.3" cy="10.6" rx="1" ry="0.8" fill="#f4ede0"/>
  <g stroke="#000000" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M8.6 12 L12 10.6"/>
    <path d="M9 14.8 L13 14"/>
    <path d="M9.4 17.6 L13 17.4"/>
    <path d="M15.2 11.6 L18.2 11"/>
    <path d="M15.8 14.8 L19 15"/>
    <path d="M15.6 17.8 L18.6 18.2"/>
  </g>
  <path d="M19 12.6 C22 12 22.4 14.8 20 15.6 Z" fill="url(#tiger-moving-fill)"/>
  <ellipse cx="9.6" cy="12.2" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="7" cy="9" rx="3.3" ry="2.9" fill="#ffffff" opacity="0.22"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 7
cy = 9
scale = 3.8

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
