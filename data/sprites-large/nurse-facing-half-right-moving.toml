[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 12.86
cy = 8.51
scale = 2.54

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
