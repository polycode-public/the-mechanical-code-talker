# family-facing-half-left — the child figure turned three-quarters, halfway
# between family-facing-left.toml's full profile and family-with-emotion.toml's
# front view. The child's nose projects only half as far past its head's edge
# and a second, smaller far eye appears near the head's right edge so both
# eyes read. The two flanking parent figures keep their own front-view
# geometry unchanged, the same simplification the full profile uses.
classes = ["family"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="family-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M8.5 7.4 C9.7 8.7 9.9 10.9 8.9 13.3" fill="none" stroke="url(#family-facing-half-left-fill)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M2.7 7.4 C1.5 8.7 1.4 10.9 2.3 13.3" fill="none" stroke="url(#family-facing-half-left-fill)" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="5.6" cy="8.4" r="2.7" fill="url(#family-facing-half-left-fill)"/>
  <path d="M2 22 C2 17.3 3.6 15.1 5.6 15.1 C7.6 15.1 9.2 17.3 9.2 22 Z" fill="url(#family-facing-half-left-fill)"/>
  <path d="M4.3 14.9 L5.6 16 L6.9 14.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18.4" cy="8.4" r="2.7" fill="url(#family-facing-half-left-fill)"/>
  <path d="M14.8 22 C14.8 17.3 16.4 15.1 18.4 15.1 C20.4 15.1 22 17.3 22 22 Z" fill="url(#family-facing-half-left-fill)"/>
  <path d="M17.1 14.9 L18.4 16 L19.7 14.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8.4 22 C8.4 18.4 9.8 16.6 12 16.6 C14.2 16.6 15.6 18.4 15.6 22 Z" fill="url(#family-facing-half-left-fill)"/>
  <path d="M11.1 16.4 L12 17.1 L12.9 16.4" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="11.79" cy="11.4" r="2.3" fill="url(#family-facing-half-left-fill)"/>
  <path d="M9.63 11.05 Q9.14 11.96 9.63 12.45 Z" fill="url(#family-facing-half-left-fill)"/>
  <ellipse cx="10.61" cy="11.05" rx="0.2" ry="0.24" fill="#1c1c1c"/>
  <ellipse cx="13.39" cy="11.02" rx="0.13" ry="0.15" fill="#1c1c1c"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# Half shift is 0.09 * r = 0.21 against the child's own r=2.3 (half of the
# full profile's 0.42), so the child head sits at cx=11.79. Half scale is
# 0.818 * 2.3 = 1.88, and cx/cy place the shared face fragment's own near
# eye on top of the one drawn above at (10.61, 11.05).
[face]
cx = 11.36
cy = 11.33
scale = 1.88

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
