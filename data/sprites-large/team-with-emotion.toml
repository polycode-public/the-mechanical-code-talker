# team-with-emotion — same face-fragment mechanism as person-with-emotion.toml
# (sprite-expressions.mjs), but team.toml is a group composite: three
# figures share one sprite, so there is no single class-declared head
# circle to copy. Judgment call: [face] anchors on the centre figure's own
# head circle (cx=12 cy=7.4 r=2.9) — it is drawn last (on top of the two
# flanking figures), sits on the horizontal centreline, and is the tallest
# of the three, reading as the frontmost figure. The two side figures stay
# plain-faced; a three-way {{FACE}} split isn't what this mechanism does.
classes = ["team"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="team-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M3.0 14.1 C1.5 14.2 0.2 15.4 0.0 17.5 C0.0 18.6 0.4 19.3 1.2 18.9 C1.3 17.3 1.8 15.7 3.2 15.0 Z" fill="url(#team-with-emotion-fill)"/>
  <path d="M7.0 14.1 C8.5 14.2 9.8 15.4 10.0 17.5 C10.0 18.6 9.6 19.3 8.8 18.9 C8.7 17.3 8.2 15.7 6.8 15.0 Z" fill="url(#team-with-emotion-fill)"/>
  <path d="M1.6 22 C1.6 17.7 3 15.6 5 15.6 C7 15.6 8.4 17.7 8.4 22 Z" fill="url(#team-with-emotion-fill)"/>
  <circle cx="5" cy="9" r="2.6" fill="url(#team-with-emotion-fill)"/>
  <path d="M2.4 17.6 L7.6 17.6" stroke="#3a6ea5" stroke-width="0.8" opacity="0.9" stroke-linecap="round"/>
  <path d="M17.0 14.1 C15.5 14.2 14.2 15.4 14.0 17.5 C13.9 18.6 14.4 19.3 15.2 18.9 C15.3 17.3 15.8 15.7 17.2 15.0 Z" fill="url(#team-with-emotion-fill)"/>
  <path d="M21.0 14.1 C22.5 14.2 23.8 15.4 23.9 17.5 C23.9 18.6 23.6 19.3 22.8 18.9 C22.7 17.3 22.2 15.7 20.8 15.0 Z" fill="url(#team-with-emotion-fill)"/>
  <path d="M15.6 22 C15.6 17.7 17 15.6 19 15.6 C21 15.6 22.4 17.7 22.4 22 Z" fill="url(#team-with-emotion-fill)"/>
  <circle cx="19" cy="9" r="2.6" fill="url(#team-with-emotion-fill)"/>
  <path d="M16.4 17.6 L21.6 17.6" stroke="#3a6ea5" stroke-width="0.8" opacity="0.9" stroke-linecap="round"/>
  <path d="M9.7 13.1 C8.1 13.2 6.6 14.5 6.4 16.9 C6.3 18.1 6.9 18.9 7.8 18.5 C7.9 16.6 8.4 14.9 10.0 14.1 Z" fill="url(#team-with-emotion-fill)"/>
  <path d="M14.3 13.1 C15.9 13.2 17.4 14.5 17.6 16.9 C17.7 18.1 17.1 18.9 16.2 18.5 C16.1 16.6 15.6 14.9 14.0 14.1 Z" fill="url(#team-with-emotion-fill)"/>
  <path d="M7.8 22 C7.8 17 9.6 14.8 12 14.8 C14.4 14.8 16.2 17 16.2 22 Z" fill="url(#team-with-emotion-fill)"/>
  <circle cx="12" cy="7.4" r="2.9" fill="url(#team-with-emotion-fill)"/>
  <path d="M9 16.6 L15 16.6" stroke="#3a6ea5" stroke-width="0.8" opacity="0.9" stroke-linecap="round"/>
  {{FACE}}
</svg>
"""

# The centre figure's own head circle — see header comment for why.
[face]
cx = 12
cy = 7.4
scale = 2.9

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
