# judge-facing-half-right-moving — judge-facing-half-left-moving.toml's
# stride mirrored across the canvas midline, the same flip-group treatment
# the standing half-right profile uses over its half-left twin.
classes = ["judge"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="judge-facing-half-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="judge-facing-half-right-moving-robe" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#4a4a50"/>
      <stop offset="100%" stop-color="#1c1c1f"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#judge-facing-half-right-moving-fill)">
      <path d="M9.4 13.1 C7.8 12.5 6.3 13.5 5.8 16.1 C5.6 17.5 6.2 18.5 7.3 18.2 C7.4 16.2 7.9 14.5 9.6 13.6 Z"/>
      <path d="M14.6 13.1 C16.7 13.5 18.7 15.3 19 18.2 C19.1 19.5 18.3 20.3 17.2 19.7 C17 17.4 16.3 15.1 14.3 14.2 Z"/>
      <path d="M6.3 21 C6.1 15.5 8.7 12.9 11.7 12.9 C15.1 12.9 17.6 14.8 17.1 19.6 C16.9 20.7 15.9 20.7 15.1 20.1 Z"/>
      <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
    </g>
    <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
    <path d="M7.4 13.4 C7 15.8 7.4 18.4 8.6 21 L10 20.5 C9 18.2 8.7 15.8 9 13.6 C8.5 13.5 7.9 13.4 7.4 13.4 Z" fill="url(#judge-facing-half-right-moving-robe)"/>
    <path d="M16.6 13.4 C17 15.8 16.6 18.4 15.4 21 L14 20.5 C15 18.2 15.3 15.8 15 13.6 C15.5 13.5 16.1 13.4 16.6 13.4 Z" fill="url(#judge-facing-half-right-moving-robe)"/>
    <rect x="10.3" y="12.9" width="1.3" height="2.6" rx="0.15" fill="#f4f1ea"/>
    <rect x="12.4" y="12.9" width="1.3" height="2.6" rx="0.15" fill="#f4f1ea"/>
    <path d="M17.3 17 L18.9 17.9 L18.5 18.6 L16.9 17.7 Z" fill="#6b3f1d" transform="rotate(-25 17.9 17.8)"/>
    <rect x="17.9" y="17.6" width="0.4" height="2.1" rx="0.2" fill="#8a5a2e" transform="rotate(-25 18.1 18.6)"/>
    <circle cx="11.7" cy="6.6" r="3.3" fill="url(#judge-facing-half-right-moving-fill)"/>
    <path d="M8.6 6.1 Q7.9 7.4 8.6 8.1 Z" fill="url(#judge-facing-half-right-moving-fill)"/>
    <ellipse cx="10" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
    <ellipse cx="14" cy="6.05" rx="0.18" ry="0.22" fill="#1c1c1c"/>
    <path d="M9.6 13.2 L12 15.6 L14.4 13.2" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.6" stroke-linecap="round"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 12.92
cy = 6.51
scale = 2.7

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
