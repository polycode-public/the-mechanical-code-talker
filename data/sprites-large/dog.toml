# dog — a floppy ear on each side of the head, four legs with paws
# breaking the body's underside, and a fixed dark nose at the snout tip;
# gradient body only, no material — the taught-colour worked example
# (dog-with-colour) stays an icon-tier-only demo of the SINGLE-placeholder
# mechanism.
classes = ["dog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="dog-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15" rx="6.4" ry="4.3" fill="url(#dog-fill)"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="7.6" y1="18.4" x2="7.4" y2="21.6"/>
    <line x1="10.6" y1="19.2" x2="10.6" y2="22"/>
    <line x1="15" y1="19.2" x2="15.2" y2="22"/>
    <line x1="18" y1="18.2" x2="18.4" y2="21.4"/>
  </g>
  <g fill="url(#dog-fill)">
    <ellipse cx="7.4" cy="21.9" rx="0.9" ry="0.55"/>
    <ellipse cx="10.6" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="15.2" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="18.4" cy="21.7" rx="0.9" ry="0.55"/>
  </g>
  <circle cx="7" cy="9" r="3.6" fill="url(#dog-fill)"/>
  <ellipse cx="6.1" cy="8" rx="1" ry="1.3" fill="#000000" opacity="0.22"/>
  <path d="M4.5 6.5 L2 3 L6 5 Z" fill="url(#dog-fill)"/>
  <path d="M9.5 6.5 L12 3 L8 5 Z" fill="url(#dog-fill)"/>
  <path d="M19 13 C22 12 22.5 15 20 16 Z" fill="url(#dog-fill)"/>
  <ellipse cx="3.8" cy="9.4" rx="0.6" ry="0.5" fill="#1c1c1c"/>
  <ellipse cx="9.6" cy="12.2" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="5.6" cy="7.4" rx="1.2" ry="0.9" fill="#ffffff" opacity="0.32"/>
</svg>
