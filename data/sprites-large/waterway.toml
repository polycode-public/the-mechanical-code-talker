  </defs>
  <path d="M2 8.4 C4.4 6.4 6.8 6.4 9.2 8.4 C11.6 10.4 14 10.4 16.4 8.4 C18.8 6.4 21.2 6.4 22.6 8" fill="none" stroke="url(#waterway-fill)" stroke-width="2.2" stroke-linecap="round"/>
