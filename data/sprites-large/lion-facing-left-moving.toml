# lion-facing-left-moving — lion-facing-left.toml's own profile caught
# mid-prowl. The mane, head, ears, jaw bump, eye and face anchor stay
# exactly as that file draws them, since a mane doesn't change shape
# mid-stride any more than a head does. What moves: the four legs stagger
# into a prowling gait, the body dips slightly under the crouch, and the
# tail tuft whips up higher than it does standing still.
classes = ["lion"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="lion-facing-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="14.5" cy="16.1" rx="6.4" ry="4.4" fill="url(#lion-facing-left-moving-fill)"/>
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <line x1="9.4" y1="18.6" x2="8.6" y2="21.4"/>
    <line x1="12.4" y1="19.4" x2="13.4" y2="22"/>
    <line x1="16.6" y1="19" x2="15.8" y2="21.6"/>
    <line x1="19.6" y1="18.6" x2="20.4" y2="22"/>
  </g>
  <g fill="color-mix(in srgb, currentColor 55%, black)">
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(40 7.2 8.4)"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(80 7.2 8.4)"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(120 7.2 8.4)"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(160 7.2 8.4)"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(200 7.2 8.4)"/>
    <path d="M6.4 4.6 L7.2 1 L8 4.6 Z" transform="rotate(320 7.2 8.4)"/>
  </g>
  <circle cx="7.2" cy="8.4" r="3.86" fill="url(#lion-facing-left-moving-fill)"/>
  <path d="M4.4 6.2 L3.6 3.6 L6.2 5.4 Z" fill="url(#lion-facing-left-moving-fill)"/>
  <path d="M9.8 5.6 L10.2 4.2 L8.8 5.2 Z" fill="url(#lion-facing-left-moving-fill)"/>
  <path d="M4.4 9.6 C3.4 10 2.8 10.8 3 11.6 C3.8 11.2 4.4 10.5 4.8 9.7 Z" fill="url(#lion-facing-left-moving-fill)"/>
  <path d="M20.5 12.8 C24 11.5 25 15 22 17.4 C20.8 16.6 19.8 14.8 19.6 13 Z" fill="url(#lion-facing-left-moving-fill)"/>
  <ellipse cx="5.1" cy="7.9" rx="0.55" ry="0.68" fill="#1c1c1c"/>
  <ellipse cx="11.1" cy="13.1" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="5.6" cy="6.8" rx="1.1" ry="0.8" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 6.1
cy = 8.28
scale = 2.5

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
