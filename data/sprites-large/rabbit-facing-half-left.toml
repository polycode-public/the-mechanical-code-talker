# rabbit-facing-half-left — the rabbit turned three-quarters, halfway
# between rabbit-facing-left.toml's full profile and rabbit-with-emotion
# .toml's front view. The head sits at the midpoint between the profile's
# and the front view's own head position, the muzzle patch and nose shrink a
# touch and dip forward, both ears read closer to upright than the full
# profile (less rotation, pulled in toward the head's own midline), and a
# small far eye now shows past the muzzle line alongside the near eye — the
# cue that reads as a turned head rather than a flat profile. The body, tail
# and paws keep the profile file's own shapes, shifted right by the same
# amount the head moved.
classes = ["rabbit"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="rabbit-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="15.4" cy="16.2" rx="5.8" ry="5.2" fill="url(#rabbit-facing-half-left-fill)"/>
  <circle cx="22.4" cy="17.7" r="1.8" fill="url(#rabbit-facing-half-left-fill)"/>
  <ellipse cx="15" cy="20.5" rx="1.3" ry="1.6" fill="url(#rabbit-facing-half-left-fill)"/>
  <ellipse cx="11.4" cy="19.7" rx="1.5" ry="1.8" fill="url(#rabbit-facing-half-left-fill)"/>
  <ellipse cx="9.2" cy="4.2" rx="1.1" ry="3" fill="url(#rabbit-facing-half-left-fill)" opacity="0.88" transform="rotate(16 9.2 4.2)"/>
  <ellipse cx="7" cy="3.9" rx="1.4" ry="4.6" fill="url(#rabbit-facing-half-left-fill)" transform="rotate(7 7 3.9)"/>
  <ellipse cx="7" cy="4.3" rx="0.6" ry="3" fill="#e3aca6" opacity="0.7" transform="rotate(7 7 4.3)"/>
  <circle cx="8.4" cy="9.5" r="3.9" fill="url(#rabbit-facing-half-left-fill)"/>
  <ellipse cx="5" cy="10.7" rx="1.5" ry="1.2" fill="#e3aca6" opacity="0.55"/>
  <circle cx="3.7" cy="10.4" r="0.42" fill="#1c1c1c"/>
  <ellipse cx="8" cy="8.9" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <ellipse cx="6.6" cy="8.5" rx="0.55" ry="0.68" fill="#1c1c1c"/>
  <ellipse cx="9.3" cy="7.2" rx="1.2" ry="0.9" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="12.8" cy="13.6" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# Half scale is 0.825 * profile head radius 3.9 = 3.2175, rounded to 3.22
# (the table's own halfway point between the front view's 1.0*r and the
# profile's 0.65*r, the same ratio bear-facing-half-left.toml used for its
# own head radius). The near eye drawn above sits at (6.6, 8.5), so
# cx = 6.6 + 0.4*3.22 = 7.89 and cy = 8.5 + 0.15*3.22 = 8.98, landing the
# shared face fragment's own near eye on top of it.
[face]
cx = 7.89
cy = 8.98
scale = 3.22

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
