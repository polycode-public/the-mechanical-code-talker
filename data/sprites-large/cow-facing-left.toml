# cow-facing-left — the same horned, muzzled cow as cow.toml turned to a
# left profile: the head sits at the body's left, the muzzle and its two
# nostril dots break the silhouette's left edge, one horn-and-ear pair reads
# bigger and in front with the far pair smaller and peeking behind. The
# white body patches and four legs redistribute along the turned body the
# same way bear-facing-left.toml redistributes its paws. A hand-authored
# [match] variant, selected only when the instance's own mgx:faces fact
# says "left"; taught only the facing, {{FACE}} resolves to nothing and the
# profile keeps the single forward eye it draws itself.
classes = ["cow"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="cow-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="14.2" cy="14.8" rx="6.8" ry="4.6" fill="url(#cow-facing-left-fill)"/>
  <path d="M6.6 6 L5.6 3.6" stroke="currentColor" stroke-width="1.4"/>
  <path d="M4.4 6.3 L3.8 4.5" stroke="currentColor" stroke-width="1.1" opacity="0.7"/>
  <circle cx="4.6" cy="9.3" r="4.05" fill="url(#cow-facing-left-fill)"/>
  <ellipse cx="1.4" cy="10.9" rx="2" ry="1.5" fill="#e7c9c2"/>
  <circle cx="0.6" cy="10.6" r="0.4" fill="#1c1c1c"/>
  <circle cx="3.2" cy="8.3" r="0.42" fill="#1c1c1c"/>
  <g fill="#f4f1ea">
    <ellipse cx="16.8" cy="12.2" rx="2.4" ry="1.8"/>
    <ellipse cx="11.8" cy="16.6" rx="1.8" ry="1.4"/>
    <ellipse cx="19.2" cy="16.2" rx="1.6" ry="1.3"/>
  </g>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="9.6" y1="18.8" x2="9.2" y2="21.8"/>
    <line x1="13" y1="19.4" x2="12.8" y2="22.2"/>
    <line x1="17" y1="19.2" x2="17.2" y2="22.2"/>
    <line x1="20.2" y1="18.6" x2="20.8" y2="21.6"/>
  </g>
  <g fill="#1c1c1c">
    <ellipse cx="9.1" cy="22.1" rx="0.8" ry="0.45"/>
    <ellipse cx="12.7" cy="22.4" rx="0.8" ry="0.45"/>
    <ellipse cx="17.3" cy="22.4" rx="0.8" ry="0.45"/>
    <ellipse cx="20.9" cy="21.9" rx="0.8" ry="0.45"/>
  </g>
  <ellipse cx="5" cy="7.6" rx="1.3" ry="0.9" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="12" cy="13" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from THIS file's own profile geometry: the head circle is
# cx=4.6 cy=9.3 r=4.05 (0.92 of cow-with-emotion.toml's r=4.4), and the
# forward eye drawn above sits at (3.2, 8.3). scale is 0.65 of the profile
# head radius (0.65*4.05=2.63, rounded to 2.6); cx/cy then place the
# fragment so its own forward eye lands on the drawn one.
[face]
cx = 4.24
cy = 8.69
scale = 2.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
