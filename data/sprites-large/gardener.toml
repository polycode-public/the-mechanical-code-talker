# gardener — Ashcombe Hall's own gardener. The smock keeps the class colour;
# the straw hat with its library-green band, the leather apron, the green
# wellingtons and the potted cutting under one arm are fixed palette, since
# straw, leather and terracotta are what they are whatever the page repaints
# the uniform — the same split badger.toml makes between its stripes and its
# coat. The wide brim is still the widest part of the silhouette, so the
# highlight sits along its leading edge.
