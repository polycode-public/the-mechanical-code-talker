# ocean — deep open water at the sprite tier: fixed blue like
# body-of-water, but taller (more of the frame is water) and darker at
# depth, with a third wave-crest band so the two read as related but
# distinct sizes of the same feature rather than duplicates. Fixed
# rather than currentColor for the same reason body-of-water is: the
# water's own colour is its identity.
classes = ["ocean"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="ocean-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe2e7"/>
      <stop offset="35%" stop-color="#4f8fbd"/>
      <stop offset="100%" stop-color="#1c4a70"/>
    </linearGradient>
  </defs>
  <path d="M2 7.4 C4.6 5.8 6.8 5.8 9.4 7.4 C12 9 14.2 9 16.8 7.4 C19.4 5.8 21.6 5.8 22 7.4 L22 21.4 L2 21.4 Z" fill="url(#ocean-wash)"/>
  <path d="M2 7.4 C4.6 5.8 6.8 5.8 9.4 7.4 C12 9 14.2 9 16.8 7.4 C19.4 5.8 21.6 5.8 22 7.4" fill="none" stroke="#eaf6f7" stroke-width="0.9" opacity="0.6"/>
  <path d="M2 12 C4.4 10.4 6.8 10.4 9.2 12 C11.6 13.6 14 13.6 16.4 12 C18.8 10.4 21.2 10.4 22 11.6" fill="none" stroke="#eaf6f7" stroke-width="0.8" opacity="0.45"/>
  <path d="M2 16.6 C4.4 15 6.8 15 9.2 16.6 C11.6 18.2 14 18.2 16.4 16.6 C18.8 15 21.2 15 22 16.2" fill="none" stroke="#eaf6f7" stroke-width="0.7" opacity="0.3"/>
  <path d="M3.2 8 C4.6 7.2 6 7.2 7.4 8" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5" stroke-linecap="round"/>
</svg>
"""
