# bed — a furniture piece at the sprite tier: the headboard, footboard and
# mattress deck share one taught mgx:madeOf gradient (a bed frame is wood or
# metal, the same two-treatment spread cabinet/desk already cover). The
# pillow and the turned-back blanket corner are fixed linen cream and a
# warm burgundy fold rather than the frame's own colour, since bedding
# stays the same cloth whatever the frame underneath is made of.
classes = ["bed"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bed-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="{{FILL_LIGHT}}"/>
      <stop offset="55%" stop-color="{{FILL}}"/>
      <stop offset="100%" stop-color="{{FILL_DARK}}"/>
    </linearGradient>
  </defs>
  <path d="M3.4 4 Q3.4 2.2 5 2.2 Q6.6 2.2 6.6 4 L6.6 20.4 L3.4 20.4 Z" fill="url(#bed-fill)"/>
  <line x1="5" y1="3.4" x2="5" y2="19.6" stroke="#000000" stroke-width="0.3" opacity="0.2"/>
  <path d="M4.1 3.4 L4.1 19.6" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>
  <rect x="6.6" y="13.2" width="13.8" height="5.2" rx="1" fill="url(#bed-fill)"/>
  <rect x="7.2" y="13.6" width="5.4" height="2.8" rx="1.3" fill="#f4ecd8"/>
  <path d="M7.6 15 Q9.9 15.7 12.2 15" stroke="#c9bb9d" stroke-width="0.3" opacity="0.6" fill="none"/>
  <path d="M13.6 13.6 L20.2 13.6 L20.2 18 L13.2 18 L13.2 15.2 Z" fill="#a24a3a"/>
  <path d="M13.2 15.2 L13.6 13.6" stroke="#7c3428" stroke-width="0.4" opacity="0.5"/>
  <path d="M14.4 13.7 L20 13.7" stroke="#c96650" stroke-width="0.3" opacity="0.5"/>
  <rect x="19.6" y="11.4" width="1.5" height="9" rx="0.6" fill="url(#bed-fill)"/>
  <line x1="20.35" y1="12" x2="20.35" y2="20" stroke="#000000" stroke-width="0.25" opacity="0.18"/>
  <g stroke="{{FILL_DARK}}" stroke-width="1.4" stroke-linecap="round">
    <line x1="5" y1="20.4" x2="5" y2="22"/>
    <line x1="20.35" y1="20.4" x2="20.35" y2="22"/>
  </g>
</svg>
"""

[parameters.material]
property = "mgx:madeOf"
placeholders = { light = "{{FILL_LIGHT}}", base = "{{FILL}}", dark = "{{FILL_DARK}}" }

[parameters.material.values]
wood = "wood"
metal = "metal"
