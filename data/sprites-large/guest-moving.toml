# guest-moving — guest-with-emotion.toml's front figure caught mid-stride,
# selected on mgx:pose = "moving" alone (no facing fact on record, so the
# centre view is what a moving-but-unturned instance gets — the same absent-
# fact convention the turntable itself uses for the front view). The head
# stays at guest-with-emotion.toml's own front anchor; what moved is the arms
# (one forward, one back) and the hem, asymmetric the same way the profile
# strides are.

classes = ["guest"]

svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="guest-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#guest-moving-fill)">
    <path d="M9.4 13.1 C7.3 13.4 5.7 15 5.5 17.6 C5.45 18.9 6.1 19.7 7.1 19.3 C7.3 17.3 7.8 15.3 9.6 14.1 Z"/>
    <path d="M14.6 13.1 C16.9 13 18.7 14.2 18.9 16.9 C19 18.3 18.2 19.2 17.1 18.6 C16.8 16.7 16.1 14.9 14.3 14.2 Z"/>
    <path d="M6.2 21 C6 15.6 8.7 12.8 12 12.8 C15.4 12.8 18 15.7 17.6 20.4 C17.4 21 16.4 20.8 15.7 20.3 C16 17.9 15.5 15.8 13.8 14.6 C12.9 14.9 11.1 14.9 10.2 14.6 C8.5 15.8 8 17.9 8.3 20.3 C7.6 20.8 6.5 21 6.2 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#guest-moving-fill)"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 13.9 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:pose"
value = "moving"

[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
