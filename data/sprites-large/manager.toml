# manager — the shared person body with a clipboard held against the body
# and a lanyard-and-card around the neck, tracking rather than doing the
# work directly, kept distinct from engineer.toml's hard-hat register. The
# board, its clip, and the lanyard card are all fixed: a clipboard's own
# board and a lanyard's own card are worn objects, not a theme-owned
# surface.
