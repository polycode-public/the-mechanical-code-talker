# employee-facing-right — employee-facing-left.toml's profile mirrored
# across the canvas midline (every shape wrapped in one translate-then-flip
# group), so the two directions stay geometrically identical twins. The
# mirror flips the lit corner of the shared gradient along with the pose,
# which reads as the same figure turned around under the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["employee"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="employee-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#employee-facing-right-fill)">
      <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
      <path d="M14.6 13.1 C16.4 13.2 18.1 14.7 18.4 17.4 C18.5 18.8 17.8 19.7 16.8 19.2 C16.7 17.1 16.1 15.1 14.3 14.2 Z"/>
      <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
      <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
    </g>
    <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
    <circle cx="11.4" cy="6.6" r="3.3" fill="url(#employee-facing-right-fill)"/>
    <path d="M8.3 6 Q7.05 7 8.3 8.05 Z" fill="url(#employee-facing-right-fill)"/>
    <ellipse cx="9.7" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
    <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M9 4.2 C9.7 3.6 10.5 3.4 11.4 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
    <path d="M11.3 12.9 L11.7 15.4 L12.3 15.4 L12.7 12.9" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.6"/>
    <rect x="10.6" y="15.4" width="2.8" height="3.6" rx="0.4" fill="#ffffff" opacity="0.9" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.4"/>
    <circle cx="12" cy="16.9" r="0.6" fill="currentColor" opacity="0.5"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# employee-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 10.5); cy and scale are the mirror's own invariants, since the
# fragment sits outside the flip group and never itself gets flipped.
[face]
cx = 13.5
cy = 6.4
scale = 2.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
