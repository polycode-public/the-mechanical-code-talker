# rabbit-facing-half-left-moving — rabbit-facing-half-left.toml's own
# three-quarter head caught mid-leap. The head, muzzle, nose, near eye and
# far-eye hint stay exactly as that file draws them, since a head does not
# change shape mid-hop. What moves: the body stretches and lifts, the
# leading paw reaches forward, the trailing paw drops low and back, both
# ears sweep back further than the plain half-left file's near-upright read
# (though still closer to upright than the full-profile leap, since the
# three-quarter angle dampens how far the sweep reads), and the cottontail
# lifts.
classes = ["rabbit"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="rabbit-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="15.6" cy="15.4" rx="6.2" ry="4.9" fill="url(#rabbit-facing-half-left-moving-fill)"/>
  <circle cx="22.8" cy="16.4" r="1.9" fill="url(#rabbit-facing-half-left-moving-fill)"/>
  <ellipse cx="19.5" cy="20.8" rx="1.5" ry="1.7" fill="url(#rabbit-facing-half-left-moving-fill)"/>
  <ellipse cx="9" cy="17" rx="1.6" ry="1.3" fill="url(#rabbit-facing-half-left-moving-fill)"/>
  <ellipse cx="10.4" cy="4.3" rx="1" ry="2.8" fill="url(#rabbit-facing-half-left-moving-fill)" opacity="0.88" transform="rotate(20 10.4 4.3)"/>
  <ellipse cx="8.6" cy="4" rx="1.3" ry="4.2" fill="url(#rabbit-facing-half-left-moving-fill)" transform="rotate(13 8.6 4)"/>
  <ellipse cx="8.6" cy="4.3" rx="0.55" ry="2.7" fill="#e3aca6" opacity="0.7" transform="rotate(13 8.6 4.3)"/>
  <circle cx="8.4" cy="9.5" r="3.9" fill="url(#rabbit-facing-half-left-moving-fill)"/>
  <ellipse cx="5" cy="10.7" rx="1.5" ry="1.2" fill="#e3aca6" opacity="0.55"/>
  <circle cx="3.7" cy="10.4" r="0.42" fill="#1c1c1c"/>
  <ellipse cx="8" cy="8.9" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <ellipse cx="6.6" cy="8.5" rx="0.55" ry="0.68" fill="#1c1c1c"/>
  <ellipse cx="9.3" cy="7.2" rx="1.2" ry="0.9" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="13" cy="12.8" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 7.89
cy = 8.98
scale = 3.22

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
