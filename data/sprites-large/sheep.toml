# sheep — a fleece built from five overlapping gradient lobes rather than
# one plain body, so the wool itself reads as bumpy texture; the face and
# legs stay a fixed dark tone regardless of fleece colour, the way a real
# sheep's face and legs read darker than its wool.
classes = ["sheep"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="sheep-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#sheep-fill)">
    <circle cx="8.4" cy="12.6" r="3.4"/>
    <circle cx="12.2" cy="11" r="3.8"/>
    <circle cx="16.2" cy="12.4" r="3.4"/>
    <circle cx="10" cy="15.4" r="3.6"/>
    <circle cx="14.4" cy="15.4" r="3.6"/>
  </g>
  <ellipse cx="5.4" cy="14.4" rx="2.6" ry="2.2" fill="#3a352f"/>
  <ellipse cx="4.4" cy="13.8" rx="0.7" ry="0.9" fill="#000000" opacity="0.3"/>
  <g stroke="#3a352f" stroke-width="1.6" stroke-linecap="round">
    <line x1="9" y1="18.6" x2="9" y2="21.4"/>
    <line x1="16" y1="18.6" x2="16" y2="21.4"/>
  </g>
  <ellipse cx="10.6" cy="10" rx="2.6" ry="1.6" fill="#ffffff" opacity="0.3"/>
</svg>
"""
