# elephant-facing-left — the same big-eared, trunked elephant as
# elephant-with-emotion.toml, turned to a left profile. The head shifts to
# the canvas's left, the single flappy ear trails up and back behind it,
# and the trunk becomes the dominant read: it now hangs and curls forward
# past the head's own leading edge, doing the job a muzzle does for the
# other animals. A near eye is drawn directly on the head; the shared face
# fragment lands on top of it once a mood is taught, and drops out cleanly
# if it isn't.
classes = ["elephant"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="elephant-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="10.4" cy="6.6" rx="3.2" ry="3.8" fill="url(#elephant-facing-left-fill)" opacity="0.55"/>
  <ellipse cx="14.6" cy="15.4" rx="7.2" ry="5.2" fill="url(#elephant-facing-left-fill)"/>
  <g fill="url(#elephant-facing-left-fill)">
    <rect x="9" y="18.6" width="2" height="3.2" rx="1"/>
    <rect x="12.8" y="19" width="2" height="3" rx="1"/>
    <rect x="16.8" y="19" width="2" height="3" rx="1"/>
    <rect x="20" y="18.6" width="2" height="3.2" rx="1"/>
  </g>
  <ellipse cx="21.8" cy="13.6" rx="1" ry="1.3" fill="url(#elephant-facing-left-fill)"/>
  <circle cx="7.6" cy="8.6" r="4.05" fill="url(#elephant-facing-left-fill)"/>
  <path d="M5 11.2 C3.8 11.8 3.2 13.2 3.6 14.6 C4.3 13.8 4.9 12.7 5.3 11.3 Z" fill="#f4ecd8"/>
  <path d="M5.2 11.6 C2.8 12.2 1.6 15.2 2.4 17.8 C2.8 19.2 4.2 19.4 4.4 18 C3.6 16.6 3.2 14.4 4 12.4 C4.3 12 4.8 11.8 5.2 11.6 Z" fill="url(#elephant-facing-left-fill)"/>
  <ellipse cx="5.9" cy="7.4" rx="0.55" ry="0.65" fill="#1c1c1c"/>
  <ellipse cx="8.6" cy="6.2" rx="1.3" ry="1" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="11.6" cy="13.6" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Head radius 4.05 is 0.92 of elephant-with-emotion.toml's own r=4.4. The
# near eye this file draws sits at (5.9, 7.4); scale is 0.65 of the head
# radius, and cx/cy place the shared face fragment's own forward eye
# exactly on top of it.
[face]
cx = 6.94
cy = 7.79
scale = 2.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
