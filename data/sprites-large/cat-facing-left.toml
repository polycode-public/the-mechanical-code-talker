# cat-facing-left — cat.toml's pointed-eared, whiskered cat in left
# profile: the head leads at the left with the pink nose triangle on the
# silhouette's edge, whiskers sweep forward, the near ear keeps its pink
# inner accent, and the curled tail closes the right side. Selected only
# when the instance's own mgx:faces fact says "left".
classes = ["cat"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="cat-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13.6" cy="16.6" rx="5.8" ry="4" fill="url(#cat-facing-left-fill)"/>
  <g fill="url(#cat-facing-left-fill)">
    <ellipse cx="9.4" cy="20.2" rx="1" ry="1.2"/>
    <ellipse cx="11.8" cy="20.6" rx="1" ry="1.2"/>
    <ellipse cx="14.8" cy="20.6" rx="1" ry="1.2"/>
    <ellipse cx="17.2" cy="20.2" rx="1" ry="1.2"/>
  </g>
  <path d="M19 15 C22 13.4 22.8 16.6 20.4 18.2 C18.8 19.2 17.4 17.4 19 15 Z" fill="url(#cat-facing-left-fill)"/>
  <path d="M4.4 6.8 L3.4 3 L6.6 5.4 Z" fill="url(#cat-facing-left-fill)"/>
  <circle cx="6.8" cy="9.8" r="4.2" fill="url(#cat-facing-left-fill)"/>
  <path d="M8.8 6.4 L9.8 2.6 L6.2 5 Z" fill="url(#cat-facing-left-fill)"/>
  <path d="M9.2 5.6 L9.6 3.5 L7.8 4.9 Z" fill="#e3a8a0"/>
  <path d="M3.6 9.2 L1.2 8.8 M3.7 10.6 L1.3 11 M4.2 11.6 L2.2 12.6" stroke="currentColor" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
  <path d="M3.1 9.6 L3.1 10.5 L2.3 10.05 Z" fill="#d98a86"/>
  <ellipse cx="5.4" cy="8.8" rx="0.5" ry="0.62" fill="#1c1c1c"/>
  <ellipse cx="7.6" cy="7.6" rx="1.4" ry="1" fill="#ffffff" opacity="0.32"/>
  <ellipse cx="11.2" cy="14.8" rx="2.4" ry="1.4" fill="#ffffff" opacity="0.26"/>
</svg>
"""

[match]
property = "mgx:faces"
value = "left"
