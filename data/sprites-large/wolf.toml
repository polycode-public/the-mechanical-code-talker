# wolf — an angular head and upright pointed ears distinguish this from
# dog.toml's own rounder silhouette, plus a raised bushy tail and four
# taller, leaner legs for a colder stance. A themed pale throat patch (a
# real wolf trait, still currentColor-shaded so a theme owns it) and a
# fixed dark nose round out the head.
classes = ["wolf"]
