# sheep-moving — a centre-facing moving pose, selected by mgx:pose = moving
# alone with no facing fact at all (there is no existing bear/cat/dog/king
# example of this file, since none of those classes has one yet; this is
# the first, authored with the same conventions as every other variant
# here). Reuses sheep-with-emotion.toml's own wool, ears, face ellipse and
# [face] anchor UNCHANGED — a front-facing head does not change shape or
# position mid-stride any more than a profile one does — with only the four
# legs redrawn into a mid-walk diagonal stance: the outer pair (legs 1 and
# 4) swung forward and lifted short, the inner pair (legs 2 and 3) trailing
# low and long, an alternating gait rather than a uniform shuffle.
classes = ["sheep"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="sheep-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g stroke="#3a352f" stroke-width="1.5" stroke-linecap="round">
    <line x1="7.2" y1="17.6" x2="8.4" y2="20.6"/>
    <line x1="10.8" y1="19" x2="9.8" y2="22.2"/>
    <line x1="14.2" y1="18.6" x2="15.4" y2="21.4"/>
    <line x1="17.8" y1="18.4" x2="16.8" y2="21.8"/>
  </g>
  <g fill="url(#sheep-moving-fill)">
    <circle cx="8.4" cy="12.6" r="3.4"/>
    <circle cx="12.2" cy="11" r="3.8"/>
    <circle cx="16.2" cy="12.4" r="3.4"/>
    <circle cx="10" cy="15.4" r="3.6"/>
    <circle cx="14.4" cy="15.4" r="3.6"/>
  </g>
  <g stroke="color-mix(in srgb, currentColor 40%, black)" stroke-width="0.4" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M9 10.4 C9.6 9.8 10.4 9.8 11 10.2"/>
    <path d="M13 9 C13.6 8.6 14.4 8.7 14.9 9.2"/>
    <path d="M15.6 11 C16.1 10.6 16.8 10.7 17.2 11.2"/>
  </g>
  <ellipse cx="3.6" cy="11.4" rx="1" ry="1.3" fill="#3a352f" transform="rotate(-25 3.6 11.4)"/>
  <ellipse cx="6.6" cy="10.6" rx="1" ry="1.3" fill="#3a352f" transform="rotate(20 6.6 10.6)"/>
  <ellipse cx="5.4" cy="14.4" rx="2.6" ry="2.2" fill="#3a352f"/>
  <ellipse cx="10.6" cy="10" rx="2.6" ry="1.6" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 5.4
cy = 14.4
scale = 2.4

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
