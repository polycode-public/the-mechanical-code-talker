# badger — the pack's one fixed-palette face: a white wedge head with
# two black stripes running from nose to ear over a low, stocky,
# short-legged body, unlike every other creature in this tier where
# currentColor carries the whole animal. The stripes and face are fixed
# black/white on purpose (the same fixed-accent technique owl.toml uses
# for its eyes) since they are the animal's whole identity, not a coat
# colour a theme should ever override.
classes = ["badger"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="badger-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12.6" cy="16.6" rx="8.4" ry="4.6" fill="url(#badger-fill)"/>
  <g fill="url(#badger-fill)">
    <ellipse cx="4.6" cy="20.4" rx="1.3" ry="1.6"/>
    <ellipse cx="9" cy="21" rx="1.3" ry="1.6"/>
    <ellipse cx="16.4" cy="21" rx="1.3" ry="1.6"/>
    <ellipse cx="20.6" cy="20.4" rx="1.3" ry="1.6"/>
  </g>
  <path d="M6.4 4.8 C9 3.4 15 3.4 17.6 4.8 C19 5.6 19 8.4 17.6 10.6 C16.2 12.6 14 13.6 12 13.6 C10 13.6 7.8 12.6 6.4 10.6 C5 8.4 5 5.6 6.4 4.8 Z" fill="#f4f1ea"/>
  <circle cx="7.4" cy="5.6" r="1.6" fill="url(#badger-fill)"/>
  <circle cx="16.6" cy="5.6" r="1.6" fill="url(#badger-fill)"/>
  <path d="M10.4 4.2 C8.6 4.6 7.6 6.6 8 9 C8.3 10.8 9 11.8 9.8 11.6 C9 9.6 9 6.8 10.4 4.2 Z" fill="#1c1c1c"/>
  <path d="M13.6 4.2 C15.4 4.6 16.4 6.6 16 9 C15.7 10.8 15 11.8 14.2 11.6 C15 9.6 15 6.8 13.6 4.2 Z" fill="#1c1c1c"/>
  <circle cx="8.9" cy="8.6" r="0.35" fill="#ffffff" opacity="0.8"/>
  <circle cx="14.9" cy="8.6" r="0.35" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="12" cy="12.6" rx="1.2" ry="0.8" fill="#1c1c1c"/>
  <path d="M20.8 15.2 C23.2 14.6 23.6 17 22 17.6 C21.6 16.7 21.2 15.9 20.8 15.2 Z" fill="url(#badger-fill)"/>
  <ellipse cx="9.8" cy="18.4" rx="3.4" ry="1.6" fill="#ffffff" opacity="0.2"/>
</svg>
"""
