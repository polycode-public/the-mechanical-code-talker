# stone — an irregular gradient boulder with two fixed dark crack lines,
# gradient/highlight only: a stone's own taught colour still reads as a
# lit rock face.
classes = ["stone"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="stone-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 55%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 80%, black)"/>
    </linearGradient>
  </defs>
  <path d="M4.4 16.6 C3 13.6 5 10.4 8.4 9.6 C9.4 7 12.6 5.8 15.4 7.2 C18.8 7.4 20.8 10.4 19.8 13.6 C21 15.4 20.2 18 17.8 18.8 C15 20 8.4 20 6 18.6 C5 18 4.8 17.4 4.4 16.6 Z" fill="url(#stone-fill)"/>
  <path d="M9.4 10.4 L12.6 12.6 L11 15.8" fill="none" stroke="#000000" stroke-width="0.4" opacity="0.24"/>
  <path d="M14.6 9 L16.4 11.6" fill="none" stroke="#000000" stroke-width="0.35" opacity="0.2"/>
  <ellipse cx="9" cy="11.4" rx="2.2" ry="1.4" fill="#ffffff" opacity="0.3"/>
</svg>
"""
