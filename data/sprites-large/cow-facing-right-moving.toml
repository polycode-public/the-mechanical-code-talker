# cow-facing-right-moving — cow-facing-left-moving.toml's mid-stride
# profile mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored.
classes = ["cow"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="cow-facing-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="14.2" cy="15.1" rx="6.8" ry="4.6" fill="url(#cow-facing-right-moving-fill)"/>
    <path d="M6.6 6 L5.6 3.6" stroke="currentColor" stroke-width="1.4"/>
    <path d="M4.4 6.3 L3.8 4.5" stroke="currentColor" stroke-width="1.1" opacity="0.7"/>
    <circle cx="4.6" cy="9.3" r="4.05" fill="url(#cow-facing-right-moving-fill)"/>
    <ellipse cx="1.4" cy="10.9" rx="2" ry="1.5" fill="#e7c9c2"/>
    <circle cx="0.6" cy="10.6" r="0.4" fill="#1c1c1c"/>
    <circle cx="3.2" cy="8.3" r="0.42" fill="#1c1c1c"/>
    <g fill="#f4f1ea">
      <ellipse cx="16.8" cy="12.4" rx="2.4" ry="1.8"/>
      <ellipse cx="11.8" cy="16.8" rx="1.8" ry="1.4"/>
      <ellipse cx="19.2" cy="16.4" rx="1.6" ry="1.3"/>
    </g>
    <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="9.6" y1="18.8" x2="7.6" y2="20.4"/>
      <line x1="13" y1="19.4" x2="11.4" y2="21.2"/>
      <line x1="17" y1="19.2" x2="18.4" y2="22.6"/>
      <line x1="20.2" y1="18.6" x2="21.8" y2="22"/>
    </g>
    <g fill="#1c1c1c">
      <ellipse cx="7.5" cy="20.7" rx="0.8" ry="0.45"/>
      <ellipse cx="11.3" cy="21.5" rx="0.8" ry="0.45"/>
      <ellipse cx="18.5" cy="22.9" rx="0.8" ry="0.45"/>
      <ellipse cx="21.9" cy="22.3" rx="0.8" ry="0.45"/>
    </g>
    <ellipse cx="5" cy="7.6" rx="1.3" ry="0.9" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="12" cy="13.3" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 19.76
cy = 8.69
scale = 2.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
