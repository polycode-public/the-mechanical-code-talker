# food — a loaf at the sprite tier: the generic foodstuff class, a warm
# cream-to-brown gradient anchored to currentColor rather than the
# tier's usual neutral white/black mix (an appetising warmth fits food
# specifically), no material.
classes = ["food"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="food-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 55%, #fff2d8)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 75%, #4a2c14)"/>
    </linearGradient>
  </defs>
  <path d="M3.4 15.6 C3.4 10.4 7.2 6.6 12 6.6 C16.8 6.6 20.6 10.4 20.6 15.6 C20.6 19 17 20.6 12 20.6 C7 20.6 3.4 19 3.4 15.6 Z" fill="url(#food-fill)"/>
  <g stroke="#4a2c14" stroke-width="0.6" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M8 9.4 C7 12 7 15 8 17.6"/>
    <path d="M12 8.6 C11 11.6 11 15.6 12 18.6"/>
