# artist-moving — artist-with-emotion.toml's figure caught mid-stride while
# still facing front: selected by mgx:pose = "moving" ALONE, with no facing
# fact at all, so the head stays centred at artist-with-emotion's own front
# anchor (cx=12 cy=7.2 scale=3.2), completely unshifted. What moves is the
# same asymmetric arm-swing-and-hem-sweep silhouette
# artist-facing-left-moving.toml draws for its own stride, reused here under
# the unshifted head. Beret, pompom, palette, paint dabs, neck rectangle,
# shading strokes and highlight all keep artist-with-emotion's own exact
# coordinates.
classes = ["artist"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="artist-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#artist-moving-fill)">
    <path d="M9.4 13.4 C7.8 12.8 6.3 13.8 5.8 16.4 C5.6 17.8 6.2 18.8 7.3 18.5 C7.4 16.5 7.9 14.8 9.6 13.9 Z"/>
    <path d="M14.6 13.4 C16.7 13.8 18.7 15.6 19 18.5 C19.1 19.8 18.3 20.6 17.2 20.0 C17 17.7 16.3 15.4 14.3 14.5 Z"/>
    <path d="M6.3 21.3 C6.1 15.8 8.7 13.2 11.7 13.2 C15.1 13.2 17.6 15.1 17.1 19.9 C16.9 21.0 15.9 21.0 15.1 20.4 Z"/>
    <path d="M10.7 10 L13.3 10 L13.1 13.3 L10.9 13.3 Z"/>
  </g>
  <ellipse cx="11.3" cy="3.6" rx="4.3" ry="1.9" fill="url(#artist-moving-fill)"/>
  <circle cx="14.6" cy="2.4" r="0.6" fill="currentColor" opacity="0.85"/>
  <circle cx="12" cy="7.2" r="3.2" fill="url(#artist-moving-fill)"/>
  <path d="M10.4 12.9 L12 14.2 L13.6 12.9" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M15.4 15.6 C17.8 14.8 19.6 16.4 19.2 18.4 C19 19.4 18 19.8 17 19.4 C16.8 18.8 16.2 18.6 15.6 18.9 C14.6 19.4 13.8 18.6 14.2 17.6 C14.5 16.8 14.9 16 15.4 15.6 Z" fill="url(#artist-moving-fill)" opacity="0.95"/>
  <circle cx="16.4" cy="16.6" r="0.5" fill="#d94f4f"/>
  <circle cx="17.8" cy="16.4" r="0.5" fill="#3f7fc1"/>
  <circle cx="18.6" cy="17.6" r="0.5" fill="#e0b23c"/>
  <circle cx="16.2" cy="18.2" r="0.5" fill="#4f9e5c"/>
  <ellipse cx="9" cy="2.9" rx="1.7" ry="0.6" fill="#ffffff" opacity="0.32"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 12
cy = 7.2
scale = 3.2

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
