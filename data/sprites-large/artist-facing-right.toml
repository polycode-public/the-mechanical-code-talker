# artist-facing-right — artist-facing-left.toml's profile mirrored across
# the canvas midline. {{FACE}} sits outside the flip group.
classes = ["artist"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="artist-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#artist-facing-right-fill)">
      <path d="M9.4 13.4 C7.6 13.5 5.9 15 5.6 17.7 C5.5 19.1 6.2 20 7.2 19.5 C7.3 17.4 7.9 15.4 9.7 14.5 Z"/>
      <path d="M14.6 13.4 C16.4 13.5 18.1 15 18.4 17.7 C18.5 19.1 17.8 20 16.8 19.5 C16.7 17.4 16.1 15.4 14.3 14.5 Z"/>
      <path d="M6 21 C6 15.6 8.7 13.1 12 13.1 C15.3 13.1 18 15.6 18 21 Z"/>
      <path d="M10.7 10 L13.3 10 L13.1 13.3 L10.9 13.3 Z"/>
    </g>
    <ellipse cx="10.72" cy="3.6" rx="4.3" ry="1.9" fill="url(#artist-facing-right-fill)"/>
    <circle cx="14.02" cy="2.4" r="0.6" fill="currentColor" opacity="0.85"/>
    <circle cx="11.42" cy="7.2" r="3.2" fill="url(#artist-facing-right-fill)"/>
    <path d="M8.4 6.6 Q7.2 7.6 8.4 8.6 Z" fill="url(#artist-facing-right-fill)"/>
    <ellipse cx="9.8" cy="6.7" rx="0.27" ry="0.33" fill="#1c1c1c"/>
    <path d="M10.4 12.9 L12 14.2 L13.6 12.9" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M15.4 15.6 C17.8 14.8 19.6 16.4 19.2 18.4 C19 19.4 18 19.8 17 19.4 C16.8 18.8 16.2 18.6 15.6 18.9 C14.6 19.4 13.8 18.6 14.2 17.6 C14.5 16.8 14.9 16 15.4 15.6 Z" fill="url(#artist-facing-right-fill)" opacity="0.95"/>
    <circle cx="16.4" cy="16.6" r="0.5" fill="#d94f4f"/>
    <circle cx="17.8" cy="16.4" r="0.5" fill="#3f7fc1"/>
    <circle cx="18.6" cy="17.6" r="0.5" fill="#e0b23c"/>
    <circle cx="16.2" cy="18.2" r="0.5" fill="#4f9e5c"/>
    <ellipse cx="8.42" cy="2.9" rx="1.7" ry="0.6" fill="#ffffff" opacity="0.32"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# artist-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 10.64); cy and scale are the mirror's own invariants.
[face]
cx = 13.36
cy = 7.02
scale = 2.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
