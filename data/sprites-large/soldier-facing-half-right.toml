# soldier-facing-half-right — soldier-facing-half-left.toml's three-quarter
# turn mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins. {{FACE}} sits outside the flip group, the same rule the
# full profile pair uses.
classes = ["soldier"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="soldier-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#soldier-facing-half-right-fill)">
      <path d="M9.4 14 C7.6 14.1 5.9 15.6 5.6 18.3 C5.5 19.7 6.2 20.6 7.2 20.1 C7.3 18 7.9 16 9.7 15.1 Z"/>
      <path d="M14.6 14 C16.4 14.1 18.1 15.6 18.4 18.3 C18.5 19.7 17.8 20.6 16.8 20.1 C16.7 18 16.1 16 14.3 15.1 Z"/>
      <path d="M6 21 C6 16 8.5 13.7 12 13.7 C15.5 13.7 18 16 18 21 Z"/>
      <path d="M10.85 12.3 L13.15 12.3 L13 13.9 L11 13.9 Z"/>
    </g>
    <path d="M6.74 8.4 C6.74 5.1 8.94 2.6 11.74 2.6 C14.54 2.6 16.74 5.1 16.74 8.4 L16.74 8.7 L6.74 8.7 Z" fill="url(#soldier-facing-half-right-fill)"/>
    <path d="M6.14 8.4 L17.34 8.4 L17.34 9.4 L6.14 9.4 Z" fill="currentColor" opacity="0.5"/>
    <circle cx="11.74" cy="9.8" r="2.9" fill="url(#soldier-facing-half-right-fill)"/>
    <path d="M9.01 9.37 Q8.41 10.5 9.01 11.11 Z" fill="url(#soldier-facing-half-right-fill)"/>
    <ellipse cx="10.25" cy="9.36" rx="0.25" ry="0.29" fill="#1c1c1c"/>
    <ellipse cx="13.76" cy="9.32" rx="0.16" ry="0.19" fill="#1c1c1c"/>
    <path d="M9.3 14.5 C8 15.4 7.1 16.9 6.9 18.8" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 14.5 C16 15.4 16.9 16.9 17.1 18.8" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M7.8 13.9 L9.6 13.5 L9.9 14.6 L8.1 15 Z" fill="#6b7a4f"/>
    <circle cx="8.85" cy="14.25" r="0.3" fill="#c9a13a"/>
    <path d="M16.2 13.9 L14.4 13.5 L14.1 14.6 L15.9 15 Z" fill="#6b7a4f"/>
    <circle cx="15.15" cy="14.25" r="0.3" fill="#c9a13a"/>
    <ellipse cx="8.74" cy="5.4" rx="1.5" ry="0.6" fill="#ffffff" opacity="0.3"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# soldier-facing-half-left.toml's anchor reflected across the canvas
# midline (cx = 24 - 11.21); cy and scale are the mirror's own invariants.
[face]
cx = 12.79
cy = 9.72
scale = 2.39

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
