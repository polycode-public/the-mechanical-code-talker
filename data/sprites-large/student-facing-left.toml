# student-facing-left — student-with-emotion.toml's body turned to a left
# profile: the head shifts toward the left shoulder, the mortarboard
# (head-attached, the same way king's crown follows king's head shift)
# shifts with it and tilts a little further, a nose wedge breaks the
# head's left silhouette, and a single forward eye replaces the plain head
# circle. The robe and arms keep student.toml's own geometry. Selected
# only when the instance's own mgx:faces fact says "left". It also carries
# the shared face-fragment mechanism, so a student taught BOTH mgx:faces =
# left and one of the 6 mgx:feels words renders this profile wearing that
# mood; taught only the facing, {{FACE}} resolves to nothing and the
# profile keeps the single forward eye it draws itself.
classes = ["student"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="student-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#student-facing-left-fill)">
    <path d="M9.4 13.4 C7.6 13.5 5.9 15 5.6 17.7 C5.5 19.1 6.2 20 7.2 19.5 C7.3 17.4 7.9 15.4 9.7 14.5 Z"/>
    <path d="M14.6 13.4 C16.4 13.5 18.1 15 18.4 17.7 C18.5 19.1 17.8 20 16.8 19.5 C16.7 17.4 16.1 15.4 14.3 14.5 Z"/>
    <path d="M6 21 C6 15.5 8.7 13.1 12 13.1 C15.3 13.1 18 15.5 18 21 Z"/>
    <path d="M10.75 11.3 L13.25 11.3 L13.05 13.3 L10.95 13.3 Z"/>
  </g>
  <g transform="rotate(-14 11.44 5.3)">
    <path d="M8.64 4.9 C8.64 3.2 9.84 2 11.44 2 C13.04 2 14.24 3.2 14.24 4.9 L14.24 5.4 L8.64 5.4 Z" fill="url(#student-facing-left-fill)" opacity="0.92"/>
    <rect x="6.04" y="4.6" width="10.8" height="1.4" rx="0.2" fill="url(#student-facing-left-fill)"/>
  </g>
  <path d="M16.44 5.4 L17.04 8.6" stroke="currentColor" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
  <circle cx="17.04" cy="8.8" r="0.6" fill="#d4a72c"/>
  <circle cx="11.44" cy="8.6" r="3.1" fill="url(#student-facing-left-fill)"/>
  <path d="M8.53 8.04 Q7.35 8.97 8.53 9.96 Z" fill="url(#student-facing-left-fill)"/>
  <ellipse cx="9.84" cy="8.13" rx="0.26" ry="0.31" fill="#1c1c1c"/>
  <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from student's own front-facing head circle (cx=12 cy=8.6 r=3.1,
# student-with-emotion.toml's own [face] anchor): head shift = 0.18*3.1 =
# 0.56, so the profile head (and its mortarboard, which follows it) sits at
# cx=11.44 cy=8.6 r=3.1. The forward eye this file draws sits at
# (9.84, 8.13). scale = 0.65*3.1 = 2.02, and cx/cy place the fragment so
# its own forward eye lands on the drawn one: cx = 9.84 + 0.4*2.02 = 10.65,
# cy = 8.13 + 0.15*2.02 = 8.43.
[face]
cx = 10.65
cy = 8.43
scale = 2.02

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
