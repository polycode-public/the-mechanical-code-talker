# letter — Ashcombe Hall's own objective at the sprite tier: the envelope
# body carries the material gradient (paper's own treatment covers a
# plain envelope and a stiffer cardboard-backed one alike), the folded
# flap stays a dark overlay and the wax seal a fixed red — a seal's own
# colour comes from the wax pressed into it, not the envelope underneath.
classes = ["letter"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="letter-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="{{FILL_LIGHT}}"/>
      <stop offset="55%" stop-color="{{FILL}}"/>
      <stop offset="100%" stop-color="{{FILL_DARK}}"/>
    </linearGradient>
  </defs>
  <rect x="3" y="6" width="18" height="13" rx="1.2" fill="url(#letter-fill)"/>
  <path d="M3 6 L21 6 L21 6.8 L12 13.8 L3 6.8 Z" fill="#000000" opacity="0.16"/>
  <path d="M4 7.4 L11 12.7" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>
  <circle cx="12" cy="12.4" r="1.15" fill="#b23a2e" opacity="0.85"/>
</svg>
"""

[parameters.material]
property = "mgx:madeOf"
placeholders = { light = "{{FILL_LIGHT}}", base = "{{FILL}}", dark = "{{FILL_DARK}}" }

[parameters.material.values]
paper = "paper"
cardboard = "paper"
