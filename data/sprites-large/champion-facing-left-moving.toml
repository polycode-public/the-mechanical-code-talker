# champion-facing-left-moving — champion-facing-left.toml's profile caught
# mid-stride. The head, nose wedge, eye and brow arc hold their profile
# shape and position exactly, since a head does not change shape mid-stride.
# The champion has no visible legs under the robe, so what moved is the
# robe hem (swept back, the right side lifted clear of the ground), one arm
# swung forward and raised, the other trailing back — the same stride
# king-facing-left-moving.toml draws for its own identical robe/arm
# geometry (champion.toml's torso is byte-identical to king.toml's own).
# The ribbon, medal and laurel are chest-anchored and stay exactly where
# champion-facing-left.toml already puts them.
classes = ["champion"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="champion-facing-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#champion-facing-left-moving-fill)">
    <path d="M9.4 13.1 C7.8 12.5 6.3 13.5 5.8 16.1 C5.6 17.5 6.2 18.5 7.3 18.2 C7.4 16.2 7.9 14.5 9.6 13.6 Z"/>
    <path d="M14.6 13.1 C16.7 13.5 18.7 15.3 19 18.2 C19.1 19.5 18.3 20.3 17.2 19.7 C17 17.4 16.3 15.1 14.3 14.2 Z"/>
    <path d="M6.3 21 C6.1 15.5 8.7 12.9 11.7 12.9 C15.1 12.9 17.6 14.8 17.1 19.6 C16.9 20.7 15.9 20.7 15.1 20.1 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <path d="M10.4 13.6 L12 16.8 L13.6 13.6" fill="none" stroke="#a6283a" stroke-width="1" stroke-linecap="round"/>
  <circle cx="12" cy="18.2" r="2" fill="#d9a635"/>
  <circle cx="12" cy="18.2" r="1.1" fill="#8a5a2e"/>
  <g fill="#4a7a34">
    <ellipse cx="9.6" cy="17.7" rx="0.5" ry="0.22" transform="rotate(-30 9.6 17.7)"/>
    <ellipse cx="14.4" cy="17.7" rx="0.5" ry="0.22" transform="rotate(30 14.4 17.7)"/>
  </g>
  <circle cx="11.4" cy="6.6" r="3.3" fill="url(#champion-facing-left-moving-fill)"/>
  <path d="M8.3 6 Q7.05 7 8.3 8.05 Z" fill="url(#champion-facing-left-moving-fill)"/>
  <ellipse cx="9.7" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.0 4.2 C9.7 3.6 10.5 3.4 11.4 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 10.5
cy = 6.4
scale = 2.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
