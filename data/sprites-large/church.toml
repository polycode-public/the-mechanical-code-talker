# church — room.toml's own card, its interior swapped for a pointed
# spire, an arched door and a rose window glazed in four fixed jewel
# tones. Stained glass is the one identity marker no other place sprite
# in the pack can claim, and it is what actually separates church from a
# plain domestic room at 40px.
