# rabbit-with-emotion — copies rabbit.toml's upgraded shape exactly. The
# ears sit well above the head circle's own top edge, so [face] can use that
# head circle directly without colliding with them; rabbit.toml's own fixed
# eye and nose are dropped, the same dog precedent, since they sit where the
# real eyes now go.
classes = ["rabbit"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="rabbit-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="9" cy="5.4" rx="1.5" ry="4.8" fill="url(#rabbit-with-emotion-fill)" transform="rotate(-14 9 5.4)"/>
  <ellipse cx="13.4" cy="5.4" rx="1.5" ry="4.8" fill="url(#rabbit-with-emotion-fill)" transform="rotate(14 13.4 5.4)"/>
  <ellipse cx="9" cy="5.8" rx="0.65" ry="3.2" fill="#e3aca6" opacity="0.7" transform="rotate(-14 9 5.8)"/>
  <ellipse cx="13.4" cy="5.8" rx="0.65" ry="3.2" fill="#e3aca6" opacity="0.7" transform="rotate(14 13.4 5.8)"/>
  <ellipse cx="12" cy="16" rx="6" ry="5.4" fill="url(#rabbit-with-emotion-fill)"/>
  <circle cx="10.4" cy="9.6" r="4.2" fill="url(#rabbit-with-emotion-fill)"/>
  <circle cx="18" cy="17.6" r="1.8" fill="url(#rabbit-with-emotion-fill)"/>
  <g fill="url(#rabbit-with-emotion-fill)">
    <ellipse cx="7.2" cy="18.4" rx="1.4" ry="1.7"/>
    <ellipse cx="15.6" cy="20.2" rx="1.4" ry="1.7"/>
  </g>
  <g stroke="#1c1c1c" stroke-width="0.2" opacity="0.4" stroke-linecap="round">
    <path d="M9.8 11.2 L6.6 10.6"/>
    <path d="M9.8 11.6 L6.6 12"/>
    <path d="M11 11.6 L13.6 12.6"/>
  </g>
  <ellipse cx="8.6" cy="12.6" rx="2.4" ry="1.4" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="9.4" cy="8.6" rx="1.1" ry="0.8" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r rabbit.toml's own head circle declares.
[face]
cx = 10.4
cy = 9.6
scale = 4.2

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
