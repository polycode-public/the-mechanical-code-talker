# frog-facing-left-moving — frog-facing-left.toml's own profile caught
# mid hop. The eyes, snout and face anchor stay exactly as that file draws
# them, since a head does not change shape mid-jump. What moves: the two
# resting leg lobes stretch into kicked-out, extended legs trailing behind
# and below, and the body dips slightly into the launch.
classes = ["frog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="frog-facing-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#a8d068"/>
      <stop offset="55%" stop-color="#5a9040"/>
      <stop offset="100%" stop-color="#2f5322"/>
    </linearGradient>
  </defs>
  <ellipse cx="14.5" cy="15.5" rx="7.4" ry="5.2" fill="url(#frog-facing-left-moving-fill)"/>
  <ellipse cx="19" cy="19.8" rx="4.2" ry="1.7" fill="url(#frog-facing-left-moving-fill)" transform="rotate(-18 19 19.8)"/>
  <ellipse cx="22" cy="16.8" rx="2.8" ry="1.2" fill="url(#frog-facing-left-moving-fill)" transform="rotate(-25 22 16.8)"/>
  <g stroke="#2f5322" stroke-width="0.9" stroke-linecap="round">
    <path d="M22.6 18.7 L23.6 19.4"/><path d="M22.2 20.3 L23 21.3"/>
  </g>
  <ellipse cx="11.8" cy="17.2" rx="2.6" ry="1.7" fill="#dcead0" opacity="0.55"/>
  <ellipse cx="8.6" cy="13.6" rx="1.3" ry="0.9" fill="#2f5322" opacity="0.4"/>
  <circle cx="9.8" cy="9.8" r="1.1" fill="url(#frog-facing-left-moving-fill)"/>
  <circle cx="9.8" cy="9.7" r="0.75" fill="#f4ecd8"/>
  <circle cx="6" cy="9" r="2.8" fill="url(#frog-facing-left-moving-fill)"/>
  <circle cx="6" cy="8.8" r="2" fill="#f4ecd8"/>
  <path d="M3.4 9.6 C1.8 9.8 1.4 10.8 2.4 11.6 C3.4 12 4.4 10.8 3.4 9.6 Z" fill="#5a9040"/>
  <ellipse cx="12" cy="14" rx="2.4" ry="1.3" fill="#ffffff" opacity="0.22"/>
  <ellipse cx="4.8" cy="7.8" rx="0.6" ry="0.45" fill="#ffffff" opacity="0.6"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 6.62
cy = 9.03
scale = 1.55

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
