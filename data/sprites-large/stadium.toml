# stadium — concentric bowl tiers of fixed poured concrete around a
# fixed turf pitch, with a floodlight mast standing at each end. Concrete
# and turf are fixed because they are the ground's and structure's own
# real colours in any stadium, whatever a theme's accent runs to.
classes = ["stadium"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="stadium-bowl" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#c7cdd3"/>
      <stop offset="100%" stop-color="#8b929a"/>
    </linearGradient>
    <linearGradient id="stadium-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ea25a"/>
      <stop offset="100%" stop-color="#3f7a3d"/>
    </linearGradient>
    <radialGradient id="stadium-lamp" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff6c4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff6c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1.6" y="4" width="20.8" height="16" rx="7" fill="url(#stadium-bowl)" stroke="#5c636b" stroke-width="1"/>
  <rect x="4.4" y="6.4" width="15.2" height="11.2" rx="4.5" fill="none" stroke="#5c636b" stroke-width="1"/>
  <rect x="6.6" y="8.4" width="10.8" height="7.2" rx="1" fill="url(#stadium-field)"/>
  <path d="M12 8.4 V15.6 M6.6 12 H17.4" stroke="#ffffff" stroke-width="0.4" opacity="0.7"/>
  <circle cx="12" cy="12" r="1.6" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.7"/>
  <line x1="1.8" y1="4.6" x2="1.8" y2="1.2" stroke="#6b7178" stroke-width="0.7"/>
  <circle cx="1.8" cy="1" r="1" fill="url(#stadium-lamp)"/>
  <rect x="1.1" y="0.5" width="1.4" height="1" fill="#3a3d40"/>
  <line x1="22.2" y1="4.6" x2="22.2" y2="1.2" stroke="#6b7178" stroke-width="0.7"/>
  <circle cx="22.2" cy="1" r="1" fill="url(#stadium-lamp)"/>
  <rect x="21.5" y="0.5" width="1.4" height="1" fill="#3a3d40"/>
</svg>
"""
