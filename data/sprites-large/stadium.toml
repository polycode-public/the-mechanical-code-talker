# stadium — concentric tiers around a green pitch earn the extra detail
# budget a castle-like structure's own rings deserve; the pitch itself is
# the one fixed-colour fill in the pack's places, since turf reads as turf
# regardless of theme the way room.toml's own wash never does.
classes = ["stadium"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="stadium-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="stadium-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ea25a"/>
      <stop offset="100%" stop-color="#3f7a3d"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="12.6" rx="10.2" ry="7.2" fill="url(#stadium-fill)"/>
  <ellipse cx="12" cy="12.6" rx="10.2" ry="7.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <ellipse cx="12" cy="12.6" rx="7.6" ry="5.3" fill="none" stroke="currentColor" stroke-width="1"/>
  <ellipse cx="12" cy="12.6" rx="5.2" ry="3.6" fill="url(#stadium-field)"/>
  <path d="M12 9 V16.2 M8 12.6 H16" stroke="#ffffff" stroke-width="0.4" opacity="0.6"/>
  <g fill="currentColor">
    <rect x="1.2" y="10.6" width="1" height="3.2"/>
    <rect x="21.8" y="10.6" width="1" height="3.2"/>
  </g>
  <ellipse cx="7.4" cy="8.2" rx="2.4" ry="1" fill="#ffffff" opacity="0.25"/>
</svg>
"""
