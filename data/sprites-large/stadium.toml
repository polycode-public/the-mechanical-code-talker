# stadium — concentric tiers around a green pitch earn the extra detail
# budget a castle-like structure's own rings deserve; the pitch itself is
# the one fixed-colour fill in the pack's places, since turf reads as turf
# regardless of theme the way room.toml's own wash never does.
classes = ["stadium"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="stadium-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="stadium-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ea25a"/>
      <stop offset="100%" stop-color="#3f7a3d"/>
    </linearGradient>
  </defs>
  <rect x="1.6" y="4" width="20.8" height="16" rx="7" fill="url(#stadium-fill)"/>
  <rect x="1.6" y="4" width="20.8" height="16" rx="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <rect x="4.4" y="6.4" width="15.2" height="11.2" rx="4.5" fill="none" stroke="currentColor" stroke-width="1"/>
  <rect x="6.6" y="8.4" width="10.8" height="7.2" rx="1" fill="url(#stadium-field)"/>
  <path d="M12 8.4 V15.6 M6.6 12 H17.4" stroke="#ffffff" stroke-width="0.4" opacity="0.7"/>
  <circle cx="12" cy="12" r="1.6" fill="none" stroke="#ffffff" stroke-width="0.35" opacity="0.7"/>
  <g fill="currentColor">
    <rect x="0.4" y="2.2" width="1" height="3.4"/>
    <rect x="22.6" y="2.2" width="1" height="3.4"/>
    <rect x="0.4" y="18.4" width="1" height="3.4"/>
    <rect x="22.6" y="18.4" width="1" height="3.4"/>
  </g>
  <path d="M4.4 6.6 A4.5 4.5 0 0 1 8.6 4.1" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>
</svg>
"""
