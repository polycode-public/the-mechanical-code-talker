# teacher-facing-half-left-moving — the three-quarter turn caught mid-stride:
# teacher-facing-half-left.toml's head, both-eye glasses and book hold their
# shape and position exactly, while the arms and torso hem take the same
# forward-swept, trailing-arm redraw king-facing-left-moving.toml uses for
# its own stride (a walk cycle's arm swing does not depend on the exact
# angle the head is turned to).
classes = ["teacher"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="teacher-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#teacher-facing-half-left-moving-fill)">
    <path d="M9.4 13.1 C7.8 12.5 6.3 13.5 5.8 16.1 C5.6 17.5 6.2 18.5 7.3 18.2 C7.4 16.2 7.9 14.5 9.6 13.6 Z"/>
    <path d="M14.6 13.1 C16.7 13.5 18.7 15.3 19 18.2 C19.1 19.5 18.3 20.3 17.2 19.7 C17 17.4 16.3 15.1 14.3 14.2 Z"/>
    <path d="M6.3 21 C6.1 15.5 8.7 12.9 11.7 12.9 C15.1 12.9 17.6 14.8 17.1 19.6 C16.9 20.7 15.9 20.7 15.1 20.1 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <circle cx="11.7" cy="6.6" r="3.3" fill="url(#teacher-facing-half-left-moving-fill)"/>
  <path d="M8.6 6.1 Q7.9 7.4 8.6 8.1 Z" fill="url(#teacher-facing-half-left-moving-fill)"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 13.9 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9 15.4 L12 14.6 L12 19.8 L9 20.4 Z" fill="url(#teacher-facing-half-left-moving-fill)" opacity="0.95"/>
  <path d="M15 15.4 L12 14.6 L12 19.8 L15 20.4 Z" fill="url(#teacher-facing-half-left-moving-fill)" opacity="0.85"/>
  <path d="M12 14.6 L12 19.8" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
  <ellipse cx="10" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <ellipse cx="14" cy="6.05" rx="0.18" ry="0.22" fill="#1c1c1c"/>
  <circle cx="10" cy="6.1" r="0.95" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
  <circle cx="10" cy="6.1" r="0.85" fill="none" stroke="#1c1c1c" stroke-width="0.3" opacity="0.85"/>
  <circle cx="14" cy="6.05" r="0.7" fill="none" stroke="#ffffff" stroke-width="0.45" opacity="0.5"/>
  <circle cx="14" cy="6.05" r="0.6" fill="none" stroke="#1c1c1c" stroke-width="0.25" opacity="0.85"/>
  <path d="M10.85 6.1 L13.4 6.05" stroke="#1c1c1c" stroke-width="0.3" opacity="0.85"/>
  <path d="M9.3 4.2 C10.0 3.6 10.8 3.4 11.7 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 11.08
cy = 6.51
scale = 2.7

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
