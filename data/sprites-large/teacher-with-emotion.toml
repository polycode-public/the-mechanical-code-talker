# teacher-with-emotion — the same glasses-and-book body as teacher.toml,
# plus the shared face-fragment mechanism (sprite-expressions.mjs): a
# required [face] anchor and a {{FACE}} placeholder that resolves to
# whichever of the 6 curated mgx:feels words the instance's own fact
# names. No mgx:feels fact falls through to the plain teacher.toml
# sprite. {{FACE}} sits as the last child before </svg>; the glasses'
# lens rings are drawn wider than the face fragment's own eye shapes, so
# the resolved eyes sit inside the frames rather than being erased by
# them.
classes = ["teacher"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="teacher-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#teacher-with-emotion-fill)">
    <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
    <path d="M14.6 13.1 C16.4 13.2 18.1 14.7 18.4 17.4 C18.5 18.8 17.8 19.7 16.8 19.2 C16.7 17.1 16.1 15.1 14.3 14.2 Z"/>
    <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#teacher-with-emotion-fill)"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 13.9 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M9 15.4 L12 14.6 L12 19.8 L9 20.4 Z" fill="url(#teacher-with-emotion-fill)" opacity="0.95"/>
  <path d="M15 15.4 L12 14.6 L12 19.8 L15 20.4 Z" fill="url(#teacher-with-emotion-fill)" opacity="0.85"/>
  <path d="M12 14.6 L12 19.8" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
  <circle cx="10.7" cy="6.3" r="0.95" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
  <circle cx="13.3" cy="6.3" r="0.95" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
  <circle cx="10.7" cy="6.3" r="0.85" fill="none" stroke="#1c1c1c" stroke-width="0.3" opacity="0.85"/>
  <circle cx="13.3" cy="6.3" r="0.85" fill="none" stroke="#1c1c1c" stroke-width="0.3" opacity="0.85"/>
  <path d="M11.5 6.3 L12.5 6.3" stroke="#1c1c1c" stroke-width="0.3" opacity="0.85"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r teacher.toml's own head circle declares.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
