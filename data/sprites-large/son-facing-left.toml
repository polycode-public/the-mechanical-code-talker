# son-facing-left — son-with-emotion.toml's body turned to a left profile:
# the head shifts toward the left shoulder, a nose wedge breaks the head's
# left silhouette, and a single forward eye replaces the plain head circle.
# The robe, arms and hair-swoosh keep son.toml's own geometry — a robe reads
# the same from the side. Selected only when the instance's own mgx:faces
# fact says "left". It also carries the shared face-fragment mechanism, so a
# son taught BOTH mgx:faces = left and one of the 6 mgx:feels words renders
# this profile wearing that mood; taught only the facing, {{FACE}} resolves
# to nothing and the profile keeps the single forward eye it draws itself.
classes = ["son"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="son-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#son-facing-left-fill)">
    <path d="M9.4 14.9 C7.9 15 6.5 16.2 6.3 18.3 C6.25 19.4 6.9 20.1 7.7 19.7 C7.8 18 8.3 16.5 9.7 15.8 Z"/>
    <path d="M14.6 14.9 C16.1 15 17.5 16.2 17.7 18.3 C17.75 19.4 17.1 20.1 16.3 19.7 C16.2 18 15.7 16.5 14.3 15.8 Z"/>
    <path d="M7.4 21 C7.4 16.6 9.4 14.6 12 14.6 C14.6 14.6 16.6 16.6 16.6 21 Z"/>
    <path d="M10.8 11.4 L13.2 11.4 L13 14.6 L11 14.6 Z"/>
  </g>
  <ellipse cx="10.2" cy="18" rx="1.1" ry="1.6" fill="#ffffff" opacity="0.1"/>
  <circle cx="11.35" cy="8.2" r="3.6" fill="url(#son-facing-left-fill)"/>
  <path d="M7.97 7.55 Q6.6 8.63 7.97 9.78 Z" fill="url(#son-facing-left-fill)"/>
  <ellipse cx="9.5" cy="7.65" rx="0.31" ry="0.36" fill="#1c1c1c"/>
  <path d="M9.3 15.3 C8.3 16 7.6 17.2 7.4 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 15.3 C15.7 16 16.4 17.2 16.6 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.15 6.95 C9.75 6.45 10.45 6.25 11.35 6.35" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from son's own front-facing head circle (cx=12 cy=8.2 r=3.6,
# son-with-emotion.toml's own [face] anchor, identical to sister's): head
# shift = 0.18*3.6 = 0.65, so the profile head sits at cx=11.35 cy=8.2
# r=3.6. The forward eye this file draws sits at (9.5, 7.65). scale =
# 0.65*3.6 = 2.34, and cx/cy place the fragment so its own forward eye
# lands on the drawn one: cx = 9.5 + 0.4*2.34 = 10.44, cy = 7.65 +
# 0.15*2.34 = 8.0.
[face]
cx = 10.44
cy = 8.0
scale = 2.34

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
