# tiger-facing-left — tiger-with-emotion.toml's striped figure turned to a
# left profile: the head circle, both ear triangles, both cheek patches and
# the light backing patch behind {{FACE}} all move together as one block
# (the king-facing-left.toml precedent for a head-worn/head-attached group),
# and a small nose wedge plus a single forward eye are added inside that
# block. Body ellipse, leg strokes, paw marks, the six stripe strokes, the
# tail and the body highlight all keep tiger-with-emotion's own exact
# coordinates — this class's own front view already lays its legs out in a
# single row along the body's base rather than a symmetric front spread, so
# it reads the same turned to profile without redrawing. The light backing
# patch is kept behind {{FACE}} for the same legibility reason
# tiger-with-emotion.toml's own comment gives (this class's darker gradient
# stops need it).
classes = ["tiger"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="tiger-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15" rx="6.6" ry="4.4" fill="url(#tiger-facing-left-fill)"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="8" y1="18.4" x2="7.8" y2="21.6"/>
    <line x1="11" y1="19.2" x2="11" y2="22"/>
    <line x1="15" y1="19.2" x2="15.2" y2="22"/>
    <line x1="18" y1="18.2" x2="18.4" y2="21.4"/>
  </g>
  <g fill="url(#tiger-facing-left-fill)">
    <ellipse cx="7.8" cy="21.9" rx="0.9" ry="0.55"/>
    <ellipse cx="11" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="15.2" cy="22.2" rx="0.9" ry="0.55"/>
    <ellipse cx="18.4" cy="21.7" rx="0.9" ry="0.55"/>
  </g>
  <circle cx="6.31" cy="9" r="3.8" fill="url(#tiger-facing-left-fill)"/>
  <path d="M3.51 6.4 L2.51 3 L5.71 5 Z" fill="url(#tiger-facing-left-fill)"/>
  <path d="M8.71 6 L9.31 2.6 L11.71 5.2 Z" fill="url(#tiger-facing-left-fill)"/>
  <ellipse cx="4.91" cy="10.6" rx="1" ry="0.8" fill="#f4ede0"/>
  <ellipse cx="7.61" cy="10.6" rx="1" ry="0.8" fill="#f4ede0"/>
  <path d="M3.0 8.5 Q2.2 9.0 3.0 9.5 Z" fill="url(#tiger-facing-left-fill)"/>
  <ellipse cx="4.3" cy="8.6" rx="0.32" ry="0.38" fill="#1c1c1c"/>
  <g stroke="#000000" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M8.6 12 L12 10.6"/>
    <path d="M9 14.8 L13 14"/>
    <path d="M9.4 17.6 L13 17.4"/>
    <path d="M15.2 11.6 L18.2 11"/>
    <path d="M15.8 14.8 L19 15"/>
    <path d="M15.6 17.8 L18.6 18.2"/>
  </g>
  <path d="M19 13 C22 12.4 22.4 15.2 20 16 Z" fill="url(#tiger-facing-left-fill)"/>
  <ellipse cx="9.6" cy="12.2" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="6.31" cy="9" rx="3.3" ry="2.9" fill="#ffffff" opacity="0.22"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from THIS file's own profile geometry, not copied from
# tiger-with-emotion.toml's front-facing anchor (cx=7 cy=9 scale=3.8): the
# head-and-ears block shifts left to cx=6.31 (delta -0.69, proportional to
# king's own -0.6 delta scaled by tiger's r=3.8 vs king's r=3.3), and the
# forward eye this file already draws sits at (4.3, 8.6). scale is ~0.65 of
# the head radius (2.5): cx = 4.3 + 0.4*2.5 = 5.3, cy = 8.6 + 0.15*2.5 = 8.98.
[face]
cx = 5.3
cy = 8.98
scale = 2.5

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
