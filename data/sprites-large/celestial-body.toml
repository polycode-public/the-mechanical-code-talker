# celestial body — filed as celestial-body.toml per this project's own
# space-to-hyphen convention. The generic ancestor behind planet.toml
# (atmosphere band) and star.toml (glowing rays): a cratered sphere with a
# faint ring, since cratering is what a body with no atmosphere or light of
# its own reads as. The sphere stays the tier's own currentColor gradient
# like planet.toml's; only the two twinkling flecks nearby are fixed
# warm-gold, the same fixed accent star.toml uses for starlight itself.
classes = ["celestial body"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <radialGradient id="celestial-body-fill" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 55%, white)"/>
      <stop offset="60%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 80%, black)"/>
    </radialGradient>
    <radialGradient id="celestial-body-sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="11" cy="14.4" rx="9.4" ry="2.4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45"/>
  <circle cx="11" cy="13" r="6.2" fill="url(#celestial-body-fill)"/>
  <g fill="color-mix(in srgb, currentColor 75%, black)" opacity="0.35">
    <circle cx="9" cy="10.4" r="1.3"/>
    <circle cx="13.4" cy="9.6" r="0.85"/>
    <circle cx="8.6" cy="15" r="1.5"/>
    <circle cx="13.8" cy="15.4" r="0.95"/>
  </g>
  <ellipse cx="8.6" cy="10.2" rx="2.2" ry="1.6" fill="url(#celestial-body-sheen)"/>
  <g stroke="#ffe9a8" stroke-width="0.6" stroke-linecap="round" opacity="0.8">
    <path d="M19.2 5 L19.2 6.4 M18.5 5.7 L19.9 5.7"/>
  </g>
  <g stroke="#ffe9a8" stroke-width="0.5" stroke-linecap="round" opacity="0.65">
    <path d="M3.6 18 L3.6 19 M3.1 18.5 L4.1 18.5"/>
  </g>
</svg>
"""
