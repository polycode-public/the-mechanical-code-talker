# dog-moving — dog-with-emotion.toml's front view caught mid-stride, the
# turntable's centre position (the absent mgx:faces fact) paired with the
# mgx:pose = moving fact alone, so a single [match] table is enough — the
# same shape a lone [[match]] entry already collapses to.
#
# A front view shows all four legs at once rather than a near/far pair, so
# the profile files' own forward-swing cue doesn't apply directly. Instead
# the two outer legs (the front legs) lift and draw slightly in, the two
# inner legs (the back legs) plant and spread slightly out — the diagonal
# gait read from the front, front-left with back-right lifting together and
# front-right with back-left planting together, the lifted pair's paws
# foreshortened the same way dog-facing-left-moving.toml's own lifted paws
# are. The tail sweeps back with the same per-point offset that file applies
# to dog-facing-left.toml's own tail curve, and the body dips down slightly
# under the stride, matching that same +0.4 body drop.
classes = ["dog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="dog-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15.4" rx="6.4" ry="4.3" fill="url(#dog-moving-fill)"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="7.3" y1="18" x2="7.1" y2="20.6"/>
    <line x1="10.3" y1="19.4" x2="10.3" y2="22.4"/>
    <line x1="15.3" y1="18.8" x2="15.5" y2="21"/>
    <line x1="18.3" y1="18.4" x2="18.7" y2="21.8"/>
  </g>
  <g fill="url(#dog-moving-fill)">
    <ellipse cx="7.1" cy="20.7" rx="0.8" ry="0.5"/>
    <ellipse cx="10.3" cy="22.6" rx="0.9" ry="0.55"/>
    <ellipse cx="15.5" cy="21" rx="0.8" ry="0.5"/>
    <ellipse cx="18.7" cy="22.1" rx="0.9" ry="0.55"/>
  </g>
  <circle cx="7" cy="9" r="3.6" fill="url(#dog-moving-fill)"/>
  <path d="M4.5 6.5 L2 3 L6 5 Z" fill="url(#dog-moving-fill)"/>
  <path d="M9.5 6.5 L12 3 L8 5 Z" fill="url(#dog-moving-fill)"/>
  <path d="M19 12.7 C22.4 10.9 22.9 13.7 19.8 15.1 Z" fill="url(#dog-moving-fill)"/>
  <ellipse cx="3.8" cy="9.4" rx="0.6" ry="0.5" fill="#1c1c1c"/>
  <ellipse cx="9.6" cy="12.6" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.28"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:pose"
value = "moving"

# The same cx/cy/r dog.toml's own head circle declares — the head doesn't
# move mid-stride.
[face]
cx = 7
cy = 9
scale = 3.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
