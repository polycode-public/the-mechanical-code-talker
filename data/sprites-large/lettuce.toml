# lettuce — a round head of ruffled leaves with a pale heart showing at the
# centre. The scalloped top rim is what carries the identity: a plain green
# dome reads as a bush, four overlapping ruffles read as a wrapped head.
# Green is fixed for the same reason the carrot's orange is, and the veins
# stay wide enough to survive the 28px draw in the mud room view.
