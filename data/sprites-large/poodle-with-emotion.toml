# poodle-with-emotion — copies dog-with-emotion.toml's shape exactly. The
# pompom curl cluster sits just above the head circle's own top edge, so
# [face] can use that head circle directly without colliding with it;
# poodle.toml carries no eye/mouth markup to drop, so nothing is removed.
classes = ["poodle"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="poodle-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15" rx="6.4" ry="4.6" fill="url(#poodle-with-emotion-fill)"/>
  <ellipse cx="10.8" cy="13.2" rx="1.8" ry="1.3" fill="#000000" opacity="0.18"/>
  <circle cx="7" cy="8.5" r="4" fill="url(#poodle-with-emotion-fill)"/>
  <g fill="url(#poodle-with-emotion-fill)">
    <circle cx="4" cy="6" r="1.6"/>
    <circle cx="7" cy="4.2" r="1.7"/>
    <circle cx="10" cy="6" r="1.6"/>
  </g>
  <rect x="18.5" y="14" width="2.2" height="6" rx="1.1" fill="url(#poodle-with-emotion-fill)"/>
  <circle cx="19.6" cy="13" r="1.5" fill="url(#poodle-with-emotion-fill)"/>
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <line x1="9" y1="19.5" x2="9" y2="22"/>
    <line x1="17" y1="19.5" x2="17" y2="22"/>
  </g>
  <ellipse cx="9.6" cy="12.2" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="5.6" cy="7" rx="1.3" ry="1" fill="#ffffff" opacity="0.32"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r poodle.toml's own head circle declares.
[face]
cx = 7
cy = 8.5
scale = 4

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
