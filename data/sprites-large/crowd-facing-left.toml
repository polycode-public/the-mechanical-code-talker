# crowd-facing-left — crowd.toml's three-figure composite with the center,
# frontmost figure (cx=12 cy=7.6 r=3) turned to a left profile: its head
# shifts toward the left shoulder, a nose wedge breaks its silhouette, and a
# single forward eye replaces the front-facing pair. The two flanking
# figures (opacity 0.6) keep crowd.toml's own geometry untouched — they are
# the anonymous-many background crowd-with-emotion.toml's own header already
# reads as never carrying a face, so only the frontmost figure turns.
# Selected only when the instance's own mgx:faces fact says "left".
classes = ["crowd"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="crowd-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g opacity="0.6">
    <path d="M3.2 14.5 C1.9 14.6 0.6 15.7 0.4 17.8 C0.3 18.8 0.8 19.5 1.6 19.1 C1.6 17.6 2.1 16.0 3.5 15.4 Z" fill="url(#crowd-facing-left-fill)"/>
    <path d="M7.2 14.5 C8.5 14.6 9.8 15.7 10.0 17.8 C10.1 18.8 9.6 19.5 8.8 19.1 C8.8 17.6 8.3 16.0 6.9 15.4 Z" fill="url(#crowd-facing-left-fill)"/>
    <path d="M1.4 22 C1.4 17.8 3 15.9 5.2 15.9 C7.4 15.9 9 17.8 9 22 Z" fill="url(#crowd-facing-left-fill)"/>
    <circle cx="5.2" cy="9.6" r="2.5" fill="url(#crowd-facing-left-fill)"/>
  </g>
  <g opacity="0.6">
    <path d="M16.8 14.5 C15.5 14.6 14.2 15.7 14.0 17.8 C13.9 18.8 14.4 19.5 15.2 19.1 C15.2 17.6 15.7 16.0 17.1 15.4 Z" fill="url(#crowd-facing-left-fill)"/>
    <path d="M20.8 14.5 C22.1 14.6 23.4 15.7 23.6 17.8 C23.7 18.8 23.2 19.5 22.4 19.1 C22.4 17.6 21.9 16.0 20.5 15.4 Z" fill="url(#crowd-facing-left-fill)"/>
    <path d="M15 22 C15 17.8 16.6 15.9 18.8 15.9 C21 15.9 22.6 17.8 22.6 22 Z" fill="url(#crowd-facing-left-fill)"/>
    <circle cx="18.8" cy="9.6" r="2.5" fill="url(#crowd-facing-left-fill)"/>
  </g>
  <path d="M9.6 13.5 C8.0 13.6 6.5 15.0 6.2 17.4 C6.1 18.7 6.7 19.5 7.6 19.1 C7.7 17.1 8.3 15.3 9.9 14.5 Z" fill="url(#crowd-facing-left-fill)"/>
  <path d="M14.4 13.5 C16.0 13.6 17.5 15.0 17.8 17.4 C17.9 18.7 17.3 19.5 16.4 19.1 C16.3 17.1 15.7 15.3 14.1 14.5 Z" fill="url(#crowd-facing-left-fill)"/>
  <path d="M6.8 22 C6.8 17.1 9 14.9 12 14.9 C15 14.9 17.2 17.1 17.2 22 Z" fill="url(#crowd-facing-left-fill)"/>
  <ellipse cx="10.5" cy="17.1" rx="1.3" ry="2" fill="#ffffff" opacity="0.1"/>
  <circle cx="11.45" cy="7.6" r="3" fill="url(#crowd-facing-left-fill)"/>
  <path d="M8.6 7.06 Q7.5 7.96 8.6 8.92 Z" fill="url(#crowd-facing-left-fill)"/>
  <ellipse cx="9.9" cy="7.14" rx="0.25" ry="0.31" fill="#1c1c1c"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from THIS file's own profile geometry, scaled from the center
# figure's own head radius (r=3, smaller than an individual portrait's 3.3):
# the head shifts left by 0.1818 * 3 = 0.545, rounded to 0.55, so cx = 11.45.
# The forward eye this file draws sits at (9.9, 7.14), the same
# (-0.515, -0.152)*r offset from the shifted head centre the individual
# portraits use. scale is 0.6364 * 3 = 1.91, rounded to 1.9, and cx/cy place
# the fragment so its own forward eye lands on the drawn one:
# cx = 9.9 + 0.4*1.9 = 10.66, cy = 7.14 + 0.15*1.9 = 7.425.
[face]
cx = 10.66
cy = 7.425
scale = 1.9

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
