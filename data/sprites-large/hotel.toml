# hotel — a many-windowed building marked by a fixed striped entrance
# awning and a gold roof pennant, the two features that read "hotel"
# rather than "house" at 40px. Fixed warm-lit windows and the awning's
# burgundy-and-cream stripe read as canonical hotel dressing regardless
# of theme colour.
classes = ["hotel"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="hotel-wash" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 45%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 72%, black)"/>
    </linearGradient>
  </defs>
  <rect x="5" y="4.6" width="14" height="16.4" rx="0.6" fill="url(#hotel-wash)"/>
  <rect x="5" y="4.6" width="14" height="16.4" rx="0.6" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <line x1="12" y1="4.6" x2="12" y2="1.4" stroke="currentColor" stroke-width="1"/>
  <path d="M12 1.6 L16 2.8 L12 4 Z" fill="#c9a227"/>
  <g fill="#ffd27a">
    <rect x="7.4" y="7.4" width="2.4" height="2.4"/>
    <rect x="14.2" y="7.4" width="2.4" height="2.4"/>
    <rect x="7.4" y="11.6" width="2.4" height="2.4"/>
    <rect x="14.2" y="11.6" width="2.4" height="2.4"/>
  </g>
  <rect x="8.6" y="15" width="6.8" height="2.2" rx="0.3" fill="#7a2e2e"/>
  <g fill="#f4ecdf">
    <rect x="9.4" y="15" width="1" height="2.2"/>
    <rect x="11.4" y="15" width="1" height="2.2"/>
    <rect x="13.4" y="15" width="1" height="2.2"/>
  </g>
  <rect x="10" y="17.4" width="4" height="3.6" fill="color-mix(in srgb, currentColor 80%, black)"/>
  <path d="M6.4 6.4 L6.4 18.6" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
</svg>
"""
