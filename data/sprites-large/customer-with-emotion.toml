# customer-with-emotion — same shopping-bag silhouette as customer.toml,
# plus a required [face] anchor and a {{FACE}} placeholder that resolves to
# whichever of the 6 curated mgx:feels words the instance's own fact names.
# No mgx:feels fact falls through to the plain customer.toml sprite.
classes = ["customer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="customer-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#customer-with-emotion-fill)"/>
  <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z" fill="url(#customer-with-emotion-fill)"/>
  <path d="M17.6 15.3 C17.6 13.4 18.6 12.4 19.9 12.5 C21.2 12.6 22 13.7 21.9 15.3" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
  <path d="M16.9 15.2 L22.6 15.2 L23.1 20.4 L16.4 20.4 Z" fill="url(#customer-with-emotion-fill)" opacity="0.92"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r customer.toml's own head circle declares.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
