# castle — a structure at the sprite tier, currentColor gradient-shaded
# like the creature sprites: no material table, since stone isn't one of
# the 8 shared treatments and a castle reads as stone far more often than
# any of them. The extra byte budget goes on what actually earns it —
# two crenellated corner towers, a crenellated curtain wall, an arched
# gate cut as a dark overlay and a flag on its own pole.
classes = ["castle"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="castle-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 55%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <rect x="3.6" y="9.6" width="3.6" height="10.4" fill="url(#castle-fill)"/>
  <rect x="16.8" y="9.6" width="3.6" height="10.4" fill="url(#castle-fill)"/>
  <path d="M3.6 9.6 L3.6 7.4 L4.5 8.4 L5.4 7 L6.3 8.4 L7.2 7.4 L7.2 9.6 Z" fill="url(#castle-fill)"/>
  <path d="M16.8 9.6 L16.8 7.4 L17.7 8.4 L18.6 7 L19.5 8.4 L20.4 7.4 L20.4 9.6 Z" fill="url(#castle-fill)"/>
  <rect x="7.2" y="12" width="9.6" height="8" fill="url(#castle-fill)"/>
  <path d="M7.2 12 L7.2 10 L8.1 11 L9 9.6 L9.9 11 L10.8 10 L10.8 12 M13.2 12 L13.2 10 L14.1 11 L15 9.6 L15.9 11 L16.8 10 L16.8 12" fill="url(#castle-fill)"/>
  <path d="M10.6 20 V15.6 A1.4 1.4 0 0 1 13.4 15.6 V20" fill="#000000" opacity="0.24"/>
  <rect x="18.2" y="3.2" width="0.7" height="4.2" fill="currentColor"/>
  <path d="M18.9 3.4 L21.4 4.2 L18.9 5 Z" fill="currentColor" opacity="0.85"/>
  <path d="M4.4 10.2 L4.4 19" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <ellipse cx="9.4" cy="13.2" rx="1.8" ry="1.2" fill="#ffffff" opacity="0.24"/>
</svg>
"""
