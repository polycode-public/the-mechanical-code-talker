# shop — a storefront with a striped awning and a display window, the same
# wash treatment as school.toml and room.toml, distinguished by its own
# silhouette rather than a different rendering technique. The awning's
# alternating stripes are the one cue that separates "shop" from a plain
# house at this scale, so they stay solid white against the awning's own
# currentColor rather than blending into the wash.
classes = ["shop"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="shop-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <rect x="4" y="8.4" width="16" height="12.6" fill="url(#shop-fill)"/>
  <rect x="4" y="8.4" width="16" height="12.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M3.4 8.4 L4.6 4.4 H19.4 L20.6 8.4 Z" fill="currentColor" opacity="0.85"/>
  <g fill="#ffffff" opacity="0.55">
    <path d="M5.4 4.4 H7.4 L6.6 8.4 H4.6 Z"/>
    <path d="M9.4 4.4 H11.4 L10.6 8.4 H8.6 Z"/>
    <path d="M13.4 4.4 H15.4 L14.6 8.4 H12.6 Z"/>
    <path d="M17.4 4.4 H19.4 L18.6 8.4 H16.6 Z"/>
  </g>
  <path d="M3.4 8.4 L20.6 8.4 L19.6 6.4 H4.4 Z" fill="#ffffff" opacity="0.22"/>
  <rect x="6" y="11.2" width="5.4" height="4.6" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <rect x="13.4" y="14.6" width="3.4" height="6.4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M6.4 11.6 L11 15.4" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
</svg>
"""
