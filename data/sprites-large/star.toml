# star — a five-point outline with its own small glow and one sparkle
# accent at a single point, distinguishing it from sun.toml's full ring of
# rays; fixed warm-gold colour for the same reason sun.toml stays fixed.
classes = ["star"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#fff6de"/>
      <stop offset="55%" stop-color="#f9d35a"/>
      <stop offset="100%" stop-color="#c9973a"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="8.6" fill="url(#star-glow)"/>
  <path d="M12 2.4 L14.2 9.4 L21.4 9.4 L15.6 13.6 L17.8 20.6 L12 16.4 L6.2 20.6 L8.4 13.6 L2.6 9.4 L9.8 9.4 Z" fill="url(#star-fill)"/>
  <path d="M12 2.4 L14.2 9.4 L12 9.4 Z" fill="#ffffff" opacity="0.35"/>
  <path d="M18.4 3.6 L19.6 3.6 M19 3 L19 4.2" stroke="#ffffff" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>
</svg>
"""
