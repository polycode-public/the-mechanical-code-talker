# mouse-facing-right — mouse-facing-left.toml's profile mirrored across the
# canvas midline (every shape wrapped in one translate-then-flip group), so
# the two directions stay geometrically identical twins. The mirror flips
# the lit corner of the shared gradient along with the pose, which reads as
# the same figure turned around under the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["mouse"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="mouse-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M2.4 15 C2 12 3.8 9.6 7.2 9.4 C11.4 9.1 15.6 9.6 18 12.2 C20.4 14.6 20.2 18.4 17.4 20.4 C14.6 22.2 9 22.4 5.6 21 C2.8 19.8 2.8 17.4 2.4 15 Z" fill="url(#mouse-facing-right-fill)"/>
    <circle cx="10.4" cy="5.2" r="1.3" fill="url(#mouse-facing-right-fill)"/>
    <circle cx="5.6" cy="5.8" r="3" fill="url(#mouse-facing-right-fill)"/>
    <path d="M17.8 19 C21.6 19.8 22.2 15.8 20 14 C20.8 16.6 19.4 18.4 17.8 19 Z" fill="url(#mouse-facing-right-fill)"/>
    <ellipse cx="2.8" cy="14.6" rx="0.8" ry="0.6" fill="#c98c8c" opacity="0.7"/>
    <g stroke="#000000" stroke-width="0.35" opacity="0.4">
      <path d="M2.6 14.2 L0.2 13.2"/>
      <path d="M2.6 15 L0.2 16"/>
    </g>
    <ellipse cx="4.6" cy="12.6" rx="0.55" ry="0.65" fill="#000000" opacity="0.6"/>
    <ellipse cx="14.8" cy="17.4" rx="3" ry="1.6" fill="#ffffff" opacity="0.28"/>
    <ellipse cx="4.6" cy="4.8" rx="0.9" ry="0.7" fill="#ffffff" opacity="0.35"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# mouse-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 5.5); cy and scale are the mirror's own invariants. Because
# the fragment sits outside the flip group, these are plain unflipped
# canvas coordinates.
[face]
cx = 18.5
cy = 12.95
scale = 1.95

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
