# poodle-moving — poodle-with-emotion.toml's own front-facing shape caught
# mid-stride, matched on mgx:pose alone with no facing constraint at all: an
# instance taught a pose but no facing still faces the viewer, the same
# absent-value reasoning sprite-templates.mjs's own header gives for centre
# and at-rest. The head, curls and nose stay exactly as poodle-with-emotion
# draws them, since a head does not change shape mid-stride. What moves: the
# outer legs swing forward and lift, the inner legs trail low and back, the
# body dips down slightly under the stride, and the pompom tail lifts and
# swings back.
classes = ["poodle"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="poodle-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15.4" rx="6.4" ry="4.6" fill="url(#poodle-moving-fill)"/>
  <ellipse cx="10.8" cy="13.6" rx="1.8" ry="1.3" fill="#000000" opacity="0.18"/>
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <line x1="7.8" y1="18" x2="7.3" y2="20.2"/>
    <line x1="10.6" y1="19.6" x2="10.3" y2="22.6"/>
    <line x1="15.4" y1="19.6" x2="15.7" y2="22.6"/>
    <line x1="18.2" y1="18" x2="18.7" y2="20.2"/>
  </g>
  <g fill="url(#poodle-moving-fill)">
    <circle cx="7.4" cy="19.6" r="1"/>
    <circle cx="10.4" cy="22" r="1"/>
    <circle cx="15.6" cy="22" r="1"/>
    <circle cx="18.6" cy="19.6" r="1"/>
  </g>
  <rect x="18.9" y="13.2" width="2.2" height="6" rx="1.1" fill="url(#poodle-moving-fill)"/>
  <circle cx="20" cy="12.2" r="1.5" fill="url(#poodle-moving-fill)"/>
  <circle cx="7" cy="8.5" r="4" fill="url(#poodle-moving-fill)"/>
  <g fill="url(#poodle-moving-fill)">
    <circle cx="4" cy="6" r="1.6"/>
    <circle cx="7" cy="4.2" r="1.7"/>
    <circle cx="10" cy="6" r="1.6"/>
  </g>
  <ellipse cx="3.2" cy="8.8" rx="0.55" ry="0.45" fill="#1c1c1c"/>
  <ellipse cx="9.6" cy="12.6" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="5.6" cy="7" rx="1.3" ry="1" fill="#ffffff" opacity="0.32"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:pose"
value = "moving"

# The same cx/cy/scale poodle-with-emotion.toml's own [face] anchor
# declares, reused unchanged: the head is not turned in this pose, so the
# front-facing head circle it anchors to (cx=7 cy=8.5 r=4) hasn't moved
# either.
[face]
cx = 7
cy = 8.5
scale = 4

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
