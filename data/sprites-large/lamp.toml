# lamp — Ashcombe Hall's own study lamp at the sprite tier, and the
# pack's own worked example for the whole gradient-shading mechanism
# (mirrors the operator's own hand-built prototype): base, globe and neck
# all share the taught mgx:madeOf gradient, one white specular streak
# along the globe's own left edge, and a soft warm glow behind the flame
# — a lit flame is exactly the kind of object a glow genuinely suits,
# unlike e.g. a key or a letter. The flame itself stays a fixed warm
# amber regardless of the lamp's own body material, since a flame's
# colour comes from what's burning, not what the lamp is made of.
classes = ["lamp"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="lamp-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="{{FILL_LIGHT}}"/>
      <stop offset="55%" stop-color="{{FILL}}"/>
      <stop offset="100%" stop-color="{{FILL_DARK}}"/>
    </linearGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="12" cy="4.6" rx="4.6" ry="4.6" fill="url(#lamp-glow)"/>
  <path d="M9 21 H15 L14 18 H10 Z" fill="url(#lamp-fill)"/>
  <path d="M8.4 18 C7 15.6 7 12.6 8.6 10.4 H15.4 C17 12.6 17 15.6 15.6 18 Z" fill="url(#lamp-fill)"/>
  <path d="M9.2 11.4 C9 13.4 9.1 15.6 9.9 17.4" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <rect x="10.6" y="6.4" width="2.8" height="4.4" rx="0.4" fill="url(#lamp-fill)"/>
  <path d="M12 3.2 C13.4 4.6 13.8 6 12 7.4 C10.2 6 10.6 4.6 12 3.2 Z" fill="#f4b73f"/>
  <path d="M12 4 C12.6 4.7 12.8 5.4 12 6.2 C11.5 5.6 11.6 5 12 4 Z" fill="#ffe9a8" opacity="0.85"/>
</svg>
"""

[parameters.material]
property = "mgx:madeOf"
placeholders = { light = "{{FILL_LIGHT}}", base = "{{FILL}}", dark = "{{FILL_DARK}}" }

[parameters.material.values]
gold = "metal"
metal = "metal"
ceramic = "ceramic"
glass = "glass"
