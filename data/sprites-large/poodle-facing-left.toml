# poodle-facing-left — the same round-pompom poodle as poodle-with-emotion
# turned to a left profile: the head leads at the body's left, one pompom
# curl reads forward as a tuft breaking the head's leading edge, the nose
# breaks the silhouette's left edge below it, and the tail's pompom ball
# breaks the trailing right edge. A hand-authored [match] variant (the
# bear-facing-left.toml precedent), selected only when the instance's own
# mgx:faces fact says "left". It also carries the shared face-fragment
# mechanism, so a poodle taught BOTH mgx:faces = left and one of the 6
# mgx:feels words renders this profile wearing that mood; taught only the
# facing, {{FACE}} resolves to nothing and the profile keeps the single
# forward eye it draws itself.
classes = ["poodle"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="poodle-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="14.4" cy="15.2" rx="6.2" ry="4.6" fill="url(#poodle-facing-left-fill)"/>
  <ellipse cx="12.2" cy="13.4" rx="1.8" ry="1.3" fill="#000000" opacity="0.18"/>
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <line x1="10.2" y1="19" x2="10" y2="21.8"/>
    <line x1="12.6" y1="19.6" x2="12.6" y2="22.2"/>
    <line x1="16.6" y1="19.6" x2="16.6" y2="22.2"/>
    <line x1="19" y1="19" x2="19.2" y2="21.8"/>
  </g>
  <g fill="url(#poodle-facing-left-fill)">
    <circle cx="10" cy="20.8" r="1"/>
    <circle cx="12.6" cy="21.4" r="1"/>
    <circle cx="16.6" cy="21.4" r="1"/>
    <circle cx="19.2" cy="20.8" r="1"/>
  </g>
  <rect x="19.7" y="14.2" width="2.2" height="6" rx="1.1" fill="url(#poodle-facing-left-fill)"/>
  <circle cx="20.8" cy="13.2" r="1.5" fill="url(#poodle-facing-left-fill)"/>
  <circle cx="6.2" cy="8.7" r="4" fill="url(#poodle-facing-left-fill)"/>
  <g fill="url(#poodle-facing-left-fill)">
    <circle cx="3" cy="5.6" r="1.6"/>
    <circle cx="6" cy="3.9" r="1.7"/>
    <circle cx="8.6" cy="5.7" r="1.4"/>
  </g>
  <ellipse cx="1.9" cy="8.9" rx="0.6" ry="0.5" fill="#1c1c1c"/>
  <ellipse cx="4.8" cy="7.7" rx="0.5" ry="0.6" fill="#1c1c1c"/>
  <ellipse cx="7.2" cy="6.3" rx="1.2" ry="0.9" fill="#ffffff" opacity="0.32"/>
  <ellipse cx="10.8" cy="12.4" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from THIS file's own profile geometry, not copied from
# poodle-with-emotion.toml's front-facing anchor (cx=7 cy=8.5 scale=4): the
# profile head circle is cx=6.2 cy=8.7 r=4, and the forward eye this file
# already draws sits at (4.8, 7.7). scale = 0.65 * head radius 4 = 2.6, the
# same ratio bear-facing-left.toml used for its own profile, which pulls the
# fragment's two eyes closer together than the front view — the read of a
# head turned away. cx/cy then place the fragment so its own forward eye
# lands on the drawn one: reusing bear's own offset-to-scale ratio (0.4, 0.15)
# gives cx = 4.8 + 0.4*2.6 = 5.8 and cy = 7.7 + 0.15*2.6 = 8.1.
[face]
cx = 5.8
cy = 8.1
scale = 2.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
