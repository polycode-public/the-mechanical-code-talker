# bear-with-emotion — copies bear.toml's shape exactly, plus a required
# [face] anchor and a {{FACE}} placeholder that resolves to whichever of
# the 6 curated mgx:feels words the instance's own fact names. The muzzle
# and nose sit below the face's own eye/mouth band, the same cat-nose
# precedent, and stay visible underneath it.
classes = ["bear"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bear-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="15.4" rx="7.2" ry="5.6" fill="url(#bear-with-emotion-fill)"/>
  <g fill="url(#bear-with-emotion-fill)">
    <ellipse cx="5.8" cy="19.8" rx="1.2" ry="1.4"/>
    <ellipse cx="9.4" cy="20.4" rx="1.2" ry="1.4"/>
    <ellipse cx="14.6" cy="20.4" rx="1.2" ry="1.4"/>
    <ellipse cx="18.2" cy="19.8" rx="1.2" ry="1.4"/>
  </g>
  <circle cx="12" cy="9" r="5" fill="url(#bear-with-emotion-fill)"/>
  <circle cx="7" cy="5.4" r="2.1" fill="url(#bear-with-emotion-fill)"/>
  <circle cx="17" cy="5.4" r="2.1" fill="url(#bear-with-emotion-fill)"/>
  <ellipse cx="12" cy="11.4" rx="2.4" ry="1.9" fill="#c9a273"/>
  <ellipse cx="12" cy="10.5" rx="0.9" ry="0.65" fill="#1c1c1c"/>
  <ellipse cx="8.6" cy="11" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="7.6" cy="4.8" rx="0.8" ry="0.6" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r bear.toml's own head circle declares.
[face]
cx = 12
cy = 9
scale = 5

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
