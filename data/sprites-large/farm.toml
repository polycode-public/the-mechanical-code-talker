# farm — room.toml's own card, its interior swapped for a fixed barn-red
# gable barn and a fixed galvanised-steel grain silo, farmland's own
# building pair. Barn red and mill-silver are fixed because both are the
# real-world constants that make each shape read as what it is.
classes = ["farm"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="farm-fill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 42%, white)"/>
      <stop offset="60%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 70%, black)"/>
    </linearGradient>
    <linearGradient id="farm-barn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b5453a"/>
      <stop offset="100%" stop-color="#7a261e"/>
    </linearGradient>
    <linearGradient id="farm-silo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e3e1da"/>
      <stop offset="55%" stop-color="#b4b1a7"/>
      <stop offset="100%" stop-color="#8b8880"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#farm-fill)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <path d="M5.5 13 L9.5 9 L13.5 13 V19.5 H5.5 Z" fill="url(#farm-barn)"/>
  <path d="M9.5 19.5 V15 H11 V19.5" fill="#3a1e14"/>
  <path d="M5.5 13 L9.5 9 L13.5 13" fill="none" stroke="#f4ecdf" stroke-width="0.5" opacity="0.6"/>
  <rect x="15.5" y="8.6" width="3.4" height="10.9" rx="1.7" fill="url(#farm-silo)"/>
  <path d="M15.5 11.6 H18.9" stroke="#7d7a72" stroke-width="0.6" opacity="0.8"/>
  <path d="M15.9 8.6 A1.7 0.9 0 0 1 19.1 8.6" fill="#8b8880"/>
  <path d="M4 4 L11 4" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
"""
