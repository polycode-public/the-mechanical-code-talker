# child-facing-half-left — the child-scale figure turned three-quarters from
# the full left profile toward the front. The head and brow-highlight arc
# sit at the half-left position between the two views, the nose wedge
# projects only part as far past the head's edge and dips down instead of
# pointing straight out, and a second, smaller far eye appears near the
# head's right edge so both eyes read. The torso, arms, neck notch and
# shading strokes keep child.toml's own geometry, the same as the full
# profile.
classes = ["child"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="child-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#child-facing-half-left-fill)">
    <path d="M9.4 14.9 C7.9 15 6.5 16.2 6.3 18.3 C6.25 19.4 6.9 20.1 7.7 19.7 C7.8 18 8.3 16.5 9.7 15.8 Z"/>
    <path d="M14.6 14.9 C16.1 15 17.5 16.2 17.7 18.3 C17.75 19.4 17.1 20.1 16.3 19.7 C16.2 18 15.7 16.5 14.3 15.8 Z"/>
    <path d="M7.4 21 C7.4 16.6 9.4 14.6 12 14.6 C14.6 14.6 16.6 16.6 16.6 21 Z"/>
    <path d="M10.8 11.4 L13.2 11.4 L13 14.6 L11 14.6 Z"/>
  </g>
  <ellipse cx="10.2" cy="18" rx="1.1" ry="1.6" fill="#ffffff" opacity="0.1"/>
  <circle cx="11.67" cy="8.2" r="3.6" fill="url(#child-facing-half-left-fill)"/>
  <path d="M8.3 7.66 Q7.5 9.07 8.3 9.84 Z" fill="url(#child-facing-half-left-fill)"/>
  <ellipse cx="9.8" cy="7.65" rx="0.3" ry="0.37" fill="#1c1c1c"/>
  <ellipse cx="14.2" cy="7.6" rx="0.2" ry="0.24" fill="#1c1c1c"/>
  <path d="M10.6 14.3 L12 15.4 L13.4 14.3" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 15.4 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.35" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 15.3 C8.3 16 7.6 17.2 7.4 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 15.3 C15.7 16 16.4 17.2 16.6 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.47 5.6 C10.07 5.1 10.77 4.9 11.67 5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# The head sits at cx=11.67 cy=8.2 r=3.6 (half of child-facing-left.toml's
# own 0.65 shift: 0.325, rounded to 0.33, so cx = 12 - 0.33 = 11.67), so
# scale is 0.8182 * 3.6 = 2.945, rounded to 2.95. The near eye this file
# draws sits at (9.8, 7.65), the profile's own forward eye shifted right by
# the head's own 0.33-unit move. cx = 9.8 + 0.4*2.95 = 11.0 and
# cy = 7.65 + 0.15*2.95 = 8.1.
[face]
cx = 11.0
cy = 8.1
scale = 2.95

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
