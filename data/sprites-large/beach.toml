# beach — room.toml's own frame and wash, its interior swapped for a sun
# and two wave lines. The sun keeps a fixed warm glow the same way the
# lamp's own flame does: a beach's sun is exactly the kind of feature a
# genuine glow suits, and its colour comes from being the sun, not from
# whatever theme the page is in.
classes = ["beach"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="beach-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="beach-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#beach-fill)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <ellipse cx="16" cy="8" rx="4.4" ry="4.4" fill="url(#beach-glow)"/>
  <circle cx="16" cy="8" r="2.2" fill="#f4b73f"/>
  <path d="M4.5 15.4 C6.5 14 8 16 10 14.6 C12 13.2 13.5 15.2 15.5 13.8 C17.5 12.4 18.7 14.4 20.5 13.4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
  <path d="M4.5 18.4 C6.5 17 8 19 10 17.6 C12 16.2 13.5 18.2 15.5 16.8 C17.5 15.4 18.7 17.4 20.5 16.4" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <path d="M4 4 L11 4" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
</svg>
"""
