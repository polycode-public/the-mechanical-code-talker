# beach — room.toml's own frame kept as the location tile's border, its
# interior redrawn as an actual shoreline: sand and water bands stacked
# like body-of-water's own layered wave crests, a striped umbrella
# planted in the sand and a shell tucked in the corner. Sand, water and
# sun are fixed rather than currentColor: their colours are what makes a
# beach read as a beach rather than a generic framed tile, the same
# reasoning carrot.toml fixes its orange root.
classes = ["beach"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="beach-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf6fb"/>
      <stop offset="100%" stop-color="#cfeaf2"/>
    </linearGradient>
    <linearGradient id="beach-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd0e0"/>
      <stop offset="100%" stop-color="#3f8fc4"/>
    </linearGradient>
    <linearGradient id="beach-sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3dba3"/>
      <stop offset="100%" stop-color="#d8b671"/>
    </linearGradient>
    <radialGradient id="beach-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#beach-sky)"/>
  <ellipse cx="16.4" cy="7.4" rx="3.4" ry="3.4" fill="url(#beach-glow)"/>
  <circle cx="16.4" cy="7.4" r="1.8" fill="#f4b73f"/>
  <path d="M3 13.6 C5.4 12.2 7.6 12.2 10 13.6 C12.4 15 14.6 15 17 13.6 C18.6 12.7 20 12.5 21 12.9 L21 20.4 L3 20.4 Z" fill="url(#beach-water)"/>
  <path d="M3 13.6 C5.4 12.2 7.6 12.2 10 13.6 C12.4 15 14.6 15 17 13.6 C18.6 12.7 20 12.5 21 12.9" fill="none" stroke="#eaf6f7" stroke-width="0.6" opacity="0.6"/>
  <path d="M3 17 C5.6 18 8 17.4 10.6 17 C13.2 16.6 16 17.2 21 16.6 L21 20.4 L3 20.4 Z" fill="url(#beach-sand)"/>
  <path d="M6.4 20 C6.6 18.4 8.2 17.6 9.2 17.8 M13.6 20 C13.2 18.6 14.8 17.8 16.2 18" fill="none" stroke="#c49a5c" stroke-width="0.4" opacity="0.5"/>
  <path d="M7.2 6.6 C4.6 6.6 3.4 8.6 3.4 11 L11 11 C11 8.6 9.8 6.6 7.2 6.6 Z" fill="#c94f3c"/>
  <path d="M7.2 6.6 L7.2 11 M5.1 6.9 L5.9 11 M9.3 6.9 L8.5 11" stroke="#f3ece0" stroke-width="0.5" opacity="0.85"/>
  <circle cx="7.2" cy="6.3" r="0.4" fill="#8f2f22"/>
  <path d="M7.2 11 L7.2 18.8" stroke="#6b4a2a" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M16.8 19.6 C16.8 18.2 17.6 17.4 18.3 17.4 C19 17.4 19.8 18.2 19.8 19.6 C18.9 19.9 17.7 19.9 16.8 19.6 Z" fill="#f3e3d3"/>
  <path d="M18.3 17.4 L18.3 19.6 M17.6 17.9 L17.9 19.6 M19 17.9 L18.7 19.6" stroke="#d8a97a" stroke-width="0.22" opacity="0.7"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
</svg>
"""
