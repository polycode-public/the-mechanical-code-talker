# horse-with-emotion — copies horse.toml's shape exactly. horse.toml's head
# is the tip of one irregular neck-and-head path, not a separate circle, so
# [face] below anchors on that head tip's own small bounding box instead —
# deliberately small, matching the narrow head width there. Its existing
# eye dot is dropped, the same dog precedent, since it sits exactly where
# the real eyes now go; the nostril curve stays (it reads as a mark below
# the new face's own mouth band). Two of the neck's own mane strands sit
# inside the new face's eye band and are dropped; the third, lower on the
# neck, stays clear of it.
classes = ["horse"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="horse-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12.4" cy="14.6" rx="7.2" ry="4.2" fill="url(#horse-with-emotion-fill)"/>
  <path d="M16.8 12.4 C17.4 8.6 19.4 5.6 22 4.4 C21 6.6 20.8 8.8 21.4 11 C22.2 12 22.2 13.6 21 14.4 C19.4 13.2 17.8 13 16.8 12.4 Z" fill="url(#horse-with-emotion-fill)"/>
  <path d="M18.4 6 C19.4 6.6 20.2 7.6 20.6 8.8" fill="none" stroke="#000000" stroke-width="0.8" opacity="0.3" stroke-linecap="round"/>
  <path d="M17.8 9 C18.1 10.2 18 11.4 17.6 12.4" fill="none" stroke="color-mix(in srgb, currentColor 35%, black)" stroke-width="0.5" opacity="0.45" stroke-linecap="round"/>
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="8.4" y1="18" x2="8" y2="22"/>
    <line x1="12" y1="18.6" x2="11.8" y2="22"/>
    <line x1="15.6" y1="18" x2="16" y2="22"/>
    <line x1="18.6" y1="17.2" x2="19.4" y2="21.6"/>
  </g>
  <g fill="#2b2118">
    <ellipse cx="8" cy="22" rx="0.7" ry="0.4"/>
    <ellipse cx="11.8" cy="22" rx="0.7" ry="0.4"/>
    <ellipse cx="16" cy="22" rx="0.7" ry="0.4"/>
    <ellipse cx="19.4" cy="21.6" rx="0.7" ry="0.4"/>
  </g>
  <path d="M6.4 17 C4 17.6 3.4 16 4.8 15.2 Z" fill="url(#horse-with-emotion-fill)"/>
  <ellipse cx="10.4" cy="12.4" rx="2.8" ry="1.5" fill="#ffffff" opacity="0.28"/>
  <ellipse cx="20.4" cy="7" rx="2.6" ry="2.3" fill="#ffffff" opacity="0.22"/>
  {{FACE}}
</svg>
"""

# No head circle exists — the head is the top of the neck-and-head path
# (bounded roughly x 19-22.2, y 4.4-9), the same spot horse.toml's own eye
# dot already sat.
[face]
cx = 20.4
cy = 7
scale = 3.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
