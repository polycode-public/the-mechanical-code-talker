# frog — the pond-side creature at the sprite tier: bulging top-set eyes
# and folded haunches over a frog green fixed the way carrot.toml fixes its
# own orange, since green IS what makes a frog read as a frog rather than
# any other bulging-eyed creature. Cream eye-whites, a pale throat patch and
# darker back blotches carry the rest of the identity; webbed toes break
# the haunches' own outline.
classes = ["frog"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="frog-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#a8d068"/>
      <stop offset="55%" stop-color="#5a9040"/>
      <stop offset="100%" stop-color="#2f5322"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="15" rx="7.4" ry="5.4" fill="url(#frog-fill)"/>
  <ellipse cx="6.6" cy="17.6" rx="3" ry="2" fill="url(#frog-fill)"/>
  <ellipse cx="17.4" cy="17.6" rx="3" ry="2" fill="url(#frog-fill)"/>
  <g stroke="#2f5322" stroke-width="0.9" stroke-linecap="round">
    <path d="M4.4 18.4 L3.4 19.8"/><path d="M6 19.4 L5.6 21"/><path d="M7.8 19.2 L7.8 20.8"/>
    <path d="M19.6 18.4 L20.6 19.8"/><path d="M18 19.4 L18.4 21"/><path d="M16.2 19.2 L16.2 20.8"/>
  </g>
  <ellipse cx="9.2" cy="16.4" rx="2.6" ry="1.7" fill="#dcead0" opacity="0.55"/>
  <ellipse cx="8.4" cy="13" rx="1.5" ry="1" fill="#2f5322" opacity="0.4"/>
  <ellipse cx="15.6" cy="13" rx="1.5" ry="1" fill="#2f5322" opacity="0.4"/>
  <circle cx="8" cy="8.4" r="2.6" fill="url(#frog-fill)"/>
  <circle cx="16" cy="8.4" r="2.6" fill="url(#frog-fill)"/>
  <circle cx="8" cy="8.2" r="1.9" fill="#f4ecd8"/>
  <circle cx="16" cy="8.2" r="1.9" fill="#f4ecd8"/>
  <circle cx="8" cy="7.8" r="1" fill="#0d2a1a"/>
  <circle cx="16" cy="7.8" r="1" fill="#0d2a1a"/>
  <path d="M9.6 15.4 C11 16.2 13 16.2 14.4 15.4" fill="none" stroke="#0d2a1a" stroke-width="0.6" opacity="0.5" stroke-linecap="round"/>
  <ellipse cx="9.4" cy="13.6" rx="2.4" ry="1.3" fill="#ffffff" opacity="0.22"/>
  <ellipse cx="7.2" cy="7.4" rx="0.7" ry="0.5" fill="#ffffff" opacity="0.6"/>
</svg>
"""
