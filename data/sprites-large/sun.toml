# sun — a soft glow behind a crown of solid triangular rays and a warm
# gradient disc, the same glow technique lamp.toml uses for its own
# flame; fixed warm colour throughout, since sunlight doesn't vary the
# way a taught object's own material does. Rays are filled triangles,
# not thin strokes, so the crown still reads as spikes rather than
# fading to hairlines at 40px; no face, so it never turns into an emoji.
classes = ["sun"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun-fill" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="60%" stop-color="#f9b73f"/>
      <stop offset="100%" stop-color="#e0872a"/>
    </radialGradient>
  </defs>
  <circle cx="12" cy="12" r="10.6" fill="url(#sun-glow)"/>
  <g fill="#f4b73f">
    <path d="M11.1 5.6 L12 1.2 L12.9 5.6 Z"/>
    <path d="M11.1 5.6 L12 1.2 L12.9 5.6 Z" transform="rotate(90 12 12)"/>
    <path d="M11.1 5.6 L12 1.2 L12.9 5.6 Z" transform="rotate(180 12 12)"/>
    <path d="M11.1 5.6 L12 1.2 L12.9 5.6 Z" transform="rotate(270 12 12)"/>
    <path d="M11.3 5.6 L12 3 L12.7 5.6 Z" transform="rotate(45 12 12)"/>
    <path d="M11.3 5.6 L12 3 L12.7 5.6 Z" transform="rotate(135 12 12)"/>
    <path d="M11.3 5.6 L12 3 L12.7 5.6 Z" transform="rotate(225 12 12)"/>
    <path d="M11.3 5.6 L12 3 L12.7 5.6 Z" transform="rotate(315 12 12)"/>
  </g>
  <circle cx="12" cy="12" r="6.4" fill="url(#sun-fill)"/>
  <ellipse cx="9.8" cy="9.4" rx="2" ry="1.4" fill="#ffffff" opacity="0.4"/>
</svg>
"""
