# dinner — a food scene at the sprite tier: a plate carrying a seared
# main and a small cluster of peas, every colour fixed to what the food
# actually is rather than drawn from a taught mgx:madeOf material, the
# same call bread/breakfast/cheese/coffee/drink make.
classes = ["dinner"]
