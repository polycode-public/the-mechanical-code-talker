  <defs>
    <linearGradient id="dinner-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#fdfaf1"/>
      <stop offset="55%" stop-color="#e8dcbf"/>
      <stop offset="100%" stop-color="#b7a47c"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="13" r="8.6" fill="url(#dinner-fill)"/>
  <circle cx="12" cy="13" r="8.6" fill="none" stroke="#b7a47c" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="10.6" cy="14" rx="4.4" ry="3.2" fill="#a9714a"/>
  <ellipse cx="10.6" cy="13" rx="4.4" ry="3" fill="#c78e5b"/>
  <circle cx="15.6" cy="9.6" r="1.6" fill="#5a9450"/>
