  <defs>
    <linearGradient id="pig-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12" cy="14.4" rx="8" ry="5.4" fill="url(#pig-fill)"/>
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <line x1="7" y1="18.6" x2="6.8" y2="21.4"/>
    <line x1="10.4" y1="19.4" x2="10.4" y2="21.8"/>
    <line x1="14" y1="19.4" x2="14" y2="21.8"/>
    <line x1="17.6" y1="18.6" x2="17.8" y2="21.4"/>
  </g>
  <g fill="#5c4438">
    <ellipse cx="6.8" cy="21.6" rx="0.7" ry="0.4"/>
    <ellipse cx="10.4" cy="22" rx="0.7" ry="0.4"/>
    <ellipse cx="14" cy="22" rx="0.7" ry="0.4"/>
