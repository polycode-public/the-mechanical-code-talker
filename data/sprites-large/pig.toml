# pig — the sty's own creature at the sprite tier: round body, a button
# snout with two fixed dark nostril dots, four short legs with fixed
# dark-brown trotters, and a curled tail; snout shape carries the identity
# while the coat itself stays currentColor so a theme still owns it.
classes = ["pig"]
svg = """
