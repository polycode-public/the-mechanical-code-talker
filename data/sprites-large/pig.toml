  <circle cx="5.4" cy="14" r="0.5" fill="#5c4438"/>
  <circle cx="7.2" cy="14" r="0.5" fill="#5c4438"/>
  <circle cx="10.6" cy="11.6" r="1" fill="#000000" opacity="0.3"/>
