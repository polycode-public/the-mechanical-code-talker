# pig-facing-half-left-moving — pig-facing-half-left.toml's own three-quarter
# turn caught mid-stride. The head, ears, snout, nostrils and tail stay
# exactly as that file draws them. What moves: the body dips down slightly
# under the stride, and the four legs spread into the same diagonal trotting
# gait pig-facing-left-moving.toml uses — the near pair forward and lifted,
# the far pair trailing low and back, planted.
classes = ["pig"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="pig-facing-half-left-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="15.6" cy="15.2" rx="7.2" ry="4.6" fill="url(#pig-facing-half-left-moving-fill)"/>
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <line x1="12" y1="17.8" x2="10.6" y2="20.6"/>
    <line x1="14.4" y1="19.6" x2="15.8" y2="22.4"/>
    <line x1="18.4" y1="18.4" x2="17.4" y2="21"/>
    <line x1="21.6" y1="19.8" x2="22.6" y2="22.6"/>
  </g>
  <g fill="#5c4438">
    <ellipse cx="10.6" cy="20.8" rx="0.7" ry="0.4"/>
    <ellipse cx="15.8" cy="22.6" rx="0.7" ry="0.4"/>
    <ellipse cx="17.4" cy="21.2" rx="0.7" ry="0.4"/>
    <ellipse cx="22.6" cy="22.8" rx="0.7" ry="0.4"/>
  </g>
  <path d="M12 10.4 L9.4 6.2 L13.4 7.6 Z" fill="url(#pig-facing-half-left-moving-fill)"/>
  <path d="M16.6 9.8 L17.2 6.6 L19.8 9.4 Z" fill="url(#pig-facing-half-left-moving-fill)"/>
  <ellipse cx="8.3" cy="14.9" rx="2.5" ry="1.9" fill="url(#pig-facing-half-left-moving-fill)"/>
  <circle cx="6.3" cy="14.3" r="0.42" fill="#5c4438"/>
  <circle cx="6.3" cy="15.5" r="0.42" fill="#5c4438"/>
  <path d="M21.6 12 C23.9 11.2 23.8 13.5 22.2 13.9 C22.2 13.1 21.8 12.4 21.6 12 Z" fill="url(#pig-facing-half-left-moving-fill)"/>
  <ellipse cx="18" cy="11.2" rx="3.2" ry="1.8" fill="#ffffff" opacity="0.28"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-left"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 11.7
cy = 11.3
scale = 3.8

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
