# adventurer — the player's own figure, and the one person in the hall who
# doesn't work there: a visitor in a travelling coat and a soft brimmed hat,
# with the satchel the world's own facts give them. The coat and hat keep the
# class colour; the leather strap and bag, its brass buckle, the oxblood hat
# band and the boots are fixed palette, so the thing that identifies the
# silhouette survives whatever the page repaints the coat — the same split
# badger.toml makes between its stripes and its coat. Arms, legs and a face
# break the outline, so it reads as a person at the 40px the room view draws.
# No [parameters.material] — a person's own skin and clothing isn't something
# this pack's material vocabulary (mgx:madeOf) describes.
classes = ["adventurer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="adventurer-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <radialGradient id="adventurer-sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M8.4 18.4 H11.4 L11.2 21.9 H8.7 Z" fill="#3a3129"/>
  <path d="M12.6 18.4 H15.6 L15.3 21.9 H12.8 Z" fill="#3a3129"/>
  <ellipse cx="9.9" cy="21.9" rx="1.7" ry="0.8" fill="#221e1b"/>
  <ellipse cx="14.1" cy="21.9" rx="1.7" ry="0.8" fill="#221e1b"/>
  <path d="M9.2 16.2 H11.4 L11.3 18.8 H9.4 Z" fill="url(#adventurer-fill)"/>
  <path d="M12.6 16.2 H14.8 L14.6 18.8 H12.7 Z" fill="url(#adventurer-fill)"/>
  <path d="M8.4 12.4 C8.4 10.8 9.9 9.9 12 9.9 C14.1 9.9 15.6 10.8 15.6 12.4 L16.2 17.4 H7.8 Z" fill="url(#adventurer-fill)"/>
  <path d="M9 10.7 L15.8 16.6 L14.9 17.7 L8.4 12 Z" fill="#7a4f2e"/>
  <rect x="11.2" y="13" width="1.9" height="1.9" rx="0.3" fill="#b08d3a" transform="rotate(41 12.15 13.95)"/>
  <path d="M7.8 12.2 C6.9 12.8 6.4 14.4 6.5 16.4 C6.55 17.5 6.8 18.2 7.3 18.5 L8.8 17.8 C8.4 17 8.3 15.4 8.6 13.6 Z" fill="url(#adventurer-fill)"/>
  <ellipse cx="7.5" cy="18.8" rx="1.05" ry="1.15" fill="#dcb894"/>
  <path d="M15.5 15.6 H19.6 C20 15.6 20.2 15.9 20.2 16.3 L20.2 19.6 C20.2 20 20 20.3 19.6 20.3 H15.5 C15.1 20.3 14.9 20 14.9 19.6 L14.9 16.3 C14.9 15.9 15.1 15.6 15.5 15.6 Z" fill="#7a4f2e"/>
  <path d="M15.5 15.6 H19.6 C20 15.6 20.2 15.9 20.2 16.3 L20.2 17.3 H14.9 L14.9 16.3 C14.9 15.9 15.1 15.6 15.5 15.6 Z" fill="#8f5f3a"/>
  <rect x="16.7" y="17" width="1.7" height="1.3" rx="0.3" fill="#b08d3a"/>
  <path d="M16.2 12.2 C17.1 12.8 17.6 14.2 17.6 15.9 L15.6 16.2 C15.6 14.9 15.4 14 15.1 13.4 Z" fill="url(#adventurer-fill)"/>
  <ellipse cx="16.6" cy="16.6" rx="1.05" ry="1.1" fill="#dcb894"/>
  <circle cx="12" cy="7.7" r="2.75" fill="#dcb894"/>
  <circle cx="10.9" cy="7.95" r="0.42" fill="#221e1b"/>
  <circle cx="13.1" cy="7.95" r="0.42" fill="#221e1b"/>
  <circle cx="10.77" cy="7.8" r="0.15" fill="#ffffff" opacity="0.75"/>
