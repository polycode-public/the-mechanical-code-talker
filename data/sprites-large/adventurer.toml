# adventurer — the sprite-tier upgrade of the player's own silhouette (same
# satchel-strap silhouette the icon tier uses to read as distinct from the
# room's NPC cast): a gradient body, one directional highlight on the head
# and shoulder. No [parameters.material] — a person's own skin/clothing
# isn't something this pack's material vocabulary (mgx:madeOf) describes.
classes = ["adventurer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="adventurer-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#adventurer-fill)"/>
  <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z" fill="url(#adventurer-fill)"/>
  <path d="M8.4 13.4 L17 17.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <rect x="14.6" y="15.8" width="5" height="4.6" rx="1" fill="url(#adventurer-fill)" opacity="0.92"/>
  <rect x="16.3" y="16.6" width="1.6" height="1.2" rx="0.3" fill="currentColor" opacity="0.9"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <path d="M7 15.6 C8 14.2 9.3 13.4 10.8 13.2" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.3"/>
</svg>
"""
