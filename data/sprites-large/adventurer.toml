  <path d="M11 9.2 C11.4 9.55 12.6 9.55 13 9.2" stroke="#a9764f" stroke-width="0.4" stroke-linecap="round" fill="none"/>
  <path d="M9.5 6.1 C9.5 3.4 10.2 2.2 12 2.2 C13.8 2.2 14.5 3.4 14.5 6.1 Z" fill="url(#adventurer-fill)"/>
  <path d="M10.4 2.9 C10.9 3.6 13.1 3.6 13.6 2.9 L13.6 4 C13.1 4.6 10.9 4.6 10.4 4 Z" fill="#000000" opacity="0.16"/>
  <path d="M9.52 5.3 C9.9 5.05 10.7 4.9 12 4.9 C13.3 4.9 14.1 5.05 14.48 5.3 L14.5 6.1 H9.5 Z" fill="#6e2c2c"/>
