# garden — fixed soil rows under colourful blooms and a gravel path,
# since a garden bed's own dirt and its flowers carry real colours a
# theme has no business tinting. This is one of the few sprites that
# also has to sit on the mud demo's own soil and leaf grounds, so the
# path and blooms stay bright enough to read against dark earth.
classes = ["garden"]
