  <defs>
    <linearGradient id="garden-wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5230"/>
      <stop offset="100%" stop-color="#4a3018"/>
    </linearGradient>
  </defs>
  <path d="M2 21 L4 12 L20 12 L22 21 Z" fill="url(#garden-wash)" stroke="#3a2412" stroke-width="0.6"/>
  <path d="M9.4 12 L8 21 M14.6 12 L16 21" fill="none" stroke="#c9b48a" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>
