# queen-with-emotion — same face-fragment mechanism as person-with-emotion.toml
# (sprite-expressions.mjs). queen.toml's crown sits entirely above the head
# (the jewel spike, band and rim highlight all resolve above y=7.2); [face]
# is anchored on the head circle underneath the crown (cx=12 cy=9.4 r=3.1),
# not on the crown's own bounding box, so the expression paints on the face.
classes = ["queen"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="queen-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M8 6.2 C8 6.2 8.3 3 8.9 2.6 C9.6 2.2 10.2 3.6 10.6 4.8 C10.9 3.6 11.4 2 12 2 C12.6 2 13.1 3.6 13.4 4.8 C13.8 3.6 14.4 2.2 15.1 2.6 C15.7 3 16 6.2 16 6.2 Z" fill="url(#queen-with-emotion-fill)"/>
  <circle cx="12" cy="3.3" r="0.6" fill="currentColor" opacity="0.9"/>
  <rect x="8" y="5.9" width="8" height="1.3" rx="0.4" fill="url(#queen-with-emotion-fill)"/>
  <circle cx="12" cy="9.4" r="3.1" fill="url(#queen-with-emotion-fill)"/>
  <path d="M6 21 C6 15.6 8.7 13.2 12 13.2 C15.3 13.2 18 15.6 18 21 Z" fill="url(#queen-with-emotion-fill)"/>
  <ellipse cx="8.8" cy="6.6" rx="1.5" ry="0.4" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

# The head circle under the crown, not the crown's own bounding box.
[face]
cx = 12
cy = 9.4
scale = 3.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
