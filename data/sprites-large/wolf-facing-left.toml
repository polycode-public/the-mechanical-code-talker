# wolf-facing-left — wolf-with-emotion.toml's figure turned to a left
# profile: the head path, both ears, the throat/muzzle shadow, the dark
# shadow patch, the snout-tip nose dot and the light backing patch behind
# {{FACE}} all move together as one block (shifted by the same delta,
# the king-facing-left.toml precedent for a head-attached group), and a
# small nose wedge plus a single forward eye are added inside that block
# for a clearer profile read — wolf-with-emotion.toml's own header comment
# explains why this class has no literal head circle to shift, only an
# irregular path, so the profile redraws that path afresh rather than
# transforming it algebraically. Body ellipse, leg strokes, tail and the
# body highlight all keep wolf-with-emotion's own exact coordinates.
classes = ["wolf"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="wolf-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="12.6" cy="15.4" rx="6.6" ry="4.2" fill="url(#wolf-facing-left-fill)"/>
  <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <line x1="8" y1="17.6" x2="7.8" y2="22.2"/>
    <line x1="10.8" y1="18.6" x2="10.8" y2="22.4"/>
    <line x1="14.4" y1="18.6" x2="14.4" y2="22.4"/>
    <line x1="17.4" y1="17.6" x2="17.6" y2="22.2"/>
  </g>
  <path d="M3.84 10.2 C3.84 7 6.04 5.2 8.84 5.2 C11.64 5.2 13.24 7.4 13.04 10.2 C12.84 12.4 11.44 13.4 8.64 13.4 C6.04 13.4 3.84 12.4 3.84 10.2 Z" fill="url(#wolf-facing-left-fill)"/>
  <path d="M4.24 6.6 L2.64 2.6 L6.24 4.8 Z" fill="url(#wolf-facing-left-fill)"/>
  <path d="M10.64 5.4 L11.04 1.6 L13.84 4.6 Z" fill="url(#wolf-facing-left-fill)"/>
  <ellipse cx="6.84" cy="12.4" rx="2.2" ry="1.6" fill="color-mix(in srgb, currentColor 45%, white)"/>
  <path d="M4.84 10.4 C5.24 12.2 7.04 13 8.64 13 C7.04 12.2 5.84 11.2 5.64 9.4 Z" fill="#000000" opacity="0.18"/>
  <ellipse cx="4.84" cy="11.2" rx="0.55" ry="0.45" fill="#1c1c1c"/>
  <path d="M4.0 9.0 Q3.2 9.5 4.0 10.0 Z" fill="url(#wolf-facing-left-fill)"/>
  <ellipse cx="5.3" cy="8.3" rx="0.3" ry="0.36" fill="#1c1c1c"/>
  <path d="M17.4 13.2 C21 10.6 23.6 13 22 16.6 C21 18.2 19.6 18.4 18.8 17 C20.2 16.4 20.8 15.1 20.2 13.8 C19.2 13 18.3 12.9 17.4 13.2 Z" fill="url(#wolf-facing-left-fill)"/>
  <ellipse cx="10.2" cy="12.2" rx="2.4" ry="1.4" fill="#ffffff" opacity="0.26"/>
  <ellipse cx="8.54" cy="9.2" rx="3.6" ry="3.1" fill="#ffffff" opacity="0.22"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from THIS file's own profile geometry, not copied from
# wolf-with-emotion.toml's front-facing anchor (cx=9.3 cy=9.2 scale=4.2): the
# head-and-ears block shifts left by -0.76 (proportional to king's own -0.6
# delta scaled by wolf's own average half-extent 4.2 vs king's r=3.3), and
# the forward eye this file already draws sits at (5.3, 8.3). scale is ~0.65
# of that average half-extent (2.7): cx = 5.3 + 0.4*2.7 = 6.38,
# cy = 8.3 + 0.15*2.7 = 8.71.
[face]
cx = 6.38
cy = 8.71
scale = 2.7

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
