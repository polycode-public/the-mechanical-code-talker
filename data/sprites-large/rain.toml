# rain — a grey cloud over four falling streaks, fixed cool tones since a
# rain-cloud's own colour doesn't vary with a taught instance the way an
# object's material does.
classes = ["rain"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="rain-cloud" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#e4e9ee"/>
      <stop offset="60%" stop-color="#b7c2cc"/>
      <stop offset="100%" stop-color="#8792a0"/>
    </linearGradient>
  </defs>
  <path d="M6.6 12.4 C4.2 12.4 3 10.4 4.2 8.4 C4.8 6 7.2 5.4 8.8 6.6 C9.8 4.4 13 4 14.6 6.2 C17.4 5.8 19.4 7.8 19 10.2 C20.6 10.6 21 12.6 19.4 13.6 C19 13.9 18.6 14 18 14 H7.4 C7.1 14 6.8 14 6.6 12.4 Z" fill="url(#rain-cloud)"/>
  <ellipse cx="9" cy="8.2" rx="2.2" ry="1.4" fill="#ffffff" opacity="0.4"/>
  <g stroke="#5c9bd6" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <line x1="7.4" y1="16" x2="6.2" y2="21"/>
    <line x1="11.4" y1="16" x2="10.2" y2="21.4"/>
    <line x1="15.4" y1="16" x2="14.2" y2="21"/>
    <line x1="19" y1="15.6" x2="18" y2="20"/>
  </g>
</svg>
"""
