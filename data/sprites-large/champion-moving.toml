# champion-moving — champion.toml's front-facing figure caught mid-stride,
# with no facing angle recorded (mgx:pose = "moving" alone, centre view).
# The head stays champion-with-emotion.toml's own front anchor exactly; the
# two arms swing oppositely (one raised and pulled in, the other extended
# down and back) and the robe leans slightly off its resting silhouette —
# the same kind of small, readable coordinate shift
# king-facing-left-moving.toml uses for its own profile stride, applied here
# to a front view instead of a profile. The ribbon, medal and laurel stay
# exactly where champion-with-emotion.toml already puts them.
classes = ["champion"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="champion-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#champion-moving-fill)">
    <path d="M9.4 13.1 C8.0 12.5 6.7 13.3 6.3 15.6 C6.2 16.9 6.8 17.7 7.6 17.4 C7.7 15.8 8.1 14.4 9.6 13.7 Z"/>
    <path d="M14.6 13.1 C16.5 13.5 18.3 15.3 18.6 18.0 C18.7 19.3 17.9 20.2 16.8 19.6 C16.6 17.5 15.9 15.5 14.3 14.2 Z"/>
    <path d="M6.2 21 C6.1 15.6 8.6 12.7 12 12.8 C15.4 12.9 18.0 15.4 17.8 21.3 C15.4 20.8 8.6 20.8 6.2 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
  <path d="M10.4 13.6 L12 16.8 L13.6 13.6" fill="none" stroke="#a6283a" stroke-width="1" stroke-linecap="round"/>
  <circle cx="12" cy="18.2" r="2" fill="#d9a635"/>
  <circle cx="12" cy="18.2" r="1.1" fill="#8a5a2e"/>
  <g fill="#4a7a34">
    <ellipse cx="9.6" cy="17.7" rx="0.5" ry="0.22" transform="rotate(-30 9.6 17.7)"/>
    <ellipse cx="14.4" cy="17.7" rx="0.5" ry="0.22" transform="rotate(30 14.4 17.7)"/>
  </g>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#champion-moving-fill)"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:pose"
value = "moving"

# The same cx/cy/r champion-with-emotion.toml's own front-facing head circle
# declares — the walk cycle changes the body, never the head anchor.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
