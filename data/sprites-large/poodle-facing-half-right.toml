# poodle-facing-half-right — poodle-facing-half-left.toml's three-quarter
# turn mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins. The mirror flips the lit corner of the shared gradient
# along with the pose, which reads as the same figure turned around under
# the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["poodle"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="poodle-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="16.7" cy="15.2" rx="6.2" ry="4.6" fill="url(#poodle-facing-half-right-fill)"/>
    <ellipse cx="14.5" cy="13.4" rx="1.8" ry="1.3" fill="#000000" opacity="0.18"/>
    <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <line x1="12.5" y1="19" x2="12.3" y2="21.8"/>
      <line x1="14.9" y1="19.6" x2="14.9" y2="22.2"/>
      <line x1="18.9" y1="19.6" x2="18.9" y2="22.2"/>
      <line x1="21.3" y1="19" x2="21.5" y2="21.8"/>
    </g>
    <g fill="url(#poodle-facing-half-right-fill)">
      <circle cx="12.3" cy="20.8" r="1"/>
      <circle cx="14.9" cy="21.4" r="1"/>
      <circle cx="18.9" cy="21.4" r="1"/>
      <circle cx="21.5" cy="20.8" r="1"/>
    </g>
    <rect x="22" y="14.2" width="2.2" height="6" rx="1.1" fill="url(#poodle-facing-half-right-fill)"/>
    <circle cx="23.1" cy="13.2" r="1.5" fill="url(#poodle-facing-half-right-fill)"/>
    <circle cx="8.5" cy="8.8" r="4" fill="url(#poodle-facing-half-right-fill)"/>
    <g fill="url(#poodle-facing-half-right-fill)">
      <circle cx="5.3" cy="5.8" r="1.6"/>
      <circle cx="8.3" cy="4.1" r="1.7"/>
      <circle cx="10.9" cy="5.2" r="1.1"/>
    </g>
    <ellipse cx="4.7" cy="9.5" rx="0.5" ry="0.42" fill="#1c1c1c"/>
    <ellipse cx="7.7" cy="7.9" rx="0.5" ry="0.6" fill="#1c1c1c"/>
    <ellipse cx="10.4" cy="8.2" rx="0.3" ry="0.37" fill="#1c1c1c"/>
    <ellipse cx="9.5" cy="6.5" rx="1" ry="0.8" fill="#ffffff" opacity="0.32"/>
    <ellipse cx="13.1" cy="12.4" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# poodle-facing-half-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 9.0); cy and scale are the mirror's own invariants. Because the
# fragment sits outside the flip group, these are plain unflipped canvas
# coordinates.
[face]
cx = 15.0
cy = 8.4
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
