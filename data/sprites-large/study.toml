# study — the family's shared room vignette turned toward a writing desk:
# a fixed wooden desk under a lamp's warm glow with a stack of books
# beside it, cosier and more cluttered than office.toml's rigid grid.
# The desk-wood and lamp-glow are fixed for the same reason the drawing
# room's mantel and flame are: neither is a surface a theme should own.
classes = ["study"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="study-wash" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 38%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 65%, black)"/>
    </linearGradient>
    <linearGradient id="study-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f6a3f"/>
      <stop offset="100%" stop-color="#5c3f22"/>
    </linearGradient>
    <radialGradient id="study-lamp" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#study-wash)"/>
  <rect x="3" y="15.6" width="18" height="5.4" fill="color-mix(in srgb, currentColor 55%, black)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <rect x="6.4" y="14.4" width="11.2" height="1.6" fill="url(#study-wood)"/>
  <path d="M7 16 V19.4 M17.4 16 V19.4" stroke="#5c3f22" stroke-width="0.9"/>
  <circle cx="16.4" cy="11.6" r="3.2" fill="url(#study-lamp)"/>
  <path d="M15.6 14.4 L17.2 14.4 L16.6 11 Z" fill="#7a2e2e"/>
  <rect x="16.1" y="9.4" width="1" height="1.6" fill="#3a2c1c"/>
  <g>
    <rect x="8.4" y="12.6" width="3.4" height="1.4" fill="#b23a3a"/>
    <rect x="8.6" y="11.2" width="3" height="1.4" fill="#3a5f8a"/>
    <rect x="8.8" y="9.8" width="2.6" height="1.4" fill="#c9a227"/>
  </g>
</svg>
