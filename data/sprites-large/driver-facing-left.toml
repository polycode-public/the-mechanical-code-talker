# driver-facing-left — the same flat-cap-and-wheel driver as
# driver-with-emotion.toml turned to a left profile: the head shifts toward
# the left shoulder, a nose wedge breaks the head's left silhouette, a single
# forward eye replaces the front-facing face fragment's own pair, and the cap
# (crown, brim tab, button, highlight) follows the head by the same amount.
# The body, arms, legs and steering wheel keep driver-with-emotion.toml's own
# geometry — none of that changes when only the head turns. Selected only
# when the instance's own mgx:faces fact says "left"; it also carries the
# shared face-fragment mechanism, so a driver taught both mgx:faces = left
# and one of the 6 mgx:feels words renders this profile wearing that mood.
classes = ["driver"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="driver-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="driver-facing-left-cap" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#5c6b7a"/>
      <stop offset="100%" stop-color="#3c4653"/>
    </linearGradient>
  </defs>
  <g fill="url(#driver-facing-left-fill)">
    <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
    <path d="M14.6 13.1 C16.4 13.2 18.1 14.7 18.4 17.4 C18.5 18.8 17.8 19.7 16.8 19.2 C16.7 17.1 16.1 15.1 14.3 14.2 Z"/>
    <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
    <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
  </g>
  <circle cx="11.4" cy="6.6" r="3.3" fill="url(#driver-facing-left-fill)"/>
  <path d="M8.3 6 Q7.05 7 8.3 8.05 Z" fill="url(#driver-facing-left-fill)"/>
  <ellipse cx="9.7" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
  <path d="M10.4 12.6 L12 13.9 L13.6 12.6" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <circle cx="12" cy="17.6" r="3" fill="none" stroke="url(#driver-facing-left-fill)" stroke-width="1.3"/>
  <line x1="12" y1="14.6" x2="12" y2="17.6" stroke="url(#driver-facing-left-fill)" stroke-width="1.1"/>
  <line x1="9.4" y1="19.1" x2="12" y2="17.6" stroke="url(#driver-facing-left-fill)" stroke-width="1.1"/>
  <line x1="14.6" y1="19.1" x2="12" y2="17.6" stroke="url(#driver-facing-left-fill)" stroke-width="1.1"/>
  <circle cx="12" cy="17.6" r="0.7" fill="url(#driver-facing-left-fill)"/>
  <path d="M8.3 4.5 C8.1 2.7 9.4 1.4 11.4 1.4 C13.4 1.4 14.7 2.7 14.5 4.5 C14.46 4.7 14.3 4.8 14.1 4.8 L8.7 4.8 C8.5 4.8 8.34 4.7 8.3 4.5 Z" fill="url(#driver-facing-left-cap)"/>
  <path d="M8.3 4.5 C7.7 4.5 7.1 4.7 6.7 4.9 C6.5 5 6.5 5.3 6.8 5.35 L8.7 5.2 L8.7 4.5 Z" fill="url(#driver-facing-left-cap)"/>
  <circle cx="11.4" cy="1.7" r="0.35" fill="#2b323b"/>
  <ellipse cx="9.5" cy="2.6" rx="1.2" ry="0.4" fill="#ffffff" opacity="0.25"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

# Derived from THIS file's own profile geometry: the profile head circle is
# cx=11.4 cy=6.6 r=3.3 (shifted left 0.6 from the front cx=12, the same
# shift king-facing-left.toml uses for its own identical head radius), and
# the forward eye this file already draws sits at (9.7, 6.1). scale is
# ~0.65 of the head radius and cx/cy place the fragment so its own forward
# eye lands on the drawn one, clear of the cap above.
[face]
cx = 10.5
cy = 6.4
scale = 2.1

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
