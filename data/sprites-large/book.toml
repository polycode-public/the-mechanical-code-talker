# book — the library's default portable at the sprite tier: a closed hardback
# seen spine-on, so a taken book reads as its own object rather than the
# generic portable. The cover stays currentColor (a theme owns the binding
# colour); the visible page block, the raised spine bands and the ribbon
# marker are fixed cream/burgundy, since paper edges and a bookmark ribbon
# are facts about the object, not the binding's own colour.
classes = ["book"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="book-wash" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <path d="M6.6 3.6 H18.6 A1 1 0 0 1 19.6 4.6 V20.6 A1 1 0 0 1 18.6 21.6 H6.6 Z" fill="#f4ecd8"/>
  <g stroke="#d8c9a8" stroke-width="0.25" opacity="0.7">
    <line x1="19.2" y1="5" x2="19.2" y2="20.2"/>
    <line x1="19.6" y1="5.4" x2="19.6" y2="19.8"/>
  </g>
  <path d="M6 3 H18 A1 1 0 0 1 19 4 V20 A1 1 0 0 1 18 21 H6 Z" fill="currentColor"/>
  <path d="M6 3 H18 A1 1 0 0 1 19 4 V20 A1 1 0 0 1 18 21 H6 Z" fill="url(#book-wash)"/>
  <rect x="6" y="3" width="1.8" height="18" fill="#000000" opacity="0.3"/>
  <g stroke="#000000" stroke-width="0.4" opacity="0.25">
    <line x1="6" y1="7" x2="7.8" y2="7"/>
    <line x1="6" y1="10.4" x2="7.8" y2="10.4"/>
    <line x1="6" y1="13.8" x2="7.8" y2="13.8"/>
  </g>
  <g stroke="#ffffff" stroke-width="0.3" opacity="0.3">
    <line x1="6" y1="7.5" x2="7.8" y2="7.5"/>
    <line x1="6" y1="10.9" x2="7.8" y2="10.9"/>
    <line x1="6" y1="14.3" x2="7.8" y2="14.3"/>
  </g>
  <path d="M9.6 3 V21" stroke="#000000" stroke-width="0.5" opacity="0.3"/>
  <path d="M11 7.5 H17 M11 10.4 H17 M11 13.3 H15" stroke="#000000" stroke-width="0.6" opacity="0.3"/>
  <path d="M14.6 3 L16.2 3 L16.2 22.4 L15.4 21 L14.6 22.4 Z" fill="#7c3138"/>
</svg>
"""
