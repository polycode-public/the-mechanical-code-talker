# road — a converging perspective strip with a dashed centre line reads as
# a road viewed from the driver's own position, rather than the top-down
# map view river.toml and street.toml use.
classes = ["road"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="road-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <path d="M9.4 2.4 L14.6 2.4 L20 21.6 H4 Z" fill="url(#road-fill)"/>
  <path d="M9.4 2.4 L4 21.6 M14.6 2.4 L20 21.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <g stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.55">
    <line x1="12" y1="4.4" x2="12" y2="7"/>
    <line x1="12" y1="9.6" x2="12" y2="12.2"/>
    <line x1="12" y1="14.8" x2="12" y2="17.4"/>
    <line x1="12" y1="20" x2="12" y2="21.6"/>
  </g>
</svg>
"""
