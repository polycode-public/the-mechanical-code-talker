# farmer-facing-half-right-moving — farmer-facing-half-left-moving.toml's
# mid-stride three-quarter turn mirrored across the canvas midline, the same
# flip-group rule every right-facing file here uses. {{FACE}} sits outside
# the flip group.
classes = ["farmer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="farmer-facing-half-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="farmer-facing-half-right-moving-straw" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#e8c977"/>
      <stop offset="100%" stop-color="#c49a3f"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#farmer-facing-half-right-moving-fill)">
      <path d="M9.4 13.4 C7.8 12.8 6.3 13.8 5.8 16.4 C5.6 17.8 6.2 18.8 7.3 18.5 C7.4 16.5 7.9 14.8 9.6 13.9 Z"/>
      <path d="M14.6 13.4 C16.7 13.8 18.7 15.6 19 18.5 C19.1 19.8 18.3 20.6 17.2 20 C17 17.7 16.3 15.4 14.3 14.5 Z"/>
      <path d="M6.3 21 C6.1 15.7 8.7 13.2 11.7 13.2 C15.1 13.2 17.6 15 17.1 19.6 C16.9 20.7 15.9 20.7 15.1 20.1 Z"/>
      <path d="M10.75 11.1 L13.25 11.1 L13.05 13.3 L10.95 13.3 Z"/>
    </g>
    <ellipse cx="11.72" cy="5.4" rx="7" ry="1.7" fill="url(#farmer-facing-half-right-moving-straw)"/>
    <path d="M8.82 5.1 C8.82 3.1 10.12 1.7 11.72 1.7 C13.32 1.7 14.62 3.1 14.62 5.1 C14.62 5.5 14.52 5.8 14.42 6.1 L9.02 6.1 C8.92 5.8 8.82 5.5 8.82 5.1 Z" fill="url(#farmer-facing-half-right-moving-straw)" opacity="0.92"/>
    <path d="M9.02 5.6 L14.42 5.6" stroke="#7a5326" stroke-width="0.6" opacity="0.5"/>
    <circle cx="11.72" cy="8.4" r="3.1" fill="url(#farmer-facing-half-right-moving-fill)"/>
    <path d="M8.81 7.93 Q8.15 9.15 8.81 9.81 Z" fill="url(#farmer-facing-half-right-moving-fill)"/>
    <ellipse cx="10.12" cy="7.93" rx="0.26" ry="0.32" fill="#1c1c1c"/>
    <ellipse cx="13.88" cy="7.88" rx="0.17" ry="0.21" fill="#1c1c1c"/>
    <path d="M10.4 12.9 L12 14.2 L13.6 12.9" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <rect x="19.4" y="10" width="0.7" height="10.5" rx="0.3" fill="#8a5f2f"/>
    <path d="M18.4 8.2 L18.4 10.3 M19.75 8 L19.75 10.3 M21.1 8.2 L21.1 10.3" stroke="#6b7580" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M18.4 10.1 C18.4 10.6 18.8 10.9 19.3 10.9 L20.2 10.9 C20.7 10.9 21.1 10.6 21.1 10.1" fill="none" stroke="#6b7580" stroke-width="0.4"/>
    <ellipse cx="8.52" cy="4.7" rx="2.2" ry="0.6" fill="#ffffff" opacity="0.3"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 12.86
cy = 8.31
scale = 2.54

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
