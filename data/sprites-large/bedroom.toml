# bedroom — room.toml's own frame and wash, its interior swapped for a
# side-view bed (a filled headboard-plus-mattress silhouette, the same
# currentColor-fill convention city/factory already use for their own
# skyline and building shapes) and a paned window. A thin double-outline
# top-view bed was tried first and read as a folder icon at this stroke
# weight — a filled side-view silhouette is what actually reads as "bed".
classes = ["bedroom"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bedroom-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#bedroom-fill)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <rect x="5" y="10.6" width="2.6" height="9" rx="0.6" fill="currentColor" opacity="0.85"/>
  <rect x="5" y="15.6" width="14" height="4" rx="0.8" fill="currentColor" opacity="0.85"/>
  <ellipse cx="8.6" cy="13.6" rx="2.6" ry="1.6" fill="#ffffff" opacity="0.35"/>
  <path d="M6.6 15.6 L18.2 15.6" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>
  <rect x="14.5" y="5.4" width="4" height="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <path d="M16.5 5.4 V9.4 M14.5 7.4 H18.5" stroke="currentColor" stroke-width="0.8"/>
  <path d="M4 4 L11 4" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
</svg>
"""
