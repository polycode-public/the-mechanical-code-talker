# bedroom — the family's shared room vignette: a wood-framed bed with a
# fixed fabric blanket and a warm-lit window standing in for the room's
# light source, filled side-view silhouettes rather than a thin double
# outline (that read as a folder icon at this stroke weight). Wood and
# blanket cloth are fixed since bedding is never theme-coloured.
classes = ["bedroom"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bedroom-fill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 42%, white)"/>
      <stop offset="60%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 70%, black)"/>
    </linearGradient>
    <linearGradient id="bedroom-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#5b3a20"/>
    </linearGradient>
    <radialGradient id="bedroom-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffe6a8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe6a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="url(#bedroom-fill)"/>
  <rect x="3" y="15.6" width="18" height="5.4" fill="color-mix(in srgb, currentColor 55%, black)"/>
  <rect x="3" y="3" width="18" height="18" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <rect x="14.6" y="5.4" width="4" height="4" fill="url(#bedroom-glow)"/>
  <rect x="14.6" y="5.4" width="4" height="4" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.7"/>
  <path d="M16.6 5.4 V9.4 M14.6 7.4 H18.6" stroke="currentColor" stroke-width="0.6" opacity="0.6"/>
  <rect x="5" y="10.6" width="2.6" height="9" rx="0.6" fill="url(#bedroom-frame)"/>
  <rect x="5" y="15.6" width="14" height="4" rx="0.8" fill="#3d5a73"/>
  <path d="M5 15.6 H19 V17 C19 17.3 18.8 17.5 18.4 17.5 H5.6 C5.2 17.5 5 17.3 5 17 Z" fill="#2c4155"/>
  <ellipse cx="8.6" cy="13.6" rx="2.6" ry="1.6" fill="#f4ecdf"/>
  <path d="M6.6 15.6 L18.2 15.6" stroke="#ffffff" stroke-width="0.4" opacity="0.3"/>
  <path d="M4 4 L11 4" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
"""
