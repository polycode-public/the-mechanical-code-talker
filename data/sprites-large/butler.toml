# butler — Ashcombe Hall's own butler. The coat keeps the page's class
# colour (the gradient every person sprite shares), and everything that
# actually names him is fixed palette, the split badger.toml makes between
# its stripes and its coat: soot hair, moustache and shoes, a cream wing
# collar and shirt front, a black bow tie, white gloves, and the brass
# salver on his raised hand. Arms and legs break the silhouette so he reads
# as a standing man at the 40px the room view draws him, not a bell shape.
