# butler — Ashcombe Hall's own butler at the sprite tier: the gradient
# person body, wing-collar and bow-tie kept as flat dark accents (a
# butler's formalwear reads as black regardless of the page's own accent
# colour), one highlight on the head.
classes = ["butler"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="butler-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#butler-fill)"/>
  <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z" fill="url(#butler-fill)"/>
  <path d="M7.6 11.6 L11.3 13.2 L8.6 15.4 Z" fill="currentColor" opacity="0.95"/>
  <path d="M16.4 11.6 L12.7 13.2 L15.4 15.4 Z" fill="currentColor" opacity="0.95"/>
  <path d="M10.6 14.2 L12 16.1 L13.4 14.2 L12 18.6 Z" fill="#1a1a1a" opacity="0.55"/>
  <path d="M9.6 4.2 C10.3 3.6 11.1 3.4 12 3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
</svg>
"""
