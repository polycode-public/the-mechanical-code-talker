# bird-facing-right-moving — bird-facing-left-moving.toml's flight pose
# mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is
# never mirrored.
classes = ["bird"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bird-facing-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="12.6" cy="13.9" rx="6.4" ry="5" fill="url(#bird-facing-right-moving-fill)"/>
    <path d="M18.6 8.4 C22 7.6 22.6 10.6 19.4 11.6 C17.6 12.2 16.6 10.4 18.6 8.4 Z" fill="color-mix(in srgb, currentColor 78%, black)"/>
    <path d="M15.4 11.4 C13.4 10.6 11 11.4 10.4 14 C10 16.2 11.6 17.8 13.6 17.4 C15.4 17 16.6 13.4 15.4 11.4 Z" fill="#c1552e"/>
    <circle cx="7.6" cy="8.4" r="3.13" fill="url(#bird-facing-right-moving-fill)"/>
    <path d="M4.6 8.2 L1.6 7.4 L4.2 9.6 Z" fill="#e8a23a"/>
    <ellipse cx="6" cy="7.4" rx="0.5" ry="0.6" fill="#1c1c1c"/>
    <ellipse cx="6.6" cy="6.8" rx="1" ry="0.7" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="14.6" cy="10.9" rx="2.2" ry="1.3" fill="#ffffff" opacity="0.3"/>
    <g stroke="#e8a23a" stroke-width="1.3" stroke-linecap="round">
      <line x1="13.6" y1="17.5" x2="15" y2="18.5"/>
      <line x1="11.2" y1="17.6" x2="10" y2="18.6"/>
    </g>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 17.2
cy = 7.7
scale = 2.0

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
