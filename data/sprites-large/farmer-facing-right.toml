# farmer-facing-right — farmer-facing-left.toml's profile mirrored across
# the canvas midline (every shape wrapped in one translate-then-flip group),
# so the two directions stay geometrically identical twins. The mirror
# flips the lit corner of the shared gradients along with the pose, which
# reads as the same figure turned around under the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["farmer"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="farmer-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="farmer-facing-right-straw" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#e8c977"/>
      <stop offset="100%" stop-color="#c49a3f"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <g fill="url(#farmer-facing-right-fill)">
      <path d="M9.4 13.4 C7.6 13.5 5.9 15 5.6 17.7 C5.5 19.1 6.2 20 7.2 19.5 C7.3 17.4 7.9 15.4 9.7 14.5 Z"/>
      <path d="M14.6 13.4 C16.4 13.5 18.1 15 18.4 17.7 C18.5 19.1 17.8 20 16.8 19.5 C16.7 17.4 16.1 15.4 14.3 14.5 Z"/>
      <path d="M6 21 C6 15.5 8.7 13.1 12 13.1 C15.3 13.1 18 15.5 18 21 Z"/>
      <path d="M10.75 11.1 L13.25 11.1 L13.05 13.3 L10.95 13.3 Z"/>
    </g>
    <ellipse cx="11.44" cy="5.4" rx="7" ry="1.7" fill="url(#farmer-facing-right-straw)"/>
    <path d="M8.54 5.1 C8.54 3.1 9.84 1.7 11.44 1.7 C13.04 1.7 14.34 3.1 14.34 5.1 C14.34 5.5 14.24 5.8 14.14 6.1 L8.74 6.1 C8.64 5.8 8.54 5.5 8.54 5.1 Z" fill="url(#farmer-facing-right-straw)" opacity="0.92"/>
    <path d="M8.74 5.6 L14.14 5.6" stroke="#7a5326" stroke-width="0.6" opacity="0.5"/>
    <circle cx="11.44" cy="8.4" r="3.1" fill="url(#farmer-facing-right-fill)"/>
    <path d="M8.53 7.84 Q7.35 8.78 8.53 9.76 Z" fill="url(#farmer-facing-right-fill)"/>
    <ellipse cx="9.84" cy="7.93" rx="0.26" ry="0.32" fill="#1c1c1c"/>
    <path d="M10.4 12.9 L12 14.2 L13.6 12.9" fill="none" stroke="currentColor" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <path d="M9.3 13.9 C8 14.8 7.1 16.3 6.9 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.9 C16 14.8 16.9 16.3 17.1 18.2" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <rect x="19.4" y="10" width="0.7" height="10.5" rx="0.3" fill="#8a5f2f"/>
    <path d="M18.4 8.2 L18.4 10.3 M19.75 8 L19.75 10.3 M21.1 8.2 L21.1 10.3" stroke="#6b7580" stroke-width="0.6" stroke-linecap="round"/>
    <path d="M18.4 10.1 C18.4 10.6 18.8 10.9 19.3 10.9 L20.2 10.9 C20.7 10.9 21.1 10.6 21.1 10.1" fill="none" stroke="#6b7580" stroke-width="0.4"/>
    <ellipse cx="8.24" cy="4.7" rx="2.2" ry="0.6" fill="#ffffff" opacity="0.3"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# farmer-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 10.63); cy and scale are the mirror's own invariants, since the
# fragment sits outside the flip group and never itself gets flipped.
[face]
cx = 13.37
cy = 8.23
scale = 1.97

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
