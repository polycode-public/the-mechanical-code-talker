# mouse-facing-half-right — mouse-facing-half-left.toml's three-quarter
# turn mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins. The mirror flips the lit corner of the shared gradient
# along with the pose, which reads as the same figure turned around under
# the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["mouse"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="mouse-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M4.4 15 C4 12 5.8 9.6 9.2 9.4 C13.4 9.1 17.6 9.6 20 12.2 C22.4 14.6 22.2 18.4 19.4 20.4 C16.6 22.2 11 22.4 7.6 21 C4.8 19.8 4.8 17.4 4.4 15 Z" fill="url(#mouse-facing-half-right-fill)"/>
    <circle cx="12.4" cy="5.2" r="1.3" fill="url(#mouse-facing-half-right-fill)"/>
    <circle cx="7.6" cy="5.8" r="3" fill="url(#mouse-facing-half-right-fill)"/>
    <path d="M19.6 19 C23.2 19.6 23.6 15.8 21.6 14.2 C22.4 16.6 21.2 18.2 19.6 19 Z" fill="url(#mouse-facing-half-right-fill)"/>
    <ellipse cx="4.8" cy="14.6" rx="0.8" ry="0.6" fill="#c98c8c" opacity="0.7"/>
    <g stroke="#000000" stroke-width="0.35" opacity="0.4">
      <path d="M4.8 14.2 L2.6 13.6"/>
      <path d="M4.8 15 L2.6 15.6"/>
    </g>
    <ellipse cx="6.6" cy="12.6" rx="0.55" ry="0.65" fill="#000000" opacity="0.6"/>
    <ellipse cx="9.8" cy="11" rx="0.25" ry="0.3" fill="#000000" opacity="0.6"/>
    <ellipse cx="16.8" cy="17.4" rx="3" ry="1.6" fill="#ffffff" opacity="0.28"/>
    <ellipse cx="6.6" cy="4.8" rx="0.9" ry="0.7" fill="#ffffff" opacity="0.35"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# mouse-facing-half-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 7.6); cy and scale are the mirror's own invariants. Because
# the fragment sits outside the flip group, these are plain unflipped
# canvas coordinates.
[face]
cx = 16.4
cy = 12.975
scale = 2.5

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
