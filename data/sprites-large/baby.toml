# baby — a swaddled bundle in place of the standing body (no leg split, a
# rounded closing curve, a fold line for the blanket wrap) and the pack's
# largest head-to-body ratio: the youngest figure, and the one whose body
# shape itself is the differentiator rather than arms or a held prop — a
# swaddled baby has no visible limbs by design. A wrap band and knot sit
# across the chest where the other figures carry a collar, and two small
# foot bumps break the swaddle's lower hem.
classes = ["baby"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="baby-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="9.8" cy="21.5" rx="1.3" ry="1" fill="url(#baby-fill)"/>
  <ellipse cx="14.2" cy="21.5" rx="1.3" ry="1" fill="url(#baby-fill)"/>
  <path d="M7.2 21 C6.6 15.6 8 12.4 12 12.4 C16 12.4 17.4 15.6 16.8 21 C16.8 21 14.6 22 12 22 C9.4 22 7.2 21 7.2 21 Z" fill="url(#baby-fill)"/>
  <ellipse cx="9.8" cy="17.2" rx="1.6" ry="2.4" fill="#ffffff" opacity="0.1"/>
  <circle cx="12" cy="7.4" r="3.8" fill="url(#baby-fill)"/>
  <path d="M9 12.9 L12 15.4 L15 12.9" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8.4 16.6 C9.6 17.4 14.4 17.4 15.6 16.6" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.3" stroke-linecap="round"/>
  <circle cx="12" cy="17" r="0.55" fill="currentColor" opacity="0.25"/>
  <path d="M9.6 4.8 C10.3 4.2 11.1 4 12 4.1" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
</svg>
"""
