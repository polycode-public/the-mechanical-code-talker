# cow — gradient-shaded like dog/animal, no material table: the patch
# markings stay the same black-overlay convention every other sprite here
# uses for shading, not a new fixed hue, so "spotted" reads without
# breaking the tier's own currentColor discipline.
classes = ["cow"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="cow-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="14.6" rx="7" ry="4.8" fill="url(#cow-fill)"/>
  <circle cx="6.6" cy="9.6" r="4.4" fill="url(#cow-fill)"/>
  <ellipse cx="5.6" cy="11.6" rx="2.4" ry="1.8" fill="#ffffff" opacity="0.42"/>
  <circle cx="4.6" cy="11.2" r="0.5" fill="#000000" opacity="0.5"/>
  <circle cx="6.6" cy="11.6" r="0.5" fill="#000000" opacity="0.5"/>
  <path d="M4 6.6 L2.4 4.4 M9.2 6.6 L10.8 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M3.4 8.4 L1.4 7.6 M9.8 8.4 L11.8 7.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <g fill="#000000" opacity="0.24">
    <ellipse cx="15.6" cy="12" rx="2.4" ry="1.8"/>
    <ellipse cx="10.6" cy="16.4" rx="1.8" ry="1.4"/>
    <ellipse cx="18" cy="16" rx="1.6" ry="1.3"/>
  </g>
  <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <line x1="9" y1="19" x2="9" y2="22"/>
    <line x1="17" y1="19" x2="17" y2="22"/>
  </g>
  <ellipse cx="9.6" cy="12.6" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
</svg>
"""
