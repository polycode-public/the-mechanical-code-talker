# girl-facing-left — girl-with-emotion.toml's front figure turned to a left
# profile: the head shifts toward the left shoulder (her own head circle,
# cx=12 cy=8.2 r=3.6, is bigger than the generic adult's), a nose wedge
# breaks the head's left silhouette, and a single forward eye replaces the
# front-facing pair. The twin tails follow the head's own turn (both shifted
# by the same delta the head moved), and the dress/arms keep
# girl-with-emotion.toml's own geometry unchanged.
#
# Anchor arithmetic scaled from king-facing-left.toml's own derivation by
# this head's own radius ratio (3.6/3.3): the head shift, nose wedge and eye
# offsets are king's own relative-to-head-centre offsets scaled by that same
# ratio, then placed against this file's own head centre (11.35, 8.2).

classes = ["girl"]

svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="girl-facing-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M15.55 6.8 C16.95 8.6 16.95 11.2 15.55 13.8" fill="none" stroke="url(#girl-facing-left-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M7.15 6.8 C5.75 8.6 5.75 11.2 7.15 13.8" fill="none" stroke="url(#girl-facing-left-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <g fill="url(#girl-facing-left-fill)">
    <path d="M9.4 14.9 C7.9 15 6.5 16.2 6.3 18.3 C6.25 19.4 6.9 20.1 7.7 19.7 C7.8 18 8.3 16.5 9.7 15.8 Z"/>
    <path d="M14.6 14.9 C16.1 15 17.5 16.2 17.7 18.3 C17.75 19.4 17.1 20.1 16.3 19.7 C16.2 18 15.7 16.5 14.3 15.8 Z"/>
    <path d="M7.4 21 C7.4 16.6 9.4 14.6 12 14.6 C14.6 14.6 16.6 16.6 16.6 21 Z"/>
    <path d="M10.8 11.4 L13.2 11.4 L13 14.6 L11 14.6 Z"/>
  </g>
  <ellipse cx="10.2" cy="18" rx="1.1" ry="1.6" fill="#ffffff" opacity="0.1"/>
  <circle cx="11.35" cy="8.2" r="3.6" fill="url(#girl-facing-left-fill)"/>
  <path d="M7.97 7.55 Q6.6 8.64 7.97 9.78 Z" fill="url(#girl-facing-left-fill)"/>
  <ellipse cx="9.5" cy="7.65" rx="0.31" ry="0.37" fill="#1c1c1c"/>
  <path d="M10.6 14.3 L12 15.4 L13.4 14.3" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 15.4 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.35" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 15.3 C8.3 16 7.6 17.2 7.4 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 15.3 C15.7 16 16.4 17.2 16.6 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M9.15 5.6 C9.75 5.1 10.45 4.9 11.35 5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "left"

[face]
cx = 10.42
cy = 7.99
scale = 2.29

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
