# king-facing-half-right — king-facing-half-left.toml's three-quarter turn
# mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins. {{FACE}} sits outside the flip group, the same rule the
# full profile pair uses, so a resolved expression never reads back-to-front.
classes = ["king"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="king-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
    <linearGradient id="king-facing-half-right-crown-gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#f6d675"/>
      <stop offset="55%" stop-color="#d9a635"/>
      <stop offset="100%" stop-color="#9c6b12"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M7.1 3.4 L8 0.9 L10 2.6 L11.7 0.25 L13.4 2.6 L15.4 0.9 L16.3 3.4 Z" fill="url(#king-facing-half-right-crown-gold)"/>
    <circle cx="11.7" cy="1.1" r="0.55" fill="#a6283a"/>
    <rect x="7.1" y="2.3" width="9.2" height="1.3" rx="0.4" fill="url(#king-facing-half-right-crown-gold)"/>
    <g fill="url(#king-facing-half-right-fill)">
      <path d="M9.4 13.1 C7.6 13.2 5.9 14.7 5.6 17.4 C5.5 18.8 6.2 19.7 7.2 19.2 C7.3 17.1 7.9 15.1 9.7 14.2 Z"/>
      <path d="M14.6 13.1 C16.4 13.2 18.1 14.7 18.4 17.4 C18.5 18.8 17.8 19.7 16.8 19.2 C16.7 17.1 16.1 15.1 14.3 14.2 Z"/>
      <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z"/>
      <path d="M10.7 9.5 L13.3 9.5 L13.1 13 L10.9 13 Z"/>
    </g>
    <ellipse cx="10.4" cy="17" rx="1.4" ry="2.2" fill="#ffffff" opacity="0.1"/>
    <path d="M8.4 13 C9.6 12.4 10.8 12.1 12 12.1 C13.2 12.1 14.4 12.4 15.6 13 L15.2 14.6 C14.1 14.1 13.1 13.8 12 13.8 C10.9 13.8 9.9 14.1 8.8 14.6 Z" fill="#f4f1ea"/>
    <ellipse cx="9.6" cy="13.3" rx="0.22" ry="0.3" fill="#1c1c1c"/>
    <ellipse cx="12" cy="12.9" rx="0.22" ry="0.3" fill="#1c1c1c"/>
    <ellipse cx="14.4" cy="13.3" rx="0.22" ry="0.3" fill="#1c1c1c"/>
    <circle cx="11.7" cy="6.6" r="3.3" fill="url(#king-facing-half-right-fill)"/>
    <path d="M8.6 6.1 Q7.9 7.4 8.6 8.1 Z" fill="url(#king-facing-half-right-fill)"/>
    <ellipse cx="10" cy="6.1" rx="0.28" ry="0.34" fill="#1c1c1c"/>
    <ellipse cx="14" cy="6.05" rx="0.18" ry="0.22" fill="#1c1c1c"/>
    <path d="M9.3 13.6 C8 14.5 7.1 16 6.9 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
    <path d="M14.7 13.6 C16 14.5 16.9 16 17.1 17.9" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# king-facing-half-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 11.08); cy and scale are the mirror's own invariants, since
# the fragment sits outside the flip group and never itself gets flipped.
[face]
cx = 12.92
cy = 6.51
scale = 2.7

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
