# servant-with-emotion — same face-fragment mechanism as
# person-with-emotion.toml (sprite-expressions.mjs); [face] anchored on
# servant.toml's own head circle.
classes = ["servant"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="servant-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="6.6" r="3.3" fill="url(#servant-with-emotion-fill)"/>
  <path d="M6 21 C6 15.3 8.7 12.8 12 12.8 C15.3 12.8 18 15.3 18 21 Z" fill="url(#servant-with-emotion-fill)"/>
  <path d="M9 13.4 L15 13.4 L15.6 20.6 L8.4 20.6 Z" fill="url(#servant-with-emotion-fill)" opacity="0.9"/>
  <path d="M9.4 13.4 L8 12" stroke="currentColor" stroke-width="0.7" opacity="0.55" stroke-linecap="round"/>
  <path d="M14.6 13.4 L16 12" stroke="currentColor" stroke-width="0.7" opacity="0.55" stroke-linecap="round"/>
  <path d="M9.6 17.4 L14.4 17.4" stroke="currentColor" stroke-width="0.5" opacity="0.35"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r servant.toml's own head circle declares.
[face]
cx = 12
cy = 6.6
scale = 3.3

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
