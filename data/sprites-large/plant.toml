# plant — a potted houseplant: the leaf cluster carries the gradient (a
# plant's own foliage colour is what varies instance to instance), the pot
# stays a fixed terracotta regardless, the same fixed-accent reasoning
# letter.toml's wax seal already carries.
classes = ["plant"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="plant-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 55%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M6.6 15 H17.4 L16 21 H8 Z" fill="#b66a3e"/>
  <path d="M7 15.6 H17" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  <path d="M12 15.6 C12 10.4 8 9 6 5.6 C10 5.6 12.4 8.4 12.6 11.4 C13 8 15.6 5 19 5.4 C17.4 9.4 13.4 10.4 12.8 15.6 Z" fill="url(#plant-fill)"/>
  <path d="M12 15.6 C11.6 12.4 10.4 10.6 8.6 9" fill="none" stroke="#000000" stroke-width="0.4" opacity="0.2"/>
  <ellipse cx="9.4" cy="7.6" rx="1.4" ry="0.9" fill="#ffffff" opacity="0.3"/>
</svg>
"""
