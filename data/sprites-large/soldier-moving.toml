# soldier-moving — a centre-facing mid-march pose: the same front-facing
# head, helmet, brim and [face] anchor as soldier-with-emotion.toml (no
# facing fact is needed, only mgx:pose = moving), with the arms and robe
# hem redrawn for a clear marching stride — one arm swung forward and up,
# the other trailing back, the hem swept and lifted on one side, the same
# body redraw soldier-facing-left-moving.toml carries. The epaulettes stay
# put — they hang off the shoulders, not the march.
classes = ["soldier"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="soldier-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#soldier-moving-fill)">
    <path d="M9.4 14 C7.8 13.4 6.3 14.4 5.8 17 C5.6 18.4 6.2 19.4 7.3 19.1 C7.4 17.1 7.9 15.4 9.6 14.5 Z"/>
    <path d="M14.6 14 C16.7 14.4 18.7 16.2 19 19.1 C19.1 20.4 18.3 21.2 17.2 20.6 C17 18.3 16.3 16 14.3 15.1 Z"/>
    <path d="M6.3 21 C6.1 16.2 8.5 13.8 11.7 13.8 C15.3 13.8 17.6 15.5 17.1 19.6 C16.9 20.7 15.9 20.7 15.1 20.1 Z"/>
    <path d="M10.85 12.3 L13.15 12.3 L13 13.9 L11 13.9 Z"/>
  </g>
  <path d="M7 8.4 C7 5.1 9.2 2.6 12 2.6 C14.8 2.6 17 5.1 17 8.4 L17 8.7 L7 8.7 Z" fill="url(#soldier-moving-fill)"/>
  <path d="M6.4 8.4 L17.6 8.4 L17.6 9.4 L6.4 9.4 Z" fill="currentColor" opacity="0.5"/>
  <circle cx="12" cy="9.8" r="2.9" fill="url(#soldier-moving-fill)"/>
  <path d="M9.3 14.5 C8 15.4 7.1 16.9 6.9 18.8" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 14.5 C16 15.4 16.9 16.9 17.1 18.8" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.3" stroke-linecap="round"/>
  <path d="M7.8 13.9 L9.6 13.5 L9.9 14.6 L8.1 15 Z" fill="#6b7a4f"/>
  <circle cx="8.85" cy="14.25" r="0.3" fill="#c9a13a"/>
  <path d="M16.2 13.9 L14.4 13.5 L14.1 14.6 L15.9 15 Z" fill="#6b7a4f"/>
  <circle cx="15.15" cy="14.25" r="0.3" fill="#c9a13a"/>
  <ellipse cx="9" cy="5.4" rx="1.5" ry="0.6" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:pose"
value = "moving"

# The same cx/cy/r soldier-with-emotion.toml's own [face] anchor declares —
# a centre-facing pose keeps the front head and helmet untouched, only the
# body moves.
[face]
cx = 12
cy = 9.8
scale = 2.9

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
