# poodle-facing-right — poodle-facing-left.toml's profile mirrored across
# the canvas midline (every shape wrapped in one translate-then-flip group),
# so the two directions stay geometrically identical twins. The mirror flips
# the lit corner of the shared gradient along with the pose, which reads as
# the same figure turned around under the same light.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored — an expression should not
# read back-to-front just because the body turned around.
classes = ["poodle"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="poodle-facing-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="14.4" cy="15.2" rx="6.2" ry="4.6" fill="url(#poodle-facing-right-fill)"/>
    <ellipse cx="12.2" cy="13.4" rx="1.8" ry="1.3" fill="#000000" opacity="0.18"/>
    <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <line x1="10.2" y1="19" x2="10" y2="21.8"/>
      <line x1="12.6" y1="19.6" x2="12.6" y2="22.2"/>
      <line x1="16.6" y1="19.6" x2="16.6" y2="22.2"/>
      <line x1="19" y1="19" x2="19.2" y2="21.8"/>
    </g>
    <g fill="url(#poodle-facing-right-fill)">
      <circle cx="10" cy="20.8" r="1"/>
      <circle cx="12.6" cy="21.4" r="1"/>
      <circle cx="16.6" cy="21.4" r="1"/>
      <circle cx="19.2" cy="20.8" r="1"/>
    </g>
    <rect x="19.7" y="14.2" width="2.2" height="6" rx="1.1" fill="url(#poodle-facing-right-fill)"/>
    <circle cx="20.8" cy="13.2" r="1.5" fill="url(#poodle-facing-right-fill)"/>
    <circle cx="6.2" cy="8.7" r="4" fill="url(#poodle-facing-right-fill)"/>
    <g fill="url(#poodle-facing-right-fill)">
      <circle cx="3" cy="5.6" r="1.6"/>
      <circle cx="6" cy="3.9" r="1.7"/>
      <circle cx="8.6" cy="5.7" r="1.4"/>
    </g>
    <ellipse cx="1.9" cy="8.9" rx="0.6" ry="0.5" fill="#1c1c1c"/>
    <ellipse cx="4.8" cy="7.7" rx="0.5" ry="0.6" fill="#1c1c1c"/>
    <ellipse cx="7.2" cy="6.3" rx="1.2" ry="0.9" fill="#ffffff" opacity="0.32"/>
    <ellipse cx="10.8" cy="12.4" rx="2.6" ry="1.4" fill="#ffffff" opacity="0.26"/>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "right"

# poodle-facing-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 5.8); cy and scale are the mirror's own invariants. Because the
# fragment sits outside the flip group, these are plain unflipped canvas
# coordinates.
[face]
cx = 18.2
cy = 8.1
scale = 2.6

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
