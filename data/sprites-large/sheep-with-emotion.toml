# sheep-with-emotion — copies sheep.toml's shape exactly. The wool itself
# is five overlapping fleece circles with no face of its own; sheep.toml's
# own dark, fixed-colour face ellipse is the real head, so [face] anchors
# there instead. Its small eye dot is dropped, the same dog precedent,
# since it sits where the real eyes now go; the ears sit above the face's
# own top edge and stay clear of it.
classes = ["sheep"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="sheep-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g stroke="#3a352f" stroke-width="1.5" stroke-linecap="round">
    <line x1="7.6" y1="18" x2="7.6" y2="21.2"/>
    <line x1="10.4" y1="18.8" x2="10.4" y2="21.6"/>
    <line x1="14.6" y1="18.8" x2="14.6" y2="21.6"/>
    <line x1="17.4" y1="18" x2="17.4" y2="21.2"/>
  </g>
  <g fill="url(#sheep-with-emotion-fill)">
    <circle cx="8.4" cy="12.6" r="3.4"/>
    <circle cx="12.2" cy="11" r="3.8"/>
    <circle cx="16.2" cy="12.4" r="3.4"/>
    <circle cx="10" cy="15.4" r="3.6"/>
    <circle cx="14.4" cy="15.4" r="3.6"/>
  </g>
  <g stroke="color-mix(in srgb, currentColor 40%, black)" stroke-width="0.4" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M9 10.4 C9.6 9.8 10.4 9.8 11 10.2"/>
    <path d="M13 9 C13.6 8.6 14.4 8.7 14.9 9.2"/>
    <path d="M15.6 11 C16.1 10.6 16.8 10.7 17.2 11.2"/>
  </g>
  <ellipse cx="3.6" cy="11.4" rx="1" ry="1.3" fill="#3a352f" transform="rotate(-25 3.6 11.4)"/>
  <ellipse cx="6.6" cy="10.6" rx="1" ry="1.3" fill="#3a352f" transform="rotate(20 6.6 10.6)"/>
  <ellipse cx="5.4" cy="14.4" rx="2.6" ry="2.2" fill="#3a352f"/>
  <ellipse cx="10.6" cy="10" rx="2.6" ry="1.6" fill="#ffffff" opacity="0.3"/>
  {{FACE}}
</svg>
"""

# sheep.toml's own dark face ellipse (cx/cy, scale is the average of its
# rx/ry) — not one of the fleece circles, which are wool, not head.
[face]
cx = 5.4
cy = 14.4
scale = 2.4

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
