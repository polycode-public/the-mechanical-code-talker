# daughter-facing-half-left — the child-scale figure turned three-quarters
# from the full left profile toward the front. The head sits at the
# midpoint position, the nose wedge projects only half as far past the
# head's edge and dips down instead of pointing straight out, and a
# second, smaller far eye appears near the head's right edge so both eyes
# read. Both hair strands stay visible at this angle — unlike the full
# profile, a three-quarter turn still shows the far side of the head — so
# both are kept, each shifted by half the full-profile's own shift. Body,
# arms and legs keep daughter.toml's own geometry.
classes = ["daughter"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="daughter-facing-half-left-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g fill="url(#daughter-facing-half-left-fill)">
    <path d="M9.4 14.9 C7.9 15 6.5 16.2 6.3 18.3 C6.25 19.4 6.9 20.1 7.7 19.7 C7.8 18 8.3 16.5 9.7 15.8 Z"/>
    <path d="M14.6 14.9 C16.1 15 17.5 16.2 17.7 18.3 C17.75 19.4 17.1 20.1 16.3 19.7 C16.2 18 15.7 16.5 14.3 15.8 Z"/>
    <path d="M7.4 21 C7.4 16.6 9.4 14.6 12 14.6 C14.6 14.6 16.6 16.6 16.6 21 Z"/>
    <path d="M10.8 11.4 L13.2 11.4 L13 14.6 L11 14.6 Z"/>
  </g>
  <ellipse cx="10.2" cy="18" rx="1.1" ry="1.6" fill="#ffffff" opacity="0.1"/>
  <path d="M10.6 14.3 L12 15.4 L13.4 14.3" fill="none" stroke="currentColor" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M12 15.4 L12 20.2" fill="none" stroke="currentColor" stroke-width="0.35" stroke-linecap="round" opacity="0.22"/>
  <path d="M9.3 15.3 C8.3 16 7.6 17.2 7.4 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M14.7 15.3 C15.7 16 16.4 17.2 16.6 18.6" fill="none" stroke="currentColor" stroke-width="0.35" opacity="0.3" stroke-linecap="round"/>
  <path d="M15.88 6.8 C17.28 8.6 17.28 11.2 15.88 13.8" fill="none" stroke="url(#daughter-facing-half-left-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M7.48 6.8 C6.08 8.6 6.08 11.2 7.48 13.8" fill="none" stroke="url(#daughter-facing-half-left-fill)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M9.48 5.6 C10.08 5.1 10.78 4.9 11.68 5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.4"/>
  <circle cx="11.68" cy="8.2" r="3.6" fill="url(#daughter-facing-half-left-fill)"/>
  <path d="M8.3 7.65 Q7.53 9.07 8.3 9.84 Z" fill="url(#daughter-facing-half-left-fill)"/>
  <ellipse cx="9.83" cy="7.65" rx="0.31" ry="0.37" fill="#1c1c1c"/>
  <ellipse cx="14.19" cy="7.6" rx="0.2" ry="0.24" fill="#1c1c1c"/>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-left"

# Half scale is 0.825 * head radius 3.6 = 2.97, rounded to 2.95 (the
# table's own halfway point between the front view's 1.0*r and the
# profile's 0.636*r). The near eye drawn above sits at (9.83, 7.65), so
# cx = 9.83 + 0.4*2.95 = 11.01 and cy = 7.65 + 0.15*2.95 = 8.09, landing
# the shared face fragment's own near eye on top of it.
[face]
cx = 11.01
cy = 8.09
scale = 2.95

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
