# tiger-with-emotion — copies dog-with-emotion.toml's shape exactly. tiger.toml
# reuses dog.toml's own head circle and eye-shadow position exactly, so the
# same dog precedent applies: that eye-shadow ellipse is dropped here since
# it sits right where the real eyes now go. Two of the coat's own stripe
# strokes sit on the head itself, right across the new brow — those two are
# dropped too (the body's other six stripes are untouched); a Playwright
# render confirmed the visible seam before this fix (a thick black clump
# instead of a clean eyebrow) and confirmed it clean after.
classes = ["tiger"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="tiger-with-emotion-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <ellipse cx="13" cy="15" rx="6.6" ry="4.4" fill="url(#tiger-with-emotion-fill)"/>
  <circle cx="7" cy="9" r="3.8" fill="url(#tiger-with-emotion-fill)"/>
  <path d="M4.2 6.4 L3.2 3 L6.4 5 Z" fill="url(#tiger-with-emotion-fill)"/>
  <path d="M9.4 6 L10 2.6 L12.4 5.2 Z" fill="url(#tiger-with-emotion-fill)"/>
  <g stroke="#000000" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <path d="M8.6 12 L12 10.6"/>
    <path d="M9 14.8 L13 14"/>
    <path d="M9.4 17.6 L13 17.4"/>
    <path d="M15.2 11.6 L18.2 11"/>
    <path d="M15.8 14.8 L19 15"/>
    <path d="M15.6 17.8 L18.6 18.2"/>
  </g>
  <path d="M19 13 C22 12.4 22.4 15.2 20 16 Z" fill="url(#tiger-with-emotion-fill)"/>
  <ellipse cx="9.6" cy="12.2" rx="2.6" ry="1.5" fill="#ffffff" opacity="0.26"/>
  {{FACE}}
</svg>
"""

# The same cx/cy/r tiger.toml's own head circle declares.
[face]
cx = 7
cy = 9
scale = 3.8

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
