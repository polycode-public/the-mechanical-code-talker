# bird-facing-half-right — bird-facing-half-left.toml's three-quarter turn
# mirrored across the canvas midline (every shape wrapped in one
# translate-then-flip group), so the two directions stay geometrically
# identical twins.
#
# {{FACE}} sits OUTSIDE the flip group, so the resolved face fragment is the
# only thing on the canvas that is never mirrored.
classes = ["bird"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="bird-facing-half-right-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <g transform="translate(24 0) scale(-1 1)">
    <ellipse cx="12.5" cy="13.6" rx="6.4" ry="5" fill="url(#bird-facing-half-right-fill)"/>
    <path d="M17.5 12.4 C20.9 11.6 21.5 14.6 18.3 15.6 C16.5 16.2 15.5 14.4 17.5 12.4 Z" fill="color-mix(in srgb, currentColor 78%, black)"/>
    <path d="M15.3 11.4 C13.3 10.6 10.9 11.4 10.3 14 C9.9 16.2 11.5 17.8 13.5 17.4 C15.3 17 16.5 13.4 15.3 11.4 Z" fill="#c1552e"/>
    <circle cx="11.6" cy="8.4" r="3.13" fill="url(#bird-facing-half-right-fill)"/>
    <path d="M9 8.2 L7.4 7.6 L8.9 9.6 Z" fill="#e8a23a"/>
    <ellipse cx="10.2" cy="7.6" rx="0.5" ry="0.6" fill="#1c1c1c"/>
    <ellipse cx="13.5" cy="8.1" rx="0.3" ry="0.35" fill="#1c1c1c"/>
    <ellipse cx="10.8" cy="7" rx="1" ry="0.7" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="14.5" cy="10.6" rx="2.2" ry="1.3" fill="#ffffff" opacity="0.3"/>
    <g stroke="#e8a23a" stroke-width="1.3" stroke-linecap="round">
      <line x1="14.5" y1="18" x2="15.5" y2="21"/>
      <line x1="11.5" y1="18.2" x2="10.9" y2="21"/>
    </g>
  </g>
  {{FACE}}
</svg>
"""

[match]
property = "mgx:faces"
value = "half-right"

# bird-facing-half-left.toml's anchor reflected across the canvas midline
# (cx = 24 - 11.23); cy and scale are the mirror's own invariants.
[face]
cx = 12.77
cy = 7.99
scale = 2.58

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
