# team-facing-half-right-moving — team-facing-half-left-moving.toml's
# mid-stride three-quarter turn mirrored across the canvas midline. The two
# flanking figures stay fixed.
classes = ["team"]
svg = """
<svg viewBox="0 0 24 24" aria-hidden="true">
  <defs>
    <linearGradient id="team-facing-half-right-moving-fill" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="color-mix(in srgb, currentColor 60%, white)"/>
      <stop offset="55%" stop-color="currentColor"/>
      <stop offset="100%" stop-color="color-mix(in srgb, currentColor 78%, black)"/>
    </linearGradient>
  </defs>
  <path d="M3.0 14.1 C1.5 14.2 0.2 15.4 0.0 17.5 C0.0 18.6 0.4 19.3 1.2 18.9 C1.3 17.3 1.8 15.7 3.2 15.0 Z" fill="url(#team-facing-half-right-moving-fill)"/>
  <path d="M7.0 14.1 C8.5 14.2 9.8 15.4 10.0 17.5 C10.0 18.6 9.6 19.3 8.8 18.9 C8.7 17.3 8.2 15.7 6.8 15.0 Z" fill="url(#team-facing-half-right-moving-fill)"/>
  <path d="M1.6 22 C1.6 17.7 3 15.6 5 15.6 C7 15.6 8.4 17.7 8.4 22 Z" fill="url(#team-facing-half-right-moving-fill)"/>
  <circle cx="5" cy="9" r="2.6" fill="url(#team-facing-half-right-moving-fill)"/>
  <path d="M2.4 17.6 L7.6 17.6" stroke="#3a6ea5" stroke-width="0.8" opacity="0.9" stroke-linecap="round"/>
  <path d="M17.0 14.1 C15.5 14.2 14.2 15.4 14.0 17.5 C13.9 18.6 14.4 19.3 15.2 18.9 C15.3 17.3 15.8 15.7 17.2 15.0 Z" fill="url(#team-facing-half-right-moving-fill)"/>
  <path d="M21.0 14.1 C22.5 14.2 23.8 15.4 23.9 17.5 C23.9 18.6 23.6 19.3 22.8 18.9 C22.7 17.3 22.2 15.7 20.8 15.0 Z" fill="url(#team-facing-half-right-moving-fill)"/>
  <path d="M15.6 22 C15.6 17.7 17 15.6 19 15.6 C21 15.6 22.4 17.7 22.4 22 Z" fill="url(#team-facing-half-right-moving-fill)"/>
  <circle cx="19" cy="9" r="2.6" fill="url(#team-facing-half-right-moving-fill)"/>
  <path d="M16.4 17.6 L21.6 17.6" stroke="#3a6ea5" stroke-width="0.8" opacity="0.9" stroke-linecap="round"/>
  <g transform="translate(24 0) scale(-1 1)">
    <path d="M9.7 13.1 C8.3 12.5 7.0 13.3 6.6 15.6 C6.4 16.8 6.9 17.7 7.9 17.5 C8.0 15.7 8.4 14.3 9.9 13.5 Z" fill="url(#team-facing-half-right-moving-fill)"/>
    <path d="M14.3 13.1 C16.2 13.5 18.0 15.1 18.2 17.7 C18.3 18.8 17.6 19.5 16.6 19.0 C16.4 16.9 15.8 14.9 14.0 14.1 Z" fill="url(#team-facing-half-right-moving-fill)"/>
    <path d="M8.0 22.0 C7.87 17.17 9.69 14.89 11.79 14.89 C14.17 14.89 15.92 16.56 15.57 20.77 C15.43 21.74 14.73 21.74 14.17 21.21 Z" fill="url(#team-facing-half-right-moving-fill)"/>
    <circle cx="11.74" cy="7.4" r="2.9" fill="url(#team-facing-half-right-moving-fill)"/>
    <path d="M9.02 6.96 Q8.40 8.10 9.02 8.72 Z" fill="url(#team-facing-half-right-moving-fill)"/>
    <ellipse cx="10.25" cy="6.96" rx="0.25" ry="0.3" fill="#1c1c1c"/>
    <ellipse cx="13.76" cy="6.92" rx="0.16" ry="0.19" fill="#1c1c1c"/>
    <path d="M9 16.6 L15 16.6" stroke="#3a6ea5" stroke-width="0.8" opacity="0.9" stroke-linecap="round"/>
  </g>
  {{FACE}}
</svg>
"""

[[match]]
property = "mgx:faces"
value = "half-right"

[[match]]
property = "mgx:pose"
value = "moving"

[face]
cx = 12.81
cy = 7.32
scale = 2.37

[parameters.emotion]
property = "mgx:feels"
placeholder = "{{FACE}}"

[parameters.emotion.values]
happy = "happy"
sad = "sad"
angry = "angry"
scared = "scared"
surprised = "surprised"
calm = "calm"
