  <circle cx="12" cy="10.4" r="2.3" fill="#8a6a52"/>
  <path d="M8 18.4 C8 15.2 9.6 13.4 12 13.4 C14.4 13.4 16 15.2 16 18.4 Z" fill="#8a6a52"/>
</svg>
"""
