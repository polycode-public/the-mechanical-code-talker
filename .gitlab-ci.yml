    - >-
      node --disable-warning=ExperimentalWarning --test
      test-e2e/pages-chat-fullscreen.test.mjs test-e2e/pages-chat-persistence.test.mjs
      test-e2e/pages-chat-export.test.mjs test-e2e/pages-chat-digest.test.mjs
      test-e2e/browser-chat.test.mjs test-e2e/chat-prompt.test.mjs
      test-e2e/chat-browser-bundle.test.mjs test-e2e/build-chat-assets.test.mjs
      test-e2e/pages-chat-research.test.mjs test-e2e/pages-chat-live-toggle.test.mjs
      test-e2e/web-chat-memory.test.mjs test-e2e/pages-research.test.mjs
      test-e2e/pages-ingest.test.mjs test-e2e/pages-ledger.test.mjs
      test-e2e/pages-ledger-teach.test.mjs test-e2e/pages-ledger-research.test.mjs
      test-e2e/ledger-viz-cli.test.mjs test-e2e/ledger-viz.test.mjs
      test-e2e/pages-code.test.mjs test-e2e/pages-spider-fly.test.mjs
      test-e2e/pages-plan.test.mjs test-e2e/plan-cli.test.mjs
      test-e2e/plan-browser-entry.test.mjs test-e2e/pages-adventure.test.mjs
      test-e2e/pages-adventure-edit.test.mjs test-e2e/pages-adventure-scenarios.test.mjs
      test-e2e/pages-mud.test.mjs test-e2e/pages-mud-scenarios.test.mjs
      test-e2e/pages-screenshot-sweep.test.mjs
    # Sharing between browsers: every file here drives two or three real browser
    # contexts at once, so they run as their own step. Nothing they do reaches
    # another visitor — the transport has no signalling server and no room
    # registry, and two contexts only find each other because the test carries
    # the SDP blob from one to the other by hand.
    - >-
