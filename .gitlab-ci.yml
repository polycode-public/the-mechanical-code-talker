# CI for @polycode-projects/the-mechanical-code-talker (tmct) — a single
# published npm package plus a static home page (no benchmark rig). Core
# jobs: run the tests, publish to public npm on a deliberate version bump,
# and deploy public/ to an AWS-hosted edge (`deploy:website`, `e2e:deployed`)
# on main — see PLAN_AWS.md. The home page moved off GitLab Pages entirely
# (2026-07-28); the old `pages` job and its redirect-stub burn-in period are
# retired. Mirrors the seonix repo's publish:npm and deploy:website shapes,
# minus the --workspace flag (tmct is a single package, not a workspace).

image: node:24.18.0

stages:
  - test
  - e2e
  - deploy
  - verify

# ---- security scanning (free tier) -----------------------------------------
# SAST (semgrep) + Pipeline Secret Detection via GitLab's stock templates.
# Harmless if the group doesn't license the report UI — the jobs still run.
# tmct is a pure-JS package, so IaC (KICS) and Container Scanning are N/A and
# are deliberately NOT included; the nightly `dep:audit` job below covers the
# Ultimate-only Dependency Scanning as far as the free tier allows.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # We scan OUR code, not committed corpuses / vendored assets: corpus/ + data/
  # hold committed corpus + template data, public/ is the static site, .tmct is
  # the on-disk graph memory, node_modules is dependencies.
  SAST_EXCLUDED_PATHS: "corpus, data, public, node_modules, .tmct"
  SECRET_DETECTION_EXCLUDED_PATHS: "corpus, data, public, node_modules, .tmct"

# ---- AWS deploy CI/CD variables (documentation only — set via `glab variable
# set`, masked + environment-scoped, once the tmct-ci/tmct-prod accounts exist
# per PLAN_AWS.md Phase 1) ----------------------------------------------------
# None of these are declared with values here: they don't exist yet (no AWS
# account has been created), and `deploy:website` / `e2e:deployed` below fail
# closed (rules require the variable present) until they are set, the same
# gate publish:npm already uses for NPM_TOKEN.
#   CI_AWS_ACTIONS_ROLE_ARN    — tmct-ci OIDC actions-role ARN (branch-scoped)
#   CI_AWS_DEPLOY_ROLE_ARN     — tmct-ci deployment-role ARN
#   PROD_AWS_ACTIONS_ROLE_ARN  — tmct-prod OIDC actions-role ARN (main only)
#   PROD_AWS_DEPLOY_ROLE_ARN   — tmct-prod deployment-role ARN; gates deploy:website
#   TMCT_PROD_ACCOUNT_ID       — tmct-prod AWS account ID
#   TMCT_PROD_CERT_ARN         — ACM cert for tmct.polycode.co.uk (us-east-1)
#   TMCT_PROD_ZONE_ID          — tmct-prod's Route53 hosted zone ID

semgrep-sast:
  stage: verify
  needs: []
  allow_failure: true

# Tracked text files must stay free of home-directory paths, unallowlisted
# email addresses and personal names — see scripts/pii-lint.mjs (and its
# allowlist, scripts/pii-allowlist.json). Dependency-free, so no npm ci.
pii:lint:
  stage: verify
  needs: []
  script:
    - npm run check:pii

# Every relative markdown link must resolve to a real repo file — see
# scripts/check-links.mjs. Dependency-free, so no npm ci.
links:check:
  stage: verify
  needs: []
  script:
    - npm run check:links

secret_detection:
  stage: verify
  needs: []
  allow_failure: true

# ---- nightly dependency scanning (free-tier substitute for Ultimate DS) ----
# Runs ONLY from a scheduled pipeline. The operator creates the schedule once
# in the GitLab UI: Settings → CI/CD → Pipeline schedules → e.g. "0 3 * * *"
# on main (CI files cannot create schedules). BLOCKING  — it has NO
# allow_failure: `npm audit --audit-level=high` fails the job on any high or
# critical advisory. `npm outdated` is visibility-only. OSV-Scanner is pinned
# to a specific release (never `releases/latest`) and cross-checks the npm
# lockfile only — tmct is pure JS, so there is no pom.xml to scan.
dep:audit:
  stage: test
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - npm run audit
    - npm outdated || true          # visibility only — never fails the job
    - curl -sSL -o /usr/local/bin/osv-scanner
        https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
    - chmod +x /usr/local/bin/osv-scanner
    # v2 syntax with v1 fallback, scoped to the single first-party manifest.
    - osv-scanner scan source -L package-lock.json
        || osv-scanner --lockfile=package-lock.json

# ---- dependency cooldown (Renovate) ----------------------------------------
# Self-hosted Renovate run. renovate.json holds the policy: minimumReleaseAge
# 14 days, so a hijacked or wormed release has two weeks to be reported and
# yanked before an update MR can pull it in. Runs ONLY from a scheduled
# pipeline (reuse the nightly schedule, or a dedicated one) and ONLY when
# RENOVATE_TOKEN is configured (a project access token with api + write_repository
# scope) — a missing token fails closed, the same shape as publish:npm's
# NPM_TOKEN gate.
renovate:
  stage: test
  interruptible: true
  image: renovate/renovate:43.264.2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN'
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_ONBOARDING: "false"
  script:
    - renovate $CI_PROJECT_PATH

# ---- consumer-impacting path set -------------------------------------------
# The heavy pipeline — the suite, package hygiene, the licence audit, the e2e
# tier, the website deploy, the npm publish and everything in the verify stage
# after them — only earns its cost when a commit can change what a consumer
# receives: the installed npm package or the deployed home page. It follows that
# every one of those jobs' rules keys off this set. These globs are it. They cover
# the shipped code and its committed data, the build and test machinery that
# proves it, the fixtures the demo build reads, and the manifests that pin
# versions. .gitlab-ci.yml is in the set so a pipeline change proves itself.
# A commit confined to design docs, plans, or benchmark notes touches none of
# them, so it runs only the cheap always-on doc guards (links:check, pii:lint)
# and the stock security templates. README.md is deliberately NOT in this set:
# it ships to npm but never to the web page, so the two jobs that own the npm
# surface (pack:contents, publish:npm) add it to their own rules instead.
.consumer-paths: &consumer-paths
  - src/**/*
  - bin/**/*
  - corpus/**/*
  - data/**/*
  - ontology/**/*
  - public/**/*
  - scripts/**/*
  - test/**/*
  - test-e2e/**/*
  - examples/**/*
  - test-benchmarks/agentbench/envelope.json
  - package.json
  - package-lock.json
  - .gitlab-ci.yml

# The suite split four ways so a push isn't gated on one long serial run.
# `scripts/list-unit-test-files.mjs` is the one place the >=20s exclusion list
# lives; test:slow's own package.json script names those same five files
# directly. Rebalance the buckets if a file's own timing drifts across that
# 20s line.
unit:smoke:
  stage: test
  interruptible: true
  rules:
    - changes: *consumer-paths
  script:
    - npm ci
    - npm run test:smoke

unit:fast:
  stage: test
  interruptible: true
  rules:
    - changes: *consumer-paths
  script:
    - npm ci
    - npm run test:fast

# Everything except the five files test:slow owns.
unit:
  stage: test
  interruptible: true
  rules:
    - changes: *consumer-paths
  script:
    - npm ci
    - npm run test:unit

# The five files with at least one test over 20s: synthbench's SYN rungs, the
# generated-artifacts estate guards, the README shell-example harness, the
# bench-smoke corpus lane, and the inference corpus lane. Isolated so their
# wall-clock doesn't sit on the critical path of the other three tiers.
unit:slow:
  stage: test
  interruptible: true
  rules:
    - changes: *consumer-paths
  script:
    - npm ci
    - npm run test:slow

# Package hygiene: publint over the exports map, and the file list npm pack
# would publish diffed against the committed expected manifest — no stray
# file ships, nothing expected goes missing.
pack:contents:
  stage: test
  interruptible: true
  # The consumer-impacting set OR README.md: this job is the guard on the shipped
  # file list, and README.md is one of the shipped files, so a README-only push
  # must still prove the manifest.
  rules:
    - changes: *consumer-paths
    - changes:
        - README.md
  script:
    - npm ci
    - npm run check:publint
    - npm pack --dry-run --json | npm run --silent check:pack

# Production dependency tree must stay inside the licence allowlist (MIT, ISC,
# BSD, Apache-2.0, MPL-2.0 and the public-domain-equivalents) — see
# scripts/check-licences.mjs.
license:deps:
  stage: test
  interruptible: true
  rules:
    - changes: *consumer-paths
  script:
    - npm ci
    - npm run check:licences

# The PRE-DEPLOY e2e tier, deliberately small. `e2e-web-index`, `e2e-cli` and
# `e2e-tui` are the set `deploy:website` waits for — the cheapest coverage that
# can still say "this build is worth putting on the edge". `e2e-web-local-origin`
# holds the files that can only run against a local server; it is not in the
# deploy's `needs`. Everything else that used to run in this stage now runs
# POST-deploy against the live site, in `e2e:deployed` at the bottom of this
# file. The trade is faster feedback for less pre-deploy certainty: a page
# regression is caught after the edge has already served it, and the fix is a
# new pipeline.
# `test-e2e/*.test.mjs` — top-level only; test-e2e/heavy/ is the separate
# `e2e:heavy` job below.
#
# Two base templates: `.e2e-web-base` installs Chromium for channels that spawn
# a real browser page; `.e2e-lite-base` skips it for the CLI/TUI channels that
# never do. A file can reach playwright through test-e2e/helpers/ rather than
# importing it, so check both before putting one on the lite base.
# .npmrc's ignore-scripts=true stops playwright's install hook, so
# `npm ci` never downloads a browser as a side effect; the browsers land in the
# project dir (PLAYWRIGHT_BROWSERS_PATH) so the cache can carry them, keyed on
# the lockfile because the pinned playwright version lives there.
.e2e-web-base:
  stage: e2e
  interruptible: true
  rules:
    - changes: *consumer-paths
  variables:
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright-browsers"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .playwright-browsers
  before_script:
    - npm ci
    - npx playwright install --with-deps chromium

.e2e-lite-base:
  stage: e2e
  interruptible: true
  rules:
    - changes: *consumer-paths
  before_script:
    - npm ci

e2e-web-index:
  extends: .e2e-web-base
  script:
    - >-
      node --disable-warning=ExperimentalWarning --test
      test-e2e/pages-index.test.mjs test-e2e/pages-home.test.mjs
      test-e2e/pages-demo-history.test.mjs test-e2e/pages-demo-templates.test.mjs
      test-e2e/pages-examples.test.mjs test-e2e/pages-service-worker.test.mjs
      test-e2e/memory-ask-browser-bundle.test.mjs test-e2e/readme-examples.test.mjs
      test-e2e/cli-render-views.test.mjs

# The browser files that need a LOCAL origin, so they cannot move to
# `e2e:deployed` with the rest of the matrix. Four of them build the page they
# open, and a deployed site has no equivalent to serve:
#   pages-sprites            rewrites sprites.html with the chat dock enabled
#   sprites-large-visual     writes its own single-page harness
#   ledger-viz-query-only-dock  renders what `tmct viz` writes (dock-less
#                            ledger.html), which is deliberately NOT the site's
#   p2p-webrtc-handshake     serves a transport fixture page, and skips itself
#                            outright when TMCT_E2E_BASE_URL is set
# The fifth is different: pages-chat-boot-budget runs fine against a deployed
# origin, but what it measures stops being the page's own boot cost and starts
# being the CDN's — its own header says so. A budget wants a fixed origin.
#
# Not in `deploy:website`'s `needs`, so this job costs the deploy nothing; it
# still gates `publish:npm`.
e2e-web-local-origin:
  extends: .e2e-web-base
  script:
    - >-
      node --disable-warning=ExperimentalWarning --test
      test-e2e/pages-sprites.test.mjs test-e2e/sprites-large-visual.test.mjs
      test-e2e/ledger-viz-query-only-dock.test.mjs test-e2e/p2p-webrtc-handshake.test.mjs
      test-e2e/pages-chat-boot-budget.test.mjs

# No browser: pure stdio/process spawns.
e2e-tui:
  extends: .e2e-lite-base
  script:
    - node --disable-warning=ExperimentalWarning --test test-e2e/tui.test.mjs test-e2e/tui-chat-file.test.mjs

e2e-cli:
  extends: .e2e-lite-base
  script:
    - >-
      node --disable-warning=ExperimentalWarning --test
      test-e2e/cli-smoke.test.mjs test-e2e/cli-help.test.mjs test-e2e/cli-config-flags.test.mjs
      test-e2e/init.test.mjs test-e2e/init-cli.test.mjs test-e2e/bootstrap-seed.test.mjs
      test-e2e/import-file.test.mjs test-e2e/digest-cli.test.mjs test-e2e/memory-export.test.mjs
      test-e2e/domain-river.test.mjs test-e2e/domain-crates.test.mjs test-e2e/lib-chat-sqlite.test.mjs
      test-e2e/build-demo-memory.test.mjs test-e2e/server-http.test.mjs test-e2e/server-http-smoke.test.mjs

# The heavy half of the e2e tier (test-e2e/heavy/*.test.mjs): a full demo:build, an
# uncapped ConceptNet seed, and a full-store export/import round trip —
# together several minutes of real signal, but not on every push. Runs when a
# push actually touches what these tests exercise, and on the nightly
# schedule (the same one dep:audit/renovate use) so drift still gets caught
# even on a quiet week.
e2e:heavy:
  stage: e2e
  interruptible: true
  variables:
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright-browsers"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .playwright-browsers
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - changes:
        - scripts/build-*.mjs
        - src/adapters/corpus/**/*
        - corpus/**/*
        - data/**/*
        - package.json
        - package-lock.json
        - test-e2e/heavy/**/*
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run test:e2e:heavy

# Publish the package to PUBLIC npmjs.org. Automatic on main, but the release
# TRIGGER is a VERSION BUMP, not a push or a tag: the script compares
# package.json's version against what's already live on npm and no-ops if they
# match, so an ordinary push to main can never re-publish or error on "version
# already exists" — only a commit that bumps the version publishes. The rule
# requires NPM_TOKEN present (a masked, protected npm *automation* token for the
# @polycode-projects scope) so a not-yet-configured token fails closed (the job
# doesn't run) rather than failing loud on every push.
publish:npm:
  stage: deploy
  # Optional so a README-only push still runs the publish gate: README.md is in
  # this job's rules but not in the test/e2e jobs' rules, so on that push all of
  # these are absent from the pipeline. The job re-runs `npm test` itself below,
  # so the guard holds either way. One entry per job in the two stages before
  # this one, so deploy still starts as soon as test+e2e clear, without waiting
  # on pack:contents/license:deps in the same stage.
  needs:
    - job: unit:smoke
      optional: true
    - job: unit:fast
      optional: true
    - job: unit
      optional: true
    - job: unit:slow
      optional: true
    - job: e2e-web-index
      optional: true
    - job: e2e-web-local-origin
      optional: true
    - job: e2e-tui
      optional: true
    - job: e2e-cli
      optional: true
  rules:
    # schedule-guarded: the nightly dep:audit schedule must not re-publish.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # The npm surface: the consumer-impacting set OR README.md, which ships to
    # npm. A version bump always touches package.json, so real publishes still
    # fire; a README-only push starts the job and the version gate no-ops it.
    - if: '$CI_COMMIT_BRANCH == "main" && $NPM_TOKEN'
      changes: *consumer-paths
    - if: '$CI_COMMIT_BRANCH == "main" && $NPM_TOKEN'
      changes:
        - README.md
  id_tokens:
    # npm provenance on GitLab CI signs the build via Sigstore using this OIDC
    # token (npm reads SIGSTORE_ID_TOKEN); the aud must be sigstore.
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    # APPEND to the committed .npmrc — overwriting it would drop the
    # ignore-scripts/save-exact hardening exactly where it matters most.
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
    - npm ci
    - npm test
    # Ask the registry what it serves (shell's job — one npm view), then let
    # check:publish decide. The decision is semver-aware and unit tested in
    # src/domain/publish-gate.mjs: it exits 0 to publish, 1 to skip, and says
    # why either way. The `[ "$PUBLISHED" = "$LOCAL" ]` this replaces could only
    # tell "same" from "different", so a local version BEHIND the registry — a
    # revert, a stale branch — read as different and went to npm publish, which
    # then failed on the registry's error rather than skipping cleanly.
    - PUBLISHED_VERSION=$(npm view @polycode-projects/the-mechanical-code-talker version 2>/dev/null || echo "none")
    - |
      if npm run --silent check:publish -- "$PUBLISHED_VERSION"; then
        npm publish --provenance --access public
      fi

# Deploy the built site to the AWS-hosted edge (tmct.polycode.co.uk) via the
# GitLab OIDC -> AWS role chain (no static keys) — see PLAN_AWS.md. Builds
# public/ and hands it to CDK instead of a GitLab Pages artifact; no artifact
# upload, so the ~85 MB payload never transits GitLab.
deploy:website:
  stage: deploy
  image: nikolaik/python-nodejs:python3.13-nodejs24
  # Named explicitly, because the default — wait for EVERY job in every earlier
  # stage — is what made the deploy the slowest job in the pipeline rather than
  # one of the first. These are the jobs whose failure means "don't put this on
  # the edge at all": the four unit tiers, the one browser channel that covers
  # the site's own shell, and the CLI/TUI channels (cheap, and a broken binary
  # is a broken release even when the page is fine). `optional: true` on the
  # unit tiers mirrors publish:npm's reason — a README-only push has none of
  # them in the pipeline.
  #
  # Everything the deploy no longer waits for runs in `e2e:deployed` after it,
  # against the site this job just published.
  needs:
    - job: unit:smoke
      optional: true
    - job: unit:fast
      optional: true
    - job: unit
      optional: true
    - job: unit:slow
      optional: true
    - job: e2e-web-index
      optional: true
    - job: e2e-cli
      optional: true
    - job: e2e-tui
      optional: true
  # Required for the PROD_* CI/CD variables (environment-scoped to production)
  # to actually inject into this job — GitLab only applies a non-wildcard
  # variable scope to jobs whose `environment` matches it.
  environment:
    name: production
  rules:
    # schedule-guarded: the nightly dep:audit schedule must not redeploy the site.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # Fails closed until PROD_AWS_DEPLOY_ROLE_ARN is set (see the AWS deploy
    # CI/CD variables block near the top of this file) — same posture as
    # publish:npm's NPM_TOKEN gate.
    - if: '$CI_COMMIT_BRANCH == "main" && $PROD_AWS_DEPLOY_ROLE_ARN'
      changes: *consumer-paths
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  script:
    - npm ci
    - npm run build:ask-bundle
    - npm run demo:build
    - command -v aws >/dev/null || pip install --quiet awscli
    - source scripts/assume-aws.sh prod
    - cd infra
    - npm ci
    - npx cdk deploy tmct-prod-prod-website --require-approval never
        -c env=prod -c slug=prod -c account="${TMCT_PROD_ACCOUNT_ID}" -c region=eu-west-2
        -c hostname=tmct.polycode.co.uk -c certArn="${TMCT_PROD_CERT_ARN}"
        -c hostedZoneId="${TMCT_PROD_ZONE_ID}" -c zoneName=tmct.polycode.co.uk

# After a real publish, check that what the world serves is what we built: npm's
# registry and the AWS-hosted home page must both show package.json's version.
# Both lag a publish by a minute or two, so the script polls before reporting.
# Follows package.json's `homepage` automatically -- no script change needed
# for the cutover, only which job this waits on.
#
# It runs only on main, only with NPM_TOKEN, and never from a schedule — the
# same gate publish:npm uses, because there is nothing to smoke without a
# publish. That also keeps it off merge requests, so it can never gate a merge.
# `needs` makes it wait for the two jobs whose output it reads. Dependency-free
# and token-free, so no npm ci.
smoke:post-deploy:
  stage: verify
  needs:
    - publish:npm
    - deploy:website
  # Needed so this job's own rule can see PROD_AWS_DEPLOY_ROLE_ARN (production-
  # scoped) -- without it the rule's `&&` sees an empty variable, evaluates
  # false, and the job is omitted from the pipeline entirely (not skipped,
  # just absent) -- caught live: it silently vanished from a real pipeline
  # until this was added.
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    # Only when a consumer-impacting commit could have produced a new publish or
    # deploy to smoke, AND both jobs this one needs are actually in the pipeline
    # (deploy:website's own rule additionally requires PROD_AWS_DEPLOY_ROLE_ARN —
    # checking it here too keeps `needs:` from ever pointing at an absent job).
    - if: '$CI_COMMIT_BRANCH == "main" && $NPM_TOKEN && $PROD_AWS_DEPLOY_ROLE_ARN'
      changes: *consumer-paths
  retry: 2
  script:
    - npm run smoke:deploy

# The browser matrix, run against the LIVE AWS-deployed site. test-e2e/helpers'
# TMCT_E2E_BASE_URL switch points every fixture at the deployed URL instead of a
# local build snapshot (demo-site.mjs skips the per-file build entirely,
# static-server.mjs hands back the deployed origin in place of a local port), so
# these are the same files the pre-deploy channels used to run, now reading what
# the edge actually serves.
#
# This is the pipeline's main browser coverage, not a smoke test after one. Two
# consequences worth knowing before editing it:
#   - Every page file below is proven ONLY here. A regression in one of them is
#     caught after the edge has served it, and the fix is a new pipeline.
#   - There is no local site build in this job, which is most of what the old
#     channels spent their time on — each of them rebuilt the whole site once per
#     FILE. That is why one job can carry the whole matrix.
# e2e-web-index's list repeats here deliberately: it is the one channel proven
# both before the deploy (as the gate) and after it (against the real edge).
#
# Not here, and why: the five files in `e2e-web-local-origin` need a local origin
# — four build the page they open, and the boot budget wants a fixed one.
e2e:deployed:
  stage: verify
  needs:
    - deploy:website
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $PROD_AWS_DEPLOY_ROLE_ARN'
      changes: *consumer-paths
  # Kept from the three-file version, and it earns more here: this job starts
  # seconds after a CDK deploy, so the first attempt can race CloudFront still
  # settling. The cost of a retry is now the whole matrix, so a genuinely flaky
  # file should be hardened rather than left to the retry.
  retry: 2
  variables:
    TMCT_E2E_BASE_URL: "https://tmct.polycode.co.uk"
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright-browsers"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .playwright-browsers
  before_script:
    - npm ci
    - npx playwright install --with-deps chromium
  script:
    # The site shell, also run pre-deploy as e2e-web-index.
    - >-
      node --disable-warning=ExperimentalWarning --test
      test-e2e/pages-index.test.mjs test-e2e/pages-home.test.mjs
      test-e2e/pages-demo-history.test.mjs test-e2e/pages-demo-templates.test.mjs
      test-e2e/pages-examples.test.mjs test-e2e/pages-service-worker.test.mjs
