      test-e2e/pages-chat-p2p-distributed-inference.test.mjs

# The other half of "does what we shipped actually work": install the package
# from the real registry, the way a consumer would, and run the CLI/TUI e2e files
# against THAT copy's binary instead of bin/tmct.mjs in the checkout.
#
# smoke:post-deploy already asks the registry which version it SERVES. That
# proves propagation and nothing else — a tarball with a missing file, a
# dependency that resolves only inside the repo, a bin entry that points at
# nothing, all still pass it. This job installs and runs the thing.
#
# scripts/install-published.mjs polls until package.json's exact version is on
# the registry (a publish lands a minute or two after the job that pushed it),
# installs it into a temp directory with its own package.json so the repo's
# .npmrc plays no part, checks the installed version, and prints the binary's
# path. TMCT_E2E_CLI_BIN then redirects the same test files at it — see
# test-e2e/helpers/cli-bin.mjs, the CLI-side twin of TMCT_E2E_BASE_URL.
#
# It needs publish:npm, not deploy:website, and gates on NPM_TOKEN, because
# there is nothing to install without a publish. No browser, so no Chromium.
#
# It runs on every consumer-impacting push to main, not only on a version bump.
# On a push that publishes nothing, the version already on the registry is this
# commit's version, so the install still proves the package a consumer gets today.
#
# Two e2e-cli/e2e-tui files are deliberately absent. cli-render-views expects
# `--render spider-fly`/`--render adventure` to exit 0, and those two archetypes
# inline a bundle built by scripts/, which the package does not ship — the
# installed CLI refuses them by design, naming the reason. tui.test.mjs drives
# the TUI through ink-testing-library rather than spawning a binary, so there is
# nothing here for it to redirect.
e2e:published-package:
  stage: verify
  needs:
    - publish:npm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $NPM_TOKEN'
      changes: *consumer-paths
  script:
    # npm ci for the test files' own imports (they read src/ and scripts/ from the
    # checkout); the BINARY they spawn is the installed one.
    - npm ci
    # The script prints one line on stdout, the binary's path; its progress goes
    # to stderr so this capture stays clean. Assign FIRST and export second:
    # `export VAR=$(cmd)` reports the export's own status, not the command's, so a
    # failed install would sail past and the run below would silently fall back to
    # the checkout's bin/tmct.mjs — a green job proving the wrong thing.
    - TMCT_E2E_CLI_BIN=$(node scripts/install-published.mjs)
    - export TMCT_E2E_CLI_BIN
    - echo "running the CLI/TUI e2e files against $TMCT_E2E_CLI_BIN"
    - >-
      node --disable-warning=ExperimentalWarning --test
      test-e2e/cli-smoke.test.mjs test-e2e/cli-help.test.mjs
      test-e2e/cli-config-flags.test.mjs test-e2e/init.test.mjs
      test-e2e/init-cli.test.mjs test-e2e/bootstrap-seed.test.mjs
      test-e2e/import-file.test.mjs test-e2e/digest-cli.test.mjs
      test-e2e/memory-export.test.mjs test-e2e/domain-river.test.mjs
      test-e2e/domain-crates.test.mjs test-e2e/server-http.test.mjs
      test-e2e/server-http-smoke.test.mjs test-e2e/tui-chat-file.test.mjs
