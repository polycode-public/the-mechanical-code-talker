# CI for @polycode-projects/the-mechanical-code-talker (tmct) — a single
# published npm package plus a static home page (no benchmark rig). Core
# jobs: run the tests, publish to public npm on a deliberate version bump,
# and deploy public/ to an AWS-hosted edge (`deploy:website`, `e2e:deployed:*`)
# on main — see PLAN_AWS.md. The home page moved off GitLab Pages entirely
# (2026-07-28); the old `pages` job and its redirect-stub burn-in period are
# retired. Mirrors the seonix repo's publish:npm and deploy:website shapes,
# minus the --workspace flag (tmct is a single package, not a workspace).

image: node:24.18.0

# ---- how this pipeline is scheduled: a DAG, not a queue --------------------
# Every job carries a `stage:` because GitLab requires one, and the stages
# below are for READING the pipeline, not for scheduling it. Scheduling comes
# from each job's `needs:`, which names only what that job genuinely depends
# on. A stage boundary used to mean an implicit "wait for all of that", and
# almost none of those waits were backed by a real dependency. `deploy:website`
# sat behind a browser channel that runs for eight minutes and proves nothing
# the deploy reads. `publish:npm`, the longest job in the pipeline, spent its
# first 758 seconds waiting for the whole test and e2e stages to clear, purely
# to reach its own stage position.
#
# The project has no users yet. Shipping something broken costs a redeploy;
# NOT KNOWING it is broken is the expensive failure. So the test tiers are no
# longer release gates. They are fast, parallel INFORMATION: they all still
# run, they all now start at once, and a failure still turns the pipeline red.
# What they no longer do is hold the deploy or the publish.
#
# Two things stay hard gates, and they are the only two:
#   secret_detection  nothing reaches the edge or the registry carrying a
#                     credential. It runs first, on its own, in `gate`.
#   unit:smoke        ~37s, one test per capability family. A build that fails
#                     it is broken in a way worth a red deploy, and waiting
#                     for it costs the deploy almost nothing.
# publish:npm adds pack:contents: a published npm version is immutable, and
# that job IS the "is this tarball right" check (publint plus the shipped file
# list) — ~42s against a mistake that cannot be taken back.
#
# Deliberately NOT `allow_failure: true`: the informational tiers. Under
# `needs:` a failing job with no dependents already blocks nothing, so
# allow_failure would buy no speed and would cost exactly the red pipeline
# that is the reason for still running them.
stages:
  - gate
  - test
  - e2e
  - image
  - deploy
  - verify
  - site-ready
  - e2e-deployed

# publish:npm creates a release tag AFTER that commit's own pipeline has already
# tested and shipped it, so a tag pipeline would re-run the suite against a
# commit that just passed it. Most jobs here rule on `changes:` alone, and
# GitLab evaluates `changes:` as always-true outside branch and merge request
# pipelines — so without this, every release would cost a second near-full
# pipeline.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

# ---- security scanning (free tier) -----------------------------------------
# SAST (semgrep) + Pipeline Secret Detection via GitLab's stock templates.
# Harmless if the group doesn't license the report UI — the jobs still run.
# tmct is a pure-JS package, so IaC (KICS), Container Scanning, and the
# Ultimate-only Dependency Scanning are all N/A and deliberately not included.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # We scan OUR code, not committed corpuses / vendored assets: corpus/ + data/
  # hold committed corpus + template data, public/ is the static site, .tmct is
  # the on-disk graph memory, node_modules is dependencies.
  SAST_EXCLUDED_PATHS: "corpus, data, public, node_modules, .tmct"
  SECRET_DETECTION_EXCLUDED_PATHS: "corpus, data, public, node_modules, .tmct"

# ---- AWS deploy CI/CD variables (documentation only — set via `glab variable
# set`, masked + environment-scoped, once the tmct-ci/tmct-prod accounts exist
# per PLAN_AWS.md Phase 1) ----------------------------------------------------
# None of these are declared with values here: they don't exist yet (no AWS
# account has been created), and `deploy:website` / `e2e:deployed:*` below fail
# closed (rules require the variable present) until they are set, the same
# gate publish:npm already uses for NPM_TOKEN.
#   CI_AWS_ACTIONS_ROLE_ARN    — tmct-ci OIDC actions-role ARN (branch-scoped)
#   CI_AWS_DEPLOY_ROLE_ARN     — tmct-ci deployment-role ARN
#   PROD_AWS_ACTIONS_ROLE_ARN  — tmct-prod OIDC actions-role ARN (main only)
#   PROD_AWS_DEPLOY_ROLE_ARN   — tmct-prod deployment-role ARN; gates deploy:website
#   TMCT_PROD_ACCOUNT_ID       — tmct-prod AWS account ID
#   TMCT_PROD_CERT_ARN         — ACM cert for tmct.polycode.co.uk (us-east-1)
#   TMCT_PROD_ZONE_ID          — tmct-prod's Route53 hosted zone ID

semgrep-sast:
  stage: verify
  needs: []
  allow_failure: true

# Tracked text files must stay free of home-directory paths, unallowlisted
# email addresses and personal names — see scripts/pii-lint.mjs (and its
# allowlist, scripts/pii-allowlist.json). Dependency-free, so no npm ci.
pii:lint:
  stage: verify
  needs: []
  script:
    - npm run check:pii

# Every relative markdown link must resolve to a real repo file — see
# scripts/check-links.mjs. Dependency-free, so no npm ci.
links:check:
  stage: verify
  needs: []
  script:
    - npm run check:links

# The one hard gate on both consumer surfaces. It used to run with
# allow_failure and nothing needing it, which meant it blocked nothing at all —
# a leaked credential would have been scanned, reported, and deployed anyway.
# `deploy:website` and `publish:npm` now need it, so it runs first, alone, in
# its own stage and costs the deploy ~19s.
#
# `allow_failure: false` is written out because the stock template sets it
# true; deleting the line would inherit the template's value, not clear it.
#
# The template's own rules are replaced rather than inherited, so this job's
# presence is deterministic. Two of them (`AST_ENABLE_MR_PIPELINES`) can drop
# the job from a branch pipeline, and a `needs:` pointing at an absent job
# fails pipeline CREATION — the whole push, not one job. One rule, always
# present on a branch, is what makes the hard `needs:` below safe.
secret_detection:
  stage: gate
  needs: []
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH'

# ---- consumer-impacting path set -------------------------------------------
# The heavy pipeline — the suite, package hygiene, the licence audit, the e2e
# tier, the website deploy, the npm publish and everything in the verify stage
# after them — only earns its cost when a commit can change what a consumer
# receives: the installed npm package or the deployed home page. It follows that
# every one of those jobs' rules keys off this set. These globs are it. They cover
# the shipped code and its committed data, the build and test machinery that
# proves it, the fixtures the demo build reads, and the manifests that pin
# versions. .gitlab-ci.yml is in the set so a pipeline change proves itself.
# A commit confined to design docs, plans, or benchmark notes touches none of
# them, so it runs only the cheap always-on doc guards (links:check, pii:lint)
# and the stock security templates. README.md is deliberately NOT in this set:
# it ships to npm but never to the web page, so the two jobs that own the npm
# surface (pack:contents, publish:npm) add it to their own rules instead.
.consumer-paths: &consumer-paths
  - src/**/*
  - bin/**/*
  - corpus/**/*
  - data/**/*
  - ontology/**/*
  - public/**/*
  - scripts/**/*
  - server/**/*
  - infra/**/*
  - Dockerfile
  - .dockerignore
  - test/**/*
  - test-e2e/**/*
  - examples/**/*
  - test-benchmarks/agentbench/envelope.json
  - package.json
  - package-lock.json
  - .gitlab-ci.yml

# Reads package-lock.json's own pinned playwright version and hands it to
# every job that needs the matching mcr.microsoft.com/playwright:v<version>-noble
# image, via a dotenv artifact — so a playwright version bump in package.json
# flows into the CI image automatically, nothing here to remember to edit by
# hand. Dependency-free, pure JSON read, so no npm ci.
detect:playwright-version:
  stage: gate
  needs: []
  rules:
    - changes: *consumer-paths
  script:
    - node scripts/detect-playwright-version.mjs playwright-version.env
  artifacts:
    reports:
      dotenv: playwright-version.env

# The suite split four ways so a push isn't gated on one long serial run.
# `scripts/list-unit-test-files.mjs` is the one place the >=20s exclusion list
# lives; test:slow's own package.json script names those same five files
# directly. Rebalance the buckets if a file's own timing drifts across that
# 20s line.
#
# All four carry `needs: []` so they start the moment the pipeline does. Only
# unit:smoke has anything downstream of it.
unit:smoke:
  stage: test
  interruptible: true
  needs: []
  rules:
    - changes: *consumer-paths
  script:
    - npm ci
    - npm run test:smoke

unit:fast:
  stage: test
  interruptible: true
  needs: []
  rules:
    - changes: *consumer-paths
  script:
    - npm ci
    - npm run test:fast

# Everything except the four files test:slow owns.
unit:
  stage: test
  interruptible: true
  needs: []
  rules:
    - changes: *consumer-paths
  script:
    - npm ci
    - npm run build:ask-bundle
    - npm run test:unit

# The four files with at least one test over 20s: synthbench's SYN rungs, the
# README shell-example harness, the bench-smoke corpus lane, and the inference
# corpus lane.
#
# This tier gates nothing now, but it is deliberately NOT made conditional on a
# fresh x.y.0 the way e2e:heavy is — these are real coverage, not drift guards.
unit:slow:
  stage: test
  interruptible: true
  needs: []
  rules:
    - changes: *consumer-paths
  script:
    - npm ci
    - npm run test:slow

# Package hygiene: publint over the exports map, and the file list npm pack
# would publish diffed against the committed expected manifest — no stray
# file ships, nothing expected goes missing.
pack:contents:
  stage: test
  interruptible: true
  needs: []
  # The consumer-impacting set OR README.md: this job is the guard on the shipped
  # file list, and README.md is one of the shipped files, so a README-only push
  # must still prove the manifest.
  rules:
    - changes: *consumer-paths
    - changes:
        - README.md
  script:
    - npm ci
    - npm run build:ask-bundle
    - npm run gen:sprite-facts
    - npm run gen:worlds-pack
    - npm run check:publint
    - npm pack --dry-run --json | npm run --silent check:pack

# Production dependency tree must stay inside the licence allowlist (MIT, ISC,
# BSD, Apache-2.0, MPL-2.0 and the public-domain-equivalents) — see
# scripts/check-licences.mjs.
license:deps:
  stage: test
  interruptible: true
  needs: []
  rules:
    - changes: *consumer-paths
  script:
    - npm ci
    - npm run check:licences

# The PRE-DEPLOY e2e tier, deliberately small. It holds the browser and
# CLI/TUI channels that want a local origin, and nothing downstream needs any
# of it: every job here carries `needs: []`, starts with the pipeline, and
# reports. `e2e-web-index` alone ran for 505 seconds while the deploy waited
# on it, which bought pre-deploy certainty the deployed matrix then re-earned
# against the real edge minutes later. Now the two run side by side.
#
# Everything else that used to run in this stage runs POST-deploy against the
# live site, in the `e2e:deployed:*` jobs at the bottom of this file. The trade
# is faster feedback for less pre-deploy certainty: a page regression is caught
# after the edge has already served it, and the fix is a new pipeline.
# `test-e2e/*.test.mjs` — top-level only; test-e2e/heavy/ is the separate
# `e2e:heavy` job below.
#
# Two base templates: `.e2e-web-base` installs Chromium for channels that spawn
# a real browser page; `.e2e-lite-base` skips it for the CLI/TUI channels that
# never do. A file can reach playwright through test-e2e/helpers/ rather than
# importing it, so check both before putting one on the lite base.
# .npmrc's ignore-scripts=true stops playwright's install hook, so
# `npm ci` never downloads a browser as a side effect; the browsers land in the
# project dir (PLAYWRIGHT_BROWSERS_PATH) so the cache can carry them, keyed on
# the lockfile because the pinned playwright version lives there.
.e2e-web-base:
  stage: e2e
  interruptible: true
  image: "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"
  needs:
    - job: detect:playwright-version
      artifacts: true
  rules:
    - changes: *consumer-paths
  before_script:
    - npm ci
    - npm run build:ask-bundle
    - npm run gen:worlds-pack

.e2e-lite-base:
  stage: e2e
  interruptible: true
  needs: []
  rules:
    - changes: *consumer-paths
  before_script:
    - npm ci

e2e-web-index:
  extends: .e2e-web-base
  script:
    - >-
      node --disable-warning=ExperimentalWarning --test
      test-e2e/pages-index.test.mjs test-e2e/pages-home.test.mjs
      test-e2e/pages-demo-history.test.mjs test-e2e/pages-demo-templates.test.mjs
      test-e2e/pages-examples.test.mjs test-e2e/pages-service-worker.test.mjs
      test-e2e/pages-service-worker-cache-bust.test.mjs
      test-e2e/memory-ask-browser-bundle.test.mjs test-e2e/readme-examples.test.mjs
      test-e2e/cli-render-views.test.mjs

# No browser: pure stdio/process spawns.
e2e-tui:
  extends: .e2e-lite-base
  script:
    - node --disable-warning=ExperimentalWarning --test test-e2e/tui.test.mjs test-e2e/tui-chat-file.test.mjs test-e2e/tui-rover-capability-chain.test.mjs

e2e-cli:
  extends: .e2e-lite-base
  script:
    - >-
      node --disable-warning=ExperimentalWarning --test
      test-e2e/cli-smoke.test.mjs test-e2e/cli-help.test.mjs test-e2e/cli-config-flags.test.mjs
      test-e2e/init.test.mjs test-e2e/init-cli.test.mjs test-e2e/bootstrap-seed.test.mjs
      test-e2e/import-file.test.mjs test-e2e/digest-cli.test.mjs test-e2e/memory-export.test.mjs
      test-e2e/domain-river.test.mjs test-e2e/domain-crates.test.mjs test-e2e/lib-chat-sqlite.test.mjs
      test-e2e/build-demo-memory.test.mjs test-e2e/server-http.test.mjs test-e2e/server-http-smoke.test.mjs

# The heavy half of the e2e tier (test-e2e/heavy/*.test.mjs): a full demo:build, an
# uncapped ConceptNet seed, and a full-store export/import round trip —
# together several minutes of real signal, but not on every push. Runs only
# when a push actually touches what these tests exercise.
#
# No x.y.0-vs-patch distinction: this job has `needs: []` and gates nothing,
# so skipping it on a patch roll would save runner-minutes, not wall-clock —
# not worth the complexity of a separate release-scope mechanism for that
# alone. It runs every time its own `changes:` rules fire, patch or not.
e2e:heavy:
  stage: e2e
  interruptible: true
  image: "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"
  needs:
    - job: detect:playwright-version
      artifacts: true
  rules:
    - changes:
        - scripts/build-*.mjs
        - src/adapters/corpus/**/*
        - corpus/**/*
        - data/**/*
        - package.json
        - package-lock.json
        - test-e2e/heavy/**/*
  script:
    - npm ci
    - npm run build:ask-bundle
    - npm run test:e2e:heavy

# Publish the package to PUBLIC npmjs.org. Automatic on main, but the release
# TRIGGER is a VERSION BUMP, not a push or a tag: the script compares
# package.json's version against what's already live on npm and no-ops if they
# match, so an ordinary push to main can never re-publish or error on "version
# already exists" — only a commit that bumps the version publishes. The rule
# requires NPM_TOKEN present (a masked, protected npm *automation* token for the
# @polycode-projects scope) so a not-yet-configured token fails closed (the job
# doesn't run) rather than failing loud on every push.
publish:npm:
  stage: deploy
  # This was the longest job in the pipeline AND the last to start: it waited
  # for every unit tier and every e2e channel to clear, and the first 758
  # seconds of its wall-clock were that wait. Its real dependencies are three:
  #
  #   secret_detection  no credential goes to a public registry. Hard.
  #   pack:contents     publint plus the shipped file list — the one check
  #                     that answers "is this tarball right". An npm version
  #                     is immutable once published, so this ~42s is worth
  #                     more here than anywhere else in the pipeline.
  #   unit:smoke        ~37s of "the engine still works at all".
  #
  # The e2e channels prove the page and the CLI, which the deployed matrix and
  # e2e:published-package both re-prove after the fact against the real thing.
  #
  # `optional: true` on the two test-stage jobs because a README-only push has
  # README.md in this job's rules but the unit tiers key off the consumer set
  # alone; pack:contents carries README.md in its own rules, so it is there.
  needs:
    - secret_detection
    - job: pack:contents
      optional: true
    - job: unit:smoke
      optional: true
  rules:
    # The npm surface: the consumer-impacting set OR README.md, which ships to
    # npm. A version bump always touches package.json, so real publishes still
    # fire; a README-only push starts the job and the version gate no-ops it.
    - if: '$CI_COMMIT_BRANCH == "main" && $NPM_TOKEN'
      changes: *consumer-paths
    - if: '$CI_COMMIT_BRANCH == "main" && $NPM_TOKEN'
      changes:
        - README.md
  id_tokens:
    # npm provenance on GitLab CI signs the build via Sigstore using this OIDC
    # token (npm reads SIGSTORE_ID_TOKEN); the aud must be sigstore.
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    # APPEND to the committed .npmrc — overwriting it would drop the
    # ignore-scripts/save-exact hardening exactly where it matters most.
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
    - npm ci
    - npm run build:ask-bundle
    - npm run gen:sprite-facts
    - npm run gen:worlds-pack
    # The fast tier, not the full suite. The full suite ran here serially for
    # roughly six minutes, on top of the four unit jobs that had already run it
    # in parallel — the same tests, twice, once on the critical path. Those
    # jobs still run and still turn the pipeline red. This keeps a seconds-long
    # sanity check in the job itself so a completely broken build cannot reach
    # the registry through a pipeline whose test jobs simply had not finished.
    - npm run test:fast
    # Ask the registry what it serves (shell's job — one npm view), then let
    # check:publish decide. The decision is semver-aware and unit tested in
    # src/domain/publish-gate.mjs: it exits 0 to publish, 1 to skip, and says
    # why either way. The `[ "$PUBLISHED" = "$LOCAL" ]` this replaces could only
    # tell "same" from "different", so a local version BEHIND the registry — a
    # revert, a stale branch — read as different and went to npm publish, which
    # then failed on the registry's error rather than skipping cleanly.
    - PUBLISHED_VERSION=$(npm view @polycode-projects/the-mechanical-code-talker version 2>/dev/null || echo "none")
    - |
      if npm run --silent check:publish -- "$PUBLISHED_VERSION"; then
        npm publish --provenance --access public
      fi
    # Then make sure this version has a release tag, on every run of this job
    # rather than only the run that published. Publishing and tagging are two
    # calls to two services, and the second can fail on its own; a re-run then
    # finds the version already on the registry, skips the publish above, and
    # would otherwise skip the tag with it and go green with nothing tagged. So
    # ask for the release first: 200 means it is already there and there is
    # nothing to do, 404 means create it, anything else is a real failure and
    # says so. `--fail` is deliberately absent from the GET — it turns the 404
    # this branches on into a dead job — and deliberately present on the POST.
    # node writes the payload rather than a heredoc so nothing in package.json
    # can break out of the JSON, and the ref is the exact commit, not a branch
    # head that has already moved on.
    - |
      VERSION=$(node -p 'require("./package.json").version')
      RELEASES_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      RELEASE_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "$RELEASES_API/v$VERSION")
      case "$RELEASE_STATUS" in
        200)
          echo "release v$VERSION already exists"
          ;;
        404)
          node -e '
            const { name, version } = require("./package.json");
            process.stdout.write(JSON.stringify({
              tag_name: `v${version}`,
              name: `v${version}`,
              ref: process.env.CI_COMMIT_SHA,
              description: `[\`${name}@${version}\`](https://www.npmjs.com/package/${name}/v/${version}) on npm.`,
            }));
          ' > release.json
          curl --fail --silent --show-error \
            --request POST \
            --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --header "Content-Type: application/json" \
            --data @release.json \
            "$RELEASES_API"
          ;;
        *)
          echo "releases API answered $RELEASE_STATUS for v$VERSION" >&2
          exit 1
          ;;
      esac

# One container image, built once and pushed to ECR tagged with this
# commit's SHA, run by all three Lambdas — Node 24 (managed Lambda runtimes
# stop short of it) with both seed sqlite files baked in.
# Two jobs because kaniko's own "-debug" image carries no AWS CLI and no ECR
# credential helper: this job (the same python+node image deploy:website
# uses, so the awscli pip fallback and `source scripts/assume-aws.sh prod`
# both already work here) builds the three Lambda bundles and both seed
# sqlite files, logs in to ECR itself, and hands the resulting docker
# credential file to the kaniko job as an artifact — kaniko never touches
# AWS credentials directly.
build:image-artifacts:
  stage: image
  image: nikolaik/python-nodejs:python3.13-nodejs24
  needs:
    - secret_detection
  # Needed so this job's own rule can see PROD_AWS_DEPLOY_ROLE_ARN and its
  # script can see TMCT_PROD_ACCOUNT_ID, both production-scoped variables —
  # see the same gotcha documented above smoke:post-deploy.
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PROD_AWS_DEPLOY_ROLE_ARN'
      changes: *consumer-paths
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  script:
    - npm ci
    # public/chat-seed.json is what build:news-worker inlines and what
    # build:seed-sqlite's xl seed reads, so it is built once, first.
    - npm run build:chat-seed
    - npm run build:row-service
    - npm run build:turn-service
    - npm run build:news-worker
    - npm run build:seed-sqlite
    - command -v aws >/dev/null || pip install --quiet awscli
    - source scripts/assume-aws.sh prod
    # Idempotent: the first pipeline to reach this point creates the repo,
    # every one after finds it already there and moves straight past.
    - >
      aws ecr describe-repositories --region eu-west-2 --repository-names tmct-web-lambdas
      || aws ecr create-repository --region eu-west-2 --repository-name tmct-web-lambdas
    - mkdir -p .kaniko-docker
    - |
      ECR_REGISTRY="${TMCT_PROD_ACCOUNT_ID}.dkr.ecr.eu-west-2.amazonaws.com"
      ECR_AUTH=$(printf 'AWS:%s' "$(aws ecr get-login-password --region eu-west-2)" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$ECR_REGISTRY" "$ECR_AUTH" > .kaniko-docker/config.json
  artifacts:
    expire_in: 1 hour
    paths:
      - server/row-service/dist/
      - server/turn-service/dist/
      - server/news-worker/dist/
      - server/seeds/
      - Dockerfile
      - .kaniko-docker/config.json

# kaniko builds the image from the artifacts above and pushes it to ECR
# tagged with this commit's SHA. `entrypoint: [""]` hands `script:` to the
# "-debug" variant's busybox sh instead of the image's own executor
# entrypoint — the standard way to run kaniko as an ordinary GitLab job.
build:image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs:
    - job: build:image-artifacts
      artifacts: true
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PROD_AWS_DEPLOY_ROLE_ARN'
      changes: *consumer-paths
  script:
    - mkdir -p /kaniko/.docker
    - cp .kaniko-docker/config.json /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${TMCT_PROD_ACCOUNT_ID}.dkr.ecr.eu-west-2.amazonaws.com/tmct-web-lambdas:${CI_COMMIT_SHA}"

# Deploy the built site to the AWS-hosted edge (tmct.polycode.co.uk) via the
# GitLab OIDC -> AWS role chain (no static keys) — see PLAN_AWS.md. Builds
# public/ and hands it to CDK instead of a GitLab Pages artifact; no artifact
# upload, so the ~85 MB payload never transits GitLab.
deploy:website:
  stage: deploy
  image: nikolaik/python-nodejs:python3.13-nodejs24
  # Two jobs, and the pipeline's whole shape follows from how short this list
  # is. The deploy is the head of the longest chain in the pipeline
  # (deploy -> site:ready -> the deployed matrix), so every second it spends
  # waiting is a second on the critical path. It used to wait ~13 minutes for
  # the unit tiers and four e2e channels, one of which (e2e-web-index, 505s)
  # was on its own the reason the deploy started when it did.
  #
  #   secret_detection  nothing with a credential in it reaches the edge. Hard.
  #   unit:smoke        ~37s. A build that fails one test per capability family
  #                     is broken loudly enough to be worth not deploying.
  #
  # Everything else runs beside this job instead of before it, and the deployed
  # matrix re-proves the page against the real edge a few minutes later anyway.
  # A page regression is now caught after the edge has served it; the site has
  # no users yet and the fix is a new pipeline, which is the trade this whole
  # file is making.
  needs:
    - secret_detection
    - job: unit:smoke
      optional: true
    - job: build:image
  # Required for the PROD_* CI/CD variables (environment-scoped to production)
  # to actually inject into this job — GitLab only applies a non-wildcard
  # variable scope to jobs whose `environment` matches it.
  environment:
    name: production
  rules:
    # Fails closed until PROD_AWS_DEPLOY_ROLE_ARN is set (see the AWS deploy
    # CI/CD variables block near the top of this file) — same posture as
    # publish:npm's NPM_TOKEN gate.
    - if: '$CI_COMMIT_BRANCH == "main" && $PROD_AWS_DEPLOY_ROLE_ARN'
      changes: *consumer-paths
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  script:
    - npm ci
    - npm run build:ask-bundle
    - npm run gen:worlds-pack
    - npm run demo:build
    - command -v aws >/dev/null || pip install --quiet awscli
    - source scripts/assume-aws.sh prod
    - cd infra
    - npm ci
    # Deploying tmct-prod-prod-website also deploys tmct-prod-prod-edge-guard
    # (the WAF web ACL and billing alarm, us-east-1) and its cross-region
    # export-reader stack: the CDK CLI walks a named stack's dependencies
    # even when they're not listed on the command line.
    - npx cdk deploy tmct-prod-prod-website --require-approval never
        -c env=prod -c slug=prod -c account="${TMCT_PROD_ACCOUNT_ID}" -c region=eu-west-2
        -c hostname=tmct.polycode.co.uk -c certArn="${TMCT_PROD_CERT_ARN}"
        -c hostedZoneId="${TMCT_PROD_ZONE_ID}" -c zoneName=tmct.polycode.co.uk
        -c imageTag="${CI_COMMIT_SHA}" -c ecrRepo=tmct-web-lambdas
    - cd ..
    - node scripts/warm-deployed-cache.mjs

# Loads the demo's corpus band into the deployed table (§3.13) — runs every
# pipeline that reaches deploy:website, not gated on a separate schedule,
# because `tmct corpus load`'s own digest no-op (corpus-loader.mjs) is what
# makes that cheap: an unchanged band's load is one manifest read and an
# early return, not a rewrite.
#
# wordnet-complete is the band this job builds from scratch here: its source
# (corpus/wordnet/wordnet-full.jsonl) is committed in-repo, so the pipeline
# needs no operator action. A consumer's own band loads through the same CLI
# verb against their own table, outside this pipeline.
corpus:load:
  stage: verify
  # The same python+node image the deploy job uses: the awscli fallback
  # installs through pip, which the plain node image does not carry.
  image: nikolaik/python-nodejs:python3.13-nodejs24
  needs:
    - deploy:website
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PROD_AWS_DEPLOY_ROLE_ARN'
      changes: *consumer-paths
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  script:
    - npm ci
    - command -v aws >/dev/null || pip install --quiet awscli
    - source scripts/assume-aws.sh prod
    # --region spelled out: the pip-installed awscli v1 reads
    # AWS_DEFAULT_REGION, not the AWS_REGION assume-aws.sh exports, and a
    # region-less describe-stacks fails into an empty variable.
    - export TMCT_DYNAMO_TABLE=$(aws cloudformation describe-stacks --region eu-west-2 --stack-name tmct-prod-prod-website --query "Stacks[0].Outputs[?OutputKey=='RowTableName'].OutputValue" --output text)
    - test -n "$TMCT_DYNAMO_TABLE"
    # One build + load per first-class band. Each load is a no-op when the
    # source digest already matches the band's manifest, so a deploy that
    # changed no corpus file costs three digest reads.
    - node scripts/corpus-bands/build-child.mjs --out child.band.jsonl
    - node bin/tmct.mjs corpus load child --source child.band.jsonl
    - node scripts/corpus-bands/build-conceptnet.mjs --out conceptnet.band.jsonl
    - node bin/tmct.mjs corpus load conceptnet --source conceptnet.band.jsonl
    - node scripts/corpus-bands/build-wordnet-complete.mjs --out wordnet-complete.band.jsonl
    - node bin/tmct.mjs corpus load wordnet-complete --source wordnet-complete.band.jsonl

# After a real publish, check that what the world serves is what we built: npm's
# registry and the AWS-hosted home page must both show package.json's version.
# Both lag a publish by a minute or two, so the script polls before reporting.
# Follows package.json's `homepage` automatically -- no script change needed
# for the cutover, only which job this waits on.
#
# It runs only on main and only with NPM_TOKEN — the same gate publish:npm
# uses, because there is nothing to smoke without a publish. That also keeps
# it off merge requests, so it can never gate a merge.
# `needs` makes it wait for the two jobs whose output it reads. Dependency-free
# and token-free, so no npm ci.
smoke:post-deploy:
  stage: verify
  needs:
    - publish:npm
    - deploy:website
  # Needed so this job's own rule can see PROD_AWS_DEPLOY_ROLE_ARN (production-
  # scoped) -- without it the rule's `&&` sees an empty variable, evaluates
  # false, and the job is omitted from the pipeline entirely (not skipped,
  # just absent) -- caught live: it silently vanished from a real pipeline
  # until this was added.
  environment:
    name: production
  rules:
    # Only when a consumer-impacting commit could have produced a new publish or
    # deploy to smoke, AND both jobs this one needs are actually in the pipeline
    # (deploy:website's own rule additionally requires PROD_AWS_DEPLOY_ROLE_ARN —
    # checking it here too keeps `needs:` from ever pointing at an absent job).
    - if: '$CI_COMMIT_BRANCH == "main" && $NPM_TOKEN && $PROD_AWS_DEPLOY_ROLE_ARN'
      changes: *consumer-paths
  retry: 2
  script:
    - npm run smoke:deploy

# The browser matrix, run against the LIVE AWS-deployed site. test-e2e/helpers'
# TMCT_E2E_BASE_URL switch points every fixture at the deployed URL instead of a
# local build snapshot (demo-site.mjs skips the per-file build entirely,
# static-server.mjs hands back the deployed origin in place of a local port), so
# these are the same files the pre-deploy channels used to run, now reading what
# the edge actually serves.
#
# This is the pipeline's main browser coverage, not a smoke test after one. Two
# consequences worth knowing before editing it:
#   - Every page file below is proven ONLY here. A regression in one of them is
#     caught after the edge has served it, and the fix is a new pipeline.
#   - There is no local site build in this job, which is most of what the old
#     channels spent their time on — each of them rebuilt the whole site once per
#     FILE. That is why one job can carry the whole matrix.
# e2e-web-index's list repeats here deliberately: it is the one channel proven
# twice, once against a local build and once against the real edge. The two now
# run alongside each other rather than in sequence.
#
# Three jobs, not one, and each caps `--test-concurrency` rather than leaving
# node's default (all files at once, bounded only by the runner's own core
# count). At 44 files in one job (grown from 3 by this same restructure) a live
# pipeline (2717061891) failed all three `retry: 2` attempts, each on a
# DIFFERENT file — a real speech-bubble assertion race in pages-mud (since
# removed; fixed below, in the same commit as this split: it was picking up
# either half of a two-character exchange as "the asker's own bubble" and
# only one half is narration) and, reproduced locally under the same
# concurrent-file load, an intermittent dropped Playwright/CDP promise in
# pages-research (since removed). Neither file
# is slow or wrong on its own; both surfaced only when several real Chromium
# instances ran at once against the live site. Splitting means a retry only
# re-runs its own slice, not the whole matrix, and the concurrency cap bounds
# how many of THOSE Chromium instances run at once regardless of the runner's
# core count.
#
# Polls the deployed site until it serves THIS build — this build's version,
# this build's COMMIT, and a full-size chat-seed.json — capped at ~5 minutes by
# default (WAIT_FOR_SITE_ATTEMPTS/WAIT_FOR_SITE_DELAY_MS). The version alone
# was not commit-precise: commits share a version between bumps, so a slow
# deploy still settling while the next push raced past it could pass the
# version check while the edge served the wrong code. deploy:website stamps
# CI_COMMIT_SHA into the page (GitLab predefines it in every job, so there is
# nothing to pass) and this demands it back. The
# e2e-deployed jobs below need this instead of racing deploy:website directly
# — pipeline history (2721958621, 2722312066) showed real, inconsistent
# failures (different files, different assertions, every retry) that
# vanished when the same files were run standalone against the live site
# moments later: a still-settling CDN, not a code defect. A cheap poll here
# replaces blindly eating a `retry: 2` on the whole (expensive) e2e matrix.
site:ready:
  stage: site-ready
  needs:
    - deploy:website
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PROD_AWS_DEPLOY_ROLE_ARN'
      changes: *consumer-paths
  script:
    - npm ci
    - npm run wait:site

.e2e-deployed-base:
  stage: e2e-deployed
  image: "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"
  needs:
    - site:ready
    - job: detect:playwright-version
      artifacts: true
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PROD_AWS_DEPLOY_ROLE_ARN'
      changes: *consumer-paths
  # site:ready already confirmed the CDN serves this build before this stage
  # starts, so a retry here is for genuine transient flakes (a dropped CDP
  # promise under real Chromium-instance contention — see the comment above
  # smoke:post-deploy), not CDN-settling races.
  retry: 2
  variables:
    TMCT_E2E_BASE_URL: "https://tmct.polycode.co.uk"
  before_script:
    - npm ci
    - npm run build:ask-bundle
    - npm run gen:worlds-pack

# The site shell, also run pre-deploy as e2e-web-index. Eight single-context
# pages — the lightest slice, so it keeps node's default concurrency.
e2e:deployed:shell:
  extends: .e2e-deployed-base
  script:
    - >-
      node --disable-warning=ExperimentalWarning --test
      test-e2e/pages-index.test.mjs test-e2e/pages-home.test.mjs
      test-e2e/pages-demo-history.test.mjs test-e2e/pages-demo-templates.test.mjs
      test-e2e/pages-examples.test.mjs
      test-e2e/memory-ask-browser-bundle.test.mjs test-e2e/readme-examples.test.mjs
      test-e2e/cli-render-views.test.mjs

# The hero clip: about 75 seconds of the live mudiii square playing itself,
# recorded off the deployed site and uploaded as a build artifact for a human
# to convert and publish. It asserts nothing, so it never gates a pipeline —
# `allow_failure` keeps a failed recording out of the way of the release, and
# the single run stands on its own rather than eating the base's retries.
capture:hero:
  extends: .e2e-deployed-base
  allow_failure: true
  retry: 0
  script:
    - npm run capture:hero
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - clips/

# The other half of "does what we shipped actually work": install the package
# from the real registry, the way a consumer would, and run the CLI/TUI e2e files
# against THAT copy's binary instead of bin/tmct.mjs in the checkout.
#
# smoke:post-deploy already asks the registry which version it SERVES. That
# proves propagation and nothing else — a tarball with a missing file, a
# dependency that resolves only inside the repo, a bin entry that points at
# nothing, all still pass it. This job installs and runs the thing.
#
# scripts/install-published.mjs polls until package.json's exact version is on
# the registry (a publish lands a minute or two after the job that pushed it),
# installs it into a temp directory with its own package.json so the repo's
# .npmrc plays no part, checks the installed version, and prints the binary's
# path. TMCT_E2E_CLI_BIN then redirects the same test files at it — see
# test-e2e/helpers/cli-bin.mjs, the CLI-side twin of TMCT_E2E_BASE_URL.
#
# It needs publish:npm, not deploy:website, and gates on NPM_TOKEN, because
# there is nothing to install without a publish. No browser, so no Chromium.
#
# It runs on every consumer-impacting push to main, not only on a version bump,
# so a push that changes what the package SHIPS has to roll the version in the
# same push. Skip the roll and the registry still serves this commit's version
# NUMBER built from an earlier commit: the job then runs today's test pins
# against yesterday's package and fails on the skew, not on a defect. That is
# what a band-set change did once — the purged tier-2 corpuses were gone from
# the checkout's manifest and still present in the installed one.
#
# Two e2e-cli/e2e-tui files are deliberately absent. cli-render-views expects
# `--render spider-fly`/`--render adventure` to exit 0, and those two archetypes
# inline a bundle built by scripts/, which the package does not ship — the
# installed CLI refuses them by design, naming the reason. tui.test.mjs drives
# the TUI through ink-testing-library rather than spawning a binary, so there is
# nothing here for it to redirect.
e2e:published-package:
  stage: verify
  needs:
    - publish:npm
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $NPM_TOKEN'
      changes: *consumer-paths
  script:
    # npm ci for the test files' own imports (they read src/ and scripts/ from the
    # checkout); the BINARY they spawn is the installed one.
    - npm ci
    # The script prints one line on stdout, the binary's path; its progress goes
    # to stderr so this capture stays clean. Assign FIRST and export second:
    # `export VAR=$(cmd)` reports the export's own status, not the command's, so a
    # failed install would sail past and the run below would silently fall back to
    # the checkout's bin/tmct.mjs — a green job proving the wrong thing.
    - TMCT_E2E_CLI_BIN=$(node scripts/install-published.mjs)
    - export TMCT_E2E_CLI_BIN
    - echo "running the CLI/TUI e2e files against $TMCT_E2E_CLI_BIN"
    - >-
      node --disable-warning=ExperimentalWarning --test
      test-e2e/cli-smoke.test.mjs test-e2e/cli-help.test.mjs
      test-e2e/cli-config-flags.test.mjs test-e2e/init.test.mjs
      test-e2e/init-cli.test.mjs test-e2e/bootstrap-seed.test.mjs
      test-e2e/import-file.test.mjs test-e2e/digest-cli.test.mjs
      test-e2e/memory-export.test.mjs test-e2e/domain-river.test.mjs
      test-e2e/domain-crates.test.mjs test-e2e/server-http.test.mjs
      test-e2e/server-http-smoke.test.mjs test-e2e/tui-chat-file.test.mjs
      test-e2e/tui-rover-capability-chain.test.mjs
