# CI for @polycode-projects/the-mechanical-code-talker (tmct) — a single
# published npm package plus a static GitLab Pages home page (no AWS, no
# benchmark rig). Three jobs: run the tests, publish to public npm on a
# deliberate version bump, and deploy public/ to Pages on main. Mirrors the
# seonix repo's publish:npm shape, minus the --workspace flag (tmct is a
# single package, not a workspace).

image: node:24

stages:
  - test
  - deploy

# Optional stock security scanning. Harmless if the group doesn't license it.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

unit:
  stage: test
  script:
    - npm ci
    - npm test

# Publish the package to PUBLIC npmjs.org. Automatic on main, but the release
# TRIGGER is a VERSION BUMP, not a push or a tag: the script compares
# package.json's version against what's already live on npm and no-ops if they
# match, so an ordinary push to main can never re-publish or error on "version
# already exists" — only a commit that bumps the version publishes. The rule
# requires NPM_TOKEN present (a masked, protected npm *automation* token for the
# @polycode-projects scope) so a not-yet-configured token fails closed (the job
# doesn't run) rather than failing loud on every push.
publish:npm:
  stage: deploy
  needs:
    - unit
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $NPM_TOKEN'
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm ci
    - npm test
    - LOCAL_VERSION=$(node -p "require('./package.json').version")
    - PUBLISHED_VERSION=$(npm view @polycode-projects/the-mechanical-code-talker version 2>/dev/null || echo "none")
    - |
      if [ "$PUBLISHED_VERSION" = "$LOCAL_VERSION" ]; then
        echo "@polycode-projects/the-mechanical-code-talker is already at $LOCAL_VERSION on npm — no version bump in this push, skipping publish."
      else
        echo "publishing $LOCAL_VERSION (npm currently has ${PUBLISHED_VERSION})"
        npm publish --access public
      fi

# GitLab Pages: the static home page. GitLab's convention is a job literally
# named `pages` whose artifact is the `public/` directory — the repo already
# keeps the site there, so this job just hands it over. Main branch only.
pages:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "publishing public/ to GitLab Pages"
  artifacts:
    paths:
      - public
